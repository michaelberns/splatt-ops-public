          await pg.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          showToast(`OCR scanning page ${i}/${maxPages}…`);
          const out = await window.Tesseract.recognize(canvas, 'eng');
          text += ((out && out.data && out.data.text) || '') + '\n';
        }
        return text;
      };

      // Read a PDF's text (pdf.js), falling back to OCR for scanned/image PDFs.
      const readPdfText = async (rel) => {
        const lib = window.pdfjsLib;
        if (!lib) throw new Error('PDF reader still loading — try again in a moment');
        try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) {}
        const buf = await (await fetch(`${FS}?path=${encodeURIComponent(rel)}`)).arrayBuffer();
        const pdf = await lib.getDocument({ data: buf }).promise;
        let text = '';
        // Reconstruct visual LINES from pdf.js text items by their baseline y:
        // pdf.js otherwise space-joins every item into one giant line per page,
        // which collapses an invoice to a single line and breaks the line-based
        // amount/currency/courier parsing (e.g. a stray "Cap. soc." noise token
        // then suppresses the whole page, so EUR totals never get picked up).
        // Group items whose y is within 2px, order each line left-to-right by x.
        for (let i = 1; i <= pdf.numPages; i++) {
          const pg = await pdf.getPage(i); const c = await pg.getTextContent();
          const rows = [];
          for (const it of c.items) {
            if (!it.str) continue;
            const y = it.transform[5];
            let r = rows.find(rr => Math.abs(rr.y - y) <= 2);
            if (!r) { r = { y, items: [] }; rows.push(r); }
            r.items.push({ x: it.transform[4], s: it.str });
          }
          rows.sort((a, b) => b.y - a.y);
          text += rows.map(r => r.items.sort((a, b) => a.x - b.x).map(o => o.s).join(' ').replace(/[ \t]+/g, ' ').trim()).filter(Boolean).join('\n') + '\n';
        }
        let method = 'text';
        if (text.replace(/\s/g, '').length < 30) {        // little/no embedded text => scanned image PDF
          showToast('Scanned PDF — running OCR (first run downloads the engine, ~10s)…');
          try { text = await ocrPages(pdf); method = 'OCR'; } catch (oe) { method = 'none'; }
        }
        return { text, method };
      };

      // Parse a document and SAVE its proposed line(s) as unconfirmed (parse_status:'parsed').
      // One bill can yield several lines (duty / clearance / import GST). Returns count added.
      const parseAndPersist = async (rel, dir) => {
        let proposed, method = 'none';
        try { const r = await readPdfText(rel); method = r.method; proposed = proposeLines(r.text, rel, dir); }
        catch (e) { proposed = [{ kind: dir === 'in' ? 'client_invoice' : 'supplier_bill', gst_treatment: 'incl_15', currency: 'NZD', amount_gross: '', notes: 'could not auto-read — enter from preview' }]; }
        let n = 0;
        for (const p of proposed) {
          const rec = buildRecord({ ...p, notes: p.notes || `parsed (${method}) from ${rel.split('/').pop()}` }, dir, rel, 'parsed');
          try { await fetchAPI('/collections/project_financials/records', { method: 'POST', body: JSON.stringify(rec) }); n++; } catch (e) {}
        }
        return n;
      };

      // Manual single-doc parse (kept for a doc dropped into the folder after a scan).
      const parseDocManual = async (rel) => {
        setPreviewRel(rel);
        showToast('Reading PDF…');
        try { const n = await parseAndPersist(rel, inferDir(rel)); await load(); showToast(n ? `Added ${n} line(s) to approve — check against the preview` : 'No amount auto-found — add the line manually'); }
        catch (e) { showToast('Parse failed: ' + e.message, 'error'); }
      };

      // Approve an auto-parsed line (parsed -> confirmed). If it still needs an amount
      // or an FX rate, open it in the editor instead of silently confirming a blank.
      const confirmLine = async (l) => {
        const nn = netNzd(l);
        if (!(Number(l.amount_gross) > 0) || nn == null) { startEdit(l); showToast('Add the amount / FX rate, then Save to approve', 'error'); return; }
        try {
          await fetchAPI(`/collections/project_financials/records/${l.id}`, { method: 'PATCH', body: JSON.stringify({ parse_status: 'confirmed', amount_net: net(l), amount_net_nzd: nn }) });
          const ls = lines.map(x => x.id === l.id ? { ...x, parse_status: 'confirmed' } : x); setLines(ls); await syncSummary(ls); showToast('Approved');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
      };

      // ── Xero-style multi-line picker ─────────────────────────────────────
      // When a new line is tied to a document, parse that ONE PDF into ALL of its
      // candidate lines at once (itemised product rows, tax/duty/import-GST
      // splits and the whole-document total) and stage them as a tick-list so
      // several lines can be added to the same invoice/bill in one go, each with
      // its own tax setting (just like entering a bill's line items in Xero).
      const taxOn = (g) => g === 'incl_15' || g === 'add_15';
      const updCand = (id, patch) => setCand(c => c ? { ...c, items: c.items.map(it => it.id === id ? { ...it, ...patch } : it) } : c);

      // Heuristic: pull itemised rows (a description + a money figure) from the
      // document text, skipping totals / GST / bank / header lines. Imperfect by
      // nature: the user ticks/edits before saving, so we err toward surfacing.
      const ITEM_STOP_RE = /(sub\s*-?\s*total|subtotal|^\s*total\b|total\s*(?:due|payable|incl|amount|nzd|eur|usd|gbp|aud)|amount\s*due|balance\s*due|grand\s*total|invoice\s*total|\bgst\b|\bvat\b|please\s*pay|\biban\b|\bswift\b|\bbic\b|account\s*(?:no|number|name)|sort\s*code|page\s*\d|\bterms\b|due\s*date|^\s*date\b)/i;
      // Header and footer boilerplate that carries a number but is NOT a line
      // item: phone and fax numbers, e-mail and web, tax registrations (P.IVA,
      // C.Fiscale, VAT no), share capital ("Capitale sociale"), R.E.A.,
      // minimum-order and validity clauses, and Italian totals (Totale / Totali /
      // Importo). Without this, a phone number or the share capital would show up
      // as a bogus line item.
      const ITEM_NOISE_RE = /\b(?:tel|fax|phone|mobile|cell|e-?mail|web-?site)\b|www\.|https?:|@|\bp\.?\s*iva\b|partita\s*iva|c\.?\s*fiscale|cod(?:ice)?\.?\s*fisc|vat\s*(?:no|number|reg)|tax\s*(?:id|no|number)|\biva\b|cap(?:itale|\.)\s*soc|capitale\s*sociale|share\s*capital|\bR\.?\s*E\.?\s*A\.?|registro\s*imprese|\bexport\s*:|cod\.?\s*identif|cod\.?\s*sdi|\bodv\b|minimo\s*fatt|minimum\s*amount\s*billable|\btotal[ei]\b|\bimporto\b/i;
      const proposeItemRows = (text) => {
        const t = (text || '').replace(/\u00a0/g, ' ');
        const rows = []; const seen = new Set();
        for (const raw of t.split(/[\n\r]/)) {
          const ln = raw.replace(/\s+/g, ' ').trim();
          if (ln.length < 4) continue;
          if (ITEM_STOP_RE.test(ln)) continue;
          if (ITEM_NOISE_RE.test(ln)) continue;
          if ((ln.match(/[A-Za-z]/g) || []).length < 3) continue;   // need a description
          const v = lastNumOn(ln);
          if (v == null || !(v > 0)) continue;
          const desc = ln.replace(NUM_RE, ' ').replace(/[|]/g, ' ').replace(/[€£$]/g, ' ').replace(/\s{2,}/g, ' ').replace(/[\s.,;:\-]+$/, '').trim().slice(0, 60) || 'line item';
          const k = desc.toLowerCase() + ':' + v.toFixed(2);
          if (seen.has(k)) continue; seen.add(k);
          rows.push({ description: desc, amount_gross: v });
          if (rows.length >= 25) break;
        }
        return rows;
      };

      // Parse a document into the staged candidate set and open the picker.
      const parseCandidates = async (rel, dir) => {
        if (!rel) { setCand(null); return; }
        setCandBusy(true);
        setCand({ rel, dir, currency: 'NZD', fx_rate: '', ref: '', party: '', doc_date: '', method: 'none', items: [], loading: true });
        let text = '', method = 'none';
        try { const r = await readPdfText(rel); text = r.text; method = r.method; }
        catch (e) { /* leave empty — user can still add manually via the editor */ }
        const base = extractFromText(text);
        const cur = base.currency || 'NZD';
        const defGst = cur === 'NZD' ? 'incl_15' : 'no_gst';
        const isCourier = COURIER_RE.test(text || '') || COURIER_RE.test(rel || '');
        const splits = (dir === 'out' && isCourier) ? proposeCourierLines(text) : [];
        const items = proposeItemRows(text);
        const baseKind = dir === 'in' ? 'client_invoice' : 'supplier_bill';
        const cands = [];
        splits.forEach((c, i) => cands.push({ id: 'split' + i, kind: c.kind, description: c.label || c.kind, amount_gross: c.amount_gross, gst_treatment: c.gst_treatment, advanced: false, selected: true, source: 'split' }));
        items.forEach((it, i) => cands.push({ id: 'item' + i, kind: baseKind, description: it.description, amount_gross: it.amount_gross, gst_treatment: defGst, advanced: false, selected: false, source: 'item' }));
        if (base.amount != null && base.amount > 0) cands.push({ id: 'total', kind: baseKind, description: 'Document total' + (base.ref ? ' (' + base.ref + ')' : ''), amount_gross: base.amount, gst_treatment: defGst, advanced: false, selected: false, source: 'total' });
        // Default selection: trust itemised rows only if they sum ~= the doc total
        // (±2%, ≥2 rows); otherwise pre-tick the single whole-document total.
        const itemSum = items.reduce((a, b) => a + (Number(b.amount_gross) || 0), 0);
        const total = base.amount || 0;
        const itemsMatchTotal = items.length >= 2 && total > 0 && Math.abs(itemSum - total) <= total * 0.02;
        if (splits.length) { /* courier: splits stay pre-selected */ }
        else if (itemsMatchTotal) cands.forEach(c => { if (c.source === 'item') c.selected = true; });
        else cands.forEach(c => { if (c.source === 'total') c.selected = true; });
        setCand({ rel, dir, currency: cur, fx_rate: '', ref: base.ref || '', party: '', doc_date: base.date || '', method, items: cands, loading: false });
        setCandBusy(false);
      };

      // Save every ticked candidate as its own confirmed line on this document.
      const addSelectedCands = async () => {
        if (!cand) return;
        const sel = cand.items.filter(i => i.selected && Number(i.amount_gross) > 0);
        if (!sel.length) { showToast('Tick at least one line to add', 'error'); return; }
        const cur = (cand.currency || 'NZD').toUpperCase();
        const fx = cand.fx_rate;
        if (cur !== 'NZD' && !(parseFloat(String(fx).replace(/[^0-9.]/g, '')) > 0)) { showToast('Enter the FX→NZD rate for these ' + cur + ' lines first', 'error'); return; }
        setCandBusy(true);
        let n = 0;
        for (const it of sel) {
          const partial = { kind: it.kind, gst_treatment: it.gst_treatment, currency: cur, fx_rate: fx, amount_gross: it.amount_gross, party: cand.party || (form && form.party) || '', ref: cand.ref || (form && form.ref) || '', doc_date: cand.doc_date || '', notes: it.description };
          const rec = buildRecord(partial, cand.dir, cand.rel, 'confirmed');
          try { await fetchAPI('/collections/project_financials/records', { method: 'POST', body: JSON.stringify(rec) }); n++; } catch (e) {}
        }
        try { const res = await fetchAPI(`/collections/project_financials/records?perPage=200&sort=direction,created&filter=${FILTER}`); const ls = res.items || []; setLines(ls); await syncSummary(ls); } catch (e) {}
        setCand(null); cancel(); setCandBusy(false);
        showToast('Added ' + n + ' line(s) from ' + cand.rel.split('/').pop());
      };

      // The candidate picker is opened explicitly via a group's "Auto-fill" button;
      // just make sure it's cleared whenever the editor closes.
      useEffect(() => { if (editId !== 'new') setCand(null); }, [editId]);

      // Delete a source document off disk (via the file server), then refresh the
      // scanned-doc list. Lines already saved from it are left untouched.
      const deleteDocFile = async (rel, name) => {
        if (!rel) return;
        if (!confirm('Delete the file "' + (name || rel.split('/').pop()) + '" from the project folder? This cannot be undone.')) return;
        try {
          const res = await fetch(`${FS}?path=${encodeURIComponent(rel)}`, { method: 'DELETE' });
          if (!res.ok) throw new Error((await res.text()).slice(0, 140));
          setDocs(d => (d || []).filter(x => norm(x.rel) !== norm(rel)));
          if (norm(previewRel) === norm(rel)) setPreviewRel(null);
          showToast('Deleted ' + (name || rel.split('/').pop()));
        } catch (e) { showToast('Delete failed: ' + e.message, 'error'); }
      };

      // ── Drag-and-drop upload: save the dropped file under <project>/bills or
      //    <project>/invoices via the project files server, then
      //    parse-then-confirm it. ──
      const UP = FILES_URL + '/api/upload-file';
      const [dragKind, setDragKind] = useState(null);   // 'bills' | 'invoices' while hovering
      const uploadFiles = async (fileList, kind) => {   // kind: 'bills' (out) | 'invoices' (in)
        if (!projectFolder) { showToast('No project folder linked — can\'t save files here yet', 'error'); return; }
        const dir = kind === 'invoices' ? 'in' : 'out';
        const already = parsedFiles();
        const existingNames = new Set((docs || []).map(d => (d.name || '').toLowerCase()));
        const seen = new Set();   // guard against the same file twice in one drop
        let added = 0;
        for (const file of Array.from(fileList || [])) {
          const target = `${projectFolder}/${kind}/${file.name}`;
          const lname = (file.name || '').toLowerCase();
          if (already.has(norm(target)) || existingNames.has(lname) || seen.has(lname)) { showToast(`"${file.name}" is already in this project — skipped`, 'error'); continue; }
          seen.add(lname);
          try {
            showToast(`Uploading ${file.name} → ${kind}/…`);
            const b64 = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result).split(',')[1] || ''); r.onerror = reject; r.readAsDataURL(file); });
            const res = await fetch(UP, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: target, contentBase64: b64 }) });
            if (!res.ok) { throw new Error((await res.text()).slice(0, 140)); }
            if (/\.pdf$/i.test(file.name)) { added += await parseAndPersist(target, dir); }
            else { const rec = buildRecord({ notes: 'uploaded ' + file.name }, dir, target, 'parsed'); await fetchAPI('/collections/project_financials/records', { method: 'POST', body: JSON.stringify(rec) }); added++; }
          } catch (e) { showToast('Upload failed: ' + e.message, 'error'); }
        }
        await scanDocs();
        if (added) showToast(`Added ${added} line(s) to approve`);
      };
      const onDrop = (e, kind) => { e.preventDefault(); e.stopPropagation(); setDragKind(null); const f = e.dataTransfer && e.dataTransfer.files; if (f && f.length) uploadFiles(f, kind); };

      const card = { background: T.cardGradient, borderRadius: '12px', border: `1px solid ${T.border}` };
      const chip = (bg, color, click) => ({ fontSize: '10px', fontWeight: 700, padding: '2px 8px', borderRadius: '20px', background: bg, color, cursor: click ? 'pointer' : 'default', border: 'none', whiteSpace: 'nowrap' });
      const dropZone = (kind, label, accent) => (
        <label
          onDragOver={e => { e.preventDefault(); setDragKind(kind); }}
          onDragLeave={() => setDragKind(null)}
          onDrop={e => onDrop(e, kind)}
          style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '2px', padding: '14px 10px', border: `1.5px dashed ${dragKind === kind ? accent : T.border}`, borderRadius: '10px', background: dragKind === kind ? accent + '14' : 'rgba(148,163,184,0.05)', cursor: 'pointer', textAlign: 'center' }}>
          <span style={{ fontSize: '18px' }}>⬇</span>
          <span style={{ fontSize: '12px', fontWeight: 600, color: accent }}>{label}</span>
          <span style={{ fontSize: '10px', color: T.textMuted }}>drag &amp; drop or click — saved to {kind}/</span>
          <input type="file" multiple accept="application/pdf,image/*" style={{ display: 'none' }} onChange={e => { uploadFiles(e.target.files, kind); e.target.value = ''; }} />
        </label>
      );
      const inp = { fontSize: '12px', padding: '6px 8px', borderRadius: '8px', background: (T.pillInactive && T.pillInactive.bg) || 'rgba(148,163,184,0.12)', color: T.text, border: `1px solid ${T.border}`, outline: 'none' };

      // Documents already in this project (scanned PDFs + any line's source) so a new
      // line can be attached to the SAME invoice/bill rather than starting blank.
      const sourceOptions = Array.from(new Set([...(docs || []).map(d => d.rel), ...lines.filter(l => l.source_file).map(l => l.source_file)].filter(Boolean)));

      const editor = form && (
        <div style={{ padding: '10px 12px', background: 'linear-gradient(160deg, rgba(148,163,184,0.102) 0%, rgba(148,163,184,0.027) 100%)', borderBottom: `1px solid ${T.border}`, display: 'flex', flexWrap: 'wrap', gap: '6px', alignItems: 'center' }}>
          <select value={form.direction} onChange={e => setForm({ ...form, direction: e.target.value })} style={inp}><option value="in">Money In</option><option value="out">Money Out</option></select>
          <select value={form.kind} onChange={e => setForm({ ...form, kind: e.target.value })} style={inp}>{KINDS.map(k => <option key={k} value={k}>{k}</option>)}</select>
          <select value={form.source_file || ''} onChange={e => setForm({ ...form, source_file: e.target.value })} style={{ ...inp, maxWidth: '160px' }} title="Attach this line to an invoice / bill already in the project">
            <option value="">— no document —</option>
            {sourceOptions.map(sf => <option key={sf} value={sf}>📄 {sf.split('/').pop()}</option>)}
            {form.source_file && !sourceOptions.includes(form.source_file) && <option value={form.source_file}>📄 {form.source_file.split('/').pop()}</option>}
          </select>
          <input value={form.party} onChange={e => setForm({ ...form, party: e.target.value })} placeholder="Party" style={{ ...inp, flex: '1 1 120px' }} />
          <input value={form.ref} onChange={e => setForm({ ...form, ref: e.target.value })} placeholder="Ref" style={{ ...inp, width: '110px' }} />
          <select value={form.currency} onChange={e => setForm({ ...form, currency: e.target.value })} style={inp}>{CURS.map(c => <option key={c} value={c}>{c}</option>)}</select>
          <input value={form.amount_gross} onChange={e => setForm({ ...form, amount_gross: e.target.value })} placeholder="Gross" style={{ ...inp, width: '90px' }} />
          <select value={form.gst_treatment} onChange={e => setForm({ ...form, gst_treatment: e.target.value })} style={inp} title="GST treatment">{GSTS.map(g => <option key={g} value={g}>{g}</option>)}</select>
          {String(form.currency).toUpperCase() !== 'NZD' && <input value={form.fx_rate} onChange={e => setForm({ ...form, fx_rate: e.target.value })} placeholder={`FX→NZD (per ${form.currency})`} style={{ ...inp, width: '120px' }} />}
          <select value={form.billed_via} onChange={e => setForm({ ...form, billed_via: e.target.value })} style={inp} title="Billed via"><option value="splatt">Splatt</option><option value="partner">Partner (excl.)</option></select>
          <select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} style={inp} title="Status">{STATUSES.map(st => <option key={st} value={st}>{st}</option>)}</select>
          <label style={{ fontSize: '11px', color: T.textMuted, display: 'flex', alignItems: 'center', gap: '3px' }}><input type="checkbox" checked={!!form.in_hubdoc} onChange={e => setForm({ ...form, in_hubdoc: e.target.checked })} />Hubdoc</label>
          <label style={{ fontSize: '11px', color: T.textMuted, display: 'flex', alignItems: 'center', gap: '3px' }}><input type="checkbox" checked={!!form.in_xero} onChange={e => setForm({ ...form, in_xero: e.target.checked })} />Xero</label>
          <input value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} placeholder="Note" style={{ ...inp, flex: '1 1 140px' }} />
          <button onClick={() => save(false)} disabled={busy} style={{ fontSize: '12px', fontWeight: 600, color: '#fff', background: T.accentGradient, border: 'none', borderRadius: '8px', padding: '6px 14px', cursor: busy ? 'wait' : 'pointer' }}>{busy ? 'Saving…' : 'Save'}</button>
          <button onClick={() => save(true)} disabled={busy} title="Save this line and keep the same bill open to add another (e.g. duty, clearance, GST)" style={{ fontSize: '12px', fontWeight: 600, color: T.accent, background: 'none', border: `1px solid ${T.accent}`, borderRadius: '8px', padding: '6px 12px', cursor: busy ? 'wait' : 'pointer' }}>Save &amp; add line</button>
          <button onClick={cancel} style={{ fontSize: '12px', color: T.textMuted, background: 'none', border: 'none', cursor: 'pointer' }}>Cancel</button>
        </div>
      );

      // Xero-style pick-list: every candidate line parsed from the chosen document,
      // shown right under the editor so several lines (each with its own tax setting)
      // can be ticked and added to the same invoice/bill at once.
      const candidatePicker = (editId === 'new' && cand) && (
        <div style={{ padding: '8px 12px 12px', background: 'linear-gradient(160deg, rgba(148,163,184,0.085) 0%, rgba(148,163,184,0.0225) 100%)', borderTop: `1px dashed ${T.border}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
            <span style={{ fontSize: '10px', fontWeight: 700, color: T.textSecondary, textTransform: 'uppercase', letterSpacing: '0.05em', flex: 1 }}>
              📄 Lines parsed from {cand.rel.split('/').pop()}{cand.loading ? ' — reading…' : (cand.method && cand.method !== 'text' ? ' (' + cand.method + ')' : '')}
            </span>
            <button onClick={() => parseCandidates(cand.rel, cand.dir)} disabled={candBusy} style={chip('rgba(96,165,250,0.16)', '#60a5fa', true)}>↻ Re-parse</button>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '11px', color: T.textMuted }}>Currency for all ticked lines:</span>
            <select value={cand.currency} onChange={e => setCand({ ...cand, currency: e.target.value })} title="Override the document currency for every ticked line" style={{ ...inp, width: '90px' }}>{CURS.map(c => <option key={c} value={c}>{c}</option>)}</select>
            {cand.currency !== 'NZD' && (
              <>
                <span style={{ fontSize: '11px', color: '#fbbf24' }}>one FX→NZD rate applies to all ticked lines:</span>
                <input value={cand.fx_rate} onChange={e => setCand({ ...cand, fx_rate: e.target.value })} placeholder={`per ${cand.currency}`} style={{ ...inp, width: '110px' }} />
              </>
            )}
          </div>
          {cand.loading ? <p style={{ fontSize: '11px', color: T.textMuted, padding: '4px' }}>Reading the document…</p>
            : cand.items.length === 0 ? <p style={{ fontSize: '11px', color: T.textMuted, padding: '4px' }}>No lines auto-found — use the editor above to add one manually.</p>
            : cand.items.map(it => (
              <div key={it.id} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '4px 2px', borderBottom: `1px solid ${T.border}`, opacity: it.selected ? 1 : 0.5 }}>
                <input type="checkbox" checked={it.selected} onChange={e => updCand(it.id, { selected: e.target.checked })} title="Add / remove this line" />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: '12px', color: T.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{it.description}</p>
                  <p style={{ fontSize: '9.5px', color: T.textMuted }}>{it.kind}{it.source === 'total' ? ' · whole-doc total' : it.source === 'split' ? ' · tax / duty split' : ' · item'}</p>
                </div>
                <span style={{ fontSize: '12px', fontWeight: 700, color: T.text, minWidth: '92px', textAlign: 'right' }}>{cand.currency !== 'NZD' ? cand.currency + ' ' + (Number(it.amount_gross) || 0).toLocaleString() : money(it.amount_gross)}</span>
                <button onClick={() => updCand(it.id, { gst_treatment: taxOn(it.gst_treatment) ? 'no_gst' : 'incl_15' })} title="Toggle tax on this line (with / without GST)" style={chip(taxOn(it.gst_treatment) ? 'rgba(16,185,129,0.16)' : 'rgba(148,163,184,0.14)', taxOn(it.gst_treatment) ? '#34d399' : '#94a3b8', true)}>{taxOn(it.gst_treatment) ? 'tax' : 'no tax'}</button>
                {it.advanced
                  ? <select value={it.gst_treatment} onChange={e => updCand(it.id, { gst_treatment: e.target.value })} title="Full GST treatment" style={{ ...inp, padding: '3px 6px', fontSize: '11px' }}>{GSTS.map(g => <option key={g} value={g}>{g}</option>)}</select>
                  : <button onClick={() => updCand(it.id, { advanced: true })} title="Show full GST options" style={{ background: 'none', border: 'none', color: T.accent, cursor: 'pointer', fontSize: '10px' }}>adv</button>}
              </div>
            ))}
          {!cand.loading && cand.items.length > 0 && (
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginTop: '8px' }}>
              <span style={{ fontSize: '11px', color: T.textMuted, flex: 1 }}>{cand.items.filter(i => i.selected).length} of {cand.items.length} selected</span>
              <button onClick={() => setCand({ ...cand, items: cand.items.map(i => ({ ...i, selected: true })) })} style={chip('rgba(148,163,184,0.14)', '#94a3b8', true)}>all</button>
              <button onClick={() => setCand({ ...cand, items: cand.items.map(i => ({ ...i, selected: false })) })} style={chip('rgba(148,163,184,0.14)', '#94a3b8', true)}>none</button>
              <button onClick={addSelectedCands} disabled={candBusy} style={{ fontSize: '12px', fontWeight: 600, color: '#fff', background: T.accentGradient, border: 'none', borderRadius: '8px', padding: '6px 14px', cursor: candBusy ? 'wait' : 'pointer' }}>{candBusy ? 'Adding…' : 'Add ' + cand.items.filter(i => i.selected).length + ' selected'}</button>
            </div>
          )}
        </div>
      );

      const row = (l) => {
        const nn = netNzd(l);
        const needsFx = nn == null;
        const unconf = l.parse_status === 'parsed';
        return (
          <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '7px 8px', borderBottom: `1px solid ${T.border}`, opacity: unconf ? 0.85 : 1 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ fontSize: '12.5px', color: T.text, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                {l.ref ? l.ref + ' · ' : ''}{l.party || l.kind}
                {l.billed_via === 'partner' && <span style={{ ...chip('rgba(251,146,60,0.16)', '#2dd4bf'), marginLeft: '6px' }}>Partner</span>}
              </p>
              <p style={{ fontSize: '10px', color: T.textMuted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{l.kind}{l.notes ? ' — ' + l.notes : ''}</p>
            </div>
            <div style={{ textAlign: 'right', minWidth: '120px' }}>
              <p style={{ fontSize: '12.5px', fontWeight: 700, color: T.text }}>{String(l.currency || 'NZD').toUpperCase() !== 'NZD' ? (l.currency + ' ' + grossDue(l).toLocaleString()) : money(grossDue(l))}</p>
              <p style={{ fontSize: '10px', color: needsFx ? '#fbbf24' : T.textMuted }}>{needsFx ? '⚠ needs FX' : ('net ' + money(nn) + (l.gst_treatment === 'add_15' ? ' · +15% GST ' + money(r2(nn * 0.15)) : '') + (String(l.currency || 'NZD').toUpperCase() !== 'NZD' && Number(l.fx_rate) > 0 ? ' · @' + Number(l.fx_rate) + ' ' + String(l.currency).toUpperCase() + '→NZD' : ''))}</p>
            </div>
            {unconf && <span style={chip('rgba(245,158,11,0.16)', '#fbbf24')}>unconfirmed</span>}
            {unconf && <button onClick={() => confirmLine(l)} title="Approve this line (confirm into the win)" style={chip('rgba(16,185,129,0.18)', '#34d399', true)}>✓ Approve</button>}
            {l.source_file && <button onClick={() => setPreviewRel(l.source_file)} title="Preview source PDF" style={{ background: 'none', border: 'none', color: '#60a5fa', cursor: 'pointer', fontSize: '12px' }}>📄</button>}
            <button onClick={() => startEdit(l)} style={{ background: 'none', border: 'none', color: T.accent, cursor: 'pointer', fontSize: '12px' }}>✎</button>
            <button onClick={() => del(l)} style={{ background: 'none', border: 'none', color: '#f87171', cursor: 'pointer', fontSize: '12px' }}>✕</button>
          </div>
        );
      };

      // ── Group lines onto ONE card per invoice/bill ────────────────────────
      // A "group" is every line that shares the same source document (else the
      // same ref+party, else its own id). Each card brackets its nested lines and
      // shows a footer total that should match the document's printed total.
      const buildGroups = (arr, dir) => {
        const map = new Map();
        arr.forEach(l => {
          const sf = norm(l.source_file);
          const key = sf ? 'sf:' + sf : ((norm(l.ref) || norm(l.party)) ? 'rp:' + norm(l.ref) + '|' + norm(l.party) : 'id:' + l.id);
          if (!map.has(key)) map.set(key, { key, dir, source_file: sf, ref: l.ref || '', party: l.party || '', currency: l.currency || 'NZD', fx_rate: l.fx_rate || '', lines: [] });
          const g = map.get(key);
          g.lines.push(l);
          if (!g.ref && l.ref) g.ref = l.ref;
          if (!g.party && l.party) g.party = l.party;
          if ((!g.fx_rate || !(Number(g.fx_rate) > 0)) && Number(l.fx_rate) > 0) g.fx_rate = l.fx_rate;
          if ((g.currency === 'NZD') && l.currency && l.currency !== 'NZD') g.currency = l.currency;
        });
        return Array.from(map.values());
      };
      const groupTotals = (g) => {
        let gross = 0, net = 0, needsFx = false, cur = null, mixed = false; const fxs = new Set();
        g.lines.forEach(l => {
          const c = (l.currency || 'NZD').toUpperCase();
          if (cur == null) cur = c; else if (cur !== c) mixed = true;
          gross += grossDue(l);
          if (c !== 'NZD' && Number(l.fx_rate) > 0) fxs.add(Number(l.fx_rate));
          const nn = netNzd(l);
          if (nn == null) needsFx = true; else net += nn;
        });
        // Surface the FX rate used only when it's unambiguous (one rate across the
        // document); mixed rates fall back to showing it per-line instead.
        return { gross, net, needsFx, cur: mixed ? null : cur, fx: fxs.size === 1 ? [...fxs][0] : null };
      };
      const groupCard = (g) => {
        const t = groupTotals(g);
        const fname = g.source_file ? g.source_file.split('/').pop() : '';
        const title = fname || (g.ref ? g.ref + (g.party ? ' · ' + g.party : '') : (g.party || (g.lines[0] && g.lines[0].kind) || 'line'));
        const icon = g.dir === 'in' ? '🧾' : '📄';
        const open = g.key === addGroup && editId === 'new';
        // Document-level meta: status / Xero / Hubdoc belong to the whole bill,
        // so derive a single value (or "mixed") and let one control set them all.
        const stU = [...new Set(g.lines.map(l => l.status || 'not_raised'))];
        const gStatus = stU.length === 1 ? stU[0] : '';
        const allXero = g.lines.every(l => l.in_xero);
        const allHub = g.lines.every(l => l.in_hubdoc);
        const allPaid = g.lines.every(l => l.status === 'paid');
        return (
          <div key={g.key} style={{ border: `1px solid ${T.border}`, borderRadius: '10px', margin: '8px 0', overflow: 'hidden', background: 'linear-gradient(160deg, rgba(148,163,184,0.068) 0%, rgba(148,163,184,0.018) 100%)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 10px', background: 'linear-gradient(160deg, rgba(148,163,184,0.119) 0%, rgba(148,163,184,0.0315) 100%)', borderBottom: `1px solid ${T.border}` }}>
              <span style={{ fontSize: '12px' }}>{icon}</span>
              <span style={{ flex: 1, fontSize: '12px', fontWeight: 700, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{title}</span>
              <span style={{ fontSize: '10px', color: T.textMuted }}>{g.lines.length} line{g.lines.length > 1 ? 's' : ''}</span>
              {g.source_file && <a href={`${FS}?path=${encodeURIComponent(g.source_file)}`} target="_blank" rel="noopener" title="Open document in a new tab" style={{ fontSize: '12px', color: T.accent, textDecoration: 'none' }}>↗</a>}
              {g.source_file && <button onClick={() => setPreviewRel(g.source_file)} title="Preview document" style={{ background: 'none', border: 'none', color: '#60a5fa', cursor: 'pointer', fontSize: '12px' }}>📄</button>}
              {g.source_file && <button onClick={() => autofillGroup(g)} title="Auto-fill lines from this document" style={{ background: 'none', border: 'none', color: '#fbbf24', cursor: 'pointer', fontSize: '12px' }}>⚡</button>}
              <button onClick={() => deleteGroup(g)} disabled={busy} title={`Delete this whole document — all ${g.lines.length} line${g.lines.length > 1 ? 's' : ''}` + (g.source_file ? ' and the file' : '')} style={{ background: 'none', border: 'none', color: '#f87171', cursor: busy ? 'wait' : 'pointer', fontSize: '12px', fontWeight: 700 }}>🗑</button>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '5px 10px', borderBottom: `1px solid ${T.border}`, flexWrap: 'wrap', background: 'linear-gradient(160deg, rgba(148,163,184,0.051) 0%, rgba(148,163,184,0.0135) 100%)' }}>
              <span style={{ fontSize: '9.5px', color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Whole document:</span>
              <select value={gStatus} onChange={e => setGroupMeta(g, { status: e.target.value })} disabled={busy} title="Set the status for every line on this document" style={{ ...inp, padding: '3px 6px', fontSize: '11px' }}>
                {gStatus === '' && <option value="">— mixed —</option>}
                {STATUSES.map(st => <option key={st} value={st}>{st.replace(/_/g, ' ')}</option>)}
              </select>
              <button onClick={() => setGroupMeta(g, { in_hubdoc: !allHub })} disabled={busy} title="Toggle Hubdoc for every line on this document" style={chip(allHub ? 'rgba(96,165,250,0.16)' : 'rgba(148,163,184,0.12)', allHub ? '#60a5fa' : '#94a3b8', true)}>📥 Hubdoc</button>
              <button onClick={() => setGroupMeta(g, { in_xero: !allXero })} disabled={busy} title="Toggle Xero for every line on this document" style={chip(allXero ? 'rgba(16,185,129,0.16)' : 'rgba(148,163,184,0.12)', allXero ? '#34d399' : '#94a3b8', true)}>Xero</button>
              <button onClick={() => setGroupMeta(g, { status: allPaid ? 'awaiting_payment' : 'paid' })} disabled={busy} title={allPaid ? 'Marked paid — click to set back to awaiting payment' : 'Mark this whole document as paid'} style={chip(allPaid ? 'rgba(34,197,94,0.20)' : 'rgba(148,163,184,0.12)', allPaid ? '#4ade80' : '#94a3b8', true)}>{allPaid ? '✓ Paid' : '$ Mark paid'}</button>
            </div>
            {g.lines.map(l => editId === l.id ? <div key={l.id} style={{ border: `1px solid ${T.accent}`, borderRadius: '8px', margin: '4px 6px' }}>{editor}</div> : row(l))}
            {open && <div style={{ border: `1px solid ${T.accent}`, borderRadius: '8px', margin: '4px 6px' }}>{editor}{candidatePicker}</div>}
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 10px', borderTop: `1px solid ${T.border}` }}>
              <button onClick={() => addToGroup(g)} style={{ fontSize: '11px', fontWeight: 600, color: T.accent, background: 'none', border: 'none', cursor: 'pointer', flex: 1, textAlign: 'left' }}>+ Add line</button>
              <span style={{ fontSize: '10px', color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Total</span>
              <div style={{ textAlign: 'right', minWidth: '110px' }}>
                <p style={{ fontSize: '12.5px', fontWeight: 700, color: T.text }}>{t.cur && t.cur !== 'NZD' ? t.cur + ' ' + t.gross.toLocaleString() : money(t.gross)}</p>
                <p style={{ fontSize: '10px', color: t.needsFx ? '#fbbf24' : T.textMuted }}>{t.needsFx ? '⚠ needs FX' : ('net ' + money(t.net) + (t.cur && t.cur !== 'NZD' && t.fx ? ' · @' + t.fx + ' ' + t.cur + '→NZD' : ''))}</p>
              </div>
            </div>
          </div>
        );
      };
      const insGroups = buildGroups(ins, 'in');
      const outsGroups = buildGroups(outs, 'out');
      const newStandalone = editId === 'new' && addGroup === null && form;

      const stat = (lbl, val, col) => (
        <div style={{ background: T.cardGradient, padding: '10px 16px' }}>
          <p style={{ fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{lbl}</p>
          <p style={{ fontSize: '14px', fontWeight: 700, color: col }}>{val}</p>
        </div>
      );

      // ── Billing position ──────────────────────────────────────────────────
      // What the client has actually been asked for and how much of it has
      // landed. GST inclusive on purpose, because that is the number on the
      // invoice and the number that hits the bank. The True Win row above is
      // ex-GST because GST is a pass through and never a margin.
      const billed = r2(ins.reduce((t, l) => t + grossDue(l), 0));
      const billedPaid = r2(ins.filter(l => l.status === 'paid').reduce((t, l) => t + grossDue(l), 0));
      const outstanding = r2(billed - billedPaid);
      const notRaised = ins.filter(l => !l.status || l.status === 'not_raised');

      // ── Money the True Win leaves out ────────────────────────────────────
      // A line that is still unparsed, or in a foreign currency with no exchange
      // rate, is left out of revenue, cost and margin. That is the safe choice,
      // but it changes the win, so the amount left out is shown beside it.
      const excluded = lines.filter(l => !ready(l));
      const excludedNeedsFx = excluded.filter(l => (l.currency || 'NZD').toUpperCase() !== 'NZD' && !(Number(l.fx_rate) > 0));
      const excludedUnparsed = excluded.filter(l => l.parse_status === 'parsed');
      const excludedNzdGuess = r2(excluded.reduce((t, l) => t + (Number(l.amount_gross) || 0), 0));

      return (
        <div style={{ ...card, overflow: 'hidden', marginTop: '16px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '14px 20px', borderBottom: `1px solid ${T.border}` }}>
            <span style={{ color: '#fbbf24' }}>📊</span>
            <h3 style={{ fontSize: '12px', fontWeight: 600, color: T.textSecondary, textTransform: 'uppercase', letterSpacing: '0.06em', flex: 1 }}>Financials — True Win</h3>
            {s.unconfirmed_count > 0 && <span style={chip('rgba(245,158,11,0.16)', '#fbbf24')}>{s.unconfirmed_count} need input</span>}
            {job.paid && <span style={chip('rgba(16,185,129,0.16)', '#34d399')}>{`PAID${job.paid_amount ? ' ' + money(job.paid_amount) : ''}`}</span>}
            <button onClick={toggleHasShipping} style={chip(involvesShipping ? 'rgba(96,165,250,0.16)' : 'rgba(148,163,184,0.12)', involvesShipping ? '#60a5fa' : '#94a3b8', true)} title="Toggle whether this project involves shipping">
              {involvesShipping ? '🚚 Has shipping' : 'No shipping'}
            </button>
            {involvesShipping && (
              <button onClick={toggleShippingPaid} style={chip(job.shipping_paid ? 'rgba(16,185,129,0.16)' : 'rgba(245,158,11,0.16)', job.shipping_paid ? '#34d399' : '#fbbf24', true)} title="Toggle shipping paid">
                {job.shipping_paid ? '✓ Shipping paid' : 'Shipping due'}
              </button>
            )}
            {/* Read only on purpose. A bill is marked paid on the bill itself,
                on the document card below, so this chip and the card cannot
                disagree. It is the same call the project rows make. */}
            {(() => {
              const b = billsStatus(job, lines);
              if (b.state === 'none') return null;
              return (
                <span style={chip(b.state === 'paid' ? 'rgba(16,185,129,0.16)' : 'rgba(245,158,11,0.16)', b.state === 'paid' ? '#34d399' : '#fbbf24')}
                  title={b.state === 'paid'
                    ? `All ${b.count} bill${b.count > 1 ? 's' : ''} on this project are marked paid`
                    : `${b.unpaidCount} of ${b.count} bill${b.count > 1 ? 's' : ''} not marked paid. Mark one paid on its own document card below.`}>
                  {(b.state === 'paid' ? '✓ ' : '') + billsChipText(b)}
                </span>
              );
            })()}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '1px', background: `linear-gradient(180deg, ${T.borderStrong} 0%, ${T.border} 100%)` }}>
            {stat('Revenue (ex-GST)', money(s.revenue_nzd), T.text)}
            {stat('Cost (ex-GST)', money(s.cost_nzd), '#fbbf24')}
            {stat('True Win', money(s.margin_nzd), s.margin_nzd >= 0 ? '#34d399' : '#f87171')}
            {stat('Margin', s.margin_pct + '%', s.margin_nzd >= 0 ? '#34d399' : '#f87171')}
          </div>
          {/* Billing position, GST inclusive. Same source as everything above,
              so these numbers can never drift away from the win. */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1px', background: `linear-gradient(180deg, ${T.borderStrong} 0%, ${T.border} 100%)`, borderTop: `1px solid ${T.border}` }}>
            {stat('Billed (incl GST)', money(billed), T.text)}
            {stat('Paid', money(billedPaid), '#34d399')}
            {stat('Outstanding', money(outstanding), outstanding > 0 ? '#fbbf24' : T.textMuted)}
          </div>
          {ins.length === 0 && (
            <div style={{ padding: '8px 16px', borderBottom: `1px solid ${T.border}`, fontSize: '11px', color: '#f87171', display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span style={{ fontWeight: 700 }}>⚠ No client invoice on this project.</span>
              <span style={{ color: T.textSecondary }}>Nothing has been billed, so the win below is cost only.</span>
              <button onClick={() => startNew('in')} style={chip('rgba(248,113,113,0.16)', '#f87171', true)}>+ Add the invoice</button>
            </div>
          )}
          {ins.length > 0 && notRaised.length > 0 && (
            <div style={{ padding: '6px 16px', borderBottom: `1px solid ${T.border}`, fontSize: '11px', color: '#fbbf24' }}>
              {notRaised.length} invoice line{notRaised.length > 1 ? 's' : ''} still marked not raised. Set the status once it is out the door.
            </div>
          )}
          {s.partner_nzd !== 0 && (
            <div style={{ padding: '6px 16px', borderBottom: `1px solid ${T.border}`, fontSize: '11px', color: '#2dd4bf' }}>Partner-billed (excluded from win): {money(s.partner_nzd)}</div>
          )}
          {/* What the win leaves out, and why. */}
          {excluded.length > 0 && (
            <div style={{ padding: '8px 16px', borderBottom: `1px solid ${T.border}`, fontSize: '11px', color: '#fbbf24' }}>
              <span style={{ fontWeight: 700 }}>{`Left out of the win: ${excluded.length} line${excluded.length > 1 ? 's' : ''}, about ${money(excludedNzdGuess)} of face value.`}</span>
              <span style={{ color: T.textSecondary }}>
                {excludedNeedsFx.length > 0 && ` ${excludedNeedsFx.length} in a foreign currency with no exchange rate.`}
                {excludedUnparsed.length > 0 && ` ${excludedUnparsed.length} read off a PDF and not confirmed yet.`}
                {' Fix those and the win below becomes final.'}
              </span>
            </div>
          )}
          {s.unconfirmed_count > 0 && (
            <div style={{ padding: '6px 16px', borderBottom: `1px solid ${T.border}`, fontSize: '11px', color: '#fbbf24' }}>⚠ Provisional — {s.unconfirmed_count} line(s) need FX / amount / review before the win is final.</div>
          )}

          {/* Source documents: scan the project folder, preview the PDF, parse-then-confirm */}
          <div style={{ padding: '8px 12px', borderBottom: `1px solid ${T.border}` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span style={{ fontSize: '11px', fontWeight: 700, color: T.textSecondary, textTransform: 'uppercase', letterSpacing: '0.05em', flex: 1 }}>Source documents</span>
              <button onClick={scanDocs} disabled={scanning || !projectFolder} title={projectFolder ? '' : 'No project folder linked'} style={{ fontSize: '11px', fontWeight: 600, color: projectFolder ? T.accent : T.textMuted, background: 'none', border: 'none', cursor: projectFolder ? 'pointer' : 'not-allowed' }}>{scanning ? 'Scanning…' : '📎 Scan & auto-parse'}</button>
            </div>
            {!projectFolder && <p style={{ fontSize: '11px', color: '#fbbf24', padding: '4px 2px' }}>No project folder linked to this project yet — drag-drop needs one.</p>}
            {projectFolder && (
              <div style={{ display: 'flex', gap: '10px', margin: '8px 0' }}>
                {dropZone('bills', 'Drop BILLS (money out)', '#fbbf24')}
                {dropZone('invoices', 'Drop INVOICES (money in)', '#34d399')}
              </div>
            )}
            {docs && docs.length === 0 && <p style={{ fontSize: '11px', color: T.textMuted, padding: '4px 2px' }}>No PDFs in the project folder.</p>}
            {docs && (() => { const pf = parsedFiles(); return docs.map(d => {
              const done = pf.has(norm(d.rel));
              return (
                <div key={d.rel} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '4px 2px', opacity: done ? 0.55 : 1 }}>
                  <span style={{ flex: 1, fontSize: '12px', color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.name}</span>
                  <button onClick={() => setPreviewRel(d.rel)} style={chip('rgba(96,165,250,0.16)', '#60a5fa', true)}>Preview</button>
                  <a href={`${FS}?path=${encodeURIComponent(d.rel)}`} target="_blank" rel="noopener" title="Open in a new tab" style={{ ...chip('rgba(96,165,250,0.16)', '#60a5fa', true), textDecoration: 'none' }}>↗</a>
                  {done ? (
                    <>
                      <span style={chip('rgba(16,185,129,0.16)', '#34d399')}>✓ Parsed</span>
                      <button onClick={() => { setPreviewRel(d.rel); setEditId('new'); setForm({ ...blank(inferDir(d.rel)), source_file: d.rel, parse_status: 'parsed', notes: 'extra line from ' + d.name }); }} title="Add another line from this document (e.g. duty)" style={chip('rgba(148,163,184,0.18)', '#cbd5e1', true)}>+ line</button>
                    </>
                  ) : (
                    <button onClick={() => parseDocManual(d.rel)} style={chip('rgba(148,163,184,0.18)', '#cbd5e1', true)}>Parse →</button>
                  )}
                  <button onClick={() => deleteDocFile(d.rel, d.name)} title="Delete this file from the project folder" style={chip('rgba(248,113,113,0.16)', '#f87171', true)}>🗑</button>
                </div>
              );
            }); })()}
          </div>

          {/* PDF preview pane */}
          {previewRel && (
            <div style={{ padding: '8px 12px', borderBottom: `1px solid ${T.border}` }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                <span style={{ fontSize: '11px', color: T.textMuted, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>📄 {previewRel.split('/').pop()}</span>
                <a href={`${FS}?path=${encodeURIComponent(previewRel)}`} target="_blank" rel="noopener" style={{ fontSize: '11px', color: T.accent, textDecoration: 'none' }}>open ↗</a>
                <button onClick={() => setPreviewRel(null)} style={{ fontSize: '11px', color: T.textMuted, background: 'none', border: 'none', cursor: 'pointer' }}>close</button>
              </div>
              <iframe src={`${FS}?path=${encodeURIComponent(previewRel)}`} style={{ width: '100%', height: '380px', border: `1px solid ${T.border}`, borderRadius: '8px', background: '#fff' }} />
            </div>
          )}

          <div style={{ padding: '8px 12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '4px 4px' }}>
              <span style={{ fontSize: '11px', fontWeight: 700, color: '#34d399', textTransform: 'uppercase', letterSpacing: '0.05em', flex: 1 }}>Money In</span>
              <button onClick={() => startNew('in')} style={{ fontSize: '11px', fontWeight: 600, color: T.accent, background: 'none', border: 'none', cursor: 'pointer' }}>+ revenue</button>
            </div>
            {newStandalone && form.direction === 'in' && (
              <div style={{ border: `1px solid ${T.accent}`, borderRadius: '10px', margin: '8px 0', overflow: 'hidden' }}>{editor}{candidatePicker}</div>
            )}
            {loading ? <p style={{ fontSize: '12px', color: T.textMuted, padding: '8px' }}>Loading…</p>
              : insGroups.length === 0 && !(newStandalone && form.direction === 'in') ? <p style={{ fontSize: '12px', color: T.textMuted, padding: '8px' }}>No revenue lines yet.</p>
              : insGroups.map(g => groupCard(g))}

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '8px 4px 4px' }}>
              <span style={{ fontSize: '11px', fontWeight: 700, color: '#fbbf24', textTransform: 'uppercase', letterSpacing: '0.05em', flex: 1 }}>Money Out</span>
              <button onClick={() => startNew('out')} style={{ fontSize: '11px', fontWeight: 600, color: T.accent, background: 'none', border: 'none', cursor: 'pointer' }}>+ cost</button>
            </div>
            {newStandalone && form.direction === 'out' && (
              <div style={{ border: `1px solid ${T.accent}`, borderRadius: '10px', margin: '8px 0', overflow: 'hidden' }}>{editor}{candidatePicker}</div>
            )}
            {loading ? null
              : outsGroups.length === 0 && !(newStandalone && form.direction === 'out') ? <p style={{ fontSize: '12px', color: T.textMuted, padding: '8px' }}>No cost lines yet.</p>
              : outsGroups.map(g => groupCard(g))}
          </div>
        </div>
      );
    }

    // ============================================================================
    // DETAILED TIMELINE: the full page for one project (or one task). Header
    // with status picker and dates, location warning, stats, FinancialsPanel,
    // the project folder's files, milestones, linked tasks, quotes, notes and
    // the activity timeline. Opened from every page that lists projects.
    // ============================================================================
    function DetailedTimeline({ job, onBack, data, showToast, onNavigate, backLabel, onOpenProjectFile }) {
      const isTask = !!job._isTask;
      const apiCollection = isTask ? 'assignments' : 'jobs';
      const client = data.clients.find(c => c.id === job.client);
      // The job handed in is a snapshot taken when the row was clicked.
      // Saving reloads data, but the parent keeps holding that snapshot,
      // so anything read off it is one save behind. Read the fresh copy
      // back out of data for the location warning, otherwise typing an
      // address in and saving leaves the warning sitting there looking
      // like the save did nothing.
      const liveJob = (data.jobs || []).find(j => j.id === job.id) || job;
      const addressGap = isTask ? null : locationGap(liveJob, data);
      // Show interactions linked directly to this job, plus client-level interactions (no job link).
      // For tasks: also include interactions linked to the parent job.
      const parentJobId = isTask ? job.job : null;
      const jobInteractions = data.interactions.filter(i => {
        if (i.job === job.id) return true;
        if (parentJobId && i.job === parentJobId) return true;
        if (job.client && i.client === job.client && !i.job) return true;
        return false;
      }).sort((a, b) => new Date(b.date) - new Date(a.date));
      const quotes = isTask ? [] : data.quotes.filter(q => q.job === job.id);
      const linkedTasks = isTask ? [] : (data.assignments || []).filter(t => t.job === job.id);
      // Done and not done are two different questions, so they get two lists.
      // A completed task carries any of three markers depending on which path
      // closed it, so all three count as done.
      const isDoneTask = (t) => t.status === 'completed' || t._realStatus === 'completed' || !!t.archived;
      const openLinkedTasks = linkedTasks.filter(t => !isDoneTask(t));
      const doneLinkedTasks = linkedTasks.filter(isDoneTask);
      const clientTasks = job.client ? (data.assignments || []).filter(t => t.client === job.client && t.id !== job.id && t.status !== 'completed') : [];
      const priColors = { 4: '#ef4444', 3: '#f59e0b', 2: '#3b82f6', 1: '#64748b' };
      const [drillItem, setDrillItem] = useState(null); // { type: 'task'|'quote', data }
      // Sits on top of the project, so Escape closes this before the project.
      useEscapeBack(!!drillItem, () => setDrillItem(null));
      // The Due Date card doubles as a date picker, so changing a date is one
      // click rather than a trip through Edit and Save.
      const [dueEdit, setDueEdit] = useState(false);
      const [savingDue, setSavingDue] = useState(false);
      // Completed tasks pile up under a project and bury the two that are
      // still open, so they fold away once there is more than one.
      const [showDoneTasks, setShowDoneTasks] = useState(null); // null = follow the default
      // Folded by default once there is more than one, open once the operator
      // unfolds it.
      const doneTasksOpen = showDoneTasks === null ? doneLinkedTasks.length <= 1 : showDoneTasks;
      const [editing, setEditing] = useState(false);
      const [saving, setSaving] = useState(false);
      // Archive / delete confirmation modal for this record
      const [archiveModal, setArchiveModal] = useState(null); // { mode: 'archive'|'delete' }
      // Inline edit state for the archive reason/comment shown on archived records
      const [editingArchiveNote, setEditingArchiveNote] = useState(false);
      const [archiveNoteDraft, setArchiveNoteDraft] = useState('');
      const [savingArchiveNote, setSavingArchiveNote] = useState(false);
      const [editForm, setEditForm] = useState({
        // A job with no status opens the form on 'quoting', a value the database
        // accepts, so the first save cannot fail on the status field.
        status: job.status || 'quoting',
        client: job.client || '',
        description: job.description || '',
        due_date: job.due_date ? job.due_date.split('T')[0].split(' ')[0] : '',
        start_date: job.start_date ? job.start_date.split('T')[0].split(' ')[0] : '',
        value: job.value || '',
        site_address: job.site_address || '',
        title: job.title || '',
      });

      // Status colours come from the one table, JOB_STATUS_META, so this page
      // and the status flow legend always agree.
      //
      // `accent` is the legend's dot colour, used for the card's top edge, the
      // milestone bar and the timeline dot. A status the table does not know
      // gets statusMeta's grey fallback.
      const jobMeta = statusMeta(job.status);
      const ss = { accent: jobMeta.dot, bg: jobMeta.bg, text: jobMeta.text, label: jobMeta.label };
      const critical = isClientCritical(client);

      const fmtDate = (d) => {
        if (!d) return '—';
        return new Date(d).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      };

      const today = new Date();
      const isOverdue = job.due_date && new Date(job.due_date) < today && !isTerminalStatus(job.status);
      const daysActive = job.start_date ? Math.ceil((today - new Date(job.start_date)) / 86400000) : null;
      const daysUntilDue = job.due_date ? Math.ceil((new Date(job.due_date) - today) / 86400000) : null;

      // One row component, used by both the open list and the completed list, so
      // the two cannot drift apart.
      const renderLinkedTask = (task) => {
        const isOverdueTask = task.due_date && new Date(task.due_date) < new Date() && task.status !== 'completed';
        const priColor = priColors[task.priority] || '#64748b';
        return (
          <div key={task.id}
            onClick={() => setDrillItem({ type: 'task', data: task })}
            style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 12px', borderRadius: '8px', background: T.surfaceGradient, borderLeft: `3px solid ${lateInk(lateTierOf(task), priColor)}`, cursor: 'pointer', transition: 'background-color 0.15s' }}
            onMouseEnter={e => e.currentTarget.style.background = T.cardHoverGradient}
            onMouseLeave={e => e.currentTarget.style.background = T.surfaceGradient}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '12px', fontWeight: 600, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{task.content || task.title}</div>
              {task.description && <div style={{ fontSize: '10px', color: T.textSecondary, marginTop: '2px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{task.description}</div>}
            </div>
            <div style={{ flexShrink: 0, textAlign: 'right' }}>
              <div style={{ fontSize: '10px', color: isOverdueTask ? '#f87171' : T.textMuted }}>{task.due_date ? tlFmtShort(task.due_date) : 'No date'}</div>
              <div style={{ fontSize: '9px', color: task.status === 'completed' ? '#10b981' : T.textMuted }}>{task.status}</div>
            </div>
            <div style={{ display: 'flex', gap: '4px', flexShrink: 0 }}>
              {task.status !== 'completed' && (
                <button onClick={async (e) => {
                  e.stopPropagation();
                  try {
                    await completeAssignmentViaSync(task.id, { title: task.content || task.title, client: task.client, job: task.job });
                    showToast(task.todoist_id ? 'Task completed — Todoist will close on next sync' : 'Task completed');
                    setTimeout(() => softRefresh(), 500);
                  } catch(err) { showToast('Error: ' + err.message, 'error'); }
                }}
                  style={{ padding: '3px 6px', borderRadius: '5px', border: 'none', backgroundColor: 'transparent', color: T.textMuted, cursor: 'pointer', transition: 'all 0.15s', fontSize: '10px', fontWeight: 600 }}
                  onMouseEnter={e => { e.stopPropagation(); e.currentTarget.style.background = 'linear-gradient(160deg, rgba(16,185,129,0.204) 0%, rgba(16,185,129,0.054) 100%)'; e.currentTarget.style.color = '#34d399'; }}
                  onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.textMuted; }}
                  title="Mark complete">✓</button>
              )}
              <button onClick={async (e) => {
                e.stopPropagation();
                if (!confirm('Delete this task?' + (task.todoist_id ? ' Todoist will close on next sync.' : ''))) return;
                try {
                  await softDeleteAssignmentViaSync(task.id, 'deleted from dashboard', {
                    client: task.client || null,
                    job: task.job || null,
                  });
                  showToast(task.todoist_id ? 'Task delete queued — Todoist will close on next sync' : 'Task deleted');
                  setTimeout(() => softRefresh(), 500);
                } catch(err) { showToast('Error: ' + err.message, 'error'); }
              }}
                style={{ padding: '3px 6px', borderRadius: '5px', border: 'none', backgroundColor: 'transparent', color: T.textMuted, cursor: 'pointer', transition: 'all 0.15s', fontSize: '10px' }}
                onMouseEnter={e => { e.stopPropagation(); e.currentTarget.style.background = 'linear-gradient(160deg, rgba(239,68,68,0.204) 0%, rgba(239,68,68,0.054) 100%)'; e.currentTarget.style.color = '#f87171'; }}
                onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.textMuted; }}
                title="Delete task">✕</button>
            </div>
          </div>
        );
      };

      // A date typed into the card goes straight to the record. For a task it
      // rides the same reverse-sync path as the Edit panel, so Todoist gets it
      // on the next pass. Never writes anything but the one field.
      const saveDueDate = async (value) => {
        const next = value || null;
        const current = job.due_date ? String(job.due_date).split('T')[0].split(' ')[0] : null;
        if (next === current) { setDueEdit(false); return; }
        setSavingDue(true);
        try {
          if (isTask) await pushAssignmentEditViaSync(job.id, { due_date: next });
          else await fetchAPI(`/collections/${apiCollection}/records/${job.id}`, { method: 'PATCH', body: JSON.stringify({ due_date: next || '' }) });
          showToast(next ? 'Due date set to ' + fmtDate(next) : 'Due date cleared');
          setDueEdit(false);
          setTimeout(() => softRefresh(), 500);
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
        setSavingDue(false);
      };

      const handleSaveEdit = async () => {
        setSaving(true);
        try {
          // For tasks: stamp source='dashboard' so the daemon's reverse_sync_edits
          // picks the row up on its next pass and pushes content, description and
          // due_date to Todoist. For projects: a plain PocketBase PATCH.
          if (isTask) {
            await pushAssignmentEditViaSync(job.id, {
              content: editForm.title,
              description: editForm.description,
              status: editForm.status === 'completed' ? 'completed' : 'open',
              due_date: editForm.due_date || null,
            });
          } else {
            // Status leaves the spread and goes through patchJobStatus, so
            // the change is stamped. Sending it in the spread would also
            // rewrite it on every save that did not touch it, which restamps
            // the chase clock for an edit to a note.
            const { status, ...rest } = editForm;
            await fetchAPI(`/collections/${apiCollection}/records/${job.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ ...rest, value: editForm.value ? parseFloat(editForm.value) : 0 }),
            });
            if (status && status !== job.status) await patchJobStatus(job.id, status);
          }
          showToast(isTask
            ? (job.todoist_id ? 'Task saved — Todoist push on next sync' : 'Task saved')
            : 'Project updated');
          setEditing(false);
          setTimeout(() => softRefresh(), 600);
        } catch (e) {
          showToast('Error saving: ' + e.message, 'error');
        }
        setSaving(false);
      };

      // Archive: writes PocketBase only; the daemon closes the Todoist task on
      // its next pass.
      const handleArchiveConfirm = async (reason) => {
        try {
          await archiveRecord(apiCollection, job.id, reason);
          showToast(isTask
            ? (job.todoist_id ? 'Task archived — Todoist will close on next sync' : 'Task archived')
            : 'Project archived');
          setArchiveModal(null);
          setTimeout(() => { onBack(); softRefresh(); }, 500);
        } catch (e) {
          showToast('Archive failed: ' + e.message, 'error');
          throw e;
        }
      };

      const handleUnarchive = async () => {
        try {
          await unarchiveRecord(apiCollection, job.id);
          showToast(isTask ? 'Task restored' : 'Project restored');
          setTimeout(() => softRefresh(), 500);
        } catch (e) {
          showToast('Restore failed: ' + e.message, 'error');
        }
      };

      // archived_reason may carry a leading sentinel (COMPLETE: / DELETE:) that
      // the daemon relies on. Split it off so the human note is shown and edited
      // cleanly, then re-attach the prefix on save.
      const ARCHIVE_PREFIX_RE = /^(COMPLETE:|DELETE:)\s*/i;
      const rawArchiveReason = job.archived_reason || '';
      const archivePrefixMatch = rawArchiveReason.match(ARCHIVE_PREFIX_RE);
      const archiveReasonPrefix = archivePrefixMatch ? archivePrefixMatch[0] : '';
      const archiveReasonBody = rawArchiveReason.replace(ARCHIVE_PREFIX_RE, '');

      const startEditArchiveNote = () => {
        setArchiveNoteDraft(archiveReasonBody);
        setEditingArchiveNote(true);
      };

      const handleSaveArchiveNote = async () => {
        setSavingArchiveNote(true);
        try {
          const newReason = archiveReasonPrefix + archiveNoteDraft.trim();
          await fetchAPI(`/collections/${apiCollection}/records/${job.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ archived_reason: newReason }),
          });
          showToast('Archive note updated');
          setEditingArchiveNote(false);
          setTimeout(() => softRefresh(), 500);
        } catch (e) {
          showToast('Error saving note: ' + e.message, 'error');
        }
        setSavingArchiveNote(false);
      };

      // Delete: for tasks, route through the daemon with a DELETE: intent marker
      // so it closes the Todoist task with a comment, then deletes the PocketBase
      // row. For projects, delete directly and log an interaction.
      const handleDeleteConfirm = async (reason) => {
        try {
          if (isTask) {
            await softDeleteAssignmentViaSync(job.id, reason, {
              client: job.client || null,
              job: job.job || null,
            });
            showToast(job.todoist_id
              ? 'Task delete queued — Todoist will close on next sync'
              : 'Task deleted');
          } else {
            await deleteRecordWithReason(apiCollection, job.id, reason, {
              client: job.client || null,
              job: null,
            });
            showToast('Project deleted');
          }
          setArchiveModal(null);
          setTimeout(() => { onBack(); softRefresh(); }, 400);
        } catch (e) {
          showToast('Delete failed: ' + e.message, 'error');
          throw e;
        }
      };

      const inputStyle = {
        width: '100%', padding: '8px 12px', fontSize: '13px', borderRadius: '8px',
        background: 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)', border: `1px solid ${T.border}`,
        color: T.text, outline: 'none', transition: 'border-color 0.15s',
      };
      const labelStyle = { fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '4px', display: 'block' };

      // Match to project file
      const matchedProjectFile = useMemo(() => {
        if (!data.projectFiles?.length) return null;
        const jobTitle = (job.title || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
        const jobWords = jobTitle.split(/\s+/).filter(w => w.length > 1);
        return data.projectFiles.find(pf => {
          const projName = pf.project.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
          const projWords = projName.split(/\s+/).filter(w => w.length > 1);
          if (projWords.every(w => jobWords.includes(w)) || jobWords.every(w => projWords.includes(w))) return true;
          if (client) {
            const clientName = client.name.toLowerCase();
            const folderName = pf.client.toLowerCase();
            if ((clientName.includes(folderName) || folderName.includes(clientName)) && projWords.filter(w => jobWords.includes(w)).length >= 2) return true;
          }
          return false;
        });
      }, [job, client, data.projectFiles]);

      // Folder contents for matched project file
      const [folderContents, setFolderContents] = useState(null);
      const [folderExpanded, setFolderExpanded] = useState(true);
      const [folderPreview, setFolderPreview] = useState(null); // { rel, name } shown in the inline preview
      useEffect(() => {
        if (!matchedProjectFile) { setFolderContents(null); return; }
        const folderRel = matchedProjectFile.path.substring(0, matchedProjectFile.path.lastIndexOf('/'));
        fetch(`${FOLDER_CONTENTS_URL}?path=${encodeURIComponent(folderRel)}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => setFolderContents(d))
          .catch(() => setFolderContents(null));
      }, [matchedProjectFile]);

      // Drilled-down task/quote: render its own detail view; back button returns here.
      if (drillItem) {
        return <DrilldownDetail
          type={drillItem.type}
          item={drillItem.data}
          parentTitle={job.title || job.content || 'project'}
          onBack={() => setDrillItem(null)}
          data={data}
          showToast={showToast}
        />;
      }

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
          {/* Back */}
          <button onClick={onBack} style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '13px', color: T.textMuted, background: 'none', border: 'none', cursor: 'pointer', padding: 0, fontWeight: 500, transition: 'color 0.15s' }}
            onMouseEnter={e => e.currentTarget.style.color = T.blue}
            onMouseLeave={e => e.currentTarget.style.color = T.textMuted}>
            <Icon name="chevronRight" className="rotate-180" size={14} /> {backLabel || 'Back to timeline'}
          </button>

          {/* Critical-client banner */}
          {critical && (
            <div role="alert" style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '14px 18px', borderRadius: '12px', background: 'linear-gradient(160deg, rgba(239,68,68,0.136) 0%, rgba(239,68,68,0.036) 100%)', border: '1px solid rgba(239,68,68,0.35)', boxShadow: '0 0 0 1px rgba(239,68,68,0.08) inset' }}>
              <div style={{ flexShrink: 0, width: '8px', height: '8px', borderRadius: '50%', background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #f87171', marginTop: '6px', boxShadow: '0 0 0 4px rgba(239,68,68,0.18)' }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: '11px', fontWeight: 700, color: '#f87171', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Critical client</div>
                <div style={{ fontSize: '13px', color: T.text, marginTop: '4px', lineHeight: 1.5 }}>{criticalBannerText(client)}</div>
              </div>
            </div>
          )}

          {/* Archived banner: shows the archive reason/comment and lets it be edited */}
          {job.archived && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', padding: '14px 18px', borderRadius: '12px', background: 'linear-gradient(160deg, rgba(245,158,11,0.136) 0%, rgba(245,158,11,0.036) 100%)', border: '1px solid rgba(245,158,11,0.3)' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span style={{ fontSize: '11px', fontWeight: 700, color: '#fbbf24', letterSpacing: '0.08em', textTransform: 'uppercase' }}>📦 Archived</span>
                  {job.archived_at && <span style={{ fontSize: '11px', color: T.textMuted }}>{fmtDate(job.archived_at)}</span>}
                </div>
                {!editingArchiveNote && (
                  <button onClick={startEditArchiveNote}
                    style={{ display: 'inline-flex', alignItems: 'center', gap: '5px', padding: '5px 12px', fontSize: '11px', fontWeight: 600, color: '#fbbf24', background: 'linear-gradient(160deg, rgba(245,158,11,0.17) 0%, rgba(245,158,11,0.045) 100%)', border: '1px solid rgba(245,158,11,0.25)', borderRadius: '8px', cursor: 'pointer' }}>
                    ✎ Edit note
                  </button>
                )}
              </div>
              {!editingArchiveNote ? (
                <div style={{ fontSize: '13px', color: archiveReasonBody ? T.text : T.textMuted, lineHeight: 1.5, whiteSpace: 'pre-wrap' }}>
                  {archiveReasonBody || 'No archive note recorded — click “Edit note” to add one.'}
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <textarea value={archiveNoteDraft} onChange={e => setArchiveNoteDraft(e.target.value)} rows={3} autoFocus
                    placeholder="Reason this was archived…"
                    style={{ ...inputStyle, width: '100%', resize: 'vertical', fontSize: '13px', lineHeight: 1.5 }} />
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button onClick={handleSaveArchiveNote} disabled={savingArchiveNote}
                      style={{ padding: '6px 14px', fontSize: '11px', fontWeight: 600, color: '#fff', background: T.accentGradient, border: 'none', borderRadius: '8px', cursor: savingArchiveNote ? 'default' : 'pointer', opacity: savingArchiveNote ? 0.6 : 1 }}>
                      {savingArchiveNote ? 'Saving…' : 'Save note'}
                    </button>
                    <button onClick={() => setEditingArchiveNote(false)} disabled={savingArchiveNote}
                      style={{ padding: '6px 14px', fontSize: '11px', fontWeight: 600, color: T.textSecondary, backgroundColor: 'transparent', border: `1px solid ${T.border}`, borderRadius: '8px', cursor: 'pointer' }}>
                      Cancel
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Hero header */}
          <div style={{ background: T.cardGradient, borderRadius: '16px', border: `1px solid ${critical ? 'rgba(239,68,68,0.35)' : T.border}`, overflow: 'hidden' }}>
            <div style={{ height: '3px', background: critical ? `linear-gradient(90deg, #ef4444, #ef444460, transparent)` : `linear-gradient(90deg, ${ss.accent}, ${ss.accent}60, transparent)` }} />
            <div style={{ padding: '24px 28px 20px' }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '16px' }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  {/* Says what you are looking at (Project or Task), so a screenshot of
                      one cannot be mistaken for the other. */}
                  <p style={{ fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '6px' }}>{isTask ? 'Task' : 'Project'}</p>
                  {!editing ? (
                    <h1 style={{ fontSize: '20px', fontWeight: 700, color: T.text, letterSpacing: '-0.01em', lineHeight: 1.3 }}>{job.title}</h1>
                  ) : (
                    <input value={editForm.title} onChange={e => setEditForm({...editForm, title: e.target.value})} style={{ ...inputStyle, fontSize: '18px', fontWeight: 700, padding: '4px 8px', marginBottom: '4px' }} />
                  )}
                  {client && (
                    <p style={{ fontSize: '13px', color: T.blue, marginTop: '4px', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '4px', fontWeight: 500 }}
                       onClick={() => onNavigate && onNavigate('clients')}
                       onMouseEnter={e => { e.currentTarget.style.textDecoration = 'underline'; e.currentTarget.style.opacity = '0.85'; }}
                       onMouseLeave={e => { e.currentTarget.style.textDecoration = 'none'; e.currentTarget.style.opacity = '1'; }}>
                      {client.name}
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                    </p>
                  )}
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '10px', flexWrap: 'wrap' }}>
                    {/* The same StatusChip in read mode and StatusPicker in edit mode as
                        everywhere else, offering the full list of eleven statuses. */}
                    {!editing ? (
                      <StatusChip status={job.status} size="lg" />
                    ) : (
                      <StatusPicker value={editForm.status} size="lg"
                        onChange={s => setEditForm({ ...editForm, status: s })} />
                    )}
                    {isOverdue && !editing && (
                      <span style={{ fontSize: '11px', fontWeight: 600, padding: '3px 10px', borderRadius: '6px', background: 'linear-gradient(160deg, rgba(239,68,68,0.204) 0%, rgba(239,68,68,0.054) 100%)', color: '#f87171', border: '1px solid rgba(239,68,68,0.2)' }}>
                        OVERDUE by {Math.abs(daysUntilDue)} days
                      </span>
                    )}
                    {job.value > 0 && !editing && (
                      <span style={{ fontSize: '15px', fontWeight: 700, color: T.green, marginLeft: '4px' }}>${job.value.toLocaleString()}</span>
                    )}
                  </div>
                </div>
                <div style={{ display: 'flex', gap: '8px', flexShrink: 0, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                  {!editing ? (
                    <React.Fragment>
                      {matchedProjectFile && onOpenProjectFile && (
                        <button onClick={() => onOpenProjectFile(matchedProjectFile)}
                          style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '8px 14px', fontSize: '12px', fontWeight: 600, color: '#94a3b8', background: 'linear-gradient(160deg, rgba(148,163,184,0.136) 0%, rgba(148,163,184,0.036) 100%)', border: '1px solid rgba(148,163,184,0.2)', borderRadius: '10px', cursor: 'pointer', transition: 'all 0.15s' }}
                          onMouseEnter={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(148,163,184,0.255) 0%, rgba(148,163,184,0.0675) 100%)'; }}
                          onMouseLeave={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(148,163,184,0.136) 0%, rgba(148,163,184,0.036) 100%)'; }}>
                          <Icon name="folder" size={14} /> PROJECT.md
                        </button>
                      )}
