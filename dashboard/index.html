                      <button onClick={() => setEditing(true)}
                        style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '8px 14px', fontSize: '12px', fontWeight: 600, color: T.textSecondary, background: 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)', border: `1px solid ${T.border}`, borderRadius: '10px', cursor: 'pointer', transition: 'all 0.15s' }}
                        onMouseEnter={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(255,255,255,0.136) 0%, rgba(255,255,255,0.036) 100%)'; e.currentTarget.style.borderColor = T.accent; e.currentTarget.style.color = T.text; }}
                        onMouseLeave={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)'; e.currentTarget.style.borderColor = T.border; e.currentTarget.style.color = T.textSecondary; }}>
                        <Icon name="edit" size={14} /> Edit
                      </button>
                      {isTask ? (
                        <React.Fragment>
                          {job._realStatus !== 'completed' && (
                            <button onClick={async () => {
                              try {
                                await completeAssignmentViaSync(job.id, { title: job.content || job.title, client: job.client, job: job.job });
                                showToast(job.todoist_id ? 'Task completed — Todoist will close on next sync' : 'Task completed');
                                setTimeout(() => softRefresh(), 600);
                              } catch(e) { showToast('Error: ' + e.message, 'error'); }
                            }}
                              style={{ display: 'inline-flex', alignItems: 'center', gap: '5px', padding: '8px 14px', fontSize: '11px', fontWeight: 600, color: '#34d399', background: 'linear-gradient(160deg, rgba(16,185,129,0.136) 0%, rgba(16,185,129,0.036) 100%)', border: '1px solid rgba(16,185,129,0.2)', borderRadius: '10px', cursor: 'pointer', transition: 'all 0.15s' }}
                              onMouseEnter={e => e.currentTarget.style.background = 'linear-gradient(160deg, rgba(16,185,129,0.255) 0%, rgba(16,185,129,0.0675) 100%)'}
                              onMouseLeave={e => e.currentTarget.style.background = 'linear-gradient(160deg, rgba(16,185,129,0.136) 0%, rgba(16,185,129,0.036) 100%)'}>

              try { await navigator.clipboard.writeText(folderContents.folderPath); showToast('Folder path copied'); } catch { showToast('Copy failed', 'error'); }

              const abs = (folderContents.folderPath || '').replace(/\/+$/, '') + '/' + (entry.parentDir ? entry.parentDir + '/' : '') + entry.name;

              const rel = relOf(entry);
              if (!confirm('Delete "' + entry.name + '" from the project folder? This cannot be undone.')) return;

                const res = await fetch(`${FILE_SERVE_URL}?path=${encodeURIComponent(rel)}`, { method: 'DELETE' });

                setFolderContents(fc => fc ? { ...fc, entries: fc.entries.filter(e => !(e.name === entry.name && e.parentDir === entry.parentDir)) } : fc);
                if (folderPreview && folderPreview.rel === rel) setFolderPreview(null);

              if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; // let the browser open a new tab

    }

    // ============================================================================
    // CLIENT INTEL PAGE: every site with Splatt equipment, on one map.
    //
    // The register lives in the PocketBase `equipment` collection, one row per
    // machine, so adding a machine is a database write, never an edit to this
    // file.
    //
    // Each row carries its own lat/lng instead of reading the client's address,
    // because the register also covers companies that are not Splatt clients
    // (machines a supplier's historical register lists). Coordinates on the row
    // keep those machines on the map without adding client records for them.
    // ============================================================================

    // Machine categories, in the order the filter row shows them. The key is
    // what the `category` select stores, so this table and the collection
    // cannot drift apart without the chip count going to zero, which is
    // visible rather than silent.
    const EQUIP_KINDS = {
      capper:      { label: 'Cappers',      dot: '#60a5fa' },
      filler:      { label: 'Fillers',      dot: '#34d399' },
      rinser:      { label: 'Rinsers',      dot: '#22d3ee' },
      seamer:      { label: 'Seamers',      dot: '#a78bfa' },
      pasteuriser: { label: 'Pasteurisers', dot: '#fb923c' },
      blower:      { label: 'Blowers',      dot: '#fbbf24' },
      dryer:       { label: 'Dryers',       dot: '#f59e0b' },
      ozone:       { label: 'Ozone',        dot: '#2dd4bf' },
      conveyor:    { label: 'Conveyors',    dot: '#94a3b8' },
      packer:      { label: 'Packers',      dot: '#c084fc' },
      doser:       { label: 'Dosers',       dot: '#818cf8' },
      cip:         { label: 'CIP',          dot: '#38bdf8' },
      labeller:    { label: 'Labellers',    dot: '#f472b6' },
      other:       { label: 'Other',        dot: '#64748b' },
    };

    // Site status drives the pin colour. 'history' is the supplier's historical
    // register: machines known to have been supplied, at companies that may not
    // be current accounts. Drawn dimmer and smaller so an old record does not
    // look like a live account.
    const INTEL_STATUS = {
      active:         { label: 'Active sites',  fill: '#2a78d6', ring: '#7fb2f0', rank: 3 },
      prospect:       { label: 'Prospects',     fill: '#eb6834', ring: '#f5a882', rank: 2 },
      history:        { label: '2022 register', fill: '#1baf7a', ring: '#6fd8b3', rank: 1 },
      decommissioned: { label: 'Decommissioned',fill: '#64748b', ring: '#94a3b8', rank: 0 },
    };
    const intelStatusMeta = (s) => INTEL_STATUS[s] || INTEL_STATUS.decommissioned;

    // A PocketBase number field stores 0, never null, so a machine saved with no
    // address comes back at 0,0. Left alone that would drop a pin in the Gulf
    // of Guinea and stretch the map's auto-fit around the world. No site is at
    // 0,0, so 0,0 means the address is missing.
    const intelCoords = (rec) => {
      const lat = Number(rec.lat), lng = Number(rec.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (lat === 0 && lng === 0) return null;
      return { lat, lng };
    };

    function ClientIntelPage({ data, showToast, onNavigate }) {
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const layerRef = useRef(null);

      const [kindFilter, setKindFilter] = useState(() => new Set());
      // History is off by default. It is the largest and least current block of
      // rows, so leaving it on would make an old register the first thing the map
      // shows.
      const [statusFilter, setStatusFilter] = useState(() => new Set(['active', 'prospect']));
      const [search, setSearch] = useState('');
      const [selectedKey, setSelectedKey] = useState(null);
      const [panel, setPanel] = useState('sites'); // 'sites' | 'gaps'
      const [fitNonce, setFitNonce] = useState(1);
      const fitServedRef = useRef(0);
      const marksRef = useRef([]);
      // NZ or the world, the same two buttons the Timeline map has. NZ and
      // Fiji together make a tall narrow shape, so framing both leaves the
      // country using a sliver of the width. Defaulting to NZ fills it, and
      // World is one click away for the Fiji and Melbourne pins.
      const [viewMode, setViewMode] = useState('nz');
      const programmaticRef = useRef(false);
      const userMovedRef = useRef(false);
      const viewModeRef = useRef('nz');

      // Frame the map on the pins. Measures the container first, because the
      // first attempt runs while the chip rows are still wrapping and the map box
      // has not reached its final height; fitting against a stale size would pin
      // everything into one corner.
      const frameOnPins = (marks, mode) => {
        const m = mapInstanceRef.current;
        if (!m || !marks || !marks.length) return;
        const want = (mode || viewModeRef.current) === 'nz'
          ? marks.filter(mk => { const ll = mk.getLatLng(); return ll.lat < -30 && ll.lng > 160; })
          : marks;
        // No NZ pin to frame, so show everything rather than nothing.
        const targets = want.length ? want : marks;
        programmaticRef.current = true;
        m.invalidateSize();
        m.fitBounds(L.featureGroup(targets).getBounds(), { padding: [34, 34], animate: false });
        setTimeout(() => { programmaticRef.current = false; }, 0);
      };

      const equipment = data.equipment || [];
      const clientsById = useMemo(() => {
        const m = {};
        (data.clients || []).forEach(c => { m[c.id] = c; });
        return m;
      }, [data.clients]);

      // Group machines into sites. The key is the site name, because that is
      // what the register is organised by: one client can have kit at more
      // than one site, and two rows at the same site belong on one pin.
      const sites = useMemo(() => {
        const bySite = {};
        equipment.filter(e => !e.archived).forEach(e => {
          const key = e.site_name || '(unnamed site)';
          const at = intelCoords(e);
          if (!bySite[key]) {
            bySite[key] = {
              key,
              name: key,
              clientId: e.client || null,
              lat: at ? at.lat : null,
              lng: at ? at.lng : null,
              precise: !!e.coords_precise,
              location: e.location || '',
              status: e.status,
              note: '',
              machines: [],
            };
          }
          const s = bySite[key];
          s.machines.push(e);
          if (!s.clientId && e.client) s.clientId = e.client;
          if (s.lat == null && at) { s.lat = at.lat; s.lng = at.lng; s.precise = !!e.coords_precise; }
          // The liveliest status on the pin wins, so one active machine at a
          // site that also holds an old register entry keeps the site live.
          if (intelStatusMeta(e.status).rank > intelStatusMeta(s.status).rank) s.status = e.status;
          if (e.note && !s.note.includes(e.note)) s.note = s.note ? s.note + ' ' + e.note : e.note;
        });
        return Object.values(bySite).sort((a, b) => a.name.localeCompare(b.name));
      }, [equipment]);

      const q = search.trim().toLowerCase();
      const machineMatchesKind = (e) => kindFilter.size === 0 || kindFilter.has(e.category);
      const siteMatchesSearch = (s) => {
        if (!q) return true;
        const hay = [s.name, s.location, ...s.machines.map(m =>
          [m.description, m.make, m.model, m.serial].filter(Boolean).join(' '))].join(' ').toLowerCase();
        return hay.includes(q);
      };

      const visibleSites = useMemo(() => sites.filter(s =>
        statusFilter.has(s.status) &&
        s.machines.some(machineMatchesKind) &&
        siteMatchesSearch(s)
      ), [sites, statusFilter, kindFilter, q]);

      // Machines shown inside a site card follow the type filter too, so a
      // "Cappers" filter does not open a card full of fillers.
      const visibleMachines = (s) => s.machines.filter(machineMatchesKind);

      const counts = useMemo(() => {
        const byKind = {};
        const byStatus = {};
        sites.forEach(s => {
          byStatus[s.status] = (byStatus[s.status] || 0) + 1;
          s.machines.forEach(m => { byKind[m.category] = (byKind[m.category] || 0) + 1; });
        });
        const machinesShown = visibleSites.reduce((n, s) => n + visibleMachines(s).length, 0);
        const unmapped = visibleSites.filter(s => s.lat == null).length;
        return { byKind, byStatus, machinesShown, unmapped };
      }, [sites, visibleSites, kindFilter]);

      // Clients with nothing on the map: accounts the business trades with where
      // no machine has been recorded yet. Inactive accounts and retired duplicate
      // rows are left out.
      const gaps = useMemo(() => {
        const covered = new Set(sites.map(s => s.clientId).filter(Boolean));
        return (data.clients || [])
          .filter(c => !covered.has(c.id))
          .filter(c => c.status !== 'inactive')
          .filter(c => !/RETIRED/i.test(c.name || ''))
          .sort((a, b) => a.name.localeCompare(b.name));
      }, [sites, data.clients]);

      const selected = visibleSites.find(s => s.key === selectedKey)
        || sites.find(s => s.key === selectedKey) || null;

      // Client intel for the selected site: what else the database knows
      // about the company whose machines these are.
      const intel = useMemo(() => {
        if (!selected || !selected.clientId) return null;
        const cid = selected.clientId;
        const client = clientsById[cid];
        const openJobs = (data.jobs || [])
          .filter(j => j.client === cid && !j.archived && !isTerminalStatus(j.status))
          .sort((a, b) => (b.value || 0) - (a.value || 0));
        const lastContact = (data.interactions || [])
          .filter(i => i.client === cid)
          .sort((a, b) => new Date(b.date || b.created) - new Date(a.date || a.created))[0] || null;
        const invoiced = (data.financials || [])
          .filter(f => f.client === cid && f.direction === 'in')
          .reduce((n, f) => n + (Number(f.amount_net_nzd ?? f.amount_net ?? 0) || 0), 0);
        return { client, openJobs, lastContact, invoiced };
      }, [selected, clientsById, data.jobs, data.interactions, data.financials]);

      const toggle = (setter) => (key) => setter(prev => {
        const n = new Set(prev);
        n.has(key) ? n.delete(key) : n.add(key);
        return n;
      });
      const toggleKind = toggle(setKindFilter);
      const toggleStatus = toggle(setStatusFilter);
      const requestFit = () => setFitNonce(n => n + 1);
      useEffect(() => { viewModeRef.current = viewMode; }, [viewMode]);

      // Init map. Same tile source and the same reason as the Timeline map:
      // OSM's own servers answer a request with no Referer with a blocked
      // tile, and this page is opened as file://, where there is no Referer.
      useEffect(() => {
        if (mapInstanceRef.current || !mapRef.current) return;
        // zoomSnap 0.25 so a fit lands on the frame the pins actually need. At the
        // default snap of 1 the fit rounds down a whole level and wastes half the
        // map. zoomDelta stays 1, so the +/- buttons still step normally.
        const m = L.map(mapRef.current, { center: [-38.5, 175.5], zoom: 5, zoomControl: true, scrollWheelZoom: true, minZoom: 2, maxZoom: 18, zoomSnap: 0.25, zoomDelta: 1 });
        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', { attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles <a href="https://www.openstreetmap.fr/">OSM France</a>', subdomains: 'abc', maxZoom: 20, className: 'map-tiles' }).addTo(m);
        layerRef.current = L.layerGroup().addTo(m);
        // Once the user has moved the map, nothing may move it back. fitBounds
        // fires the same events, so the programmatic flag tells a user drag apart
        // from a reframe done here.
        m.on('dragstart zoomstart', () => {
          if (!programmaticRef.current) userMovedRef.current = true;
        });
        mapInstanceRef.current = m;
        return () => { m.remove(); mapInstanceRef.current = null; layerRef.current = null; };
      }, []);

      // Draw the pins.
      useEffect(() => {
        const m = mapInstanceRef.current;
        const layer = layerRef.current;
        if (!m || !layer) return;
        layer.clearLayers();
        const marks = [];
        visibleSites.filter(s => s.lat != null).forEach(s => {
          const meta = intelStatusMeta(s.status);
          const isSel = s.key === selectedKey;
          const kit = visibleMachines(s);
          const mk = L.circleMarker([s.lat, s.lng], {
            radius: isSel ? 12 : (s.status === 'history' ? 6 : 8),
            weight: isSel ? 3 : 2,
            color: isSel ? '#ffffff' : meta.ring,
            fillColor: meta.fill,
            fillOpacity: s.status === 'history' ? 0.75 : 0.95,
          });
          mk.bindPopup(
            '<b>' + s.name + '</b><br>' +
            (s.location || '') + (s.precise ? '' : ' <i>(approx)</i>') +
            '<br><br>' + kit.map(k => '&bull; ' + k.description).join('<br>')
          );
          mk.on('click', () => { setSelectedKey(s.key); setPanel('sites'); });
          mk.addTo(layer);
          marks.push(mk);
        });

        marksRef.current = marks;

        // Only reframe when something asked for it. The 30 second background
        // refresh must not move the map while someone is reading it.
        if (fitNonce > fitServedRef.current && marks.length) {
          fitServedRef.current = fitNonce;
          frameOnPins(marks);
        }
      }, [visibleSites, selectedKey, kindFilter, fitNonce]);

      // Leaflet needs telling when its box changes size, and the box keeps
      // changing while the page settles: the chip rows wrap, the data lands, the
      // sidebar collapses. So the map re-frames on each resize until the user
      // moves it, and never after that.
      useEffect(() => {
        const el = mapRef.current;
        const m = mapInstanceRef.current;
        if (!el || !m) return;
        const settle = () => {
          m.invalidateSize();
          if (!userMovedRef.current) frameOnPins(marksRef.current);
        };
        const t = setTimeout(settle, 120);
        if (typeof ResizeObserver === 'undefined') return () => clearTimeout(t);
        const ro = new ResizeObserver(settle);
        ro.observe(el);
        return () => { clearTimeout(t); ro.disconnect(); };
      }, []);

      const fmtD = (d) => d ? new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
      const fmtNZD = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('en-NZ');
      const daysSince = (d) => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;

      const chip = (on, dot) => ({
        display: 'inline-flex', alignItems: 'center', gap: '6px',
        padding: '5px 11px', fontSize: '12px', fontWeight: on ? 700 : 500,
        borderRadius: '14px', cursor: 'pointer', fontFamily: 'inherit',
        border: `1px solid ${on ? T.pillActive.border : T.border}`,
        background: on ? T.pillActive.bg : T.pillInactive.bg,
        color: on ? T.pillActive.text : T.pillInactive.text,
      });

      const empty = equipment.length === 0;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', height: 'calc(100vh - 170px)', minHeight: '560px' }}>

          {/* Counts strip */}
          <div style={{ display: 'flex', gap: '26px', flexWrap: 'wrap', alignItems: 'flex-end', background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '12px', padding: '12px 18px', flexShrink: 0 }}>
            {[
              ['Sites shown', visibleSites.length],
              ['Machines shown', counts.machinesShown],
              ['Sites on record', sites.length],
              ['Machines on record', equipment.length],
              ['Clients with no kit recorded', gaps.length],
            ].map(([label, n]) => (
              <div key={label}>
                <div style={{ fontSize: '21px', fontWeight: 700, color: T.text, lineHeight: 1.15 }}>{n}</div>
                <div style={{ fontSize: '11.5px', color: T.textSecondary }}>{label}</div>
              </div>
            ))}
            {counts.unmapped > 0 && (
              <div style={{ fontSize: '11.5px', color: T.amber, alignSelf: 'center' }}>
                {counts.unmapped} shown site{counts.unmapped === 1 ? '' : 's'} with no address, listed on the right but not pinned
              </div>
            )}
          </div>

          {/* Filters */}
          <div style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '12px', padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: '9px', flexShrink: 0 }}>
            <div style={{ display: 'flex', gap: '7px', flexWrap: 'wrap', alignItems: 'center' }}>
              <span style={{ fontSize: '10.5px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.6px', color: T.textMuted, minWidth: '74px' }}>Machine</span>
              {Object.entries(EQUIP_KINDS).filter(([k]) => counts.byKind[k]).map(([k, meta]) => {
                const on = kindFilter.has(k);
                return (
                  <button key={k} onClick={() => toggleKind(k)} aria-pressed={on} style={chip(on)}>
                    <span style={{ width: '9px', height: '9px', borderRadius: '50%', background: meta.dot, flexShrink: 0 }} />
                    {meta.label}<span style={{ opacity: 0.6, fontSize: '11px' }}>{counts.byKind[k]}</span>
                  </button>
                );
              })}
              {kindFilter.size > 0 && (
                <button onClick={() => setKindFilter(new Set())} style={{ background: 'none', border: 'none', color: T.accentText, font: 'inherit', fontSize: '12px', cursor: 'pointer', textDecoration: 'underline' }}>clear</button>
              )}
            </div>
            <div style={{ display: 'flex', gap: '7px', flexWrap: 'wrap', alignItems: 'center' }}>
              <span style={{ fontSize: '10.5px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.6px', color: T.textMuted, minWidth: '74px' }}>Status</span>
              {Object.entries(INTEL_STATUS).filter(([k]) => counts.byStatus[k]).map(([k, meta]) => {
                const on = statusFilter.has(k);
                return (
                  <button key={k} onClick={() => toggleStatus(k)} aria-pressed={on} style={chip(on)}>
                    <span style={{ width: '9px', height: '9px', borderRadius: '50%', background: meta.fill, flexShrink: 0 }} />
                    {meta.label}<span style={{ opacity: 0.6, fontSize: '11px' }}>{counts.byStatus[k]}</span>
                  </button>
                );
              })}
              <div style={{ flex: 1 }} />
              <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Search site, machine, serial…"
                style={{ border: `1px solid ${T.border}`, background: T.panelGradient, color: T.text, borderRadius: '8px', padding: '7px 11px', fontSize: '13px', fontFamily: 'inherit', minWidth: '230px', outline: 'none' }} />
              {[{ k: 'nz', l: 'NZ' }, { k: 'all', l: 'World' }].map(v => (
                <button key={v.k} title="Frame the map on these pins"
                  onClick={() => { setViewMode(v.k); viewModeRef.current = v.k; userMovedRef.current = false; requestFit(); }}
                  style={{ padding: '6px 13px', fontSize: '12px', fontWeight: 600, borderRadius: '8px', border: `1px solid ${T.border}`, cursor: 'pointer',
                    background: viewMode === v.k ? T.accentGradient : T.cardGradient, color: viewMode === v.k ? '#fff' : T.textSecondary }}>{v.l}</button>
              ))}
            </div>
          </div>

          {/* Map + panel */}
          <div style={{ flex: 1, display: 'flex', minHeight: 0, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${T.border}`, background: T.panelGradient }}>
            <div style={{ flex: 1, position: 'relative', minWidth: 0 }}>
              <div ref={mapRef} style={{ width: '100%', height: '100%' }} />
              {empty && (
                <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 900, pointerEvents: 'none' }}>
                  <div style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '12px', padding: '16px 22px', color: T.textSecondary, fontSize: '13px', maxWidth: '380px', textAlign: 'center' }}>
                    Nothing in the equipment collection yet. Add rows to PocketBase and they appear here on the next refresh.
                  </div>
                </div>
              )}
            </div>

            <div style={{ width: '430px', flexShrink: 0, background: T.cardGradient, borderLeft: `1px solid ${T.border}`, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
              {/* Panel tabs */}
              <div style={{ display: 'flex', borderBottom: `1px solid ${T.border}`, flexShrink: 0 }}>
                {[['sites', `Sites (${visibleSites.length})`], ['gaps', `Gaps (${gaps.length})`]].map(([k, label]) => (
                  <button key={k} onClick={() => setPanel(k)} style={{
                    flex: 1, padding: '10px 8px', fontSize: '12.5px', fontWeight: panel === k ? 700 : 500,
                    background: panel === k ? T.surfaceGradient : 'transparent',
                    color: panel === k ? T.text : T.textSecondary,
                    border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                    boxShadow: panel === k ? `inset 0 -2px 0 0 ${T.accent}` : 'none',
                  }}>{label}</button>
                ))}
              </div>

              <div style={{ flex: 1, overflowY: 'auto', minHeight: 0 }}>
                {panel === 'gaps' ? (
                  <div style={{ padding: '12px 14px' }}>
                    <div style={{ fontSize: '12px', color: T.textSecondary, marginBottom: '10px', lineHeight: 1.5 }}>
                      Clients in the database with no machine recorded against them. Each one is either a client we have never supplied kit to, or a gap in the register worth filling.
                    </div>
                    {gaps.length === 0 && <div style={{ fontSize: '13px', color: T.textMuted }}>Every client has at least one machine recorded.</div>}
                    {gaps.map(c => (
                      <div key={c.id} style={{ padding: '8px 10px', borderRadius: '8px', border: `1px solid ${T.border}`, marginBottom: '6px', background: T.panelGradient }}>
                        <div style={{ fontSize: '13px', fontWeight: 600, color: T.text }}>{c.name}</div>
                        <div style={{ fontSize: '11.5px', color: T.textMuted }}>
                          {c.status || 'no status'}{c.address ? ' · ' + String(c.address).replace(/\s*\|\s*GPS:.*$/, '') : ''}
                        </div>
                      </div>
                    ))}
                  </div>
                ) : selected ? (
                  <div style={{ padding: '14px 16px' }}>
                    <button onClick={() => setSelectedKey(null)} style={{ background: 'none', border: 'none', color: T.accentText, font: 'inherit', fontSize: '12px', cursor: 'pointer', padding: 0, marginBottom: '10px' }}>← All sites</button>

                    <div style={{ fontSize: '16px', fontWeight: 700, color: T.text, lineHeight: 1.25 }}>{selected.name}</div>
                    <div style={{ fontSize: '12px', color: T.textSecondary, marginTop: '2px' }}>
                      {selected.location || 'No location on file'}{selected.lat != null && !selected.precise ? ' · pin is approximate' : ''}
                    </div>
                    <div style={{ marginTop: '8px', display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '11.5px', fontWeight: 600, padding: '3px 10px', borderRadius: '12px', background: T.surfaceGradient, border: `1px solid ${T.border}`, color: T.textSecondary }}>
                      <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: intelStatusMeta(selected.status).fill }} />
                      {intelStatusMeta(selected.status).label}
                    </div>

                    {selected.note && (
                      <div style={{ marginTop: '10px', padding: '8px 11px', borderRadius: '8px', fontSize: '12px', lineHeight: 1.5, color: T.amber, background: 'rgba(251,191,36,0.10)', border: '1px solid rgba(251,191,36,0.28)' }}>
                        {selected.note}
                      </div>
                    )}

                    <div style={{ marginTop: '16px', fontSize: '10.5px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.6px', color: T.textMuted }}>
                      Equipment ({visibleMachines(selected).length}{visibleMachines(selected).length !== selected.machines.length ? ' of ' + selected.machines.length : ''})
                    </div>
                    {(() => {
                      const srcs = [...new Set(visibleMachines(selected).map(m => m.source).filter(Boolean))];
                      return srcs.length === 1
                        ? <div style={{ fontSize: '10.5px', color: T.textDim, marginTop: '3px', lineHeight: 1.4 }}>Source: {srcs[0]}</div>
                        : null;
                    })()}
                    {visibleMachines(selected).map(mch => {
                      const km = EQUIP_KINDS[mch.category] || EQUIP_KINDS.other;
                      return (
                        <div key={mch.id} style={{ marginTop: '7px', padding: '9px 11px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '7px', marginBottom: '3px' }}>
                            <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: km.dot, flexShrink: 0 }} />
                            <span style={{ fontSize: '10.5px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', color: T.textMuted }}>{km.label}</span>
                            {mch.serial && <span style={{ fontSize: '10.5px', color: T.textDim, marginLeft: 'auto' }}>s/n {mch.serial}</span>}
                          </div>
                          <div style={{ fontSize: '12.5px', color: T.text, lineHeight: 1.45 }}>{mch.description}</div>
                          {mch.source && new Set(visibleMachines(selected).map(x => x.source).filter(Boolean)).size > 1 && (
                            <div style={{ fontSize: '10.5px', color: T.textDim, marginTop: '4px', lineHeight: 1.4 }}>Source: {mch.source}</div>
                          )}
                        </div>
                      );
                    })}

                    {intel ? (
                      <>
                        <div style={{ marginTop: '18px', fontSize: '10.5px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.6px', color: T.textMuted }}>Client</div>
                        <div style={{ marginTop: '7px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                          <div style={{ padding: '9px 11px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient }}>
                            <div style={{ fontSize: '10.5px', color: T.textMuted }}>Invoiced to date</div>
                            <div style={{ fontSize: '15px', fontWeight: 700, color: T.text }}>{fmtNZD(intel.invoiced)}</div>
                          </div>
                          <div style={{ padding: '9px 11px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient }}>
                            <div style={{ fontSize: '10.5px', color: T.textMuted }}>Open projects</div>
                            <div style={{ fontSize: '15px', fontWeight: 700, color: T.text }}>{intel.openJobs.length}</div>
                          </div>
                        </div>

                        <div style={{ marginTop: '10px', padding: '9px 11px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient }}>
                          <div style={{ fontSize: '10.5px', color: T.textMuted, marginBottom: '3px' }}>Last contact</div>
                          {intel.lastContact ? (
                            <>
                              <div style={{ fontSize: '12.5px', color: T.text, lineHeight: 1.4 }}>
                                {intel.lastContact.subject || intel.lastContact.summary || intel.lastContact.type || 'Interaction'}
                              </div>
                              <div style={{ fontSize: '11px', color: T.textDim, marginTop: '2px' }}>
                                {fmtD(intel.lastContact.date || intel.lastContact.created)}
                                {daysSince(intel.lastContact.date || intel.lastContact.created) != null && ` · ${daysSince(intel.lastContact.date || intel.lastContact.created)} days ago`}
                              </div>
                            </>
                          ) : <div style={{ fontSize: '12.5px', color: T.textMuted }}>Nothing logged</div>}
                        </div>

                        {intel.openJobs.length > 0 && (
                          <>
                            <div style={{ marginTop: '14px', fontSize: '10.5px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.6px', color: T.textMuted }}>Open projects</div>
                            {intel.openJobs.slice(0, 6).map(j => {
                              const sm = statusMeta(j.status);
                              return (
                                <div key={j.id} style={{ marginTop: '6px', padding: '8px 11px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient, display: 'flex', alignItems: 'center', gap: '9px' }}>
                                  <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: sm.dot, flexShrink: 0 }} />
                                  <span style={{ fontSize: '12.5px', color: T.text, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{j.title}</span>
                                  <span style={{ fontSize: '11.5px', color: T.textSecondary, flexShrink: 0 }}>{j.value ? fmtNZD(j.value) : sm.label}</span>
                                </div>
                              );
                            })}
                          </>
                        )}

                        {onNavigate && (
                          <button onClick={() => onNavigate('clients', selected.clientId)}
                            style={{ marginTop: '14px', width: '100%', padding: '9px', fontSize: '12.5px', fontWeight: 600, borderRadius: '8px', border: `1px solid ${T.border}`, background: T.surfaceGradient, color: T.text, cursor: 'pointer', fontFamily: 'inherit' }}>
                            Open client record
                          </button>
                        )}
                      </>
                    ) : (
                      <div style={{ marginTop: '18px', padding: '10px 12px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient, fontSize: '12px', color: T.textSecondary, lineHeight: 1.5 }}>
                        Not linked to a client record. This site comes from a supplier's historical equipment register, so there is no account history to show.
                      </div>
                    )}
                  </div>
                ) : (
                  <div style={{ padding: '8px 10px' }}>
                    {visibleSites.length === 0 && (
                      <div style={{ padding: '14px', fontSize: '13px', color: T.textMuted }}>No site matches these filters.</div>
                    )}
                    {visibleSites.map(s => {
                      const meta = intelStatusMeta(s.status);
                      const kit = visibleMachines(s);
                      return (
                        <button key={s.key} onClick={() => { setSelectedKey(s.key); if (s.lat != null && mapInstanceRef.current) mapInstanceRef.current.setView([s.lat, s.lng], Math.max(mapInstanceRef.current.getZoom(), 9)); }}
                          style={{ display: 'block', width: '100%', textAlign: 'left', padding: '9px 11px', marginBottom: '5px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.panelGradient, cursor: 'pointer', fontFamily: 'inherit' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                            <span style={{ width: '9px', height: '9px', borderRadius: '50%', background: meta.fill, flexShrink: 0 }} />
                            <span style={{ fontSize: '13px', fontWeight: 600, color: T.text, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.name}</span>
                            <span style={{ fontSize: '11px', color: T.textMuted, flexShrink: 0 }}>{kit.length}</span>
                          </div>
                          <div style={{ fontSize: '11.5px', color: T.textMuted, marginTop: '2px' }}>
                            {s.location || 'no address on file'}{s.lat == null ? ' · not pinned' : ''}
                          </div>
                          <div style={{ fontSize: '11.5px', color: T.textSecondary, marginTop: '3px', lineHeight: 1.4 }}>
                            {kit.slice(0, 2).map(k => k.description).join(' · ')}{kit.length > 2 ? ` · +${kit.length - 2} more` : ''}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // SKILLS PAGE (#skills): the live skill harness console. Lists the skills,
    // their references, routes and recent invocations, read from PocketBase
    // (written by tools/skill_harness.py).
    // ============================================================================

    function Skill2Page({ showToast }) {
      const [loading, setLoading] = useState(true);
      const [lastRefreshed, setLastRefreshed] = useState(null);
      const [skills, setSkills] = useState([]);
      const [refs, setRefs] = useState([]);
      const [routes, setRoutes] = useState([]);
      const [invocations, setInvocations] = useState([]);
      const [loadError, setLoadError] = useState(null);
      const [selectedSkillId, setSelectedSkillId] = useState(null);
      const [activeTab, setActiveTab] = useState('skills');

      const loadHarness = useCallback(async () => {
        setLoading(true);
        setLoadError(null);
        try {
          const [sk, rf, rt, iv] = await Promise.all([
            fetchAPI('/collections/skills/records?perPage=200&sort=name'),
            fetchAPI('/collections/skill_refs/records?perPage=200&sort=-updated'),
            fetchAPI('/collections/skill_routes/records?perPage=100&sort=-priority'),
            fetchAPI('/collections/skill_invocations/records?perPage=50&sort=-created'),
          ]);
          setSkills(sk.items || []);
          setRefs(rf.items || []);
          setRoutes(rt.items || []);
          setInvocations(iv.items || []);
          setLastRefreshed(new Date());
        } catch (e) {
          const msg = e && e.message ? e.message : String(e);
          setLoadError(msg);
          if (showToast) showToast('Harness load failed: ' + msg, 'error');
        } finally {
          setLoading(false);
        }
      }, [showToast]);

      useEffect(() => { loadHarness(); }, [loadHarness]);

      // Derived lookups
      const skillById = useMemo(() => {
        const m = new Map();
        for (const s of skills) m.set(s.id, s);
        return m;
      }, [skills]);

      const refsBySkill = useMemo(() => {
        const m = new Map();
        for (const r of refs) {
          const arr = m.get(r.skill) || [];
          arr.push(r);
          m.set(r.skill, arr);
        }
        return m;
      }, [refs]);

      const summary = useMemo(() => {
        const broken = refs.filter(r => r.status !== 'valid');
        const valid = refs.filter(r => r.status === 'valid');
        const blockedRecent = invocations.filter(i => i.result === 'blocked').length;
        return {
          totalSkills: skills.length,
          validRefs: valid.length,
          brokenRefs: broken.length,
          totalRefs: refs.length,
          totalRoutes: routes.length,
          recentInvocations: invocations.length,
          recentBlocked: blockedRecent,
          brokenList: broken,
        };
      }, [skills, refs, routes, invocations]);

      // Formatting helpers (local scope only)
      const fmtTime = (iso) => {
        if (!iso) return '—';
        const d = iso instanceof Date ? iso : new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        const diffMs = Date.now() - d.getTime();
        const mins = Math.floor(diffMs / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        if (days < 7) return `${days}d ago`;
        return d.toLocaleDateString();
      };
      const shortHash = (h) => h ? `${String(h).slice(0, 10)}…` : '—';
      const truncate = (s, n) => !s ? '' : (s.length > n ? s.slice(0, n) + '…' : s);

      const statusTone = (s) => {
        const key = (s || '').toLowerCase();
        if (key === 'valid' || key === 'ok' || key === 'healthy' || key === 'success') return { c: T.green, bg: 'rgba(52,211,153,0.12)', bd: 'rgba(52,211,153,0.3)' };
        if (key === 'pending' || key === 'warn' || key === 'warning') return { c: T.amber, bg: 'rgba(251,191,36,0.12)', bd: 'rgba(251,191,36,0.3)' };
        if (key === 'stale' || key === 'blocked' || key === 'failed' || key === 'broken' || key === 'error') return { c: T.red, bg: 'rgba(248,113,113,0.12)', bd: 'rgba(248,113,113,0.3)' };
        return { c: T.textMuted, bg: 'rgba(100,116,139,0.12)', bd: 'rgba(100,116,139,0.3)' };
      };

      // --- local presentational bits ---
      const Chip = ({ label, icon, mono, tone = 'muted' }) => {
        const palette = {
          muted: { bg: T.chipGradient, c: T.chipText, bd: T.borderSubtle },
          green: { bg: 'rgba(52,211,153,0.12)', c: T.green, bd: 'rgba(52,211,153,0.25)' },
          red:   { bg: 'rgba(248,113,113,0.12)', c: T.red,   bd: 'rgba(248,113,113,0.25)' },
          blue:  { bg: 'rgba(96,165,250,0.12)',  c: T.blue,  bd: 'rgba(96,165,250,0.25)' },
        };
        const p = palette[tone] || palette.muted;
        return (
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: '4px',
            fontSize: '10px', fontWeight: 600,
            color: p.c, background: p.bg, border: `1px solid ${p.bd}`,
            padding: '2px 8px', borderRadius: '999px',
            fontFamily: mono ? 'ui-monospace, SFMono-Regular, Menlo, monospace' : 'inherit',
          }}>
            {icon && <Icon name={icon} size={10} />}
            {label}
          </span>
        );
      };

      const EmptyState = ({ text }) => (
        <div style={{ padding: '40px', textAlign: 'center', color: T.textMuted, background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '10px' }}>
          {text}
        </div>
      );

      const StatusPill = ({ status, minWidth }) => {
        const t = statusTone(status);
        return (
          <span style={{
            display: 'inline-block',
            fontSize: '10px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em',
            color: t.c, background: t.bg, border: `1px solid ${t.bd}`,
            padding: '2px 8px', borderRadius: '999px',
            minWidth: minWidth || 'auto', textAlign: 'center', whiteSpace: 'nowrap',
          }}>{status || 'unknown'}</span>
        );
      };

      // --- header + summary + banner ---
      const renderHeader = () => (
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '20px', gap: '16px' }}>
          <div>
            <h1 style={{ fontSize: '26px', fontWeight: 700, color: T.text, margin: 0, display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span style={{ color: T.accentText }}><Icon name="sparkle" size={24} /></span>
              Skill Harness
            </h1>
            <p style={{ margin: '4px 0 0', color: T.textSecondary, fontSize: '13px' }}>
              Live view of skills, references, routes, and invocations — backed by PocketBase.
              {lastRefreshed && <span style={{ marginLeft: '8px', color: T.textMuted }}>Refreshed {fmtTime(lastRefreshed)}</span>}
            </p>
          </div>
          <button
            onClick={loadHarness}
            disabled={loading}
            style={{
              padding: '8px 14px', borderRadius: '8px',
              background: loading ? T.cardHoverGradient : T.pillActive.bg,
              color: T.accentText,
              border: `1px solid ${T.accentBorder}`,
              fontSize: '13px', fontWeight: 600,
              cursor: loading ? 'wait' : 'pointer',
              whiteSpace: 'nowrap',
            }}
          >{loading ? 'Loading…' : 'Refresh'}</button>
        </div>
      );

      const renderSummary = () => {
        const cards = [
          { label: 'Skills',       value: summary.totalSkills,      sub: 'tracked by harness',                                                            color: T.purple, icon: 'sparkle' },
          { label: 'Refs Valid',   value: summary.validRefs,        sub: `of ${summary.totalRefs} total`,                                                 color: T.green,  icon: 'check' },
          { label: 'Refs Broken',  value: summary.brokenRefs,       sub: summary.brokenRefs ? 'needs attention' : 'all clean',                            color: summary.brokenRefs ? T.red : T.textMuted, icon: summary.brokenRefs ? 'alertTriangle' : 'check' },
          { label: 'Routes',       value: summary.totalRoutes,      sub: 'operation types',                                                               color: T.blue,   icon: 'link' },
          { label: 'Invocations',  value: summary.recentInvocations, sub: summary.recentBlocked ? `${summary.recentBlocked} blocked` : 'recent activity', color: summary.recentBlocked ? T.amber : T.textMuted, icon: 'clock' },
        ];
        return (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '12px', marginBottom: '20px' }}>
            {cards.map(c => (
              <div key={c.label} style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '10px', padding: '14px 16px' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '6px' }}>
                  <span style={{ fontSize: '11px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{c.label}</span>
                  <span style={{ color: c.color }}><Icon name={c.icon} size={16} /></span>
                </div>
                <div style={{ fontSize: '26px', fontWeight: 700, color: T.text, lineHeight: 1 }}>{c.value}</div>
                <div style={{ fontSize: '11px', color: T.textSecondary, marginTop: '4px' }}>{c.sub}</div>
              </div>
            ))}
          </div>
        );
      };

      const renderBrokenBanner = () => {
        if (summary.brokenRefs === 0) return null;
        return (
          <div style={{
            background: 'linear-gradient(160deg, rgba(248,113,113,0.102) 0%, rgba(248,113,113,0.027) 100%)',
            border: `1px solid rgba(248,113,113,0.25)`,
            borderRadius: '10px',
            padding: '14px 16px',
            marginBottom: '20px',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
              <span style={{ color: T.red }}><Icon name="alertTriangle" size={18} /></span>
              <span style={{ color: T.red, fontSize: '14px', fontWeight: 700 }}>
                {summary.brokenRefs} broken ref{summary.brokenRefs > 1 ? 's' : ''} detected
              </span>
              <span style={{ color: T.textMuted, fontSize: '11px', marginLeft: '4px' }}>
                (morning sweep will auto-file Todoist tasks for these)
              </span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {summary.brokenList.slice(0, 8).map(r => {
                const s = skillById.get(r.skill);
                return (
                  <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: '10px', fontSize: '12px' }}>
                    <StatusPill status={r.status} minWidth="60px" />
                    <span style={{ color: T.text, fontWeight: 500 }}>{s?.name || r.skill}</span>
                    <span style={{ color: T.textMuted }}>→</span>
                    <code style={{ fontFamily: 'ui-monospace, monospace', color: T.accentText, fontSize: '11px' }}>{r.ref_key}</code>
                    {r.last_error && <span style={{ color: T.textSecondary, fontSize: '11px' }}>· {truncate(r.last_error, 80)}</span>}
                  </div>
                );
              })}
              {summary.brokenList.length > 8 && (
                <div style={{ fontSize: '11px', color: T.textMuted, marginTop: '2px' }}>
                  +{summary.brokenList.length - 8} more — see References tab
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderTabs = () => {
        const tabs = [
          { id: 'skills',      label: 'Skills',      count: skills.length },
          { id: 'refs',        label: 'References',  count: refs.length },
          { id: 'routes',      label: 'Routes',      count: routes.length },
          { id: 'invocations', label: 'Invocations', count: invocations.length },
        ];
        return (
          <div style={{ display: 'flex', gap: '4px', borderBottom: `1px solid ${T.border}`, marginBottom: '16px' }}>
            {tabs.map(t => {
              const on = activeTab === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  style={{
                    padding: '10px 16px',
                    background: on ? T.pillActive.bg : 'transparent',
                    color: on ? T.accentText : T.textSecondary,
                    border: 'none',
                    borderBottom: on ? `2px solid ${T.accent}` : '2px solid transparent',
                    fontSize: '13px', fontWeight: 600,
                    cursor: 'pointer',
                    display: 'flex', alignItems: 'center', gap: '6px',
                    marginBottom: '-1px',
                  }}
                >
                  {t.label}
                  <span style={{
                    background: on ? T.pillActive.bg : T.chipGradient,
                    color: on ? T.accentText : T.textMuted,
                    padding: '1px 6px', borderRadius: '10px',
                    fontSize: '11px', fontWeight: 700,
                  }}>{t.count}</span>
                </button>
              );
            })}
          </div>
        );
      };

      // --- Skills tab ---
      const renderSkillsTab = () => {
        if (skills.length === 0) return <EmptyState text="No skills registered yet. Run skill_harness.py bootstrap." />;
        return (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: '12px' }}>
            {skills.map(s => {
              const mine = refsBySkill.get(s.id) || [];
              const brokenHere = mine.filter(r => r.status !== 'valid').length;
              const isOpen = selectedSkillId === s.id;
              const editable = s.working_path && s.live_path && s.working_path !== s.live_path;
              return (
                <div
                  key={s.id}
                  onClick={() => setSelectedSkillId(isOpen ? null : s.id)}
                  style={{
                    background: T.cardGradient,
                    border: `1px solid ${isOpen ? T.accentBorder : T.border}`,
                    borderRadius: '10px',
                    padding: '14px 16px',
                    cursor: 'pointer',
                    transition: 'border-color 0.15s',
                  }}
                >
                  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '8px', marginBottom: '4px' }}>
                    <div style={{ minWidth: 0, flex: 1 }}>
                      <div style={{ fontSize: '14px', fontWeight: 700, color: T.text, display: 'flex', alignItems: 'center', gap: '6px' }}>
                        <span style={{ color: T.purple }}><Icon name="sparkle" size={14} /></span>
                        {s.name}
                      </div>
                      {s.category && (
                        <div style={{ fontSize: '10px', color: T.textMuted, marginTop: '2px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{s.category}</div>
                      )}
                    </div>
                    <StatusPill status={s.status} />
                  </div>

                  <p style={{ fontSize: '12px', color: T.textSecondary, margin: '8px 0 10px', lineHeight: 1.5 }}>
                    {truncate(s.description || '(no description)', 140)}
                  </p>

                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '10px' }}>
                    <Chip label={`${s.file_count || 0} file${(s.file_count || 0) === 1 ? '' : 's'}`} icon="file" />
                    <Chip label={fmtBytes(s.size_bytes)} />
                    <Chip label={shortHash(s.content_hash)} mono />
                    <Chip
                      label={`${mine.length} ref${mine.length === 1 ? '' : 's'}`}
                      tone={brokenHere ? 'red' : (mine.length ? 'green' : 'muted')}
                      icon={brokenHere ? 'alertTriangle' : (mine.length ? 'check' : undefined)}
                    />
                    {editable && <Chip label="editable" tone="blue" icon="edit" />}
                  </div>

                  <div style={{ fontSize: '11px', color: T.textMuted, display: 'flex', justifyContent: 'space-between', gap: '8px' }}>
                    <span>synced {fmtTime(s.last_synced_at)}</span>
                    <span>validated {fmtTime(s.last_validated_at)}</span>
                  </div>

                  {isOpen && (
                    <div
                      onClick={(e) => e.stopPropagation()}
                      style={{ marginTop: '12px', paddingTop: '12px', borderTop: `1px solid ${T.borderSubtle}`, cursor: 'default' }}
                    >
                      {s.working_path && (
                        <div style={{ fontSize: '11px', color: T.textSecondary, marginBottom: '4px' }}>
                          <span style={{ color: T.textMuted }}>working:</span>{' '}
                          <code style={{ fontFamily: 'ui-monospace, monospace', wordBreak: 'break-all' }}>{s.working_path}</code>
                        </div>
                      )}
                      {s.live_path && (
                        <div style={{ fontSize: '11px', color: T.textSecondary, marginBottom: '8px' }}>
                          <span style={{ color: T.textMuted }}>live:</span>{' '}
                          <code style={{ fontFamily: 'ui-monospace, monospace', wordBreak: 'break-all' }}>{s.live_path}</code>
                        </div>
                      )}

                      {Array.isArray(s.triggers) && s.triggers.length > 0 && (
                        <div style={{ marginBottom: '8px' }}>
                          <div style={{ fontSize: '10px', fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '4px' }}>Triggers</div>
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                            {s.triggers.slice(0, 10).map((trig, i) => (
                              <code key={i} style={{ fontSize: '10px', fontFamily: 'ui-monospace, monospace', color: T.chipText, background: T.chipGradient, padding: '2px 6px', borderRadius: '4px' }}>{trig}</code>
                            ))}
                          </div>
                        </div>
                      )}

                      {mine.length > 0 && (
                        <div style={{ marginTop: '4px' }}>
                          <div style={{ fontSize: '10px', fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '4px' }}>
                            References ({mine.length})
                          </div>
                          {mine.map(r => (
                            <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '11px', padding: '3px 0' }}>
                              <StatusPill status={r.status} minWidth="48px" />
                              <code style={{ fontFamily: 'ui-monospace, monospace', color: T.accentText }}>{r.ref_key}</code>
                              <span style={{ color: T.textMuted, fontSize: '10px' }}>· {r.ref_type}</span>
                            </div>
                          ))}
                        </div>
                      )}

                      {s.last_error && (
                        <div style={{ marginTop: '10px', fontSize: '11px', color: T.red, background: 'linear-gradient(160deg, rgba(248,113,113,0.136) 0%, rgba(248,113,113,0.036) 100%)', padding: '6px 8px', borderRadius: '6px' }}>
                          <strong>Last error:</strong> {s.last_error}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      };

      // --- References tab ---
      const renderRefsTab = () => {
        if (refs.length === 0) return <EmptyState text="No references indexed yet. Run skill_harness.py audit." />;
        const gridCols = '90px 1.4fr 1fr 1.2fr 130px 110px';
        return (
          <div style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '10px', overflow: 'hidden' }}>
            <div style={{ display: 'grid', gridTemplateColumns: gridCols, gap: '10px', padding: '10px 14px', background: T.cardHoverGradient, borderBottom: `1px solid ${T.border}`, fontSize: '10px', fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
              <span>Status</span><span>Ref Key</span><span>Skill</span><span>Label</span><span>Type</span><span>Validated</span>
            </div>
            {refs.map(r => {
              const s = skillById.get(r.skill);
              return (
                <div key={r.id} style={{ display: 'grid', gridTemplateColumns: gridCols, gap: '10px', padding: '10px 14px', borderBottom: `1px solid ${T.borderSubtle}`, fontSize: '12px', alignItems: 'center' }}>
                  <StatusPill status={r.status} />
                  <code style={{ fontFamily: 'ui-monospace, monospace', color: T.accentText, fontSize: '11px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.ref_key}</code>
                  <span style={{ color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s?.name || r.skill}</span>
                  <span style={{ color: T.textSecondary, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{truncate(r.label || '', 80)}</span>
                  <span style={{ color: T.textMuted, fontSize: '11px' }}>{r.ref_type}</span>
                  <span style={{ color: T.textMuted, fontSize: '11px' }}>{fmtTime(r.last_validated_at)}</span>
                </div>
              );
            })}
          </div>
        );
      };

      // --- Routes tab ---
      const renderRoutesTab = () => {
        if (routes.length === 0) return <EmptyState text="No routes configured yet. Run skill_harness.py routes." />;
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            {routes.map(r => {
              const resolved = (r.skill_ids || []).map(id => ({ id, name: skillById.get(id)?.name || id }));
              const patterns = r.trigger_patterns || [];
              return (
                <div key={r.id} style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '10px', padding: '14px 16px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px', gap: '10px', flexWrap: 'wrap' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
                      <span style={{
                        fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em',
                        color: T.accentText, background: T.pillActive.bg, border: `1px solid ${T.accentBorder}`,
                        padding: '3px 10px', borderRadius: '999px',
                      }}>{r.operation_type}</span>
                      <span style={{ fontSize: '11px', color: T.textMuted }}>priority {r.priority ?? 0}</span>
                      <span style={{
                        fontSize: '10px', fontWeight: 700, textTransform: 'uppercase',
                        color: r.enabled ? T.green : T.textMuted,
                        background: r.enabled ? 'rgba(52,211,153,0.12)' : 'rgba(100,116,139,0.12)',
                        border: `1px solid ${r.enabled ? 'rgba(52,211,153,0.3)' : 'rgba(100,116,139,0.3)'}`,
                        padding: '2px 8px', borderRadius: '999px',
                      }}>{r.enabled ? 'enabled' : 'disabled'}</span>
                    </div>
                    <span style={{ fontSize: '11px', color: T.textMuted }}>{fmtBytes(r.est_context_bytes)} context</span>
                  </div>

                  {r.notes && <div style={{ fontSize: '12px', color: T.textSecondary, marginBottom: '8px' }}>{r.notes}</div>}

                  <div style={{ marginBottom: '8px' }}>
                    <div style={{ fontSize: '10px', fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '4px' }}>Triggers ({patterns.length})</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                      {patterns.slice(0, 12).map((p, i) => (
                        <code key={i} style={{ fontSize: '10px', fontFamily: 'ui-monospace, monospace', color: T.chipText, background: T.chipGradient, padding: '2px 6px', borderRadius: '4px' }}>{p}</code>
                      ))}
                      {patterns.length > 12 && <span style={{ fontSize: '10px', color: T.textMuted, alignSelf: 'center' }}>+{patterns.length - 12} more</span>}
                    </div>
                  </div>

                  <div>
                    <div style={{ fontSize: '10px', fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '4px' }}>Skills ({resolved.length})</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                      {resolved.map(rk => (
                        <span key={rk.id} style={{
                          fontSize: '11px',
                          color: T.accentText,
                          background: T.pillActive.bg,
                          border: `1px solid ${T.accentBorder}`,
                          padding: '2px 8px', borderRadius: '999px',
                        }}>{rk.name}</span>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      };

      // --- Invocations tab ---
      const renderInvocationsTab = () => {
        if (invocations.length === 0) return <EmptyState text="No invocations logged yet. Routes will log themselves as they're used." />;
        const gridCols = '140px 100px 130px 1.3fr 100px 2fr';
        return (
          <div style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '10px', overflow: 'hidden' }}>
            <div style={{ display: 'grid', gridTemplateColumns: gridCols, gap: '10px', padding: '10px 14px', background: T.cardHoverGradient, borderBottom: `1px solid ${T.border}`, fontSize: '10px', fontWeight: 700, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
              <span>When</span><span>Result</span><span>Operation</span><span>Skill</span><span>Context</span><span>Notes</span>
            </div>
            {invocations.map(i => (
              <div key={i.id} style={{ display: 'grid', gridTemplateColumns: gridCols, gap: '10px', padding: '10px 14px', borderBottom: `1px solid ${T.borderSubtle}`, fontSize: '12px', alignItems: 'center' }}>
                <span style={{ color: T.textMuted, fontSize: '11px' }}>{fmtTime(i.created)}</span>
                <StatusPill status={i.result} />
                <span style={{ color: T.text }}>{i.operation_type || '—'}</span>
                <span style={{ color: T.textSecondary, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  {i.skill_name || skillById.get(i.skill)?.name || i.skill || '—'}
                </span>
                <span style={{ color: T.textMuted, fontSize: '11px' }}>{fmtBytes(i.context_bytes_used)}</span>
                <span style={{ color: T.textMuted, fontSize: '11px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{truncate(i.notes || '', 100)}</span>
              </div>
            ))}
          </div>
        );
      };

      // --- main render ---
      if (loading && skills.length === 0 && !loadError) {
        return (
          <div style={{ padding: '60px', textAlign: 'center', color: T.textMuted }}>
            Loading skill harness…
          </div>
        );
      }

      return (
        <div>
          {renderHeader()}
          {loadError && (
            <div style={{ background: 'linear-gradient(160deg, rgba(248,113,113,0.136) 0%, rgba(248,113,113,0.036) 100%)', border: '1px solid rgba(248,113,113,0.25)', color: T.red, borderRadius: '10px', padding: '12px 14px', marginBottom: '16px', fontSize: '13px' }}>
              Failed to load harness data: {loadError}
            </div>
          )}
          {renderSummary()}
          {renderBrokenBanner()}
          {renderTabs()}
          {activeTab === 'skills' && renderSkillsTab()}
          {activeTab === 'refs' && renderRefsTab()}
          {activeTab === 'routes' && renderRoutesTab()}
          {activeTab === 'invocations' && renderInvocationsTab()}
        </div>
      );
    }

    // ============================================================================
    // PROJECT FILES PAGE
    // ============================================================================
    // ProjectFileDetail shows one project's markdown file (rendered, editable)
    // beside a tile of the files in its folder. ProjectFilesPage, further down,
    // is the searchable list of every project file, grouped by client.

    function ProjectFileDetail({ file, onBack, showToast, renderMarkdown, onUpdated }) {
      const [editing, setEditing] = useState(false);
      const [editContent, setEditContent] = useState(file.content);
      const [saving, setSaving] = useState(false);
      const [folderContents, setFolderContents] = useState(null);
      const [folderLoading, setFolderLoading] = useState(true);
      const [folderExpanded, setFolderExpanded] = useState(true);

      const folderRelPath = file.path.substring(0, file.path.lastIndexOf('/'));

      useEffect(() => {
        setFolderLoading(true);
        fetch(`${FOLDER_CONTENTS_URL}?path=${encodeURIComponent(folderRelPath)}`)
          .then(r => r.ok ? r.json() : null)
          .then(data => { setFolderContents(data); setFolderLoading(false); })
          .catch(() => { setFolderContents(null); setFolderLoading(false); });
      }, [file.path]);

      const copyPath = async (fullPath) => {
        try {
          await navigator.clipboard.writeText(fullPath);
          showToast('Path copied — use Finder > Go > Go to Folder');
        } catch { showToast('Failed to copy', 'error'); }
      };

      const fileIcon = (ext) => {
        if (['.md', '.txt', '.html'].includes(ext)) return icons.fileText;
        if (['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'].includes(ext)) return icons.eye;
        return icons.file;
      };

      const fileIconColor = (ext) => {
        if (['.pdf'].includes(ext)) return '#ef4444';
        if (['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'].includes(ext)) return '#64748b';
        if (['.md', '.txt', '.html'].includes(ext)) return T.accent;
        return T.textMuted;
      };

      // Sync if file changes externally
      useEffect(() => { setEditContent(file.content); }, [file.content]);

      const handleSave = async () => {
        setSaving(true);
        try {
          const res = await fetch(PROJECT_FILES_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: file.path, content: editContent }),
          });
          if (!res.ok) throw new Error('Save failed');
          const result = await res.json();
          showToast('File saved');
          setEditing(false);
          onUpdated({ ...file, content: editContent, modified: result.modified || new Date().toISOString() });
        } catch (e) {
          showToast('Error saving file: ' + e.message, 'error');
        }
        setSaving(false);
      };

      const handleCancel = () => {
        setEditContent(file.content);
        setEditing(false);
      };

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          {/* Header bar */}
          <div style={{ padding: '16px 20px', display: 'flex', alignItems: 'center', gap: '12px', borderBottom: `1px solid ${T.border}`, flexShrink: 0 }}>
            <button onClick={onBack}
              style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '6px 14px', borderRadius: '8px', border: `1px solid ${T.border}`, background: T.cardGradient, color: T.textSecondary, cursor: 'pointer', fontSize: '13px', fontWeight: 500, transition: 'all 0.15s' }}
              onMouseEnter={e => { e.currentTarget.style.background = T.cardHoverGradient; e.currentTarget.style.color = T.text; }}
              onMouseLeave={e => { e.currentTarget.style.background = T.cardGradient; e.currentTarget.style.color = T.textSecondary; }}>
              <span style={{ transform: 'rotate(180deg)', display: 'inline-flex' }}>{icons.chevronRight}</span> Back
            </button>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span style={{ color: T.textMuted, fontSize: '13px' }}>{file.client}</span>
              <span style={{ color: T.textMuted }}>/</span>
              <span style={{ color: T.text, fontSize: '15px', fontWeight: 600 }}>{file.project}</span>
            </div>
            <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span style={{ fontSize: '12px', color: T.textMuted }}>
                Updated {new Date(file.modified).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
              </span>
              {!editing ? (
                <button onClick={() => setEditing(true)}
                  style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '6px 14px', fontSize: '12px', fontWeight: 600, color: T.textSecondary, background: 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)', border: `1px solid ${T.border}`, borderRadius: '8px', cursor: 'pointer', transition: 'all 0.15s' }}
                  onMouseEnter={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(255,255,255,0.136) 0%, rgba(255,255,255,0.036) 100%)'; e.currentTarget.style.borderColor = T.accent; e.currentTarget.style.color = T.text; }}
                  onMouseLeave={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)'; e.currentTarget.style.borderColor = T.border; e.currentTarget.style.color = T.textSecondary; }}>
                  {icons.edit} Edit
                </button>
              ) : (
                <React.Fragment>
                  <button onClick={handleCancel}
                    style={{ padding: '6px 14px', fontSize: '12px', fontWeight: 600, color: T.textSecondary, background: 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)', border: `1px solid ${T.border}`, borderRadius: '8px', cursor: 'pointer' }}>
                    Cancel
                  </button>
                  <button onClick={handleSave} disabled={saving}
                    style={{ display: 'inline-flex', alignItems: 'center', gap: '5px', padding: '6px 14px', fontSize: '12px', fontWeight: 600, color: '#fff', background: T.accentGradient, border: 'none', borderRadius: '8px', cursor: saving ? 'wait' : 'pointer', opacity: saving ? 0.7 : 1 }}>
                    {icons.check} {saving ? 'Saving...' : 'Save'}
                  </button>
                </React.Fragment>
              )}
            </div>
          </div>
          {/* Content: two-column layout: markdown left, folder tile right */}
          <div style={{ flex: 1, overflow: 'auto', padding: '24px 32px' }}>
            <div style={{ display: 'flex', gap: '24px', alignItems: 'flex-start' }}>
              {/* Markdown content */}
              <div style={{ flex: 1, minWidth: 0 }}>
                {editing ? (
                  <textarea value={editContent} onChange={e => setEditContent(e.target.value)}
                    style={{
                      width: '100%', height: '100%', minHeight: '500px', padding: '16px', fontSize: '13px', lineHeight: 1.7,
                      fontFamily: "'SF Mono', 'Fira Code', 'Consolas', monospace",
                      background: 'linear-gradient(160deg, rgba(255,255,255,0.051) 0%, rgba(255,255,255,0.0135) 100%)', color: T.text,
                      border: `1px solid ${T.border}`, borderRadius: '10px', resize: 'vertical', outline: 'none',
                    }}
                    onFocus={e => e.currentTarget.style.borderColor = T.accent}
                    onBlur={e => e.currentTarget.style.borderColor = T.border}
                  />
                ) : (
                  <div className="project-md" dangerouslySetInnerHTML={renderMarkdown(file.content, file.path)} />
                )}
              </div>

              {/* Folder Contents Tile: top right */}
              {!editing && !folderLoading && folderContents && (() => {
                const otherFiles = folderContents.entries.filter(e => e.name !== file.path.split('/').pop());
                const allFiles = folderContents.entries.filter(e => e.type === 'file');
                const openFile = (entry) => {
                  const rel = entry.parentDir
                    ? folderRelPath + '/' + entry.parentDir + '/' + entry.name
                    : folderRelPath + '/' + entry.name;
                  window.open(`${FILE_SERVE_URL}?path=${encodeURIComponent(rel)}`, '_blank');
                };
                return (
                  <div style={{ width: '280px', flexShrink: 0, position: 'sticky', top: 0, border: `1px solid ${T.border}`, borderRadius: '12px', overflow: 'hidden', background: T.cardGradient }}>
                    {/* Header */}
                    <div style={{ padding: '12px 14px', borderBottom: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span style={{ color: T.accent }}>{icons.folder}</span>
                      <span style={{ fontSize: '13px', fontWeight: 600, color: T.text, flex: 1 }}>Files</span>
                      <span style={{ fontSize: '11px', color: T.textMuted, background: 'linear-gradient(160deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.0225) 100%)', padding: '2px 8px', borderRadius: '10px' }}>
                        {allFiles.length}
                      </span>
                    </div>
                    {/* Copy folder path */}
                    <div onClick={() => copyPath(folderContents.folderPath)}
                      style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '8px 14px', fontSize: '11px', color: T.textMuted, cursor: 'pointer', borderBottom: `1px solid ${T.borderSubtle}`, transition: 'all 0.1s' }}
                      onMouseEnter={e => { e.currentTarget.style.background = T.cardHoverGradient; e.currentTarget.style.color = T.text; }}
                      onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.textMuted; }}>
                      {React.cloneElement(icons.copy, { width: 12, height: 12 })}
                      <span>Copy folder path</span>
                    </div>
                    {/* File tiles */}
                    <div style={{ maxHeight: '400px', overflow: 'auto' }}>
                      {allFiles.length === 0 ? (
                        <div style={{ padding: '20px 14px', textAlign: 'center', fontSize: '12px', color: T.textMuted }}>
                          No files yet
                        </div>
                      ) : (() => {
                        const topFiles = allFiles.filter(e => !e.parentDir);
                        const subDirs = [...new Set(allFiles.filter(e => e.parentDir).map(e => e.parentDir))];
                        return (
                          <React.Fragment>
                            {topFiles.map(entry => (
                              <div key={entry.name} onClick={() => openFile(entry)}
                                style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '8px 14px', cursor: 'pointer', transition: 'background 0.1s' }}
                                onMouseEnter={e => e.currentTarget.style.background = T.cardHoverGradient}
                                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                                <span style={{ color: fileIconColor(entry.extension), flexShrink: 0 }}>
                                  {React.cloneElement(fileIcon(entry.extension), { width: 16, height: 16 })}
                                </span>
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div style={{ fontSize: '12px', color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{entry.name}</div>
                                  <div style={{ fontSize: '10px', color: T.textMuted }}>{fmtBytes(entry.size)}</div>
                                </div>
                                <span style={{ color: T.textMuted, flexShrink: 0 }}>{React.cloneElement(icons.link, { width: 12, height: 12 })}</span>
                              </div>
                            ))}
                            {subDirs.map(dir => (
                              <React.Fragment key={dir}>
