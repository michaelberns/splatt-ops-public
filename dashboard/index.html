              {/* View toggle */}
              <div style={{ position: 'absolute', top: '12px', left: '60px', zIndex: 1000, display: 'flex', gap: '4px' }}>

                    padding: '6px 14px', fontSize: '12px', fontWeight: 600, borderRadius: '8px', border: `1px solid ${T.border}`, cursor: 'pointer',
                    background: viewMode === v.k ? T.accentGradient : T.cardGradient, color: viewMode === v.k ? '#fff' : T.textSecondary,

            {/* Unmapped sidebar */}
            <div style={{ width: '260px', flexShrink: 0, background: T.cardGradient, borderLeft: `1px solid ${T.border}`, display: 'flex', flexDirection: 'column' }}>
              <div style={{ padding: '10px 12px', borderBottom: `1px solid rgba(255,255,255,0.06)`, fontWeight: 700, fontSize: '12px', display: 'flex', justifyContent: 'space-between' }}>
                <span>Unmapped</span><span style={{ color: T.textSecondary, fontWeight: 500 }}>{unmappedJobs.length}</span>
              </div>
              <div style={{ overflowY: 'auto', padding: '6px', flex: 1 }}>
                {unmappedJobs.length === 0 && <div style={{ fontSize: '11px', color: T.textMuted, padding: '20px 0', textAlign: 'center' }}>All items mapped</div>}
                {isTaskMode && (() => {
                  // Same shape as the pin popups: the project is the heading,
                  // the tasks sit under it. A task with no project goes in the
                  // "No project linked" bucket at the bottom, which is a
                  // useful list in its own right.
                  const byProject = new Map();
                  unmappedJobs.forEach(t => {
                    const key = t.job || '_unlinked';
                    if (!byProject.has(key)) byProject.set(key, { project: t._linkedProject || null, tasks: [] });
                    byProject.get(key).tasks.push(t);
                  });
                  const groupList = Array.from(byProject.values()).sort((a, b) => {
                    if (!a.project !== !b.project) return a.project ? -1 : 1;
                    const aO = a.tasks.some(isTaskOverdueLive) ? 0 : 1;
                    const bO = b.tasks.some(isTaskOverdueLive) ? 0 : 1;
                    if (aO !== bO) return aO - bO;
                    return (a.project?.title || '').localeCompare(b.project?.title || '');
                  });
                  return groupList.map((g, gi) => {
                    const proj = g.project;
                    const projClient = proj ? data.clients.find(cl => cl.id === proj.client) : null;
                    return (
                      <div key={proj ? proj.id : `_unlinked-${gi}`} style={{ marginBottom: '8px' }}>
                        <div
                          onClick={() => { if (proj && onSelect) onSelect(proj); }}
                          title={proj ? 'Open this project' : 'These tasks are not attached to a project yet'}
                          style={{ padding: '4px 6px', display: 'flex', alignItems: 'baseline', gap: '5px', cursor: proj ? 'pointer' : 'default' }}
                        >
                          <span style={{ fontSize: '11px', fontWeight: 700, color: proj ? T.text : T.textMuted, fontStyle: proj ? 'normal' : 'italic', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            {proj ? proj.title : 'No project linked'}
                          </span>
                          <span style={{ fontSize: '10px', color: T.textSecondary, flexShrink: 0, marginLeft: 'auto' }}>{g.tasks.length}</span>
                        </div>
                        {projClient && (
                          <div style={{ padding: '0 6px 3px', fontSize: '10px', color: T.textSecondary, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{projClient.name}</div>
                        )}
                        {g.tasks.map(t => {
                          const c = SC[t._status] || SC.unknown;
                          const mine = t._status === 'internal';
                          const overdue = isTaskOverdueLive(t);
                          const tTier = lateTierOf(t) || (overdue ? 'quiet' : '');
                          const lands = actionableDateOf(t);
                          return (
                            <div key={t.id} onClick={() => onSelect(t)} style={{ padding: '5px 8px', margin: '2px 0 2px 8px', borderRadius: '8px', background: mine ? 'linear-gradient(160deg, rgba(13,148,136,0.28) 0%, rgba(13,148,136,0.08) 100%)' : T.cardGradient, border: `1px solid ${mine ? 'rgba(45,212,191,0.45)' : 'rgba(255,255,255,0.06)'}`, borderLeft: mine ? '3px solid #2dd4bf' : `1px solid rgba(255,255,255,0.06)`, display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', cursor: 'pointer' }}>
                              <div style={{ width: '7px', height: '7px', borderRadius: '50%', background: `linear-gradient(160deg, rgba(255,255,255,0.30) 0%, rgba(0,0,0,0.10) 100%), ${c.bg}`, flexShrink: 0 }}></div>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.title}</div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '5px', marginTop: '2px' }}>
                                  <span style={{ color: T.textSecondary, fontSize: '10px' }}>{c.label}</span>
                                  <span style={{ fontSize: '10px', color: lateInk(tTier, T.textSecondary), fontWeight: lateWeight(tTier) }}>{lands ? tlFmtShort(lands) : '—'}</span>
                                  <LocationGapChip gap={locationGap(t, data) || 'address'} />
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  });
                })()}
                {!isTaskMode && unmappedJobs.map(j => {
                  const c = SC[j._status] || SC.unknown;
                  const client = data.clients.find(cl => cl.id === j.client);
                  // Internal work has no site to pin, so it always lands here. A tinted row
                  // and a teal edge mark it as internal at a glance.
                  const mine = j._status === 'internal';
                  return (
                    <div key={j.id} onClick={() => onSelect(j)} style={{ padding: '6px 8px', margin: '2px 0', borderRadius: '8px', background: mine ? 'linear-gradient(160deg, rgba(13,148,136,0.28) 0%, rgba(13,148,136,0.08) 100%)' : T.cardGradient, border: `1px solid ${mine ? 'rgba(45,212,191,0.45)' : 'rgba(255,255,255,0.06)'}`, borderLeft: mine ? '3px solid #2dd4bf' : `1px solid rgba(255,255,255,0.06)`, display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', cursor: 'pointer' }}>
                      <div style={{ width: '7px', height: '7px', borderRadius: '50%', background: `linear-gradient(160deg, rgba(255,255,255,0.30) 0%, rgba(0,0,0,0.10) 100%), ${c.bg}`, flexShrink: 0 }}></div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{client ? `${client.name} — ` : ''}{j.title}</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '5px', marginTop: '2px' }}>
                          <span style={{ color: T.textSecondary, fontSize: '10px' }}>{c.label}</span>
                          <LocationGapChip gap={locationGap(j, data) || 'address'} />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Legend / filter bar */}
          <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '14px', padding: '8px 20px', background: T.cardGradient, borderTop: `1px solid ${T.border}`, flexShrink: 0, flexWrap: 'wrap' }}>
            {STATUS_PRI.map(s => {
              if (!stats.counts[s]) return null;
              const c = SC[s];
              const dimmed = !activeFilters.has(s);
              return (
                <div key={s} onClick={() => toggleFilter(s)} style={{ display: 'flex', alignItems: 'center', gap: '5px', fontSize: '12px', fontWeight: 500, cursor: 'pointer', padding: '3px 8px', borderRadius: '10px', opacity: dimmed ? 0.25 : 1, transition: 'all 0.15s', userSelect: 'none' }}>
                  <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: `linear-gradient(160deg, rgba(255,255,255,0.30) 0%, rgba(0,0,0,0.10) 100%), ${c.bg}` }}></div>
                  <span>{stats.counts[s]} {c.label}</span>
                </div>
              );
            })}
            <div style={{ width: '1px', height: '18px', background: `linear-gradient(180deg, transparent 0%, ${T.border} 25%, ${T.border} 75%, transparent 100%)` }}></div>
            <span style={{ fontSize: '12px', fontWeight: 600, color: '#34d399' }}>{stats.mapped} mapped</span>
            <span style={{ fontSize: '12px', fontWeight: 600, color: '#f87171' }}>{stats.unmapped} unmapped</span>
            <div style={{ width: '1px', height: '18px', background: `linear-gradient(180deg, transparent 0%, ${T.border} 25%, ${T.border} 75%, transparent 100%)` }}></div>
            <TodayFilters items={allEnrichedJobs} newToday={newToday} setNewToday={setNewToday} changedToday={changedToday} setChangedToday={setChangedToday} />
            <div style={{ width: '1px', height: '18px', background: `linear-gradient(180deg, transparent 0%, ${T.border} 25%, ${T.border} 75%, transparent 100%)` }}></div>
            {(() => {
              const mapArchivedHidden = !showArchived
                ? (jobs || []).filter(j => j.archived).length
                  + (data.assignments || []).filter(t => t.archived && t.status !== 'completed').length
                : 0;
              const mapReengageHidden = !showReengage
                ? (jobs || []).filter(j => j.status === 'reengage').length
                : 0;
              const togBtn = (active, onClick, labelOn, labelOff, hiddenCount, tintColor) => (
                <button
                  onClick={onClick}
                  style={{
                    fontSize: '11px',
                    fontWeight: 600,
                    padding: '3px 10px',
                    borderRadius: '10px',
                    border: `1px solid ${active ? tintColor : T.border}`,
                    background: active ? (T.cardAccent || T.card) : 'transparent',
                    color: active ? (T.text || '#fff') : (T.textMuted || '#94a3b8'),
                    cursor: 'pointer',
                    userSelect: 'none',
                    transition: 'all 0.15s',
                  }}
                  title={active ? `Hide ${labelOff.toLowerCase()}` : `Show ${labelOff.toLowerCase()}${hiddenCount ? ` (${hiddenCount})` : ''}`}
                >
                  {active ? labelOn : `${labelOff}${hiddenCount ? ` (${hiddenCount})` : ''}`}
                </button>
              );
              return (
                <React.Fragment>
                  {togBtn(showArchived, () => setShowArchived(s => !s), 'Hide archived', 'Show archived', mapArchivedHidden, '#6b7280')}
                  {togBtn(showReengage, () => setShowReengage(s => !s), 'Hide re-engage', 'Show re-engage', mapReengageHidden, '#fb923c')}
                </React.Fragment>
              );
            })()}
          </div>
        </div>
      );
    }

    // ── GANTT VIEW (scrollable horizontal) ──
    function TimelineGanttView({ jobs, data, onSelect, onNavigate }) {
      const scrollRef = useRef(null);
      const labelsRef = useRef(null);
      const [dayWidth, setDayWidth] = useState(28);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const ROW_H = 62;
      const LABEL_W = 300;
      const HEADER_H = 50;

      const allDates = [];
      jobs.forEach(j => {
        if (j.start_date) allDates.push(new Date(j.start_date));
        if (j.due_date) allDates.push(new Date(j.due_date));
      });
      if (allDates.length === 0) allDates.push(today);

      const rangeStart = new Date(Math.min(...allDates.map(d => d.getTime())));
      rangeStart.setDate(rangeStart.getDate() - 7);
      rangeStart.setHours(0, 0, 0, 0);
      const rangeEnd = new Date(Math.max(...allDates.map(d => d.getTime()), today.getTime()));
      rangeEnd.setDate(rangeEnd.getDate() + 21);
      rangeEnd.setHours(0, 0, 0, 0);

      const totalDays = Math.ceil((rangeEnd - rangeStart) / 86400000) + 1;
      const chartW = totalDays * dayWidth;

      const dayOffset = (date) => { const d = new Date(date); d.setHours(0,0,0,0); return Math.round((d - rangeStart) / 86400000); };
      const todayOffset = dayOffset(today);

      const months = [];
      const mc = new Date(rangeStart); mc.setDate(1);
      if (mc < rangeStart) mc.setMonth(mc.getMonth() + 1);
      while (mc <= rangeEnd) { months.push({ date: new Date(mc), offset: dayOffset(mc) }); mc.setMonth(mc.getMonth() + 1); }

      const weeks = [];
      const wc = new Date(rangeStart); const wd = wc.getDay(); wc.setDate(wc.getDate() + (wd === 0 ? 1 : (8 - wd)));
      while (wc <= rangeEnd) { weeks.push({ date: new Date(wc), offset: dayOffset(wc) }); wc.setDate(wc.getDate() + 7); }

      const sorted = [...jobs].sort((a, b) => {
        const aS = a.start_date ? new Date(a.start_date).getTime() : Infinity;
        const bS = b.start_date ? new Date(b.start_date).getTime() : Infinity;
        return aS - bS;
      });

      // Sync scroll between labels and chart
      const handleChartScroll = (e) => {
        if (labelsRef.current) {
          const scrollBody = labelsRef.current.querySelector('.overflow-y-auto') || labelsRef.current;
          scrollBody.scrollTop = e.target.scrollTop;
        }
      };

      useEffect(() => {
        if (scrollRef.current) { scrollRef.current.scrollLeft = Math.max(0, todayOffset * dayWidth - 350); }
      }, []);

      const fmtShort = (d) => d ? new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }) : '';

      return (
        <div className="space-y-3">
          <div className="flex items-center justify-end gap-2">
            <button onClick={() => setDayWidth(w => Math.max(8, w - 4))} className="px-2 py-1 text-xs border border-slate-200 rounded" style={{ background: T.cardGradient }}><Icon name="zoomOut" size={14} /></button>
            <span className="text-[10px] text-slate-400 w-12 text-center">{dayWidth}px/d</span>
            <button onClick={() => setDayWidth(w => Math.min(60, w + 4))} className="px-2 py-1 text-xs border border-slate-200 rounded" style={{ background: T.cardGradient }}><Icon name="zoomIn" size={14} /></button>
          </div>

          <div style={{ borderRadius: '12px', border: `1px solid ${T.border}`, overflow: 'hidden', display: 'flex', height: Math.min(900, sorted.length * ROW_H + HEADER_H + 4), background: T.cardGradient }}>
            {/* Fixed labels column */}
            <div className="flex-shrink-0 border-r overflow-hidden" style={{ width: LABEL_W, borderColor: T.border, background: 'linear-gradient(160deg, rgba(255,255,255,0.051) 0%, rgba(255,255,255,0.0135) 100%)' }} ref={labelsRef}>
              <div className="border-b px-3 flex items-center gap-4" style={{ height: HEADER_H, borderColor: T.border }}>
                <span className="text-[10px] uppercase tracking-wider font-semibold" style={{ color: T.textMuted, width: '45%' }}>Project</span>
                <span className="text-[10px] uppercase tracking-wider font-semibold" style={{ color: T.textMuted, width: '20%' }}>Status</span>
                <span className="text-[10px] uppercase tracking-wider font-semibold text-right" style={{ color: T.textMuted, width: '18%' }}>Start</span>
                <span className="text-[10px] uppercase tracking-wider font-semibold text-right" style={{ color: T.textMuted, width: '17%' }}>Due</span>
              </div>
              <div className="overflow-y-auto" style={{ height: `calc(100% - ${HEADER_H}px)` }}>
                {sorted.map((job, idx) => {
                  const client = data.clients.find(c => c.id === job.client);
                  const sc = TL_STATUS_COLORS[job.status] || TL_NEUTRAL;
                  const overdue = tlIsOverdue(job);
                  return (
                    <div
                      key={job.id}
                      className="flex items-center px-3 gap-2 cursor-pointer transition-colors"
                      data-result="true" tabIndex={0}
                      style={{ height: ROW_H, borderBottom: `1px solid ${T.border}`, backgroundColor: idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)' }}
                      onClick={() => onSelect(job)}
                      onMouseEnter={e => e.currentTarget.style.background = 'linear-gradient(160deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.0225) 100%)'}
                      onMouseLeave={e => e.currentTarget.style.background = idx % 2 === 0 ? 'transparent' : 'linear-gradient(160deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 100%)'}
                    >
                      <div className="min-w-0" style={{ width: '45%' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '5px' }}>
                          {job._isNewToday && <div style={{ width: 7, height: 7, borderRadius: '50%', background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #34d399', flexShrink: 0, animation: 'splatt-badge-pulse 1.8s ease-in-out infinite' }} title={'New task activity today for ' + job.title} />}
                          {!job._isNewToday && job._isChangedToday && <div style={{ width: 7, height: 7, borderRadius: '50%', background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #94a3b8', flexShrink: 0, animation: 'splatt-badge-pulse 2.2s ease-in-out infinite' }} title={'Task updated today for ' + job.title} />}
                          <p style={{ fontSize: '12px', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', lineHeight: '1.2', color: T.text }}>{job.title}</p>
                        </div>
                        {client && <p style={{ fontSize: '10px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', lineHeight: '1.2', color: T.blue, cursor: 'pointer' }} onClick={(e) => { e.stopPropagation(); onNavigate && onNavigate('clients'); }}>{client.name}</p>}
                        {job.value > 0 && <p style={{ fontSize: '10px', fontWeight: 700, color: T.green }}>${job.value.toLocaleString()}</p>}
                      </div>
                      <div style={{ width: '20%' }}>
                        <span className="inline-block px-1.5 py-0.5 text-[9px] font-semibold rounded-md" style={{ backgroundColor: `${sc.border}30`, color: sc.border, border: `1px solid ${sc.border}50` }}>
                          {job.status?.replace('_', ' ')}
                        </span>
                      </div>
                      <div className="text-right" style={{ width: '18%' }}>
                        <p className="text-[10px]" style={{ color: T.textSecondary }}>{fmtShort(job.start_date) || '—'}</p>
                      </div>
                      <div className="text-right" style={{ width: '17%' }}>
                        <p className="text-[10px] font-medium" style={{ color: lateInk(tlLateTierOf(job), T.textSecondary) }}>{fmtShort(job.due_date) || '—'}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Scrollable chart area */}
            <div className="flex-1 overflow-x-auto overflow-y-auto" ref={scrollRef} onScroll={handleChartScroll}>
              <div style={{ width: chartW, position: 'relative' }}>
                {/* Time header */}
                <div className="border-b relative" style={{ height: HEADER_H, borderColor: T.border }}>
                  {months.map((m, i) => (
                    <div key={i} className="absolute top-0 text-[10px] font-bold px-2 py-1" style={{ left: m.offset * dayWidth, color: T.textSecondary }}>
                      {m.date.toLocaleDateString('en-NZ', { month: 'short', year: '2-digit' })}
                    </div>
                  ))}
                  {weeks.map((w, i) => (
                    <div key={i} className="absolute bottom-0 text-[9px] px-1 pb-1" style={{ left: w.offset * dayWidth, color: T.textMuted, borderLeft: `1px solid ${T.border}` }}>
                      {w.date.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' })}
                    </div>
                  ))}
                </div>

                {/* Rows */}
                <div className="relative">
                  {weeks.map((w, i) => (
                    <div key={`wg-${i}`} className="absolute top-0" style={{ left: w.offset * dayWidth, height: sorted.length * ROW_H, borderLeft: `1px solid ${T.borderSubtle}` }}></div>
                  ))}

                  {/* Today line */}
                  <div className="absolute z-20" style={{ left: todayOffset * dayWidth, top: -HEADER_H, height: sorted.length * ROW_H + HEADER_H }}>
                    <div style={{ height: '100%', width: 2, background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #ef4444', opacity: 0.6 }}></div>
                    <div className="absolute text-[8px] font-bold px-1.5 py-0.5 rounded" style={{ top: 2, left: 4, color: '#dc2626', background: 'linear-gradient(160deg, rgba(239,68,68,0.255) 0%, rgba(239,68,68,0.0675) 100%)', whiteSpace: 'nowrap' }}>TODAY</div>
                  </div>

                  {sorted.map((job, idx) => {
                    const sc = TL_STATUS_COLORS[job.status] || TL_NEUTRAL;
                    const overdue = tlIsOverdue(job);
                    const client = data.clients.find(c => c.id === job.client);
                    const startOff = job.start_date ? dayOffset(job.start_date) : todayOffset;
                    // No due date: extend bar to today (active projects) or start+14 (completed)
                    const isComplete = isTerminalStatus(job.status) || job.status === 'stale';
                    const endOff = job.due_date ? dayOffset(job.due_date) : (isComplete ? startOff + 14 : Math.max(todayOffset + 7, startOff + 7));
                    const barLeft = startOff * dayWidth;
                    const barWidth = Math.max((endOff - startOff + 1) * dayWidth, dayWidth * 3);
                    const y = idx * ROW_H;
                    const daysSpan = endOff - startOff + 1;
                    const currentStage = MILESTONE_STAGES[Math.min(getStatusIndex(job.status), MILESTONE_STAGES.length - 1)];

                    // Progress %
                    let pct = 0;
                    if (job.start_date) {
                      const s = new Date(job.start_date); s.setHours(0,0,0,0);
                      const e = job.due_date ? new Date(job.due_date) : new Date(today.getTime() + 7*86400000); e.setHours(0,0,0,0);
                      const total = Math.max(e - s, 1);
                      const elapsed = Math.max(0, Math.min(today - s, total));
                      pct = Math.min(100, Math.round((elapsed / total) * 100));
                    }

                    return (
                      <div key={job.id} className="absolute" style={{ top: y, left: 0, right: 0, height: ROW_H }}>
                        <div className="absolute inset-0" style={{ borderBottom: `1px solid ${T.borderSubtle}`, backgroundColor: idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)' }}></div>

                        {/* Main bar with hover tooltip */}
                        <div className="gantt-bar-wrap absolute" style={{ left: barLeft, width: barWidth, top: 6, height: ROW_H - 12 }}
                          onMouseEnter={(e) => {
                            const tip = e.currentTarget.querySelector('.gantt-tip');
                            if (tip && scrollRef.current) {
                              const sl = scrollRef.current.scrollLeft;
                              const st = scrollRef.current.scrollTop;
                              const tipLeft = Math.max(0, sl - barLeft + 8);
                              tip.style.left = tipLeft + 'px';
                              // Flip tooltip below bar if near top of visible area
                              if (y - st < 180) {
                                tip.style.bottom = 'auto';
                                tip.style.top = '100%';
                                tip.style.marginTop = '6px';
                                tip.style.marginBottom = '0';
                              } else {
                                tip.style.bottom = '100%';
                                tip.style.top = 'auto';
                                tip.style.marginBottom = '6px';
                                tip.style.marginTop = '0';
                              }
                            }
                          }}>
                          <div
                            className="cursor-pointer rounded-md hover:brightness-125 transition-all"
                            style={{
                              width: '100%', height: '100%',
                              background: `linear-gradient(135deg, ${sc.border}90, ${sc.border}50)`,
                              border: `1.5px solid ${lateInk(tlLateTierOf(job), sc.border)}cc`,
                              boxShadow: `0 0 12px ${sc.border}30`,
                            }}
                            onClick={() => onSelect(job)}
                          >
                            {/* Title row */}
                            <div style={{ display: 'flex', alignItems: 'center', padding: '3px 8px 0', overflow: 'hidden' }}>
                              {job._isNewToday && <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #34d399', flexShrink: 0, marginRight: 4, animation: 'splatt-badge-pulse 1.8s ease-in-out infinite' }} />}
                              <span style={{ fontSize: '10px', fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: lateInk(tlLateTierOf(job), T.text) }}>
                                {job.title}
                              </span>
                              {barWidth > 120 && job.value > 0 && (
                                <span style={{ marginLeft: 'auto', fontSize: '9px', fontWeight: 700, flexShrink: 0, paddingLeft: 4, color: T.green }}>${job.value.toLocaleString()}</span>
                              )}
                              {barWidth > 160 && (
                                <span style={{ marginLeft: 4, fontSize: '8px', flexShrink: 0, color: T.textMuted }}>{daysSpan}d</span>
                              )}
                            </div>
                            {/* Milestone breadcrumbs + client name */}
                            {barWidth > 80 && (
                              <div style={{ display: 'flex', alignItems: 'center', gap: '2px', padding: '2px 8px 0', overflow: 'hidden' }}>
                                {MILESTONE_STAGES.map((ms, mi) => {
                                  const reached = mi <= getStatusIndex(job.status);
                                  const isCurrent = mi === getStatusIndex(job.status);
                                  return (
                                    <React.Fragment key={ms.key}>
                                      <div style={{
                                        width: isCurrent ? '8px' : '6px', height: isCurrent ? '8px' : '6px',
                                        borderRadius: '50%', flexShrink: 0,
                                        backgroundColor: reached ? sc.border : 'rgba(255,255,255,0.18)',
                                        border: isCurrent ? `1.5px solid ${sc.border}` : 'none',
                                        boxShadow: isCurrent ? `0 0 4px ${sc.border}` : 'none',
                                      }} />
                                      {mi < MILESTONE_STAGES.length - 1 && (
                                        <div style={{ flex: '1 0 4px', maxWidth: '14px', height: '1.5px', backgroundColor: reached && mi < getStatusIndex(job.status) ? sc.border : 'rgba(255,255,255,0.18)' }} />
                                      )}
                                    </React.Fragment>
                                  );
                                })}
                                {barWidth > 160 && (
                                  <span style={{ fontSize: '8px', color: T.textMuted, marginLeft: '4px', whiteSpace: 'nowrap' }}>
                                    {currentStage?.label}
                                  </span>
                                )}
                              </div>
                            )}
                          </div>

                          {/* Hover tooltip card */}
                          <div className="gantt-tip" style={{
                            position: 'absolute', bottom: '100%', left: 0, marginBottom: 6, zIndex: 50,
                            width: 280, padding: '10px 12px', borderRadius: '10px',
                            background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #212838', border: `1px solid ${T.border}`,
                            boxShadow: '0 8px 24px rgba(0,0,0,0.5)', pointerEvents: 'none',
                          }}>
                            <div style={{ fontWeight: 700, fontSize: '12px', color: T.text, marginBottom: 4 }}>{job.title}</div>
                            {client && <div style={{ fontSize: '11px', color: T.blue, marginBottom: 4 }}>{client.name}</div>}
                            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: 6 }}>
                              <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 6px', borderRadius: '4px', backgroundColor: `${sc.border}25`, color: sc.border, border: `1px solid ${sc.border}40` }}>
                                {job.status?.replace('_', ' ')}
                              </span>
                              {overdue && <LateBadge tier={tlLateTierOf(job) || 'quiet'} days={tlDaysLateOf(job)} />}
                              {job._isNewToday && <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 6px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(52,211,153,0.255) 0%, rgba(52,211,153,0.0675) 100%)', color: '#34d399' }}>New Today</span>}
                            </div>
                            {job.description && <div style={{ fontSize: '10px', color: T.textSecondary, marginBottom: 6, lineHeight: '1.4', overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical' }}>{job.description}</div>}
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: T.textMuted, marginBottom: 6 }}>
                              <span>Start: {fmtShort(job.start_date) || '—'}</span>
                              <span>Due: <span style={{ color: lateInk(tlLateTierOf(job) || (overdue ? 'quiet' : ''), T.textSecondary), fontWeight: 400 }}>{fmtShort(job.due_date) || '—'}</span></span>
                              <span>{daysSpan}d span</span>
                            </div>
                            {/* Progress bar */}
                            <div style={{ height: 4, borderRadius: 2, background: 'linear-gradient(160deg, rgba(255,255,255,0.102) 0%, rgba(255,255,255,0.027) 100%)', overflow: 'hidden', marginBottom: 4 }}>
                              <div style={{ width: `${pct}%`, height: '100%', borderRadius: 2, backgroundColor: lateInk(tlLateTierOf(job), sc.border) }} />
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '9px', color: T.textMuted }}>
                              <span>{pct}% elapsed</span>
                              {job.value > 0 && <span style={{ color: T.green, fontWeight: 600 }}>${job.value.toLocaleString()}</span>}
                              <span>{currentStage?.icon} {currentStage?.label}</span>
                            </div>
                          </div>
                        </div>

                        {/* Progress fill within bar (time elapsed) */}
                        {job.start_date && (
                          <div style={{
                            position: 'absolute', left: barLeft, width: barWidth * pct / 100, top: ROW_H - 6, height: 3,
                            borderRadius: '2px 0 0 2px', backgroundColor: lateInk(tlLateTierOf(job), sc.border), opacity: 0.8,
                          }}></div>
                        )}

                        {/* Start diamond */}
                        {job.start_date && (
                          <div className="absolute z-10" style={{ left: startOff * dayWidth - 3, top: ROW_H / 2 - 4 }}>
                            <div style={{ width: 7, height: 7, backgroundColor: sc.border, transform: 'rotate(45deg)', borderRadius: 1 }}></div>
                          </div>
                        )}
                        {/* Due diamond */}
                        {job.due_date && (
                          <div className="absolute z-10" style={{ left: (endOff + 1) * dayWidth - 4, top: ROW_H / 2 - 4 }}>
                            <div style={{ width: 7, height: 7, backgroundColor: lateInk(tlLateTierOf(job), sc.border), transform: 'rotate(45deg)', borderRadius: 1 }}></div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* Legend */}
          <div className="flex items-center gap-4 justify-center flex-wrap">
            <span className="text-[10px] flex items-center gap-1" style={{ color: T.textSecondary }}><span className="w-3 h-0.5 inline-block" style={{ background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #ef4444' }}></span> Today</span>
            <span className="text-[10px] flex items-center gap-1" style={{ color: T.textSecondary }}><span style={{ width: 6, height: 6, display: 'inline-block', transform: 'rotate(45deg)', background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #94a3b8', borderRadius: 1 }}></span> Start / Due</span>
            {Object.entries(TL_STATUS_COLORS).filter(([, v]) => !v.taskOnly).map(([k, v]) => (
              <span key={k} className="flex items-center gap-1 text-[10px]" style={{ color: T.textSecondary }}>
                <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: v.border }}></span>
                {k.replace('_', ' ')}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ── WORKLOAD VIEW ──
    // Draws the result of the filter pipeline (runWorkload in filter_engine.js,
    // run by TimelinePage): open projects with their open tasks nested
    // beneath, grouped by client, collapsible at client and project level, with
    // the summary bar on top. It draws exactly the cards the chips counted.
    function TimelineWorkloadView({ result, jobs, data, onSelect, onSelectClient, onNavigate, searchTerm, statusFilter, dateFilter, customStart, customEnd, dataMode, unifiedMode, newToday, changedToday, showArchivedExt, showReengageExt, showCancelledExt, showToast, qualityFilters, onQualityFilterChange }) {
      // ── Record quality ───────────────────────────────────────────────────
      // Worked out once for the whole page. Every chip, badge, count and row
      // below reads off this, so the number in the summary bar and the chips
      // on the rows are the same fact told twice rather than two guesses.
      const quality = useQuality(data);
      const [fixing, setFixing] = useState(null);
      const [bandOpen, setBandOpen] = useState(false);
      // A project passes the Records row when it carries every gap picked, so two
      // chips narrow rather than widen. That rule lives in the engine, with the
      // pass that applies it.
      const qFilters = qualityFilters || [];

      const priColors = { p1: '#ef4444', p2: '#f59e0b', p3: '#3b82f6', p4: '#64748b' };
      const priLabels = { 4: 'p1', 3: 'p2', 2: 'p3', 1: 'p4' };
      // Aliases for the token names this view uses (cardBg, cardBorder,
      // textPrimary), mapped onto the live theme T.
      const T2 = {
        ...T,
        cardBg: T.card,
        cardBorder: T.border,
        textPrimary: T.text,
      };
      const NO_CLIENT = '__no_client__';

      // Defer to the parent's toggle state when it is passed, otherwise fall
      // back to local state so this view still works rendered standalone.
      const [showArchivedLocal, setShowArchivedLocal] = useState(false);
      const [showReengageLocal, setShowReengageLocal] = useState(false);
      const showArchived = showArchivedExt !== undefined ? showArchivedExt : showArchivedLocal;
      const showReengage = showReengageExt !== undefined ? showReengageExt : showReengageLocal;
      const showCancelled = !!showCancelledExt;

      // ── One run of the pipeline ───────────────────────────────────────────
      //
      // The filtering happens once, in filter_engine.js (runWorkload, called by
      // TimelinePage), and this view renders what it is handed: the `result` prop
      // is that run. That is what keeps each chip's count equal to the cards
      // drawn here. The fallback below is only for rendering this view on its
      // own, and it calls the same function rather than a second set of rules.
      const run = result || F.runWorkload(
        {
          jobs: jobs || [],
          assignments: data.assignments || [],
          clients: data.clients || [],
          financials: data.financials || [],
          quality: quality,
        },
        {
          status: statusFilter, when: dateFilter,
          customStart: customStart, customEnd: customEnd,
          records: qFilters, search: searchTerm,
          createdToday: newToday, editedToday: changedToday,
          archived: showArchived, reengage: showReengage, cancelled: showCancelled,
        }
      );

      // Projects that matched on their own merits, and projects that are only
      // here because a task underneath them is (host projects). They are kept
      // apart because they mean different things: one is work the filter found,
      // the other only keeps an open task from vanishing off the page.
      const openJobs = run.projects;
      const hostJobs = run.hostProjects;
      const openTasks = run.tasks;
      const scopeActive = run.scopeActive;
      const summary = run.summary;
      const filteredJobs = openJobs;

      // The same words the bar's summary strip uses, from the same function,
      // so the empty state cannot name a different set of filters from the
      // strip sitting right above it.
      const recordLabelsForView = {};
      for (const r of (Q.RULES || [])) recordLabelsForView[r.code] = r.label;
      const emptyStateFilters = F.describeFilters(run.filters, recordLabelsForView);
      // Which filter is keeping the host projects off the list, by name, so the
      // fold says what it is folding.
      const hostFilterLabel = F.STATUS_LABELS[run.filters.status] || run.filters.status;

      const openProjectsCount = summary.openProjects;
      const openTasksCount = summary.openTasks;
      const overdueProjects = summary.overdueProjects;
      const overdueTasks = summary.overdueTasks;
      const totalValue = summary.value;

      // Whether a project may count toward the open and overdue numbers at
      // all. Same rule the summary uses, because the per client tallies have
      // to add up to the bar at the top.
      const inspectingParked = statusFilter === 'on_hold' || statusFilter === 'stale';
      const countingJob = (j) => scopeActive || inspectingParked || countsTowardWorkload(j);

      // Counts for the "filtered out" hint
      const archivedHiddenCount = !showArchived
        ? (jobs || []).filter(j => j.archived).length
          + (data.assignments || []).filter(t => t.archived && t.status !== 'completed').length
        : 0;

      const tasksByJob = {};
      const tasksByClientNoJob = {};
      const orphanTasks = [];
      for (const t of openTasks) {
        if (t.job) {
          (tasksByJob[t.job] = tasksByJob[t.job] || []).push(t);
        } else if (t.client) {
          (tasksByClientNoJob[t.client] = tasksByClientNoJob[t.client] || []).push(t);
        } else {
          orphanTasks.push(t);
        }
      }

      const projectsByClient = {};
      for (const j of openJobs) {
        const key = j.client || NO_CLIENT;
        (projectsByClient[key] = projectsByClient[key] || []).push(j);
      }
      const hostsByClient = {};
      for (const j of hostJobs) {
        const key = j.client || NO_CLIENT;
        (hostsByClient[key] = hostsByClient[key] || []).push(j);
      }

      const clientIds = new Set([
        ...Object.keys(projectsByClient),
        ...Object.keys(hostsByClient),
        ...Object.keys(tasksByClientNoJob),
      ]);

      const clientList = Array.from(clientIds).map(cid => {
        if (cid === NO_CLIENT) {
          return { id: cid, name: 'Projects without a client', critical: false, isVirtual: true, internal: false };
        }
        const c = (data.clients || []).find(x => x.id === cid);
        const internal = isInternalClient(c);
        return {
          id: cid,
          // Splatt's own work is labelled in plain English rather than by a company
          // name, because it is not a customer.
          name: internal ? 'Splatt NZ, my own work' : (c?.name || c?.company || '(unknown client)'),
          critical: !internal && isClientCritical(c),
          isVirtual: false,
          internal,
        };
      });
      clientList.sort((a, b) => {
        // Client work first, then Splatt's own work, then the leftovers.
        if (a.isVirtual !== b.isVirtual) return a.isVirtual ? 1 : -1;
        if (a.internal !== b.internal) return a.internal ? 1 : -1;
        if (a.critical !== b.critical) return a.critical ? -1 : 1;
        return (a.name || '').localeCompare(b.name || '');
      });

      // ── Per-client aggregates ──
      const clientStats = {};
      for (const cl of clientList) {
        const own = projectsByClient[cl.id] || [];
        const hosts = hostsByClient[cl.id] || [];
        const projs = own.concat(hosts);
        const unlinked = tasksByClientNoJob[cl.id] || [];
        // Only count tasks and projects that contribute to the live workload.
        // Archived, on-hold, cancelled, stale and terminal projects and their tasks
        // are left out of the per-client open and overdue tallies.
        const countedProjs = projs.filter(countingJob);
        let value = 0, projOverdue = 0, taskOverdue = 0, taskCount = unlinked.length;
        let lateAttention = 0;
        for (const t of unlinked) {
          if (isTaskOverdueLive(t)) taskOverdue++;
          if (lateTierOf(t) === 'attention') lateAttention++;
        }
        for (const p of countedProjs) {
          value += Number(p.value) || 0;
          if (tlIsOverdue(p)) projOverdue++;
          const tt = tasksByJob[p.id] || [];
          taskCount += tt.length;
          for (const t of tt) {
            if (isTaskOverdueLive(t)) taskOverdue++;
            if (lateTierOf(t) === 'attention') lateAttention++;
          }
          if (tlLateTierOf(p) === 'attention') lateAttention++;
        }
        // Three different numbers, not to be mixed up:
        //
        //   shownCount  projects this client matched, which is what gets drawn
        //   projCount   of those, the ones that may count toward the live
        //               workload figures, which is what the header badge says
        //   hostCount   projects here only to hold an open task
        //
        // A group is kept whenever it has something to draw, even when projCount is
        // 0. Otherwise, under All or Stale/Old, a client whose projects are all
        // stale would disappear while the chip still counted its projects.
        clientStats[cl.id] = {
          value, projOverdue, taskOverdue, taskCount, lateAttention,
          shownCount: own.length,
          projCount: own.filter(countingJob).length,
          hostCount: hosts.length,
          unlinkedCount: unlinked.length,
        };
      }

      // ── Collapse state ──
      // Default: everything expanded, so the full picture is visible at a glance.
      const [collapsedClients, setCollapsedClients] = useState({});
      const [collapsedProjects, setCollapsedProjects] = useState({});

      // Host groups start closed. They are context, not results.
      const [hostsExpanded, setHostsExpanded] = useState({});
      const toggleHosts = (id) => setHostsExpanded(s => ({ ...s, [id]: !s[id] }));

      const toggleClient = (id) => setCollapsedClients(s => ({ ...s, [id]: !s[id] }));
      const toggleProject = (id) => setCollapsedProjects(s => ({ ...s, [id]: !s[id] }));
      const expandAll = () => {
        setCollapsedClients({});
        setCollapsedProjects({});
      };
      const collapseAll = () => {
        const cc = {}; for (const cl of clientList) cc[cl.id] = true;
        const cp = {}; for (const j of openJobs.concat(hostJobs)) cp[j.id] = true;
        setCollapsedClients(cc); setCollapsedProjects(cp);
        setHostsExpanded({});
      };

      const fmtMoney = (n) => '$' + Math.round(n).toLocaleString();

      // ── Chevron icon ──
      const Chevron = ({ open }) => (
        <span className="inline-block transition-transform shrink-0" style={{
          transform: open ? 'rotate(90deg)' : 'rotate(0deg)',
          color: T2.textSecondary,
          fontSize: '10px',
          width: 12,
        }}>▶</span>
      );

      // ── Task row (subdued, indented under project) ──
      const renderTask = (t) => {
        const overdue = isTaskOverdueLive(t);
        const tTier = lateTierOf(t) || (overdue ? 'quiet' : '');
        const priLabel = priLabels[t.priority] || 'p4';
        const priColor = priColors[priLabel];
        const handleClick = (e) => {
          e.stopPropagation();
          // Open the task in DetailedTimeline by selecting it as a task (sets _isTask flag).
          const normalized = normalizeTask ? normalizeTask(t, data) : { ...t, _isTask: true, title: t.content || t.title || '(untitled)' };
          onSelect(normalized);
        };
        return (
          <div
            key={t.id}
            onClick={handleClick}
            className="flex items-center gap-2 py-1.5 pl-6 pr-3 cursor-pointer"
            style={{
              // `border` first, then `borderLeft`, so the priority bar wins on
              // the left edge and the box outline still closes the other three.
              border: `1px solid ${T2.cardBorder}`,
              borderLeft: `4px solid ${priColor}`,
              borderRadius: 6,
              background: T2.cardGradient,
              boxShadow: '0 1px 3px rgba(0,0,0,0.30)',
              marginLeft: 20, marginRight: 8, marginBottom: 5,
              transition: 'background 0.15s, border-color 0.15s, transform 0.15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = T2.cardHoverGradient; e.currentTarget.style.borderColor = T2.borderFocus; e.currentTarget.style.borderLeftColor = priColor; }}
            onMouseLeave={e => { e.currentTarget.style.background = T2.cardGradient; e.currentTarget.style.borderColor = T2.cardBorder; e.currentTarget.style.borderLeftColor = priColor; }}
          >
            <span className="text-[9px] font-mono uppercase shrink-0"
              style={{ color: priColor, width: 18 }}>
              {priLabel}
            </span>
            <span className="flex-1 text-[12px] truncate" style={{ color: T2.textSecondary }}>
              {t.content || t.title || '(untitled)'}
            </span>
            {t.section_name && (
              <span className="text-[9px] px-1 py-0.5 rounded shrink-0"
                style={{ background: T2.pillInactive.bg, color: T2.textSecondary, opacity: 0.8 }}>
                {t.section_name}
              </span>
            )}
            {/* The hard deadline, when there is one. Shown apart from the due date
                because it means something different: the due date moves when a task is
                rescheduled, the deadline never does, so once it has passed it stays red. */}
            {t._deadline && (
              <span className="text-[9px] px-1 py-0.5 rounded shrink-0 font-medium"
                style={{
                  backgroundColor: new Date(t._deadline) < new Date() ? '#fee2e2' : '#fef3c7',
                  color: new Date(t._deadline) < new Date() ? '#b91c1c' : '#92400e',
                }}
                title={`Hard deadline ${tlFmtShort(t._deadline)}`}>
                ⏳ {tlFmtShort(t._deadline)}
              </span>
            )}
            <span className="text-[10px] shrink-0"
              style={{ color: lateInk(tTier, T2.textSecondary), fontWeight: lateWeight(tTier) }}
              title={t._daysLate > 0 ? `${t._daysLate} days late, originally due ${tlFmtShort(t._realDue)}` : undefined}>
              {t.due_date ? tlFmtShort(t.due_date) : '—'}
            </span>
          </div>
        );
      };

      // ── Project card (prominent) ──
      const renderProject = (j) => {
        const sc = TL_STATUS_COLORS[j.status] || TL_NEUTRAL;
        const childTasks = tasksByJob[j.id] || [];
        const childOverdue = childTasks.filter(t => isTaskOverdueLive(t)).length;
        const childAttention = childTasks.some(t => lateTierOf(t) === 'attention');
        const projOverdue = tlIsOverdue(j);
        const isCollapsed = !!collapsedProjects[j.id];
        const client = (data.clients || []).find(c => c.id === j.client);
        const isOrphanParent = !!j._orphanParent;

        return (
          <div key={j.id} className="mb-4 rounded-lg overflow-hidden"
            style={{
              background: T2.cardGradient,
              border: `1px solid ${T2.borderStrong}`,
              boxShadow: '0 2px 10px rgba(0,0,0,0.40)',
              opacity: isOrphanParent ? 0.85 : 1,
            }}>
            {/* Project header: large, prominent */}
            <div
              data-result="true" tabIndex={0}
              className="flex items-center gap-3 px-3 py-2.5 cursor-pointer"
              style={{
                borderLeft: `6px solid ${sc.border}`,
                background: T2.headerGradient,
                borderBottom: (!isCollapsed && childTasks.length > 0) ? `1px solid ${T2.borderStrong}` : 'none',
              }}
              onClick={() => onSelect(j)}
            >
              <span
                onClick={(e) => { e.stopPropagation(); toggleProject(j.id); }}
                className="cursor-pointer p-1 -m-1 shrink-0"
                title={isCollapsed ? 'Expand tasks' : 'Collapse tasks'}
              >
                <Chevron open={!isCollapsed} />
              </span>
              <span className="text-[10px] px-2 py-0.5 rounded font-semibold shrink-0 uppercase tracking-wide"
                style={j.paid
                  ? { background: 'linear-gradient(160deg, rgba(16,185,129,0.255) 0%, rgba(16,185,129,0.0675) 100%)', color: T2.green || '#10b981' }
                  : { background: `linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(0,0,0,0.05) 100%), ${sc.bg}`, color: sc.text }}>
                {j.paid
                  ? <span className="inline-flex items-center gap-1"><Icon name="dollar" size={9} />Paid</span>
                  : (j.status || '').replace('_', ' ')}
              </span>
              {isOrphanParent && (
                <span className="text-[9px] px-1.5 py-0.5 rounded font-semibold shrink-0 uppercase tracking-wide"
                  title="Project is closed/filtered but still has open tasks"
                  style={{ background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #fef3c7', color: '#92400e', border: '1px solid #fcd34d' }}>
                  open tasks
                </span>
              )}
              <div className="flex-1 min-w-0">
                <div className="text-[14px] font-semibold truncate" style={{ color: T2.textPrimary }}>
                  {j.title || '(untitled project)'}
                </div>
                <div className="flex items-center gap-2 text-[10px] mt-0.5" style={{ color: T2.textSecondary }}>
                  {client && <span>{client.name}</span>}
                  {j.start_date && <span>· started {tlFmtShort(j.start_date)}</span>}
                  {/* Shipping shown with SVG icons, like every other idea on this page, so
                      it renders at the same size and weight on every operating system. */}
                  {(() => {
                    const ship = shippingStatus(j, data.financials);
                    if (ship === 'none') return null;
                    const tone = ship === 'paid' ? '#34d399' : '#fbbf24';
                    return (
                      <span className="inline-flex items-center gap-1" style={{ color: tone, fontWeight: 600 }}>
                        · <Icon name="truck" size={10} />{ship === 'paid' ? 'Shipping paid' : 'Shipping due'}
                      </span>
                    );
                  })()}
                  {(() => {
                    const b = billsStatus(j, data.financials);
                    if (b.state === 'none') return null;
                    const tone = b.state === 'paid' ? '#34d399' : '#fbbf24';
                    return (
                      <span className="inline-flex items-center gap-1" style={{ color: tone, fontWeight: 600 }}>
                        · <Icon name="briefcase" size={10} />{billsChipText(b)}
                      </span>
                    );
                  })()}
                </div>
              </div>
              {/* What is missing on this project. Click a chip to fill it in
                  without leaving the page. Sits before the money so the eye
                  lands on the problem before the number it casts doubt on. */}
              <span className="shrink-0" onClick={(e) => e.stopPropagation()}>
                <IssueChips issues={quality.byJob[j.id]} onFix={setFixing} size="md" />
              </span>
              {(j.paid ? Number(j.paid_amount) > 0 : Number(j.value) > 0) && (
                <span className="text-[13px] font-bold shrink-0" style={{ color: T2.green || '#10b981' }}>
                  {fmtMoney(j.paid ? j.paid_amount : j.value)}
                </span>
              )}
              <span className="text-[11px] shrink-0 px-2 py-0.5 rounded"
                style={{
                  background: childAttention ? 'linear-gradient(150deg, rgba(239,68,68,0.30), rgba(239,68,68,0.10))' : childOverdue > 0 ? 'linear-gradient(150deg, rgba(245,158,11,0.20), rgba(245,158,11,0.06))' : T2.pillInactive.bg,
                  color: childAttention ? '#dc2626' : childOverdue > 0 ? '#d97706' : T2.textSecondary,
                  fontWeight: childAttention ? 600 : 400,
                }}>
                {childTasks.length} {childTasks.length === 1 ? 'task' : 'tasks'}
                {childOverdue > 0 && ` · ${childOverdue} late`}
              </span>
              <span className="text-[11px] shrink-0 px-2 py-0.5 rounded"
                style={{
                  background: tlLateTierOf(j) === 'attention' ? 'linear-gradient(150deg, rgba(239,68,68,0.30), rgba(239,68,68,0.10))' : projOverdue ? 'linear-gradient(150deg, rgba(245,158,11,0.20), rgba(245,158,11,0.06))' : 'transparent',
                  color: tlLateTierOf(j) === 'attention' ? '#dc2626' : projOverdue ? '#d97706' : T2.textSecondary,
                  fontWeight: projOverdue ? 600 : 400,
                }}>
                due {j.due_date ? tlFmtShort(j.due_date) : '—'}
              </span>
            </div>
            {/* Nested tasks. Recessed well so the list reads as inside the
                project rather than as a continuation of the header row. */}
            {!isCollapsed && childTasks.length > 0 && (
              <div className="pt-2 pb-2" style={{ background: T2.wellGradient }}>
                {childTasks
                  .slice()
                  .sort((a, b) => {
                    // overdue first, then by due date, then by priority
                    const aO = a.due_date && new Date(a.due_date) < new Date() ? 0 : 1;
                    const bO = b.due_date && new Date(b.due_date) < new Date() ? 0 : 1;
                    if (aO !== bO) return aO - bO;
                    const ad = a.due_date ? new Date(a.due_date).getTime() : Infinity;
                    const bd = b.due_date ? new Date(b.due_date).getTime() : Infinity;
                    if (ad !== bd) return ad - bd;
                    return (b.priority || 0) - (a.priority || 0);
                  })
                  .map(renderTask)}
              </div>
            )}
            {!isCollapsed && childTasks.length === 0 && (
              <div className="px-3 py-2 text-[11px] italic" style={{ color: T2.textSecondary, opacity: 0.7 }}>
                No open tasks linked to this project.
              </div>
            )}
          </div>
        );
      };

      // ── What needs attention in what you are currently looking at ─────────
      // Deliberately scoped to the filtered list, not the whole database. The
      // number has to match the chips on screen or it stops being trusted.
      const attentionJobs = (filteredJobs || [])
        .filter(j => (quality.byJob[j.id] || []).length > 0)
        .sort((a, b) => {
          const ai = quality.byJob[a.id] || [], bi = quality.byJob[b.id] || [];
          const ab = ai.filter(i => i.severity === 'blocker').length;
          const bb = bi.filter(i => i.severity === 'blocker').length;
          if (ab !== bb) return bb - ab;
          return bi.length - ai.length;
        });
      const attentionIssues = attentionJobs.reduce((acc, j) => acc.concat(quality.byJob[j.id] || []), []);
      const attentionBlockers = attentionIssues.filter(i => i.severity === 'blocker').length;
      // How often each gap shows up, so the band can offer the common ones as
      // one click filters instead of making you hunt for them.
      const attentionByCode = {};
      for (const i of attentionIssues) {
        if (!attentionByCode[i.code]) attentionByCode[i.code] = { code: i.code, chip: i.chip, label: i.label, why: i.why, severity: i.severity, count: 0 };
        attentionByCode[i.code].count++;
      }
      const attentionCodes = Object.values(attentionByCode).sort((a, b) => {
        const rank = { blocker: 0, fix: 1, info: 2 };
        if (rank[a.severity] !== rank[b.severity]) return rank[a.severity] - rank[b.severity];
        return b.count - a.count;
      });

      // ── The summary bar ────────────────────────────────────────────────
      //
      // Five numbers that all answer "what is in front of me", built from one
      // list and drawn the same way. Every figure comes off the same summary
      // object the header line reads, so the two always agree.
      const summaryStats = [
        { key: 'projects', value: openProjectsCount, label: openProjectsCount === 1 ? 'open project' : 'open projects', icon: 'briefcase' },
        { key: 'tasks', value: openTasksCount, label: openTasksCount === 1 ? 'open task' : 'open tasks', icon: 'check' },
        ...(overdueProjects > 0 ? [{ key: 'op', value: overdueProjects, label: overdueProjects === 1 ? 'overdue project' : 'overdue projects', icon: 'clock', tone: '#f59e0b' }] : []),
        ...(overdueTasks > 0 ? [{ key: 'ot', value: overdueTasks, label: overdueTasks === 1 ? 'overdue task' : 'overdue tasks', icon: 'clock', tone: '#f59e0b' }] : []),
        ...(totalValue > 0 ? [{ key: 'value', value: fmtMoney(totalValue), label: 'open value', icon: 'dollar', tone: T2.green || '#10b981' }] : []),
      ];

      const SummaryBar = () => (
        <div className="mb-4 rounded-lg flex items-center gap-1 flex-wrap"
          style={{
            background: T2.headerGradient,
            border: `1px solid ${T2.borderStrong}`,
            boxShadow: '0 2px 10px rgba(0,0,0,0.40)',
            padding: '10px 12px',
          }}>
          {summaryStats.map((stat, n) => (
            <React.Fragment key={stat.key}>
              {n > 0 && (
                <div className="w-px h-7 mx-2" style={{ background: `linear-gradient(180deg, transparent, ${T2.cardBorder} 22%, ${T2.cardBorder} 78%, transparent)` }} />
              )}
              <div className="flex items-center gap-2">
                <span style={{ color: stat.tone || T2.textMuted, display: 'flex', opacity: stat.tone ? 0.85 : 0.55 }}>
                  <Icon name={stat.icon} size={13} />
                </span>
                <span className="flex items-baseline gap-1.5">
                  <span className="text-[19px] font-bold leading-none" style={{ color: stat.tone || T2.textPrimary, letterSpacing: '-0.01em' }}>
                    {stat.value}
                  </span>
                  <span className="text-[10px] uppercase" style={{ color: stat.tone || T2.textSecondary, letterSpacing: '0.05em', opacity: stat.tone ? 0.9 : 1 }}>
                    {stat.label}
                  </span>
                </span>
              </div>
            </React.Fragment>
          ))}
          {/* Records with something missing or wrong. Click for the list. */}
          {attentionJobs.length > 0 && (
            <>
              <div className="w-px h-7 mx-2" style={{ background: `linear-gradient(180deg, transparent, ${T2.cardBorder} 22%, ${T2.cardBorder} 78%, transparent)` }} />
              <button
                type="button"
                aria-pressed={bandOpen}
                className="flex items-center gap-2 rounded-full"
                title="Projects with something missing or wrong. Click for the list."
                onClick={() => setBandOpen(o => !o)}
                style={{
                  padding: '3px 10px 3px 8px', cursor: 'pointer',
                  border: `1px solid ${bandOpen ? (attentionBlockers > 0 ? 'rgba(248,113,113,0.85)' : 'rgba(251,191,36,0.85)') : 'transparent'}`,
                  background: bandOpen ? 'rgba(255,255,255,0.06)' : 'transparent',
                }}>
                <span style={{ color: attentionBlockers > 0 ? '#f87171' : '#fbbf24', display: 'flex', opacity: 0.85 }}>
                  <Icon name="alertTriangle" size={13} />
                </span>
                <span className="flex items-baseline gap-1.5">
                  <span className="text-[19px] font-bold leading-none"
                    style={{ color: attentionBlockers > 0 ? '#f87171' : '#fbbf24', letterSpacing: '-0.01em' }}>
                    {attentionJobs.length}
                  </span>
                  <span className="text-[10px] uppercase" style={{ color: attentionBlockers > 0 ? '#f87171' : '#fbbf24', letterSpacing: '0.05em', opacity: 0.9 }}>
                    need attention{attentionBlockers > 0 ? ` · ${attentionBlockers} blocking` : ''}
                  </span>
                </span>
              </button>
            </>
          )}
          <div className="flex-1" />
          <div className="flex items-center gap-1">
            <button
              onClick={expandAll}
              className="text-[10px] uppercase px-2.5 py-1 rounded-full"
              style={{ color: T2.textSecondary, letterSpacing: '0.05em', border: `1px solid ${T2.cardBorder}`, background: T2.pillInactive.bg, cursor: 'pointer' }}
            >Expand all</button>
            <button
              onClick={collapseAll}
              className="text-[10px] uppercase px-2.5 py-1 rounded-full"
              style={{ color: T2.textSecondary, letterSpacing: '0.05em', border: `1px solid ${T2.cardBorder}`, background: T2.pillInactive.bg, cursor: 'pointer' }}
            >Collapse all</button>
          </div>
        </div>
      );

      const renderClientHeader = (cl, st, isCollapsed) => (
        <div
          onClick={() => toggleClient(cl.id)}
          className="flex items-center gap-2 mb-2 px-2 py-2 cursor-pointer hover:bg-black/5 rounded"
          style={{
            borderBottom: `1px solid ${cl.internal ? INTERNAL_TONE.border : T2.cardBorder}`,
            // A teal wash and a teal edge, so internal work is recognisable at a glance
            // without looking as urgent as an overdue client job.
            backgroundColor: cl.internal ? INTERNAL_TONE.bg : 'transparent',
            borderLeft: cl.internal ? `3px solid ${INTERNAL_TONE.accent}` : '3px solid transparent',
          }}
        >
          <Chevron open={!isCollapsed} />
          {/* The name opens the client, the rest of the row still folds the
              group. Two jobs on one strip, so the click target for each has
              to be its own element or one of them steals the other. */}
          <h3 className="text-[15px] font-bold inline-flex items-center gap-1.5"
            onClick={onSelectClient ? (e) => { e.stopPropagation(); onSelectClient(cl); } : undefined}
            title={onSelectClient ? `Open ${cl.name}` : undefined}
            style={{ color: cl.internal ? INTERNAL_TONE.text : T2.textPrimary, cursor: onSelectClient ? 'pointer' : 'inherit' }}
            onMouseEnter={onSelectClient ? (e) => { e.currentTarget.style.textDecoration = 'underline'; e.currentTarget.style.textUnderlineOffset = '3px'; } : undefined}
            onMouseLeave={onSelectClient ? (e) => { e.currentTarget.style.textDecoration = 'none'; } : undefined}>
            {cl.name}
            {onSelectClient && (
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{ opacity: 0.5 }}>
                <path d="M7 17L17 7M17 7H7M17 7V17" />
              </svg>
            )}
          </h3>
          {cl.internal && (
            <span className="text-[9px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wide"
              style={{ backgroundColor: INTERNAL_TONE.accent, color: '#ffffff' }}>
              internal
            </span>
          )}
          {cl.internal && (
            <span className="text-[11px]" style={{ color: INTERNAL_TONE.text }}>
              no client, this one is on you
            </span>
          )}
          {cl.critical && (
            <span className="text-[9px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wide"
              style={{ background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #fef2f2', color: '#dc2626' }}>
              critical
            </span>
          )}
          <div className="flex-1" />
          {st.shownCount > 0 && (
            <span className="text-[11px] px-2 py-0.5 rounded"
              style={{ background: T2.pillInactive.bg, color: T2.textSecondary }}>
              {st.shownCount} {st.shownCount === 1 ? 'project' : 'projects'}
            </span>
          )}
          {st.taskCount > 0 && (
            <span className="text-[11px] px-2 py-0.5 rounded"
              style={{ background: T2.pillInactive.bg, color: T2.textSecondary }}>
              {st.taskCount} {st.taskCount === 1 ? 'task' : 'tasks'}
            </span>
          )}
          {(st.projOverdue + st.taskOverdue) > 0 && (
            <span className="text-[11px] px-2 py-0.5 rounded font-semibold"
              style={{ background: st.lateAttention > 0 ? 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #fef2f2' : 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #fef3c7', color: st.lateAttention > 0 ? '#dc2626' : '#b45309' }}>
              {st.projOverdue + st.taskOverdue} late
            </span>
          )}
          {/* The client record's own gaps, clickable so an address or an email
              can be typed straight in from here. */}
          <span onClick={(e) => e.stopPropagation()}>
            <IssueChips issues={quality.byClient[cl.id]} onFix={setFixing} max={2} />
          </span>
          {/* Everything wrong underneath, so a collapsed group still tells you
              there is something inside worth opening. */}
          {isCollapsed && (
            <QualityBadge issues={quality.rollupByClient[cl.id]} />
          )}
          {st.value > 0 && (
            <span className="text-[13px] font-bold"
              style={{ color: T2.green || '#10b981' }}>
              {fmtMoney(st.value)}
            </span>
          )}
        </div>
      );

      return (
        <div>
          <SummaryBar />
          {/* ── Needs attention ────────────────────────────────────────────
              Collapsed by default so a normal day looks normal. Opened, it lists the
              worst projects first and offers each kind of gap as a one-click filter
              ("show me everything missing an invoice"). */}
          {attentionJobs.length > 0 && (bandOpen || qFilters.length > 0) && (
            <div className="mb-4 rounded-lg overflow-hidden"
              style={{
                background: T2.cardGradient,
                border: `1px solid ${attentionBlockers > 0 ? 'rgba(248,113,113,0.4)' : 'rgba(251,191,36,0.35)'}`,
                boxShadow: '0 1px 3px rgba(0,0,0,0.3)',
              }}>
              <div className="px-3 py-2 flex items-center gap-2 flex-wrap"
                style={{ borderBottom: `1px solid ${T2.cardBorder}` }}>
                <span className="text-[12px] font-bold" style={{ color: T2.textPrimary }}>
                  Needs attention
                </span>
                <span className="text-[11px]" style={{ color: T2.textSecondary }}>
                  {attentionJobs.length} {attentionJobs.length === 1 ? 'project' : 'projects'} · {attentionIssues.length} {attentionIssues.length === 1 ? 'gap' : 'gaps'}
                </span>
                <div className="flex-1" />
                <button
                  onClick={() => setBandOpen(false)}
                  className="text-[11px] px-2 py-0.5 rounded hover:bg-black/5"
                  style={{ color: T2.textSecondary, border: `1px solid ${T2.cardBorder}` }}
                >Hide</button>
              </div>
              <div className="px-3 py-2 flex items-center gap-1.5 flex-wrap"
                style={{ borderBottom: `1px solid ${T2.cardBorder}` }}>
                <span className="text-[10px] uppercase tracking-wide mr-1" style={{ color: T2.textSecondary }}>
                  Filter by gap
                </span>
                {attentionCodes.map(c => {
                  const on = qFilters.indexOf(c.code) !== -1;
                  const tone = Q_TONE[c.severity] || Q_TONE.info;
                  return (
                    <button key={c.code}
                      title={c.why}
                      onClick={() => onQualityFilterChange && onQualityFilterChange(c.code)}
                      className="text-[10px] px-2 py-0.5 rounded font-semibold"
                      style={{
                        background: on ? `linear-gradient(150deg, ${tone.text} 0%, ${tone.text}bb 100%)` : tone.bg,
                        color: on ? '#0f1320' : tone.text,
                        border: `1px solid ${tone.border}`,
                      }}
                    >{`${c.chip} · ${c.count}`}</button>
                  );
                })}
                {qFilters.length > 0 && (
                  <button
                    onClick={() => onQualityFilterChange && onQualityFilterChange(null)}
                    className="text-[10px] px-2 py-0.5 rounded"
                    style={{ color: T2.textSecondary, border: `1px solid ${T2.cardBorder}` }}
                  >Clear</button>
                )}
              </div>
              <div style={{ maxHeight: '240px', overflowY: 'auto' }}>
                {attentionJobs.slice(0, 40).map(j => {
                  const cl = (data.clients || []).find(c => c.id === j.client);
                  return (
                    <div key={j.id}
                      onClick={() => onSelect(j)}
                      className="px-3 py-1.5 flex items-center gap-2 cursor-pointer hover:bg-black/5"
                      style={{ borderTop: `1px solid ${T2.cardBorder}` }}>
                      <span className="text-[12px] font-semibold truncate" style={{ color: T2.textPrimary, maxWidth: '38%' }}>
                        {j.title || '(untitled project)'}
                      </span>
                      <span className="text-[10px] truncate" style={{ color: T2.textSecondary, maxWidth: '22%' }}>
                        {cl ? cl.name : 'no client'}
                      </span>
                      <div className="flex-1" />
                      <span onClick={(e) => e.stopPropagation()}>
                        <IssueChips issues={quality.byJob[j.id]} onFix={setFixing} max={4} />
                      </span>
                    </div>
                  );
                })}
                {attentionJobs.length > 40 && (
                  <div className="px-3 py-1.5 text-[10px] italic"
                    style={{ color: T2.textSecondary, borderTop: `1px solid ${T2.cardBorder}` }}>
                    {attentionJobs.length - 40} more. Use a gap filter above to narrow the list.
                  </div>
                )}
              </div>
            </div>
          )}
          {/* Fill the gap in without leaving the page. */}
          {fixing && (
            <QuickFix
              issue={fixing}
              data={data}
              onClose={() => setFixing(null)}
              onSaved={() => { setFixing(null); if (typeof softRefresh === 'function') softRefresh(); }}
              showToast={showToast}
            />
          )}
          <div className="space-y-4">
            {clientList.map(cl => {
              const st = clientStats[cl.id];
              if (!st || (st.shownCount === 0 && st.hostCount === 0 && st.unlinkedCount === 0)) return null;
              const isCollapsed = !!collapsedClients[cl.id];
              const byDate = (a, b) => {
                // Overdue projects first, then by due date
                const aO = tlIsOverdue(a) ? 0 : 1;
                const bO = tlIsOverdue(b) ? 0 : 1;
                if (aO !== bO) return aO - bO;
                const ad = a.due_date ? new Date(a.due_date).getTime() : Infinity;
                const bd = b.due_date ? new Date(b.due_date).getTime() : Infinity;
                return ad - bd;
              };
              const projects = (projectsByClient[cl.id] || []).slice().sort(byDate);
              const hosts = (hostsByClient[cl.id] || []).slice().sort(byDate);
              const hostsOpen = !!hostsExpanded[cl.id];
              const hostTaskCount = hosts.reduce((n, h) => n + ((tasksByJob[h.id] || []).length), 0);
              const unlinked = tasksByClientNoJob[cl.id] || [];
              return (
                <div key={cl.id}>
                  {renderClientHeader(cl, st, isCollapsed)}
                  {!isCollapsed && (
                    <div className="pl-3">
                      {projects.map(renderProject)}
                      {/* ── Only here for their tasks ────────────────────
                          A closed, stale or filtered-out project whose tasks are still open. The
                          tasks must not vanish, but the project did not match anything itself,
                          so it is not counted as a result and is folded away until asked for.

                          The folded line says which filter is hiding the project and how many
                          tasks are underneath. */}
                      {hosts.length > 0 && (
                        <div className="mb-2">
                          <button
                            onClick={() => toggleHosts(cl.id)}
                            className="w-full flex items-center gap-2 px-3 py-1.5 rounded-lg text-[11px]"
                            style={{
                              background: T2.wellGradient,
                              border: `1px dashed ${T2.cardBorder}`,
                              color: T2.textSecondary,
                              cursor: 'pointer',
                            }}>
                            <Chevron open={hostsOpen} />
                            <span>
                              {hosts.length} {hosts.length === 1 ? 'project' : 'projects'} the <strong style={{ fontWeight: 600, color: T2.textPrimary }}>{hostFilterLabel}</strong> filter hides, holding {hostTaskCount} open {hostTaskCount === 1 ? 'task' : 'tasks'}
                            </span>
                          </button>
                          {hostsOpen && (
                            <div className="mt-2">
                              {hosts.map(renderProject)}
                            </div>
                          )}
                        </div>
                      )}
                      {unlinked.length > 0 && (
                        <div className="mb-2 rounded-lg overflow-hidden"
                          style={{
                            background: T2.cardGradient,
                            border: `1px solid ${cl.internal ? INTERNAL_TONE.border : T2.borderStrong}`,
                            boxShadow: '0 2px 10px rgba(0,0,0,0.40)',
                          }}>
                          <div className="px-3 py-1.5 text-[10px] uppercase tracking-wide font-semibold"
                            style={{
                              color: cl.internal ? INTERNAL_TONE.text : T2.textSecondary,
                              background: T2.headerGradient,
                              borderBottom: `1px solid ${cl.internal ? INTERNAL_TONE.border : T2.borderStrong}`,
                            }}>
                            {cl.internal
                              ? `Splatt NZ work, admin and tools (${unlinked.length})`
                              : `Client work — no project link (${unlinked.length})`}
                          </div>
                          <div className="py-1"
                            style={{ background: cl.internal ? INTERNAL_TONE.bg : T2.wellGradient, paddingTop: 4, paddingBottom: 4 }}>
                            {unlinked.map(renderTask)}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            {orphanTasks.length > 0 && (
              <div>
                <div className="flex items-center gap-2 mb-2 px-2 py-2"
                  style={{ borderBottom: `1px solid ${T2.cardBorder}` }}>
                  <h3 className="text-[15px] font-bold" style={{ color: T2.textPrimary }}>
                    Still needs an owner
                  </h3>
