              <button onClick={onClose} className="text-slate-500 hover:text-slate-700">
                <Icon name="x" />
              </button>
            </div>
            <div className="p-6">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, onConfirm, onCancel, title, message }) => {
      return (
        <Modal isOpen={isOpen} onClose={onCancel} title={title} size="sm">
          <p className="text-slate-700 mb-6">{message}</p>
          <div className="flex gap-4 justify-end">
            <button onClick={onCancel} className="px-4 py-2 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Cancel</button>
            <button onClick={onConfirm} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Delete</button>
          </div>
        </Modal>
      );
    };

    // ============================================================================
    // ARCHIVE MODAL: confirmation plus a required reason for archive/delete.
    // Used for projects, tasks and quotes. Writes to PocketBase; the daemon
    // picks up the archived flag on its next pass and closes the matching
    // Todoist task.
    // ============================================================================
    const ArchiveModal = ({ isOpen, onConfirm, onCancel, mode = 'archive', targetType = 'item', targetTitle = '', extraNote = null }) => {
      const [reason, setReason] = useState('');
      const [submitting, setSubmitting] = useState(false);
      useEffect(() => { if (isOpen) { setReason(''); setSubmitting(false); } }, [isOpen]);
      // Escape backs out of the confirmation before it backs out of the page.
      useEscapeBack(!!isOpen, onCancel);
      if (!isOpen) return null;
      const isDelete = mode === 'delete';
      const title = isDelete ? `Delete ${targetType}` : `Archive ${targetType}`;
      const verb = isDelete ? 'Delete' : 'Archive';
      const btnClass = isDelete
        ? 'bg-red-600 hover:bg-red-700'
        : 'bg-amber-600 hover:bg-amber-700';
      const submit = async () => {
        const r = reason.trim();
        if (!r) return;
        setSubmitting(true);
        try { await onConfirm(r); } finally { setSubmitting(false); }
      };
      return (
        <Modal isOpen={isOpen} onClose={onCancel} title={title} size="sm">
          <div className="mb-3 text-sm text-slate-700">
            {isDelete ? (
              <span><strong>Permanently delete</strong> {targetTitle ? <em>"{targetTitle}"</em> : `this ${targetType.toLowerCase()}`}. This cannot be undone.</span>
            ) : (
              <span>Archive {targetTitle ? <em>"{targetTitle}"</em> : `this ${targetType.toLowerCase()}`}. It will be hidden from default views but can be restored later.</span>
            )}
            {extraNote && <div className="mt-2 text-xs text-slate-500">{extraNote}</div>}
          </div>
          <label className="block text-sm font-medium text-slate-700 mb-1">
            Reason <span className="text-red-500">*</span>
          </label>
          <textarea
            value={reason}
            onChange={e => setReason(e.target.value)}
            rows={3}
            autoFocus
            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-sm"
            placeholder={`Why are you ${isDelete ? 'deleting' : 'archiving'} this?`}
          />
          <div className="flex gap-3 justify-end">
            <button onClick={onCancel} disabled={submitting} className="px-4 py-2 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 disabled:opacity-50">Cancel</button>
            <button
              onClick={submit}
              disabled={!reason.trim() || submitting}
              className={`px-4 py-2 text-white rounded-lg ${btnClass} disabled:opacity-50 disabled:cursor-not-allowed`}
            >
              {submitting ? `${verb.replace(/e$/, '')}ing…` : verb}
            </button>
          </div>
        </Modal>
      );
    };

    // Archive helper: sets the archive flags on a PocketBase record. The daemon
    // completes the matching Todoist task on its next pass (for assignments).
    const archiveRecord = (collection, id, reason) =>
      fetchAPI(`/collections/${collection}/records/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({
          archived: true,
          archived_reason: reason,
          archived_at: new Date().toISOString(),
        }),
      });

    const unarchiveRecord = (collection, id) =>
      fetchAPI(`/collections/${collection}/records/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({
          archived: false,
          archived_reason: '',
          archived_at: null,
        }),
      });

    // Delete helper. Also records the reason as a one-line interaction, so
    // there is a paper trail after the record is gone.
    const deleteRecordWithReason = async (collection, id, reason, ctx = {}) => {
      try {
        await fetchAPI('/collections/interactions/records', {
          method: 'POST',
          body: JSON.stringify({
            date: new Date().toISOString(),
            type: 'note',
            summary: `Deleted ${collection} record ${id}: ${reason}`,
            client: ctx.client || null,
            job: ctx.job || null,
          }),
        });
      } catch (e) {
        console.warn('Could not log delete interaction:', e.message);
      }
      return fetchAPI(`/collections/${collection}/records/${id}`, { method: 'DELETE' });
    };

    // ─── Reverse-sync helpers for assignments (Edit / Complete / Delete) ──
    // The dashboard never writes to Todoist for these. Each one sets an intent
    // marker on the PocketBase record, and the daemon's reverse sync pushes the
    // change to Todoist with its own token from .env, adds a Todoist comment
    // for visibility and sends the notification.

    // Edit: mark the assignment with source='dashboard'. The daemon's
    // reverse_sync_edits pushes content, description, due_date, priority and
    // labels to Todoist, then resets source='sync'.
    const pushAssignmentEditViaSync = (id, fields) =>
      fetchAPI(`/collections/assignments/records/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ ...fields, source: 'dashboard' }),
      });

    // Complete: encode the intent as a COMPLETE: sentinel on archived_reason
    // so reverse_sync_archived knows to use the "✅ Completed" comment intro.
    const completeAssignmentViaSync = (id, ctx = {}) => {
      const serverBody = {
        archived: true,
        archived_reason: 'COMPLETE: completed from dashboard',
        archived_at: new Date().toISOString(),
      };
      // Paper trail, same shape as the soft delete below: an interaction
      // row so Recent Activity says what was ticked off from here. Best
      // effort, a failed log never blocks the complete.
      fetchAPI('/collections/interactions/records', {
        method: 'POST',
        body: JSON.stringify({
          date: new Date().toISOString(),
          type: 'note',
          summary: `Completed from dashboard: ${ctx.title || ('assignment ' + id)}`,
          client: ctx.client || null,
          job: ctx.job || null,
        }),
      }).catch(e => console.warn('Could not log complete interaction:', e.message));
      // Optimistic update first: hide the task from every list as soon as the
      // button is clicked, before any network round trip. The local-only status
      // covers lists that filter on status rather than archived. This is a sticky
      // override that survives background refetches (see loadData).
      applyLocalRecordPatch('assignments', id, { ...serverBody, status: 'completed' });
      return fetchAPI(`/collections/assignments/records/${id}`, {
        method: 'PATCH',
        body: JSON.stringify(serverBody),
      }).catch(err => { revertOptimisticAssignment(id); throw err; });
    };

    // Soft delete: log a paper-trail interaction, then mark the assignment with
    // a DELETE: sentinel so the daemon closes the Todoist task and deletes the
    // PocketBase row on its next pass. Deleting the row from here directly
    // would lose the intent the daemon acts on.
    const softDeleteAssignmentViaSync = async (id, reason, ctx = {}) => {
      const patch = {
        archived: true,
        archived_reason: `DELETE: ${reason || 'deleted from dashboard'}`,
        archived_at: new Date().toISOString(),
      };
      // Optimistic update first: remove it from every list at once (sticky override).
      applyLocalRecordPatch('assignments', id, { ...patch, status: 'completed' });
      try {
        await fetchAPI('/collections/interactions/records', {
          method: 'POST',
          body: JSON.stringify({
            date: new Date().toISOString(),
            type: 'note',
            summary: `Deleted from dashboard: ${ctx.title || ('assignment ' + id)}. Reason: ${reason || '(no reason)'}`,
            client: ctx.client || null,
            job: ctx.job || null,
          }),
        });
      } catch (e) {
        console.warn('Could not log delete interaction:', e.message);
      }
      try {
        return await fetchAPI(`/collections/assignments/records/${id}`, {
          method: 'PATCH',
          body: JSON.stringify(patch),
        });
      } catch (err) {
        revertOptimisticAssignment(id);
        throw err;
      }
    };

    // ============================================================================
    // SOFT REFRESH + PERMALINK HELPERS
    // ============================================================================
    // The root component registers its loadData() here, so nested mutation
    // handlers can refresh the data without a full page reload. That keeps
    // scroll position, open modals, sidebar state and the current detail view.
    let __ssRefreshFn = null;       // registered by App: (opts) => loadData(opts)
    let __ssApplyLocal = null;      // registered by App: (collection, id, patch) => void
    let __ssClearOptimistic = null; // registered by App: (id) => drop a stuck optimistic override
    let __ssDetailBack = null;      // registered by an open detail view: () => return to its list

    // ── The Escape stack ─────────────────────────────────────────────────
    // Every view or overlay that opens on top of something else pushes its own
    // way out here while it is on screen, and Escape calls the newest one. Last
    // in, first out, so Escape walks back exactly the way you came in: a modal
    // over a task over a project over the work log closes in that order.
    // Each view registers its own way back, rather than a central list of what
    // is open, so a newly added view cannot be missed.
    const __ssEscStack = [];
    const useEscapeBack = (active, back) => {
      const ref = React.useRef(back);
      ref.current = back;
      React.useEffect(() => {
        if (!active) return undefined;
        const entry = { run: () => { const fn = ref.current; if (typeof fn === 'function') fn(); } };
        __ssEscStack.push(entry);
        return () => {
          const i = __ssEscStack.indexOf(entry);
          if (i !== -1) __ssEscStack.splice(i, 1);
        };
      }, [active]);
    };
    let __ssRefreshTimer = null;
    // Re-fetch data without a full page reload. Debounced and silent, so a burst
    // of actions becomes one quiet background refresh (no spinner, no flash).
    function softRefresh() {
      if (typeof __ssRefreshFn !== 'function') {
        // Nothing registered yet (the root has not mounted): fall back to a reload.
        window.location.reload();
        return;
      }
      if (__ssRefreshTimer) clearTimeout(__ssRefreshTimer);
      __ssRefreshTimer = setTimeout(() => {
        __ssRefreshTimer = null;
        try { __ssRefreshFn({ silent: true }); } catch (e) { /* ignore */ }
      }, 150);
    }
    // Instantly patch one record in local state so the UI reacts immediately,
    // then reconcile quietly in the background. This is what makes completing or
    // deleting a task feel instant instead of waiting on a full data refetch.
    function applyLocalRecordPatch(collection, id, patch) {
      if (typeof __ssApplyLocal === 'function') __ssApplyLocal(collection, id, patch);
    }
    // If a mutation fails, drop its sticky optimistic override and re-sync so the
    // row reappears in its true state.
    function revertOptimisticAssignment(id) {
      if (typeof __ssClearOptimistic === 'function') __ssClearOptimistic(id);
      softRefresh();
    }

    // Hash routing: "#page" or "#page/<recordId>" for deep links.
    function parseAppHash() {
      const raw = (typeof window !== 'undefined' ? window.location.hash : '') || '';
      const body = raw.replace(/^#/, '');
      const slash = body.indexOf('/');
      if (slash === -1) return { page: body, id: null };
      const id = decodeURIComponent(body.slice(slash + 1));
      return { page: body.slice(0, slash), id: id || null };
    }
    function buildPermalink(page, id) {
      const base = window.location.origin + window.location.pathname;
      return id ? `${base}#${page}/${encodeURIComponent(id)}` : `${base}#${page}`;
    }
    function copyPermalink(page, id, showToast) {
      const url = buildPermalink(page, id);
      const ok = () => { if (showToast) showToast('Link copied to clipboard'); };
      const fallback = () => window.prompt('Copy this link:', url);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(ok).catch(fallback);
        } else { fallback(); }
      } catch (e) { fallback(); }
    }

    // ============================================================================
    // PARTICLE BACKGROUND
    // ============================================================================
    // A fixed canvas behind everything: slow drifting dots with faint links
    // between near neighbours. Kept quiet (low counts, low alpha), switched off
    // for people who ask the OS for reduced motion, and paused while the tab is
    // hidden.

    function ParticleBackground({ mode }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const ctx = canvas.getContext('2d');
        let w = 0, h = 0, raf = 0;
        const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);
        const COUNT = 60, LINK = 110;
        const dots = Array.from({ length: COUNT }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.18,
          r: 0.6 + Math.random() * 1.4,
        }));
        const light = mode === 'light';
        const dotColor = light ? 'rgba(71,85,105,' : 'rgba(148,163,184,';
        const lineColor = light ? 'rgba(71,85,105,' : 'rgba(129,140,248,';
        const dotAlpha = light ? 0.16 : 0.38;
        const lineAlpha = light ? 0.08 : 0.18;
        const tick = () => {
          ctx.clearRect(0, 0, w, h);
          for (const p of dots) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < -12) p.x = w + 12; if (p.x > w + 12) p.x = -12;
            if (p.y < -12) p.y = h + 12; if (p.y > h + 12) p.y = -12;
          }
          for (let i = 0; i < COUNT; i++) {
            for (let j = i + 1; j < COUNT; j++) {
              const a = dots[i], b = dots[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < LINK * LINK) {
                ctx.strokeStyle = lineColor + ((1 - Math.sqrt(d2) / LINK) * lineAlpha) + ')';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
              }
            }
          }
          ctx.fillStyle = dotColor + dotAlpha + ')';
          for (const p of dots) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
          raf = requestAnimationFrame(tick);
        };
        const onVisibility = () => {
          cancelAnimationFrame(raf);
          if (!document.hidden) raf = requestAnimationFrame(tick);
        };
        document.addEventListener('visibilitychange', onVisibility);
        raf = requestAnimationFrame(tick);
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', resize);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [mode]);
      return <canvas ref={canvasRef} style={{ position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none' }} />;
    }

    // ============================================================================
    // MAIN APP COMPONENT: SplattDashboard
    // ============================================================================
    // Owns the loaded data, the routing state, the sidebar, the theme and
    // streamer mode toggles, and renders the current page.

    function SplattDashboard() {
      // Initial page comes from the URL hash (e.g. #workload) so a refresh
      // restores the page the user was on. Every routed page id must be listed
      // here, or a reload on that page falls back to the Dashboard.
      const validPageIds = new Set([
        'dashboard','map','clientIntel','clients','contacts','projects','quotes','invoices','bills','suppliers',
        'interactions','planner','knowledge','timeline','workload','skills',
        'skill2','projectFiles','playbooks','logs',
        // Publish is only offered on the local copy, the same rule as the sidebar.
        ...(window.SPLATT_CONFIG.SNAPSHOT_URL ? [] : ['publish']),
      ]);
      // 'skill2' is an older id for the skills page. Links that use it land on
      // the same page.
      const normalizePageId = (page) => (page === 'skill2' ? 'skills' : page);
      const [currentPage, setCurrentPage] = useState(() => {
        const page = normalizePageId(parseAppHash().page);
        if (page && validPageIds.has(page)) return page;
        return 'dashboard';
      });
      // Deep-link target: the record id within the current page (project /
      // client / quote). Drives permalinks like "#projects/<id>".
      const [deepLinkId, setDeepLinkId] = useState(() => parseAppHash().id);
      // Keep URL hash in sync with the sidebar AND the open record, so a
      // refresh or a shared link restores both the page and the item.
      useEffect(() => {
        if (typeof window === 'undefined') return;
        const wanted = '#' + currentPage + (deepLinkId ? '/' + encodeURIComponent(deepLinkId) : '');
        if (window.location.hash !== wanted) {
          window.history.replaceState(null, '', wanted);
        }
      }, [currentPage, deepLinkId]);
      // Listen for back/forward navigation and pasted links.
      useEffect(() => {
        if (typeof window === 'undefined') return;
        const onHash = () => {
          const parsed = parseAppHash();
          const page = normalizePageId(parsed.page);
          const id = parsed.id;
          if (page && validPageIds.has(page) && page !== currentPage) setCurrentPage(page);
          setDeepLinkId(prev => (prev === id ? prev : id));
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [currentPage]);
      // Register the data refresher so nested mutation handlers can soft-refresh
      // instead of reloading the whole page.
      useEffect(() => {
        __ssRefreshFn = loadData;
        __ssApplyLocal = applyLocalPatch;
        __ssClearOptimistic = clearOptimistic;
        return () => {
          if (__ssRefreshFn === loadData) __ssRefreshFn = null;
          if (__ssApplyLocal === applyLocalPatch) __ssApplyLocal = null;
          if (__ssClearOptimistic === clearOptimistic) __ssClearOptimistic = null;
        };
      }, [loadData, applyLocalPatch, clearOptimistic]);
      // Switching pages via the sidebar / cross-page links clears any open record.
      const goToPage = useCallback((page) => { setCurrentPage(page); setDeepLinkId(null); }, []);
      const [projectFileTarget, setProjectFileTarget] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      // Theme: 'dark' or 'light'. applyTheme swaps the T tokens in place,
      // the state change re-renders everything from the root with them.
      const [themeMode, setThemeMode] = useState(getSavedThemeMode);
      const toggleTheme = () => {
        const next = themeMode === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        setThemeMode(next);
      };
      const [connected, setConnected] = useState(true);
      const [toast, setToast] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [data, setData] = useState({
        clients: [],
        contacts: [],
        jobs: [],
        quotes: [],
        suppliers: [],
        interactions: [],
        knowledge: [],
        assignments: [],
        // One row per machine, read by the Client Intel page.
        equipment: [],
        projectFiles: [],
        // project_financials is the only money table. Money in and money out
        // are the same rows split on `direction`, not two collections.
        financials: [],
        financialsSummary: [],
        // The Xero snapshot, or null when it has not been fetched or the port
        // server is down. Null on purpose rather than an empty object, so
        // "we do not know" stays a different value from "we asked and nothing
        // is owed". Those two call for opposite reactions.
        xero: null,
      });

      // Streamer mode. The raw, unmasked data lives in this ref and what
      // React renders is either it or the masked copy, so the toggle
      // re-renders instantly with no refetch. The saved flag is read once
      // here; the engine and its DOM net are told in the effect below.
      const rawDataRef = useRef(null);
      const [streamerMode, setStreamerMode] = useState(() => {
        try { return localStorage.getItem('splatt_streamer') === 'on'; } catch (e) { return false; }
      });
      const toggleStreamer = () => {
        const next = !streamerMode;
        try { localStorage.setItem('splatt_streamer', next ? 'on' : 'off'); } catch (e) {}
        setStreamerMode(next);
      };
      useEffect(() => {
        if (window.SplattStreamer) window.SplattStreamer.setActive(streamerMode);
        const raw = rawDataRef.current;
        if (raw) setData(streamerMode && window.SplattStreamer ? window.SplattStreamer.mask(raw) : raw);
      }, [streamerMode]);

      // Sticky optimistic overrides for assignments: { id -> patch }. Applied on
      // top of every refetch so a completed/deleted task stays hidden until the
      // server confirms (the sync daemon can take a moment to settle).
      const optimisticAssignmentsRef = useRef({});

      const loadData = useCallback(async (opts = {}) => {
        const silent = opts && opts.silent;
        const safeFetch = async (endpoint) => {
          try { const r = await fetchAPI(endpoint); return r.items || []; }
          catch (e) { console.warn(`Skipping ${endpoint}:`, e.message); return []; }
        };

        // Assignments can hold several rows for one Todoist task (same todoist_id),
        // left behind by repeated sync cycles. A flat perPage=200 read would see
        // only an arbitrary slice of the collection and would show repeats, so this
        // reads newest-first across pages and keeps one row per todoist_id (newest
        // wins). Read only: no records are modified.
        const safeFetchAssignments = async () => {
          // Preferred path: the local API's dedup endpoint returns one row per
          // Todoist task in a single request (it pages PocketBase and collapses
          // duplicates server-side). Falls back to direct PB paging below if the
          // server isn't running.
          try {
            const r = await fetch(FILES_URL + '/api/assignments');
            if (r.ok) {
              const data = await r.json();
              if (data && Array.isArray(data.items)) return data.items;
            }
          } catch (e) { /* API server down — fall back to direct PB paging */ }

          const seen = new Set();
          const out = [];
          // Scan the whole collection. While duplicates exist, the newest pages are
          // dominated by copies of a few tasks, so a small page cap would drop genuine
          // older tasks. The cap is only a safety bound (300 * 500 = 150k rows).
          const maxPages = 300;
          for (let page = 1; page <= maxPages; page++) {
            let items = [];
            try {
              const r = await fetchAPI(`/collections/assignments/records?perPage=500&page=${page}&sort=-created`);
              items = (r && r.items) || [];
            } catch (e) { console.warn(`Skipping assignments page ${page}:`, e.message); break; }
            for (const rec of items) {
              const key = rec.todoist_id ? `t:${rec.todoist_id}` : `id:${rec.id}`;
              if (seen.has(key)) continue; // sorted -created, so first seen = newest
              seen.add(key);
              out.push(rec);
            }
            if (items.length < 500) break; // reached the last page
          }
          return out;
        };

        if (!silent) setRefreshing(true);
        try {
          const results = await Promise.all([
            safeFetch('/collections/clients/records?perPage=200&sort=name'),
            safeFetch('/collections/contacts/records?perPage=200'),
            safeFetch('/collections/jobs/records?perPage=200'),
            safeFetch('/collections/quotes/records?perPage=200'),
            safeFetch('/collections/suppliers/records?perPage=200'),
            safeFetch('/collections/interactions/records?perPage=200&sort=-date'),
            safeFetch('/collections/knowledge_base/records?perPage=200'),
            safeFetchAssignments(),
            // Money. project_financials is the only money table: direction 'in' is an
            // invoice to a client, direction 'out' is a bill coming in.
            safeFetch('/collections/project_financials/records?perPage=500&sort=-created'),
            safeFetch('/collections/project_financials_summary/records?perPage=500'),
            // The equipment register behind the Client Intel map. One row per machine;
            // 500 per page is far more than the register holds.
            safeFetch('/collections/equipment/records?perPage=500&sort=site_name'),
          ]);

          // Project files. Non-blocking: the dashboard keeps working when the files
          // server is down.
          let projectFiles = [];
          try {
            const pfRes = await fetch(PROJECT_FILES_URL);
            if (pfRes.ok) projectFiles = await pfRes.json();
          } catch (e) { /* project files server not running — that's fine */ }

          // Xero, read from the snapshot the port server holds. Non-blocking
          // for the same reason as project files: the dashboard has to keep
          // working with the server down. A failure leaves this null, and the
          // money panel then shows its empty state rather than zeros.
          let xero = null;
          try {
            const xRes = await fetch(FILES_URL + '/api/xero');
            if (xRes.ok) xero = await xRes.json();
          } catch (e) { /* port server not running — money panel says so */ }

          // Apply the sticky optimistic overrides, so a task completed or deleted
          // here stays hidden for the rest of the session whatever intermediate state
          // the server reports. The Todoist-to-PocketBase sync can briefly flip
          // `archived` back to false before the daemon closes the task, so the
          // server's flags are not trusted to clear an override. Overrides are
          // dropped only when the PATCH fails (revertOptimisticAssignment) or the page
          // reloads. They are keyed by id, so a refetched record is hidden every time.
          let assignments = results[7];
          const overrides = optimisticAssignmentsRef.current;
          if (overrides && Object.keys(overrides).length) {
            assignments = assignments.map(r => (overrides[r.id] ? { ...r, ...overrides[r.id] } : r));
          }

          const anyData = results.some(r => r.length > 0);
          const raw = {
            clients: results[0], contacts: results[1], jobs: results[2], quotes: results[3],
            suppliers: results[4], interactions: results[5], knowledge: results[6], assignments,
            // One money table. Money in and money out are the same rows read
            // two ways, split on `direction`, not two separate collections.
            // The Invoices page, the Bills page, the home money panel and a
            // project's own financials all read this, so they cannot show
            // different numbers for the same money.
            financials: results[8],
            financialsSummary: results[9],
            equipment: results[10],
            projectFiles,
            xero,
          };
          // Streamer mode reads the engine's own flag, not React state, so
          // the 30 second poll can never render a stale unmasked frame from
          // a closure made before the toggle.
          rawDataRef.current = raw;
          setData(window.SplattStreamer && window.SplattStreamer.active()
            ? window.SplattStreamer.mask(raw) : raw);
          setConnected(anyData);
          setLastUpdated(new Date());
        } catch (error) {
          setConnected(false);
          console.error('Failed to load data:', error);
        } finally {
          if (!silent) setRefreshing(false);
        }
      }, []);

      // Optimistic local mutation: patch one record in place so the UI updates
      // instantly (used by the task complete/delete helpers via __ssApplyLocal).
      const applyLocalPatch = useCallback((collection, id, patch) => {
        // Record a sticky override for assignments so background refetches and the
        // 30s poll don't briefly un-hide a task before the daemon settles.
        if (collection === 'assignments') {
          optimisticAssignmentsRef.current = {
            ...optimisticAssignmentsRef.current,
            [id]: { ...(optimisticAssignmentsRef.current[id] || {}), ...patch },
          };
        }
        setData(prev => ({
          ...prev,
          [collection]: (prev[collection] || []).map(r => (r.id === id ? { ...r, ...patch } : r)),
        }));
      }, []);

      // Drop a stuck optimistic override (used when a mutation fails so the row
      // returns to its real state on the next refresh).
      const clearOptimistic = useCallback((id) => {
        if (optimisticAssignmentsRef.current[id]) {
          const next = { ...optimisticAssignmentsRef.current };
          delete next[id];
          optimisticAssignmentsRef.current = next;
        }
      }, []);

      useEffect(() => {
        loadData();
        const interval = setInterval(loadData, 30000);
        return () => clearInterval(interval);
      }, [loadData]);

      // Global keyboard handler: typing focuses the search box, Tab moves to the
      // first result, Enter opens it, Escape steps back one level.
      useEffect(() => {
        const findSearchInput = () => document.querySelector('input[type="text"][placeholder*="earch"], input[type="text"][placeholder*="Search"]');
        const findFirstResult = () => document.querySelector('[data-result]');
        let lastEnterTs = 0; // for detecting a quick double-Enter

        const handler = (e) => {
          const tag = document.activeElement?.tagName;
          const inSearch = tag === 'INPUT' && document.activeElement?.placeholder?.toLowerCase().includes('earch');
          const onResult = document.activeElement?.hasAttribute('data-result');

          // Tab from search input → focus first result
          if (e.key === 'Tab' && !e.shiftKey && inSearch) {
            const first = findFirstResult();
            if (first) { e.preventDefault(); first.focus(); }
            return;
          }

          // Enter from search input → click first result
          if (e.key === 'Enter' && inSearch) {
            const first = findFirstResult();
            if (first) { e.preventDefault(); first.click(); }
            return;
          }

          // Enter on a focused result → click it
          if (e.key === 'Enter' && onResult) {
            e.preventDefault();
            document.activeElement.click();
            return;
          }

          // Double-Enter while a detail view (opened from a list/search) is showing
          // → go back to that list, keeping the same search we used to get there.
          if (e.key === 'Enter' && typeof __ssDetailBack === 'function' && !inSearch && !onResult) {
            const interactive = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'A');
            if (!interactive && !document.activeElement?.isContentEditable) {
              const now = Date.now();
              if (now - lastEnterTs < 450) {
                e.preventDefault();
                lastEnterTs = 0;
                const back = __ssDetailBack;
                back();
                // Restore focus to the search box once the list re-renders.
                setTimeout(() => { const inp = findSearchInput(); if (inp) inp.focus(); }, 60);
              } else {
                lastEnterTs = now;
              }
              return;
            }
          }

          // Arrow keys on focused result → move between results
          if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && onResult) {
            e.preventDefault();
            const all = Array.from(document.querySelectorAll('[data-result]'));
            const idx = all.indexOf(document.activeElement);
            const next = e.key === 'ArrowDown' ? all[idx + 1] : all[idx - 1];
            if (next) next.focus();
            return;
          }

          // Escape from result → back to search
          if (e.key === 'Escape' && onResult) {
            const input = findSearchInput();
            if (input) { e.preventDefault(); input.focus(); }
            return;
          }

          // Escape anywhere else → step back one level. Skipped while a field
          // has focus, because there Escape belongs to the field: it closes a
          // date picker or a select without throwing you off the page.
          if (e.key === 'Escape') {
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            if (document.activeElement?.isContentEditable) return;
            const top = __ssEscStack[__ssEscStack.length - 1];
            if (top) { e.preventDefault(); top.run(); }
            return;
          }

          // Typing while nothing focused → auto-focus search
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (document.activeElement?.isContentEditable) return;
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          if (e.key.length !== 1 && e.key !== 'Backspace') return;
          const searchInput = findSearchInput();
          if (searchInput) searchInput.focus();
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, []);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      const handleLogout = () => {
        window.location.href = '/';
      };

      // The sidebar. Projects and Planner are not listed, but their pages still
      // exist for deep links and cross-page buttons (see hiddenPageLabels and the
      // routes below). Map opens the Timeline page on its map view.
      const pages = [
        { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
        { id: 'map', label: 'Map', icon: 'map' },
        // Where the machines are, rather than where the work is. Reads the
        // equipment collection, not jobs, so it stays right even for sites
        // with no open project.
        { id: 'clientIntel', label: 'Client Intel', icon: 'factory' },
        { id: 'clients', label: 'Clients', icon: 'building' },
        { id: 'contacts', label: 'Contacts', icon: 'users' },
        { id: 'quotes', label: 'Quotes', icon: 'fileText' },
        { id: 'invoices', label: 'Invoices', icon: 'dollar' },
        { id: 'bills', label: 'Bills', icon: 'dollar' },
        { id: 'suppliers', label: 'Suppliers', icon: 'truck' },
        { id: 'interactions', label: 'Interactions', icon: 'message' },
        { id: 'timeline', label: 'Timeline', icon: 'calendar' },
        { id: 'workload', label: 'Workload', icon: 'book' },
        { id: 'skills', label: 'Skills', icon: 'sparkle' },
        { id: 'projectFiles', label: 'Project Files', icon: 'folder' },
        { id: 'knowledge', label: 'Knowledge Base', icon: 'book' },
        { id: 'playbooks', label: 'Playbooks', icon: 'settings' },
        { id: 'logs', label: 'Logs', icon: 'book' },
        // Publish runs a script on the machine that hosts the dashboard, so it is
        // only offered on the local copy. On the hosted snapshot the shim would
        // refuse the call, so the page is left out of the rail there.
        ...(window.SPLATT_CONFIG.SNAPSHOT_URL ? [] : [{ id: 'publish', label: 'Publish', icon: 'upload' }]),
      ];
      // Pages reachable by link but not listed in the sidebar, so the header can
      // still show a title on them.
      const hiddenPageLabels = { projects: 'Projects', planner: 'Planner' };

      return (
        <div className="flex h-screen overflow-hidden" style={{ position: 'relative', backgroundColor: T.bg, backgroundImage: T.bgGradient, backgroundSize: T.bgGradientSize }}>
          <ParticleBackground mode={themeMode} />
          {/* Sidebar */}
          <div className={`${sidebarOpen ? 'w-64' : 'w-20'} flex flex-col transition-all duration-300`}
            style={{ backgroundColor: T.sidebar, backgroundImage: T.sidebarGradient, backgroundSize: T.sidebarGradientSize, borderRight: `1px solid ${T.border}`, position: 'relative', zIndex: 1 }}>
            <div className="p-4 flex items-center justify-between" style={{ borderBottom: `1px solid ${T.border}` }}>
              {sidebarOpen && <h1 style={{ fontSize: '18px', fontWeight: 700, letterSpacing: '-0.02em', backgroundImage: T.logoGradient, WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent' }}>Splatt Eng</h1>}
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 rounded-lg" style={{ color: T.textSecondary, transition: 'all 0.15s' }}
                onMouseEnter={e => { e.currentTarget.style.background = T.surfaceGradient; e.currentTarget.style.color = T.text; }}
                onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.textSecondary; }}>
                <Icon name="menu" />
              </button>
            </div>

            <nav className="flex-1 overflow-y-auto py-3" style={{ padding: sidebarOpen ? '12px 10px' : '12px 8px' }}>
              {pages.map(page => {
                const navActive = currentPage === page.id;
                // Active tabs get a strong navy gradient and a solid edge
                // bar. Idle tabs are still tinted, never flat grey, so the
                // whole rail reads as coloured.
                const navIdleBg = `linear-gradient(90deg, ${T.accentLight}, transparent 70%)`;
                const navActiveBg = `linear-gradient(90deg, ${T.accentStrong}, ${T.accentLight} 60%, transparent)`;
                const navHoverBg = `linear-gradient(90deg, ${T.accentBorder}, ${T.accentLight} 65%, transparent)`;
                return (
                <button
                  key={page.id}
                  onClick={() => goToPage(page.id)}
                  style={{
                    width: '100%', display: 'flex', alignItems: 'center', gap: '12px',
                    padding: sidebarOpen ? '10px 14px' : '10px 0', justifyContent: sidebarOpen ? 'flex-start' : 'center',
                    borderRadius: '10px', transition: 'all 0.2s', border: 'none', cursor: 'pointer', marginBottom: '3px',
                    background: navActive ? navActiveBg : navIdleBg,
                    color: navActive ? T.accentText : T.navIdle,
                    boxShadow: navActive
                      ? `inset 3px 0 0 0 ${T.accent}, inset 0 0 0 1px ${T.accentBorder}`
                      : `inset 2px 0 0 0 ${T.accentBorder}`,
                    fontWeight: navActive ? 600 : 500,
                  }}
                  onMouseEnter={e => { if (!navActive) { e.currentTarget.style.background = navHoverBg; e.currentTarget.style.color = T.accentText; }}}
                  onMouseLeave={e => { if (!navActive) { e.currentTarget.style.background = navIdleBg; e.currentTarget.style.color = T.navIdle; }}}
                >
                  <Icon name={page.icon} size={18} />
                  {sidebarOpen && <span style={{ fontSize: '13px', fontWeight: 'inherit' }}>{page.label}</span>}
                </button>
                );
              })}
            </nav>

            <div className="p-4 space-y-3" style={{ borderTop: `1px solid ${T.border}` }}>
              <div style={{ fontSize: '11px' }}>
                {connected ? (
                  <div className="flex items-center gap-2">
                    <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: `linear-gradient(160deg, rgba(255,255,255,0.30) 0%, rgba(0,0,0,0.10) 100%), ${T.green}`, boxShadow: `0 0 6px rgba(16,185,129,0.4)` }}></div>
                    <span style={{ color: T.textSecondary }}>Connected</span>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: `linear-gradient(160deg, rgba(255,255,255,0.30) 0%, rgba(0,0,0,0.10) 100%), ${T.red}`, boxShadow: `0 0 6px rgba(239,68,68,0.4)` }}></div>
                    <span style={{ color: T.red }}>Disconnected</span>
                  </div>
                )}
              </div>
              <button onClick={toggleTheme} className="w-full flex items-center gap-2 px-4 py-2 rounded-lg text-sm"
                title={themeMode === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
                style={{ background: T.surfaceGradient, color: T.textSecondary, border: `1px solid ${T.border}`, transition: 'all 0.15s' }}
                onMouseEnter={e => { e.currentTarget.style.background = T.chipGradientHover; e.currentTarget.style.color = T.text; }}
                onMouseLeave={e => { e.currentTarget.style.background = T.surfaceGradient; e.currentTarget.style.color = T.textSecondary; }}>
                <Icon name={themeMode === 'dark' ? 'sun' : 'moon'} size={16} />
                {sidebarOpen && <span>{themeMode === 'dark' ? 'Light mode' : 'Dark mode'}</span>}
              </button>
              <button onClick={toggleStreamer} className="w-full flex items-center gap-2 px-4 py-2 rounded-lg text-sm"
                title={streamerMode
                  ? 'Streamer mode is on: names, contacts, money and map positions are masked, and edits are blocked. Click to turn off.'
                  : 'Streamer mode: star out names, contacts and money, and scatter the map, for screen sharing'}
                style={{
                  background: streamerMode ? 'linear-gradient(150deg, rgba(251,191,36,0.24) 0%, rgba(251,191,36,0.08) 100%)' : T.surfaceGradient,
                  color: streamerMode ? '#fbbf24' : T.textSecondary,
                  border: `1px solid ${streamerMode ? 'rgba(251,191,36,0.45)' : T.border}`,
                  transition: 'all 0.15s',
                }}
                onMouseEnter={e => { if (!streamerMode) { e.currentTarget.style.background = T.chipGradientHover; e.currentTarget.style.color = T.text; } }}
                onMouseLeave={e => { if (!streamerMode) { e.currentTarget.style.background = T.surfaceGradient; e.currentTarget.style.color = T.textSecondary; } }}>
                <Icon name="eye" size={16} />
                {sidebarOpen && <span>{streamerMode ? 'Streamer mode on' : 'Streamer mode'}</span>}
              </button>
              <button onClick={handleLogout} className="w-full flex items-center gap-2 px-4 py-2 rounded-lg text-sm"
                style={{ background: T.surfaceGradient, color: T.textSecondary, border: `1px solid ${T.border}`, transition: 'all 0.15s' }}
                onMouseEnter={e => { e.currentTarget.style.background = T.chipGradientHover; e.currentTarget.style.color = T.text; }}
                onMouseLeave={e => { e.currentTarget.style.background = T.surfaceGradient; e.currentTarget.style.color = T.textSecondary; }}>
                <Icon name="x" size={16} />
                {sidebarOpen && <span>Logout</span>}
              </button>
            </div>
          </div>

          {/* Main Content */}
          <div className="flex-1 flex flex-col overflow-hidden" style={{ position: 'relative', zIndex: 1 }}>
            <div className="px-8 py-4 flex justify-between items-center" style={{ backgroundColor: T.sidebar, backgroundImage: T.headerGradient, borderBottom: `1px solid ${T.border}` }}>

              {deepLinkId && (

                  onMouseEnter={e => { e.currentTarget.style.background = T.chipGradientHover; e.currentTarget.style.color = T.text; }}
                  onMouseLeave={e => { e.currentTarget.style.background = T.surfaceGradient; e.currentTarget.style.color = T.textSecondary; }}>
                  <Icon name="link" size={15} /> Copy link

            </div>

            <div className="flex-1 overflow-auto">
              <div className="p-8">
                {currentPage === 'dashboard' && <DashboardPage data={data} onRefresh={loadData} lastUpdated={lastUpdated} refreshing={refreshing} onNavigate={(page, id) => { goToPage(page); if (id) setDeepLinkId(id); }} />}
                {/* #map opens the Timeline page on its map view. */}
                {currentPage === 'map' && <TimelinePage data={data} showToast={showToast} onNavigate={goToPage} onOpenProjectFile={(pf) => { setProjectFileTarget(pf); goToPage('projectFiles'); }} initialViewMode="map" focusId={currentPage === 'map' ? deepLinkId : null} onFocusChange={setDeepLinkId} />}
                {currentPage === 'clientIntel' && <ClientIntelPage data={data} showToast={showToast} onNavigate={(page, id) => { goToPage(page); if (id) setDeepLinkId(id); }} />}
                {currentPage === 'clients' && <ClientsPage data={data} showToast={showToast} focusId={currentPage === 'clients' ? deepLinkId : null} onFocusChange={setDeepLinkId} />}
                {currentPage === 'contacts' && <ContactsPage data={data} showToast={showToast} />}
                {currentPage === 'projects' && <JobsPage data={data} showToast={showToast} onNavigate={goToPage} onOpenProjectFile={(pf) => { setProjectFileTarget(pf); goToPage('projectFiles'); }} focusId={currentPage === 'projects' ? deepLinkId : null} onFocusChange={setDeepLinkId} />}
                {currentPage === 'quotes' && <QuotesPage data={data} showToast={showToast} focusId={currentPage === 'quotes' ? deepLinkId : null} onFocusChange={setDeepLinkId} />}
                {currentPage === 'invoices' && <InvoicesPage data={data} showToast={showToast} onRefresh={loadData} />}
                {currentPage === 'bills' && <BillsPage data={data} showToast={showToast} onRefresh={loadData} />}
                {currentPage === 'suppliers' && <SuppliersPage data={data} showToast={showToast} />}

                {currentPage === 'knowledge' && <KnowledgePage data={data} showToast={showToast} />}
                {currentPage === 'timeline' && <TimelinePage data={data} showToast={showToast} onNavigate={goToPage} onOpenProjectFile={(pf) => { setProjectFileTarget(pf); goToPage('projectFiles'); }} focusId={currentPage === 'timeline' ? deepLinkId : null} onFocusChange={setDeepLinkId} />}
                {currentPage === 'workload' && <TimelinePage data={data} showToast={showToast} onNavigate={goToPage} onOpenProjectFile={(pf) => { setProjectFileTarget(pf); goToPage('projectFiles'); }} initialViewMode="workload" focusId={currentPage === 'workload' ? deepLinkId : null} onFocusChange={setDeepLinkId} />}
                {/* #skills (and the older #skill2) open the live skill harness console. */}
                {currentPage === 'skills' && <Skill2Page showToast={showToast} />}
                {currentPage === 'projectFiles' && <ProjectFilesPage data={data} showToast={showToast} initialTarget={projectFileTarget} onTargetConsumed={() => setProjectFileTarget(null)} />}

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

    // ============================================================================
    // SHARED FILTER BAR
    // ============================================================================

    function FilterBar({ searchTerm, onSearchChange, placeholder, pills, activePill, onPillChange, children }) {
      return (
        <div style={{ background: T.cardGradient, borderRadius: '12px', border: `1px solid ${T.border}`, padding: '12px 16px', boxShadow: '0 1px 3px rgba(0,0,0,0.3)' }}>
          <div className="flex items-center gap-3 flex-wrap">
            {onSearchChange && (
              <div className="relative flex-1 min-w-[180px] max-w-xs">
                <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: T.textMuted }} />
                <input type="text" placeholder={placeholder || "Search..."} value={searchTerm || ''} onChange={e => onSearchChange(e.target.value)}
                  style={{ width: '100%', paddingLeft: '32px', paddingRight: '12px', paddingTop: '8px', paddingBottom: '8px', fontSize: '13px', background: T.panelGradient, border: `1px solid ${T.border}`, borderRadius: '8px', color: T.text, outline: 'none' }} />
              </div>
            )}
            {pills && pills.length > 0 && (
              <div className="flex gap-1.5 flex-wrap">
                {pills.map(p => {
                  const isActive = activePill === p.key;
                  const isCritical = p.accent === 'critical';
                  // Critical pills get a red treatment regardless of active state
                  const bg = isCritical
                    ? (isActive ? 'linear-gradient(150deg, rgba(239,68,68,0.30), rgba(239,68,68,0.10))' : 'linear-gradient(150deg, rgba(239,68,68,0.16), rgba(239,68,68,0.05))')
                    : (isActive ? T.pillActive.bg : T.pillInactive.bg);
                  const color = isCritical
                    ? '#f87171'
                    : (isActive ? T.pillActive.text : T.pillInactive.text);
                  const borderColor = isCritical
                    ? 'rgba(239,68,68,0.45)'
                    : (isActive ? T.pillActive.border : null);
                  return (
                    <button key={p.key} onClick={() => onPillChange(p.key)}
                      style={{
                        padding: '6px 14px', fontSize: '12px', fontWeight: isCritical ? 600 : 500, borderRadius: '20px',
                        cursor: 'pointer', transition: 'all 0.15s', border: 'none',
                        background: bg,
                        color,
                        boxShadow: borderColor ? `inset 0 0 0 1px ${borderColor}` : 'none',
                      }}>
                      {isCritical && <span style={{ marginRight: '4px' }}>●</span>}
                      {p.label}{p.count != null && <span style={{ opacity: 0.5, marginLeft: '4px' }}>{p.count}</span>}

                  );

            )}
            {children}
