    // ============================================================================
    // JOBS PAGE (#projects): a table of every project with status, dates,
    // value, location gaps and the matching project file. Not in the sidebar;
    // reached by links and deep links. Opening a row shows DetailedTimeline.
    // ============================================================================

    function JobsPage({ data, showToast, onNavigate, onOpenProjectFile, focusId, onFocusChange }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [clientFilter, setClientFilter] = useState('all');
      const [sortBy, setSortBy] = useState('updated');
      const [newToday, setNewToday] = useState(false);
      const [changedToday, setChangedToday] = useState(false);
      // Archived and re-engage projects are hidden by default. The toggles below
      // surface them when needed (for example to restore one).
      const [showArchived, setShowArchived] = useState(false);
      const [showReengage, setShowReengage] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [editingJob, setEditingJob] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [selectedProject, setSelectedProject] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      // Escape walks back out the way you came in.
      useEscapeBack(!!selectedProject, () => setSelectedProject(null));
      useEscapeBack(!!selectedClient, () => setSelectedClient(null));
      const [formData, setFormData] = useState({
        title: '', description: '', client_id: '', site_address: '',
        status: 'quoting', start_date: '', due_date: '', value: '',
      });

      // Permalink: open the project named in the URL (#projects/<id>).
      // data.jobs loads asynchronously, so this re-runs when the data arrives.
      const projectFocusHandled = useRef(false);
      useEffect(() => {
        if (!focusId) { projectFocusHandled.current = false; return; }
        if (selectedProject && selectedProject.id === focusId) { projectFocusHandled.current = true; return; }
        const job = (data.jobs || []).find(j => j.id === focusId);
        if (job) { setSelectedProject(job); projectFocusHandled.current = true; }
      }, [focusId, data.jobs]);
      // Report the open project up so the URL + Copy-link button track it.
      // Don't clear the URL id while we're still waiting for a deep link to open.
      useEffect(() => {
        if (!onFocusChange) return;
        if (selectedProject) { onFocusChange(selectedProject.id); return; }
        if (!focusId || projectFocusHandled.current) onFocusChange(null);
      }, [selectedProject]);

      const matchStatusFilter = (job, key) => {
        if (key === 'all') return true;
        if (key === 'critical') return isJobCritical(job, data.clients);
        const status = job.status;
        if (key === 'open') return isOpenStatus(status);
        if (key === 'confirmed') return isConfirmedStatus(status);
        if (key === 'closed') return STATUS_GROUPS.closed.includes(status) || STATUS_GROUPS.closed_negative.includes(status);
        if (key === 'paid') return !!job.paid;
        if (key === 'ship_due') return shippingStatus(job, data.financials) === 'due';
        if (key === 'supplier_due') return supplierStatus(job, data.financials) === 'due';
        return status === key;
      };

      const filteredJobs = useMemo(() => {
        let results = data.jobs.filter(j => {
          // Hide archived + reengage unless explicitly toggled on.
          if (!showArchived && j.archived) return false;
          if (!showReengage && j.status === 'reengage') return false;
          const matchesSearch = j.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (j.description || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (data.clients.find(c => c.id === j.client)?.name || '').toLowerCase().includes(searchTerm.toLowerCase());
          const matchesStatus = matchStatusFilter(j, statusFilter);
          const matchesClient = clientFilter === 'all' || j.client === clientFilter;
          if (newToday && !isToday(j.created)) return false;
          if (changedToday && !(isToday(j.updated) && j.updated !== j.created)) return false;
          return matchesSearch && matchesStatus && matchesClient;
        });
        const sorters = {
          updated: (a, b) => new Date(b.updated || 0) - new Date(a.updated || 0),
          created: (a, b) => new Date(b.created || 0) - new Date(a.created || 0),
          title: (a, b) => a.title.localeCompare(b.title),
          value: (a, b) => (b.value || 0) - (a.value || 0),
          due: (a, b) => (a.due_date || '9999') < (b.due_date || '9999') ? -1 : 1,
          status: (a, b) => (statusMeta(a.status).order || 99) - (statusMeta(b.status).order || 99),
        };
        results.sort(sorters[sortBy] || sorters.updated);
        return results;
      }, [data.jobs, data.clients, searchTerm, statusFilter, clientFilter, sortBy, newToday, changedToday, showArchived, showReengage]);

      const handleOpenModal = (job = null) => {
        if (job) {
          setEditingJob(job);
          setFormData({ title: job.title, description: job.description || '', client_id: job.client_id || '', site_address: job.site_address || '', status: job.status, start_date: job.start_date || '', due_date: job.due_date || '', value: job.value || '' });
        } else {
          setEditingJob(null);
          setFormData({ title: '', description: '', client_id: '', site_address: '', status: 'quoting', start_date: '', due_date: '', value: '' });
        }
        setShowModal(true);
      };

      const handleSave = async () => {
        if (!formData.title.trim()) { showToast('Title is required', 'error'); return; }
        // Job value is captured into the database as the source of truth: there
        // is always money involved. We *ask* rather than hard-block (an early
        // quoting job may not have a firm number yet), but entering it is the
        // default path so the pipeline figures stay real.
        if (!(parseFloat(formData.value) > 0)) {
          if (!window.confirm('No job value entered.\n\nSplatt jobs almost always have a dollar value, and it should be saved so the pipeline figures are real. Save without a value anyway?')) return;
        }
        try {
          const saveData = { ...formData, value: formData.value ? parseFloat(formData.value) : 0 };
          // Stamp the status change here too, so the seven day chase clock
          // measures the same thing however the status moved. Nothing else
          // can work it out afterwards: `updated` moves on any edit, so a
          // job quoted three weeks ago whose value was corrected yesterday
          // would read as one day old and never be chased. Only when the
          // status really changed, or saving the record again would reset
          // the clock every time.
          if (editingJob && saveData.status && saveData.status !== editingJob.status) {
            saveData.status_changed_at = new Date().toISOString();
            saveData.status_changed_by = 'dashboard';
          }
          if (editingJob) {
            await fetchAPI(`/collections/jobs/records/${editingJob.id}`, { method: 'PATCH', body: JSON.stringify(saveData) });
            showToast('Project updated');
          } else {
            await fetchAPI('/collections/jobs/records', { method: 'POST', body: JSON.stringify(saveData) });
            showToast('Project created');
          }
          setShowModal(false);
          softRefresh();
        } catch (error) { showToast('Error saving project', 'error'); }
      };

      const handleDelete = async () => {
        try {
          await fetchAPI(`/collections/jobs/records/${confirmDelete}`, { method: 'DELETE' });
          showToast('Project deleted');
          setConfirmDelete(null);
          softRefresh();
        } catch (error) { showToast('Error deleting project', 'error'); }
      };

      const getClient = (job) => data.clients.find(c => c.id === job.client || c.id === job.client_id);
      const isOverdue = (job) => job.due_date && new Date(job.due_date) < new Date() && !isTerminalStatus(job.status);
      const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }) : null;
      const fmtDateLong = (d) => d ? new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

      // Derive badge colors from the shared JOB_STATUS_META so adding a new
      // status anywhere is a one-line change at the top of the file.

      // Match jobs to project files: word-based fuzzy matching
      const findProjectFile = (job) => {
        const client = getClient(job);
        const jobTitle = (job.title || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
        const jobWords = jobTitle.split(/\s+/).filter(w => w.length > 1);
        return (data.projectFiles || []).find(pf => {
          const projName = pf.project.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
          const projWords = projName.split(/\s+/).filter(w => w.length > 1);
          // All words from folder name must appear in job title (or vice versa)
          const allProjWordsInJob = projWords.every(w => jobWords.includes(w));
          const allJobWordsInProj = jobWords.every(w => projWords.includes(w));
          if (allProjWordsInJob || allJobWordsInProj) return true;
          // Also check with client matching for extra confidence
          if (client) {
            const clientName = client.name.toLowerCase();
            const folderName = pf.client.toLowerCase();
            const clientMatch = clientName.includes(folderName) || folderName.includes(clientName);
            if (clientMatch && projWords.filter(w => jobWords.includes(w)).length >= 2) return true;
          }
          return false;
        });
      };

      const totalValue = filteredJobs.reduce((s, j) => s + (j.value || 0), 0);
      // The count badge reflects the live overdue load: archived, on-hold,
      // cancelled, stale and terminal projects are excluded (the per-row marker
      // still shows each project's own overdue state).
      const overdueCount = filteredJobs.filter(j => isOverdue(j) && countsTowardWorkload(j)).length;

      // ── Count context ──────────────────────────────────────────────────────
      // Every filter-pill and Archived/Re-engage count is computed over the jobs
      // that match the current search term and client filter, so the numbers
      // agree with what is on screen (searching "bottling" makes every count
      // reflect those jobs only).
      const matchesSearchClient = (j) => {
        const matchesSearch = j.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
          (j.description || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (data.clients.find(c => c.id === j.client)?.name || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchesClient = clientFilter === 'all' || j.client === clientFilter;
        return matchesSearch && matchesClient;
      };
      const contextJobs = data.jobs.filter(matchesSearchClient);
      // Pill counts also honor the Archived/Re-engage toggle state so the numbers
      // match the rows that are actually shown. The Archived/Re-engage toggle
      // counts themselves (below) are computed from contextJobs directly, so they
      // stay accurate regardless of whether the toggle is on.
      const pillBase = contextJobs.filter(j => {
        if (!showArchived && j.archived) return false;
        if (!showReengage && j.status === 'reengage') return false;
        return true;
      });

      const criticalJobCount  = pillBase.filter(j => isJobCritical(j, data.clients)).length;
      const jobPills = [
        { key: 'all',       label: 'All',       count: pillBase.length },
        ...(criticalJobCount > 0 ? [{ key: 'critical', label: `Critical (${criticalJobCount})`, count: criticalJobCount, accent: 'critical' }] : []),
        { key: 'open',      label: 'Open',      count: pillBase.filter(j => isOpenStatus(j.status)).length },
        { key: 'confirmed', label: 'Confirmed', count: pillBase.filter(j => isConfirmedStatus(j.status)).length },
        { key: 'paid',      label: 'Paid',      count: pillBase.filter(j => j.paid).length },
        { key: 'ship_due',  label: 'Shipping due', count: pillBase.filter(j => shippingStatus(j, data.financials) === 'due').length },
        { key: 'supplier_due',  label: 'Bills unpaid', count: pillBase.filter(j => supplierStatus(j, data.financials) === 'due').length },
        { key: 'on_hold',   label: 'On Hold',   count: pillBase.filter(j => j.status === 'on_hold').length },
        { key: 'closed',    label: 'Closed',    count: pillBase.filter(j => STATUS_GROUPS.closed.includes(j.status) || STATUS_GROUPS.closed_negative.includes(j.status)).length },
      ];
      const clientOptions = data.clients.filter(c => c.status === 'active').sort((a, b) => a.name.localeCompare(b.name));

      // --- Detail views ---
      if (selectedProject) {
        return <DetailedTimeline job={selectedProject} onBack={() => setSelectedProject(null)} data={data} showToast={showToast} backLabel="Back to projects"
          onOpenProjectFile={onOpenProjectFile}
          onNavigate={(page) => { if (page === 'clients') { const cl = data.clients.find(c => c.id === selectedProject.client); if (cl) { setSelectedProject(null); setSelectedClient(cl); } } else { onNavigate(page); } }} />;
      }
      if (selectedClient) {
        return <ClientDetailView client={selectedClient} data={data} showToast={showToast}
          onBack={() => setSelectedClient(null)}
          onSelectProject={(job) => { setSelectedClient(null); setSelectedProject(job); }}
          onNavigate={onNavigate} />;
      }

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
          <FilterBar searchTerm={searchTerm} onSearchChange={setSearchTerm} placeholder="Search projects, clients, descriptions..." pills={jobPills} activePill={statusFilter} onPillChange={setStatusFilter}>
            <TodayFilters items={contextJobs} newToday={newToday} setNewToday={setNewToday} changedToday={changedToday} setChangedToday={setChangedToday} />
            <ArchiveReengageFilters items={contextJobs} showArchived={showArchived} setShowArchived={setShowArchived} showReengage={showReengage} setShowReengage={setShowReengage} />
            <select value={clientFilter} onChange={e => setClientFilter(e.target.value)}
              style={{ fontSize: '12px', padding: '6px 14px', borderRadius: '20px', background: T.pillInactive.bg, color: T.pillInactive.text, border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="all">All Clients</option>
              {clientOptions.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <select value={sortBy} onChange={e => setSortBy(e.target.value)}
              style={{ fontSize: '12px', padding: '6px 14px', borderRadius: '20px', background: T.pillInactive.bg, color: T.pillInactive.text, border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="updated">Sort: Last Updated</option>
              <option value="created">Sort: Newest First</option>
              <option value="title">Sort: Name A-Z</option>
              <option value="value">Sort: Highest Value</option>
              <option value="due">Sort: Due Soonest</option>
              <option value="status">Sort: Status</option>
            </select>
            <button onClick={() => handleOpenModal()}
              style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '6px', padding: '8px 16px', fontSize: '12px', fontWeight: 600, background: T.accentGradient, color: '#fff', border: 'none', borderRadius: '10px', cursor: 'pointer' }}>
              <Icon name="plus" size={16} /> New Project
            </button>
          </FilterBar>

          {/* Summary bar */}
          <div style={{ display: 'flex', gap: '8px' }}>
            <div style={{ flex: 1, background: T.cardGradient, borderRadius: '10px', border: `1px solid ${T.border}`, padding: '10px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: '11px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.04em' }}>Showing</span>
              <span style={{ fontSize: '18px', fontWeight: 700, color: T.text }}>{filteredJobs.length}</span>
            </div>
            <div style={{ flex: 1, background: T.cardGradient, borderRadius: '10px', border: `1px solid ${T.border}`, padding: '10px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: '11px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.04em' }}>Pipeline</span>
              <span style={{ fontSize: '18px', fontWeight: 700, color: T.green }}>${totalValue.toLocaleString()}</span>
            </div>
            {overdueCount > 0 && (
              <div style={{ flex: 1, background: 'linear-gradient(160deg, rgba(245,158,11,0.10) 0%, rgba(245,158,11,0.03) 100%)', borderRadius: '10px', border: '1px solid rgba(245,158,11,0.18)', padding: '10px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: '11px', fontWeight: 600, color: '#f59e0b', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Overdue</span>
                <span style={{ fontSize: '18px', fontWeight: 700, color: '#f59e0b' }}>{overdueCount}</span>
              </div>
            )}
          </div>

          {/* Table header */}
          <div style={{ display: 'flex', alignItems: 'center', padding: '0 16px', gap: '12px', minWidth: 0 }}>
            <span style={{ width: '40%', minWidth: 0, fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Project</span>
            <span style={{ width: '18%', minWidth: 0, fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Client</span>
            <span style={{ width: '70px', flexShrink: 0, fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'center' }}>Status</span>
            <span style={{ width: '120px', flexShrink: 0, fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Dates</span>
            <span style={{ width: '80px', flexShrink: 0, fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Value</span>
            <span style={{ width: '50px', flexShrink: 0 }}></span>
          </div>

          {/* Project rows */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
            {filteredJobs.map(job => {
              const client = getClient(job);
              // statusMeta falls back to a grey chip for any unknown status value.
              const colors = statusMeta(job.status);
              const overdue = isOverdue(job);
              // Says which of the two is missing, because the fix differs: no client
              // means pick one, no address means type one in.
              const gap = locationGap(job, data);
              const quotesCount = data.quotes.filter(q => q.job === job.id).length;
              const projectFile = findProjectFile(job);

              return (
                <div key={job.id}
                  style={{
                    display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 16px',
                    background: T.cardGradient, borderRadius: '10px', border: `1px solid ${T.border}`,
                    borderLeft: `3px solid ${lateInk(tlLateTierOf(job), colors.dot)}`,
                    cursor: 'pointer', transition: 'all 0.15s',
                  }}
                  data-result="true" tabIndex={0}
                  onMouseEnter={e => { e.currentTarget.style.background = T.cardHoverGradient; e.currentTarget.style.borderColor = colors.dot + '60'; }}
                  onMouseLeave={e => { e.currentTarget.style.background = T.cardGradient; e.currentTarget.style.borderColor = T.border; }}
                  onClick={() => setSelectedProject(job)}
                >
                  {/* Project info */}
                  <div style={{ width: '40%', minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <span style={{ fontSize: '13px', fontWeight: 600, color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{job.title}</span>
                      {overdue && <LateBadge tier={tlLateTierOf(job) || 'quiet'} days={tlDaysLateOf(job)} />}
                      {job.paid && <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(16,185,129,0.238) 0%, rgba(16,185,129,0.063) 100%)', color: '#34d399', flexShrink: 0 }}>{`✓ PAID${job.paid_amount ? ' $' + Number(job.paid_amount).toLocaleString() : ''}`}</span>}
                      {(() => { const ship = shippingStatus(job, data.financials); if (ship === 'none') return null; return ship === 'paid'
                        ? <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(16,185,129,0.238) 0%, rgba(16,185,129,0.063) 100%)', color: '#34d399', flexShrink: 0 }}>🚚 Shipping paid</span>
                        : <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(245,158,11,0.238) 0%, rgba(245,158,11,0.063) 100%)', color: '#fbbf24', flexShrink: 0 }}>🚚 Shipping due</span>; })()}
                      {(() => { const b = billsStatus(job, data.financials); if (b.state === 'none') return null; return b.state === 'paid'
                        ? <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(16,185,129,0.238) 0%, rgba(16,185,129,0.063) 100%)', color: '#34d399', flexShrink: 0 }}>{'📦 ' + billsChipText(b)}</span>
                        : <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(245,158,11,0.238) 0%, rgba(245,158,11,0.063) 100%)', color: '#fbbf24', flexShrink: 0 }}>{'📦 ' + billsChipText(b)}</span>; })()}
                      {gap && <span style={{ flexShrink: 0 }}><LocationGapChip gap={gap} /></span>}
                      {quotesCount > 0 && <span style={{ fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(148,163,184,0.17) 0%, rgba(148,163,184,0.045) 100%)', color: '#94a3b8', flexShrink: 0 }}>{quotesCount} {quotesCount === 1 ? 'quote' : 'quotes'}</span>}
                      {projectFile && <span onClick={(e) => { e.stopPropagation(); onOpenProjectFile && onOpenProjectFile(projectFile); }}
                        style={{ display: 'inline-flex', alignItems: 'center', gap: '3px', fontSize: '9px', fontWeight: 600, padding: '1px 5px', borderRadius: '4px', background: 'linear-gradient(160deg, rgba(148,163,184,0.17) 0%, rgba(148,163,184,0.045) 100%)', color: '#94a3b8', flexShrink: 0, cursor: 'pointer' }}
                        title={`View project file: ${projectFile.client}/${projectFile.project}`}>
                        <Icon name="folder" size={10} />PROJECT.md</span>}
                    </div>
                    {job.description && <p style={{ fontSize: '11px', color: T.textMuted, marginTop: '3px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{job.description}</p>}
                  </div>

                  {/* Client */}
                  <div style={{ width: '18%', minWidth: 0 }}>
                    {client ? (
                      <span style={{ fontSize: '12px', fontWeight: 500, color: T.blue, cursor: 'pointer', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'block' }}
                        onClick={(e) => { e.stopPropagation(); setSelectedClient(client); }}>
                        {client.name}
                      </span>
                    ) : (
                      <span style={{ fontSize: '12px', color: T.textMuted }}>—</span>
                    )}
                  </div>

                  {/* Status pill, wide enough for the longest label (Commissioning). */}
                  <div style={{ width: '110px', flexShrink: 0, textAlign: 'center' }}>
                    <StatusChip status={job.status} />
                  </div>

                  {/* Dates */}
                  <div style={{ width: '120px', flexShrink: 0 }}>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '2px' }}>
                      {job.start_date && <span style={{ fontSize: '11px', color: T.textSecondary }}>{fmtDate(job.start_date)} → {job.due_date ? fmtDate(job.due_date) : '...'}</span>}
                      {!job.start_date && job.due_date && <span style={{ fontSize: '11px', color: lateInk(tlLateTierOf(job), T.textSecondary) }}>Due {fmtDate(job.due_date)}</span>}
                      {!job.start_date && !job.due_date && <span style={{ fontSize: '11px', color: T.textMuted }}>No dates</span>}
                    </div>
                  </div>

                  {/* Value */}
                  <div style={{ width: '80px', flexShrink: 0, textAlign: 'right' }}>
                    {job.value > 0 ? (
                      <span style={{ fontSize: '13px', fontWeight: 700, color: T.green }}>${Number(job.value).toLocaleString()}</span>
                    ) : (
                      <span style={{ fontSize: '11px', color: T.textMuted }}>—</span>
                    )}
                  </div>

                  {/* Actions */}
                  <div style={{ width: '50px', flexShrink: 0, display: 'flex', justifyContent: 'flex-end', gap: '4px' }} onClick={e => e.stopPropagation()}>
                    {(!job.description || job.description.length < 30) && (
                      <button onClick={() => copyResearchPrompt(job, client, data.quotes.filter(q => q.job === job.id), data.interactions.filter(i => i.job === job.id), showToast)}
                        style={{ padding: '4px 6px', borderRadius: '6px', border: 'none', backgroundColor: 'transparent', color: T.accent, cursor: 'pointer', transition: 'background 0.15s' }}
                        onMouseEnter={e => e.currentTarget.style.background = 'linear-gradient(160deg, rgba(148,163,184,0.17) 0%, rgba(148,163,184,0.045) 100%)'}
                        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                        title="Copy AI research prompt">
                        <Icon name="sparkle" size={14} />
                      </button>
                    )}
                    <button onClick={() => setSelectedProject(job)}
                      style={{ padding: '4px 6px', borderRadius: '6px', border: 'none', backgroundColor: 'transparent', color: T.textMuted, cursor: 'pointer', transition: 'all 0.15s' }}
                      onMouseEnter={e => { e.currentTarget.style.background = 'linear-gradient(160deg, rgba(148,163,184,0.17) 0%, rgba(148,163,184,0.045) 100%)'; e.currentTarget.style.color = T.accent; }}
                      onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.textMuted; }}
                      title="View project">
                      <Icon name="chevronRight" size={14} />
                    </button>
                  </div>
                </div>
              );
            })}
            {filteredJobs.length === 0 && (
              <div style={{ textAlign: 'center', padding: '40px', color: T.textMuted, fontSize: '13px' }}>No projects match your filters</div>
            )}
          </div>

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title={editingJob ? 'Edit Project' : 'New Project'} size="lg">
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Title</label>
                <input type="text" value={formData.title} onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Client</label>
                <select value={formData.client_id} onChange={(e) => setFormData({ ...formData, client_id: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">Select a client</option>
                  {data.clients.map(client => <option key={client.id} value={client.id}>{client.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Description</label>
                <textarea value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Site Address</label>
                <div className="flex gap-2">
                  <input type="text" value={formData.site_address} onChange={(e) => setFormData({ ...formData, site_address: e.target.value })}
                    placeholder="Job site address" className="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  {formData.client_id && (() => { const cl = data.clients.find(c => c.id === formData.client_id); return cl?.address ? (
                    <button type="button" onClick={() => setFormData({ ...formData, site_address: cl.address })} className="px-3 py-2 text-xs bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 whitespace-nowrap" title="Copy from client">Use client</button>
                  ) : null; })()}
                </div>
                {!formData.site_address && <p className="text-[11px] text-amber-600 mt-1">Projects without an address won't appear on the map</p>}
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Start Date</label>
                  <input type="date" value={formData.start_date} onChange={(e) => setFormData({ ...formData, start_date: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
                  <input type="date" value={formData.due_date} onChange={(e) => setFormData({ ...formData, due_date: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Status</label>
                  {/* The picker reads JOB_STATUS_META, so it offers exactly the eleven
                      statuses, drawn as the chips they become. */}
                  <StatusPicker value={formData.status}
                    onChange={s => setFormData({ ...formData, status: s })} />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Value (NZD) <span className="text-red-500">*</span></label>
                  <input type="number" min="0" step="0.01" value={formData.value} onChange={(e) => setFormData({ ...formData, value: e.target.value })}
                    className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${!(parseFloat(formData.value) > 0) ? 'border-amber-400' : 'border-slate-300'}`} placeholder="e.g. 12500" />
                  {!(parseFloat(formData.value) > 0) && <p className="text-xs text-amber-600 mt-1">Enter the job value — there's always money involved.</p>}
                </div>
              </div>
              <div className="flex gap-3 justify-end pt-4">
                <button onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
              </div>
            </div>
          </Modal>

          <ConfirmModal isOpen={!!confirmDelete} onConfirm={handleDelete} onCancel={() => setConfirmDelete(null)}
            title="Delete Project" message="Are you sure you want to delete this project?" />
        </div>
      );
    }

    // ============================================================================
    // QUOTES PAGE: every quote with status pills (draft, sent, accepted,
    // declined), client filter, value and linked project. #quotes/<id> opens
    // one.
    // ============================================================================

    function QuotesPage({ data, showToast, focusId, onFocusChange }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [clientFilter, setClientFilter] = useState('all');
      const [newToday, setNewToday] = useState(false);
      const [changedToday, setChangedToday] = useState(false);
      // Archived hidden by default: toggle below to surface it.
      const [showArchived, setShowArchived] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [editingQuote, setEditingQuote] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      // Archive/delete modal: { mode: 'archive'|'delete', quote: <quote> }
      const [archiveTarget, setArchiveTarget] = useState(null);
      const [formData, setFormData] = useState({
        title: '',
        client_id: '',
        job_id: '',
        amount: '',
        status: 'draft',
      });

      const filteredQuotes = useMemo(() => {
        return data.quotes.filter(q => {
          // Hide archived quotes unless toggle is on.
          if (!showArchived && q.archived) return false;
          const matchesSearch = q.title.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesStatus = statusFilter === 'all' || q.status === statusFilter;
          const matchesClient = clientFilter === 'all' || q.client === clientFilter;
          if (newToday && !isToday(q.created)) return false;
          if (changedToday && !(isToday(q.updated) && q.updated !== q.created)) return false;
          return matchesSearch && matchesStatus && matchesClient;
        });
      }, [data.quotes, searchTerm, statusFilter, clientFilter, newToday, changedToday, showArchived]);

      const handleOpenModal = (quote = null) => {
        if (quote) {
          setEditingQuote(quote);
          setFormData({
            title: quote.title,
            client_id: quote.client_id || '',
            job_id: quote.job_id || '',
            amount: quote.amount || '',
            status: quote.status,
          });
        } else {
          setEditingQuote(null);
          setFormData({
            title: '',
            client_id: '',
            job_id: '',
            amount: '',
            status: 'draft',
          });
        }
        setShowModal(true);
      };

      // Permalink: open the quote named in the URL (#quotes/<id>).
      // data.quotes loads asynchronously, so this re-runs when the data arrives.
      const quoteFocusHandled = useRef(false);
      useEffect(() => {
        if (!focusId) { quoteFocusHandled.current = false; return; }
        if (showModal && editingQuote && editingQuote.id === focusId) { quoteFocusHandled.current = true; return; }
        const q = (data.quotes || []).find(x => x.id === focusId);
        if (q) { handleOpenModal(q); quoteFocusHandled.current = true; }
      }, [focusId, data.quotes]);
      // Report the open quote up so the URL + Copy-link button track it.
      // Don't clear the URL id while we're still waiting for a deep link to open.
      useEffect(() => {
        if (!onFocusChange) return;
        const openId = (showModal && editingQuote) ? editingQuote.id : null;
        if (openId) { onFocusChange(openId); return; }
        if (!focusId || quoteFocusHandled.current) onFocusChange(null);
      }, [showModal, editingQuote]);

      const handleSave = async () => {
        if (!formData.title.trim()) {
          showToast('Title is required', 'error');
          return;
        }

        try {
          const saveData = {
            ...formData,
            amount: formData.amount ? parseFloat(formData.amount) : 0,
          };

          if (editingQuote) {
            await fetchAPI(`/collections/quotes/records/${editingQuote.id}`, {
              method: 'PATCH',
              body: JSON.stringify(saveData),
            });
            showToast('Quote updated successfully');
          } else {
            await fetchAPI('/collections/quotes/records', {
              method: 'POST',
              body: JSON.stringify(saveData),
            });
            showToast('Quote created successfully');
          }
          setShowModal(false);
          softRefresh();
        } catch (error) {
          showToast('Error saving quote', 'error');
        }
      };

      const handleArchiveConfirm = async (reason) => {
        const target = archiveTarget;
        if (!target?.quote) return;
        try {
          if (target.mode === 'delete') {
            await deleteRecordWithReason('quotes', target.quote.id, reason, {
              client: target.quote.client_id || null,
              job: target.quote.job_id || null,
            });
            showToast('Quote deleted');
          } else {
            await archiveRecord('quotes', target.quote.id, reason);
            showToast('Quote archived');
          }
          setArchiveTarget(null);
          setTimeout(() => softRefresh(), 400);
        } catch (e) {
          showToast((target.mode === 'delete' ? 'Delete' : 'Archive') + ' failed: ' + e.message, 'error');
          throw e;
        }
      };

      const handleUnarchiveQuote = async (id) => {
        try {
          await unarchiveRecord('quotes', id);
          showToast('Quote restored');
          setTimeout(() => softRefresh(), 400);
        } catch (e) {
          showToast('Restore failed: ' + e.message, 'error');
        }
      };

      const getClientName = (clientId) => {
        const client = data.clients.find(c => c.id === clientId);
        return client?.name || '-';
      };

      const getJobTitle = (jobId) => {
        const job = data.jobs.find(j => j.id === jobId);
        return job?.title || '-';
      };

      const statusColors = {
        draft: 'bg-slate-50 text-slate-700',
        sent: 'bg-blue-50 text-blue-700',
        accepted: 'bg-green-50 text-green-700',
        declined: 'bg-red-50 text-red-700',
        expired: 'bg-yellow-50 text-yellow-700',
      };

      const quotePills = [
        { key: 'all', label: 'All', count: data.quotes.length },
        { key: 'draft', label: 'Draft', count: data.quotes.filter(q => q.status === 'draft').length },
        { key: 'sent', label: 'Sent', count: data.quotes.filter(q => q.status === 'sent').length },
        { key: 'accepted', label: 'Accepted', count: data.quotes.filter(q => q.status === 'accepted').length },
        { key: 'declined', label: 'Declined', count: data.quotes.filter(q => q.status === 'declined').length },
      ];
      const clientOptions = data.clients.filter(c => c.status === 'active').sort((a, b) => a.name.localeCompare(b.name));

      return (
        <div className="space-y-6">
          <FilterBar searchTerm={searchTerm} onSearchChange={setSearchTerm} placeholder="Search quotes..." pills={quotePills} activePill={statusFilter} onPillChange={setStatusFilter}>
            <TodayFilters items={data.quotes} newToday={newToday} setNewToday={setNewToday} changedToday={changedToday} setChangedToday={setChangedToday} />
            <ArchiveReengageFilters items={data.quotes} showArchived={showArchived} setShowArchived={setShowArchived} showReengage={false} setShowReengage={() => {}} hasReengage={false} />
            <select value={clientFilter} onChange={e => setClientFilter(e.target.value)}
              style={{ fontSize: '12px', padding: '6px 14px', borderRadius: '20px', background: T.pillInactive.bg, color: T.pillInactive.text, border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="all">All Clients</option>
              {clientOptions.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <button
              onClick={() => handleOpenModal()}
              className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2 ml-auto"
            >
              <Icon name="plus" size={18} />
              New Quote
            </button>
          </FilterBar>

          <div className="bg-white rounded-lg shadow-sm overflow-hidden">
            <table className="w-full">
              <thead className="bg-slate-50 border-b border-slate-200">
                <tr>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Title</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Client</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Job</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Amount</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Status</th>
                  <th className="px-6 py-3 text-right text-xs font-semibold text-slate-700">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {filteredQuotes.map(quote => (
                  <tr key={quote.id} className="hover:bg-slate-50">
                    <td className="px-6 py-4 font-medium text-slate-900">{quote.title}</td>
                    <td className="px-6 py-4 text-slate-600">{getClientName(quote.client_id)}</td>
                    <td className="px-6 py-4 text-slate-600">{getJobTitle(quote.job_id)}</td>
                    <td className="px-6 py-4 font-semibold text-slate-900">${quote.amount?.toLocaleString() || '0'}</td>
                    <td className="px-6 py-4">
                      <span className={`px-3 py-1 text-xs font-semibold rounded-full ${statusColors[quote.status]}`}>
                        {quote.status}
                      </span>
                    </td>
                    <td className="px-6 py-4 text-right flex gap-2 justify-end">
                      <button
                        onClick={() => handleOpenModal(quote)}
                        className="text-blue-600 hover:text-blue-700 font-medium text-sm"
                      >
                        Edit
                      </button>
                      {quote.archived ? (
                        <button
                          onClick={() => handleUnarchiveQuote(quote.id)}
                          className="text-amber-600 hover:text-amber-700 font-medium text-sm"
                        >
                          Restore
                        </button>
                      ) : (
                        <button
                          onClick={() => setArchiveTarget({ mode: 'archive', quote })}
                          className="text-amber-600 hover:text-amber-700 font-medium text-sm"
                        >
                          Archive
                        </button>
                      )}
                      <button
                        onClick={() => setArchiveTarget({ mode: 'delete', quote })}
                        className="text-red-600 hover:text-red-700 font-medium text-sm"
                      >
                        Delete
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title={editingQuote ? 'Edit Quote' : 'New Quote'} size="lg">
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Title</label>
                <input
                  type="text"
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Client</label>
                  <select
                    value={formData.client_id}
                    onChange={(e) => setFormData({ ...formData, client_id: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select a client</option>
                    {data.clients.map(client => (
                      <option key={client.id} value={client.id}>{client.name}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Job</label>
                  <select
                    value={formData.job_id}
                    onChange={(e) => setFormData({ ...formData, job_id: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select a job</option>
                    {data.jobs.map(job => (
                      <option key={job.id} value={job.id}>{job.title}</option>
                    ))}
                  </select>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Amount</label>
                  <input
                    type="number"
                    value={formData.amount}
                    onChange={(e) => setFormData({ ...formData, amount: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="0.00"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Status</label>
                  <select
                    value={formData.status}
                    onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="draft">Draft</option>
                    <option value="sent">Sent</option>
                    <option value="accepted">Accepted</option>
                    <option value="declined">Declined</option>
                    <option value="expired">Expired</option>
                  </select>
                </div>
              </div>
              <div className="flex gap-3 justify-end pt-4">
                <button onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
              </div>
            </div>
          </Modal>

          <ArchiveModal
            isOpen={!!archiveTarget}
            mode={archiveTarget?.mode || 'archive'}
            targetType="Quote"
            targetTitle={archiveTarget?.quote?.title || ''}
            onCancel={() => setArchiveTarget(null)}
            onConfirm={handleArchiveConfirm}
          />
        </div>
      );
    }

    // ============================================================================
    // INVOICES PAGE (money in: what clients owe Splatt)
    // ============================================================================

    const money0 = (n) => '$' + (Math.round(parseFloat(n) || 0)).toLocaleString();

    // ── Money in / money out, both off the same ledger ──────────────────────
    // LedgerPage draws both the Invoices and the Bills page. It reads
    // project_financials, the same table the project Financials panel, the
    // true-win maths and the Workload flags read, and filters on direction:
    // 'in' is money owed to Splatt, 'out' is money Splatt owes. One table, so
    // there is no second set of numbers to keep in step.
    //
    // Fields it shows and edits: party (who the money is to or from), ref,
    // notes, kind, amount_gross with gst_treatment and currency, and status
    // ('paid' means settled).
    function LedgerPage({ data, showToast, direction }) {
      const isIn = direction === 'in';
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [showModal, setShowModal] = useState(false);
      const [editing, setEditing] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const blank = () => ({
        ref: '', party: '', client: '', job: '', notes: '',
        kind: isIn ? 'client_invoice' : 'supplier_bill',
        amount_gross: '', currency: 'NZD', fx_rate: '', gst_treatment: 'incl_15',
        status: 'not_raised', doc_date: new Date().toISOString().slice(0, 10),
        billed_via: 'splatt', in_xero: false,
      });
      const [formData, setFormData] = useState(blank);

      const KINDS_IN = ['client_invoice', 'ex_stock'];
      const KINDS_OUT = ['supplier_bill', 'freight', 'duty', 'import_gst', 'custom_cost'];
      const KINDS = isIn ? KINDS_IN : KINDS_OUT;
      const STATUSES = ['not_raised', 'draft', 'awaiting_approval', 'awaiting_payment', 'paid'];
      const GSTS = ['incl_15', 'add_15', 'no_gst', 'zero', 'is_import_gst'];
      const CURS = ['NZD', 'USD', 'EUR', 'GBP', 'AUD', 'ZAR'];
      const nice = (v) => String(v || '').replace(/_/g, ' ');

      const rows = (data.financials || []).filter(l => l.direction === direction);
      const getClientName = (id) => (data.clients.find(c => c.id === id) || {}).name || '';
      const getJobTitle = (id) => (data.jobs.find(j => j.id === id) || {}).title || '';

      // Same maths the project panel uses, so a total here and a total there
      // can never disagree. Gross is what actually changes hands, which is the
      // right number for "what is owed".
      const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
      const grossDue = (l) => {
        const g = Number(l.amount_gross) || 0;
        return l.gst_treatment === 'add_15' ? r2(g * 1.15) : r2(g);
      };
      // A foreign line with no rate cannot be turned into dollars. It is shown
      // in its own currency and left out of the totals rather than guessed at
      // par, which is how a total quietly goes wrong.
      const needsFx = (l) => (l.currency || 'NZD').toUpperCase() !== 'NZD' && !(Number(l.fx_rate) > 0);
      const nzd = (l) => {
        if (needsFx(l)) return null;
        const fx = Number(l.fx_rate);
        return r2(grossDue(l) * (fx > 0 ? fx : 1));
      };
      const owedOf = (l) => (l.status === 'paid' ? 0 : (nzd(l) || 0));

      const totals = useMemo(() => {
        let total = 0, settled = 0, owed = 0, unpriced = 0;
        for (const l of rows) {
          const v = nzd(l);
          if (v == null) { unpriced++; continue; }
          total += v;
          if (l.status === 'paid') settled += v; else owed += v;
        }
        return { total: r2(total), settled: r2(settled), owed: r2(owed), unpriced };
      }, [data.financials, direction]);

      const filtered = useMemo(() => {
        const q = searchTerm.toLowerCase();
        return rows.filter(l => {
          const hay = `${l.ref || ''} ${l.party || ''} ${l.notes || ''} ${l.kind || ''} ${getClientName(l.client)} ${getJobTitle(l.job || l.project_key)}`.toLowerCase();
          if (!hay.includes(q)) return false;
          if (statusFilter === 'all') return true;
          if (statusFilter === 'unpaid') return l.status !== 'paid';
          if (statusFilter === 'needs_fx') return needsFx(l);
          if (statusFilter === 'unconfirmed') return l.parse_status === 'parsed';
          return l.status === statusFilter;
        }).sort((a, b) => new Date(b.doc_date || b.created) - new Date(a.doc_date || a.created));
      }, [data.financials, direction, searchTerm, statusFilter]);

      const openModal = (l = null) => {
        if (l) {
          setEditing(l);
          setFormData({
            ref: l.ref || '', party: l.party || '', client: l.client || '', job: l.job || l.project_key || '',
            notes: l.notes || '', kind: l.kind || (isIn ? 'client_invoice' : 'supplier_bill'),
            amount_gross: l.amount_gross == null ? '' : l.amount_gross,
            currency: l.currency || 'NZD', fx_rate: l.fx_rate || '',
            gst_treatment: l.gst_treatment || 'incl_15', status: l.status || 'not_raised',
            doc_date: (l.doc_date || '').slice(0, 10), billed_via: l.billed_via || 'splatt',
            in_xero: !!l.in_xero,
          });
        } else {
          setEditing(null);
          setFormData(blank());
        }
        setShowModal(true);
      };

      const handleSave = async () => {
        if (!(parseFloat(formData.amount_gross) > 0)) { showToast('Enter an amount', 'error'); return; }
        const cur = String(formData.currency || 'NZD').toUpperCase();
        if (cur !== 'NZD' && !(parseFloat(formData.fx_rate) > 0)) {
          showToast('A foreign line needs an exchange rate, otherwise it is left out of every total', 'error');
          return;
        }
        const rec = {
          direction, kind: formData.kind, billed_via: formData.billed_via || 'splatt',
          party: formData.party || '', ref: formData.ref || '', notes: formData.notes || '',
          currency: cur, gst_treatment: formData.gst_treatment,
          amount_gross: parseFloat(String(formData.amount_gross).replace(/[^0-9.]/g, '')) || 0,
          fx_rate: formData.fx_rate ? (parseFloat(formData.fx_rate) || 0) : (cur === 'NZD' ? 1 : 0),
          status: formData.status, doc_date: formData.doc_date || '',
          client: formData.client || '', job: formData.job || '', project_key: formData.job || '',
          in_xero: !!formData.in_xero,
          parse_status: 'confirmed',
        };
        // Keep the derived columns in step with what was typed, because the
        // project summary reads them straight off the record.
        const g = rec.amount_gross;
        rec.amount_net = rec.gst_treatment === 'incl_15' ? r2(g / 1.15) : (rec.gst_treatment === 'is_import_gst' ? 0 : r2(g));
        rec.amount_net_nzd = r2(rec.amount_net * (rec.fx_rate > 0 ? rec.fx_rate : 1));
        try {
          if (editing) {
            await fetchAPI(`/collections/project_financials/records/${editing.id}`, { method: 'PATCH', body: JSON.stringify(rec) });
            showToast('Saved');
          } else {
            await fetchAPI('/collections/project_financials/records', { method: 'POST', body: JSON.stringify(rec) });
            showToast(isIn ? 'Invoice line added' : 'Bill line added');
          }
          setShowModal(false);
          softRefresh();
        } catch (e) { showToast('Error saving: ' + e.message, 'error'); }
      };

      const markPaid = async (l) => {
        try {
          await fetchAPI(`/collections/project_financials/records/${l.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: 'paid', date_paid: new Date().toISOString().slice(0, 10) }),
          });
          showToast('Marked paid'); softRefresh();
        } catch (e) { showToast('Error', 'error'); }
      };

      const handleDelete = async () => {
        try {
          await fetchAPI(`/collections/project_financials/records/${confirmDelete.id}`, { method: 'DELETE' });
          showToast('Deleted'); setConfirmDelete(null); softRefresh();
        } catch (e) { showToast('Error deleting', 'error'); }
      };

      const statusColors = {
        not_raised: 'bg-slate-50 text-slate-700', draft: 'bg-slate-50 text-slate-700',
        awaiting_approval: 'bg-amber-50 text-amber-700', awaiting_payment: 'bg-blue-50 text-blue-700',
        paid: 'bg-green-50 text-green-700',
      };
      const pills = ['all', 'unpaid', 'not_raised', 'awaiting_payment', 'paid', 'needs_fx', 'unconfirmed'];
      const clientOptions = [...data.clients].sort((a, b) => a.name.localeCompare(b.name));
      const jobOptions = [...data.jobs].sort((a, b) => (a.title || '').localeCompare(b.title || ''));

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <StatCard title={isIn ? 'Invoiced' : 'Billed to us'} value={money0(totals.total)} icon="fileText" color="blue" sub={`${rows.length} line${rows.length === 1 ? '' : 's'}`} />
            <StatCard title={isIn ? 'Outstanding' : 'Still to pay'} value={money0(totals.owed)} icon="alertTriangle" color={totals.owed > 0 ? (isIn ? 'yellow' : 'red') : 'green'} sub={isIn ? 'owed to you' : 'owed by you'} />
            <StatCard title={isIn ? 'Received' : 'Paid out'} value={money0(totals.settled)} icon="dollar" color="green" sub="settled" />
          </div>

          {totals.unpriced > 0 && (
            <div className="px-4 py-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-sm">
              {`${totals.unpriced} line${totals.unpriced === 1 ? ' is' : 's are'} in a foreign currency with no exchange rate, so they are not in the totals above. Open the line and add the rate to bring it in.`}
            </div>
          )}

          <div className="flex flex-wrap items-center gap-3">
            <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder={isIn ? 'Search invoices...' : 'Search bills...'}
              className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 min-w-[200px]" />
            <div className="flex gap-1 flex-wrap">
              {pills.map(p => (
                <button key={p} onClick={() => setStatusFilter(p)}
                  className={`px-3 py-1.5 rounded-full text-xs font-medium capitalize ${statusFilter === p ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{nice(p)}</button>
              ))}
            </div>
            <button onClick={() => openModal()} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2 ml-auto">
              <Icon name="plus" size={18} /> {isIn ? 'Add Invoice' : 'Add Bill'}
            </button>
          </div>

          <div className="bg-white rounded-lg shadow-sm overflow-hidden">
            <table className="w-full">
              <thead className="bg-slate-50 border-b border-slate-200">
                <tr>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">{isIn ? 'Invoice' : 'Bill'}</th>

    // ============================================================================
    // SUPPLIERS PAGE: supplier directory with contact details, plus add, edit
    // and delete.
    // ============================================================================

    function SuppliersPage({ data, showToast }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [specialtyFilter, setSpecialtyFilter] = useState('');
      const [newToday, setNewToday] = useState(false);
      const [changedToday, setChangedToday] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [editingSupplier, setEditingSupplier] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        contact_name: '',
        email: '',
        phone: '',
        specialty: '',
      });

      const filteredSuppliers = useMemo(() => {
        return data.suppliers.filter(s => {
          const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (s.specialty && s.specialty.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchesSpecialty = !specialtyFilter || s.specialty === specialtyFilter;
          if (newToday && !isToday(s.created)) return false;
          if (changedToday && !(isToday(s.updated) && s.updated !== s.created)) return false;
          return matchesSearch && matchesSpecialty;
        });
      }, [data.suppliers, searchTerm, specialtyFilter, newToday, changedToday]);

      const handleOpenModal = (supplier = null) => {
        if (supplier) {
          setEditingSupplier(supplier);
          setFormData({
            name: supplier.name,
            contact_name: supplier.contact_name || '',
            email: supplier.email || '',
            phone: supplier.phone || '',
            specialty: supplier.specialty || '',
          });
        } else {
          setEditingSupplier(null);
          setFormData({ name: '', contact_name: '', email: '', phone: '', specialty: '' });
        }
        setShowModal(true);
      };

      const handleSave = async () => {
        if (!formData.name.trim()) {
          showToast('Name is required', 'error');
          return;
        }

        try {
          if (editingSupplier) {
            await fetchAPI(`/collections/suppliers/records/${editingSupplier.id}`, {
              method: 'PATCH',
              body: JSON.stringify(formData),
            });
            showToast('Supplier updated successfully');
          } else {
            await fetchAPI('/collections/suppliers/records', {
              method: 'POST',
              body: JSON.stringify(formData),
            });
            showToast('Supplier created successfully');
          }
          setShowModal(false);
          softRefresh();
        } catch (error) {
          showToast('Error saving supplier', 'error');
        }
      };

      const handleDelete = async () => {
        try {
          await fetchAPI(`/collections/suppliers/records/${confirmDelete}`, { method: 'DELETE' });
          showToast('Supplier deleted successfully');
          setConfirmDelete(null);
          softRefresh();
        } catch (error) {
          showToast('Error deleting supplier', 'error');
        }
      };

      const specialties = [...new Set(data.suppliers.map(s => s.specialty).filter(Boolean))].sort();
      const specialtyPills = [{ key: 'all', label: 'All' }, ...specialties.map(s => ({ key: s, label: s }))];

      return (
        <div className="space-y-6">
          <FilterBar searchTerm={searchTerm} onSearchChange={setSearchTerm} placeholder="Search suppliers..." pills={specialtyPills.length > 1 ? specialtyPills : null} activePill={specialtyFilter || 'all'} onPillChange={v => setSpecialtyFilter(v === 'all' ? '' : v)}>
            <TodayFilters items={data.suppliers} newToday={newToday} setNewToday={setNewToday} changedToday={changedToday} setChangedToday={setChangedToday} />
            <button
              onClick={() => handleOpenModal()}
              className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2 ml-auto"
            >
              <Icon name="plus" size={18} />
              New Supplier
            </button>
          </FilterBar>

          <div className="bg-white rounded-lg shadow-sm overflow-hidden">
            <table className="w-full">
              <thead className="bg-slate-50 border-b border-slate-200">
                <tr>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Name</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Contact</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Email</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Phone</th>
                  <th className="px-6 py-3 text-left text-xs font-semibold text-slate-700">Specialty</th>
                  <th className="px-6 py-3 text-right text-xs font-semibold text-slate-700">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {filteredSuppliers.map(supplier => (
                  <tr key={supplier.id} className="hover:bg-slate-50">
                    <td className="px-6 py-4 font-medium text-slate-900">{supplier.name}</td>
                    <td className="px-6 py-4 text-slate-600">{supplier.contact_name || '-'}</td>
                    <td className="px-6 py-4 text-slate-600">{supplier.email || '-'}</td>
                    <td className="px-6 py-4 text-slate-600">{supplier.phone || '-'}</td>
                    <td className="px-6 py-4 text-slate-600">{supplier.specialty || '-'}</td>
                    <td className="px-6 py-4 text-right flex gap-2 justify-end">
                      <button
                        onClick={() => handleOpenModal(supplier)}
                        className="text-blue-600 hover:text-blue-700 font-medium text-sm"
                      >
                        Edit
                      </button>
                      <button
                        onClick={() => setConfirmDelete(supplier.id)}
                        className="text-red-600 hover:text-red-700 font-medium text-sm"
                      >
                        Delete
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title={editingSupplier ? 'Edit Supplier' : 'New Supplier'} size="lg">
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Company Name</label>
                <input
                  type="text"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Contact Name</label>
                <input
                  type="text"
                  value={formData.contact_name}
                  onChange={(e) => setFormData({ ...formData, contact_name: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                  <input
                    type="email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                  <input
                    type="tel"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Specialty</label>
                <input
                  type="text"
                  value={formData.specialty}
                  onChange={(e) => setFormData({ ...formData, specialty: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div className="flex gap-3 justify-end pt-4">
                <button onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
              </div>
            </div>
          </Modal>

          <ConfirmModal
            isOpen={!!confirmDelete}
            onConfirm={handleDelete}
            onCancel={() => setConfirmDelete(null)}
            title="Delete Supplier"
            message="Are you sure you want to delete this supplier?"
          />
        </div>
      );
    }

    // ============================================================================
    // INTERACTIONS PAGE: emails, calls, meetings and notes logged against
    // clients, newest first, with type and client filters.
    // ============================================================================

    function InteractionsPage({ data, showToast }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [clientFilter, setClientFilter] = useState('all');
      const [dateRange, setDateRange] = useState('all');
      const [newToday, setNewToday] = useState(false);
      const [changedToday, setChangedToday] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [editingInteraction, setEditingInteraction] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [formData, setFormData] = useState({
        subject: '',
        summary: '',
        type: 'note',
        date: new Date().toISOString().split('T')[0],
        client: '',
        contact: '',
        job: '',
      });

      const filteredInteractions = useMemo(() => {
        const now = new Date();
        const cutoff = dateRange === '7d' ? new Date(now - 7*86400000) : dateRange === '30d' ? new Date(now - 30*86400000) : dateRange === '90d' ? new Date(now - 90*86400000) : null;
        return data.interactions
          .filter(i => {
            const matchesSearch = i.subject.toLowerCase().includes(searchTerm.toLowerCase());
            const iType = i.type || i.interaction_type;
            const matchesType = typeFilter === 'all' || iType === typeFilter;
            const matchesClient = clientFilter === 'all' || i.client === clientFilter;
            const matchesDate = !cutoff || (i.date && new Date(i.date) >= cutoff);
            if (newToday && !isToday(i.created)) return false;
            if (changedToday && !(isToday(i.updated) && i.updated !== i.created)) return false;
            return matchesSearch && matchesType && matchesClient && matchesDate;
          })
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [data.interactions, searchTerm, typeFilter, clientFilter, dateRange, newToday, changedToday]);

      const handleOpenModal = (interaction = null) => {
        if (interaction) {
          setEditingInteraction(interaction);
          setFormData({
            subject: interaction.subject,
            summary: interaction.summary || '',
            type: interaction.type || interaction.interaction_type || 'note',
            date: interaction.date,
            client: interaction.client || '',
            contact: interaction.contact || '',
            job: interaction.job || '',
          });
        } else {
          setEditingInteraction(null);
          setFormData({
            subject: '',
            summary: '',
            type: 'note',
            date: new Date().toISOString().split('T')[0],
            client: '',
            contact: '',
            job: '',
          });
        }
        setShowModal(true);
      };

      const handleSave = async () => {
        if (!formData.subject.trim()) {
          showToast('Subject is required', 'error');
          return;
        }

        try {
          if (editingInteraction) {
            await fetchAPI(`/collections/interactions/records/${editingInteraction.id}`, {
              method: 'PATCH',
              body: JSON.stringify(formData),
            });
            showToast('Interaction updated successfully');
          } else {
            await fetchAPI('/collections/interactions/records', {
              method: 'POST',
              body: JSON.stringify(formData),
            });
            showToast('Interaction created successfully');
          }
          setShowModal(false);
          softRefresh();
        } catch (error) {
          showToast('Error saving interaction', 'error');
        }
      };

      const handleDelete = async () => {
        try {
          await fetchAPI(`/collections/interactions/records/${confirmDelete}`, { method: 'DELETE' });
          showToast('Interaction deleted successfully');
          setConfirmDelete(null);
          softRefresh();
        } catch (error) {
          showToast('Error deleting interaction', 'error');
        }
      };

      const getClientName = (clientId) => {
        const client = data.clients.find(c => c.id === clientId);
        return client?.name || '-';
      };

      const typeColors = {
        email: 'bg-blue-50 text-blue-700',
        call: 'bg-green-50 text-green-700',

    // ============================================================================
    // TIMELINE PAGE and its views
    // ============================================================================
    // TimelinePage (further down) owns the filter bar and switches between the

    // show projects or tasks. PlannerPage reuses the planner view. The shared

    // ── Shared timeline helpers ──
    const TL_STATUS_COLORS = {
      // Open pipeline
      quoting:   { bg: '#fef3c7', border: '#f59e0b', text: '#92400e', pill: 'bg-amber-100 text-amber-800 border border-amber-300' },
      quoted:    { bg: '#ffedd5', border: '#ea580c', text: '#9a3412', pill: 'bg-orange-100 text-orange-800 border border-orange-300' },
      // Confirmed pipeline
      won:       { bg: '#d1fae5', border: '#10b981', text: '#065f46', pill: 'bg-emerald-100 text-emerald-800 border border-emerald-300' },
      invoicing: { bg: '#cffafe', border: '#06b6d4', text: '#155e75', pill: 'bg-cyan-100 text-cyan-800 border border-cyan-300' },
      invoiced:  { bg: '#dbeafe', border: '#3b82f6', text: '#1e40af', pill: 'bg-blue-100 text-blue-800 border border-blue-300' },
      commissioning: { bg: '#ccfbf1', border: '#14b8a6', text: '#115e59', pill: 'bg-teal-100 text-teal-800 border border-teal-300' },
      // Parked
      reengage:  { bg: '#f3e8ff', border: '#a855f7', text: '#6b21a8', pill: 'bg-purple-100 text-purple-800 border border-purple-300' },
      // Other
      on_hold:   { bg: '#f1f5f9', border: '#64748b', text: '#334155', pill: 'bg-slate-100 text-slate-700 border border-slate-300' },
      lost:      { bg: '#fee2e2', border: '#dc2626', text: '#991b1b', pill: 'bg-red-100 text-red-700 border border-red-300' },
      cancelled: { bg: '#fee2e2', border: '#ef4444', text: '#991b1b', pill: 'bg-red-100 text-red-700 border border-red-300' },
      completed: { bg: 'rgba(255,255,255,0.06)', border: '#94a3b8', text: '#475569', pill: 'bg-slate-100 text-slate-600 border border-slate-300' },
      // Task-only. normalizeTask returns these for the Waiting and Stalled Todoist
      // columns, so parked tasks are never drawn as live work. taskOnly keeps
      // them out of the project legends, which are about the sales pipeline.
      waiting:   { bg: '#fef9c3', border: '#eab308', text: '#854d0e', pill: 'bg-yellow-100 text-yellow-800 border border-yellow-300', taskOnly: true },
      stalled:   { bg: '#e0f2fe', border: '#0ea5e9', text: '#075985', pill: 'bg-sky-100 text-sky-800 border border-sky-300', taskOnly: true },
      // A task that is simply moving today. Kept apart from every job status so
      // the two can change independently.
      live:      { bg: '#d1fae5', border: '#10b981', text: '#065f46', pill: 'bg-emerald-100 text-emerald-800 border border-emerald-300', taskOnly: true },
    };

    // What a status this table does not know gets: grey, and taskOnly so it
    // never appears in a legend. An unknown status should be visible as one,
    // not drawn as a real state.
    const TL_NEUTRAL = { bg: 'rgba(148,163,184,0.14)', border: '#94a3b8', text: '#475569', pill: 'bg-slate-100 text-slate-600 border border-slate-300', taskOnly: true };
    const tlFmtDate = (d) => { if (!d) return null; return new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }); };
    const tlFmtShort = (d) => { if (!d) return null; return new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }); };
    const tlFmtRelative = (d) => {
      if (!d) return null;
      const diff = Math.ceil((new Date(d) - new Date()) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      if (diff === -1) return 'Yesterday';
      if (diff > 0 && diff <= 7) return `In ${diff}d`;
      if (diff < 0 && diff >= -7) return `${Math.abs(diff)}d ago`;
      if (diff > 7 && diff <= 30) return `In ${Math.ceil(diff / 7)}w`;
      return null;
    };
    const tlIsOverdue = F.tlIsOverdue;

    // ── Where a pin comes from ──
    //
    // One place, and only one. A pin is drawn from real coordinates written on
