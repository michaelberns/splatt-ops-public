                  <span className="text-[11px]" style={{ color: T2.textSecondary }}>
                    pick a client, or move it to Splatt NZ if it is your own work
                  </span>
                  <div className="flex-1" />
                  <span className="text-[11px] px-2 py-0.5 rounded"
                    style={{ background: T2.pillInactive.bg, color: T2.textSecondary }}>
                    {orphanTasks.length} {orphanTasks.length === 1 ? 'task' : 'tasks'}
                  </span>
                </div>
                <div className="pl-3">
                  <div className="mb-2 rounded-lg overflow-hidden"
                    style={{ background: T2.cardGradient, border: `1px solid ${T2.borderStrong}`, boxShadow: '0 2px 10px rgba(0,0,0,0.40)' }}>
                    <div className="py-2" style={{ background: T2.wellGradient }}>
                      {orphanTasks.map(renderTask)}
                    </div>
                  </div>
                </div>
              </div>
            )}
            {clientList.length === 0 && orphanTasks.length === 0 && (
              // The empty state names the filters that are on, with a way to clear them,
              // rather than only saying nothing matched.
              <div className="text-center py-14" style={{ color: T2.textSecondary }}>
                <div className="text-[13px]" style={{ color: T2.textPrimary }}>
                  Nothing matches {emptyStateFilters.map(f => f.label).join(' + ')}.
                </div>
                <div className="text-[11px] mt-1.5">
                  Take one off in the bar above, or Clear all.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── WHERE IS THIS ───────────────────────────────────────────────────
    // One answer to "does this thing have a location", used by the map,
    // the project list, the task list and the detail panels, so they
    // cannot drift apart and disagree on screen.
    //
    // A project carries its own site_address. A task has no address of
    // its own on purpose. It inherits from the project it belongs to,
    // then from the client. So an address is typed once, on the thing
    // that actually has a location, and every task at that site follows.
    //
    // These are function declarations rather than arrow constants so they are
    // hoisted: JobsPage, far above this point, calls them too.
    //
    // Splatt's own work, as opposed to work done for a paying client. The
    // internal client record is matched on its name, so the dashboard keeps
    // working if the record is ever rebuilt; the id is a fallback. The same
    // id and rule are in quality_engine.js.
    const INTERNAL_CLIENT_ID = 'internalclient0';

    // The one place the internal colour is defined. Teal because nothing else
    // on this page uses it, so it never reads as a warning.
    const INTERNAL_TONE = {
      accent: '#0d9488',
      text: '#0f766e',
      bg: 'rgba(13, 148, 136, 0.07)',
      border: 'rgba(13, 148, 136, 0.35)',
    };

    function isInternalClient(client) {
      if (!client) return false;
      if (client.id === INTERNAL_CLIENT_ID) return true;
      const name = String(client.name || '').toLowerCase();
      return name.indexOf('splatt') !== -1 && name.indexOf('internal') !== -1;
    }

    // Same question, but when all you have is the id.
    function isInternalClientId(clientId, data) {
      if (!clientId) return false;
      if (clientId === INTERNAL_CLIENT_ID) return true;
      return isInternalClient((data?.clients || []).find(c => c.id === clientId));
    }

    function locationOf(item, data) {
      if (!item) return null;
      const jobs = data?.jobs || [];
      const clients = data?.clients || [];
      const isTask = item._isTask === true || item.todoist_id !== undefined;
      const job = isTask ? jobs.find(j => j.id === item.job) : item;
      if (job && job.site_address) return { address: job.site_address, from: 'project' };
      const clientId = (job && job.client) || item.client;
      const client = clients.find(c => c.id === clientId);
      if (client && client.address) return { address: client.address, from: 'client' };
      return null;
    }

    // What is missing, if anything.
    //   null       nothing to do, there is an address to put on the map
    //   'client'   no client linked, so there is nothing to hang an
    //              address off yet. Pick the client first.
    //   'address'  the client is known and neither it nor the project
    //              has an address. Type one in.
    function locationGap(item, data) {
      if (!item) return null;
      if (locationOf(item, data)) return null;
      const jobs = data?.jobs || [];
      const isTask = item._isTask === true || item.todoist_id !== undefined;
      const job = isTask ? jobs.find(j => j.id === item.job) : item;
      const clientId = (job && job.client) || item.client;
      // Internal work is not a gap: there is no client to find and no customer
      // site to put on the map.
      if (isInternalClientId(clientId, data)) return null;
      return clientId ? 'address' : 'client';
    }

    // The marker itself. Same wording and same colours everywhere, so
    // seeing it on a task card and on a project row means the same thing.
    // Red is a blocker, there is no client. Amber is a job for later,
    // somebody just needs to type the address in.
    function LocationGapChip({ gap, size = 'sm' }) {
      if (!gap) return null;
      const blocked = gap === 'client';
      const label = blocked ? 'NO CLIENT' : 'NO ADDRESS';
      const title = blocked
        ? 'Not linked to a client, so it has no address and will not appear on the map. Link a client first.'
        : 'No address on this project or its client, so it will not appear on the map. Add one.';
      const c = blocked ? T.red : T.amber;
      const big = size === 'md';
      return (
        <span title={title} style={{
          fontSize: big ? '10px' : '9px', fontWeight: 600, letterSpacing: '0.03em',
          padding: big ? '2px 8px' : '1px 6px', borderRadius: '4px',
          background: blocked
            ? 'linear-gradient(150deg, rgba(248,113,113,0.22) 0%, rgba(248,113,113,0.06) 100%)'
            : 'linear-gradient(150deg, rgba(251,191,36,0.22) 0%, rgba(251,191,36,0.06) 100%)',
          border: '1px solid ' + (blocked ? 'rgba(248,113,113,0.45)' : 'rgba(251,191,36,0.45)'),
          color: c, whiteSpace: 'nowrap',
        }}>📍 {label}</span>
      );
    }

    // ============================================================================
    // TIMELINE PAGE (#timeline, #workload, #map)
    // ============================================================================
    // ── Normalize assignment (task) to job-like shape for shared views ──
    function normalizeTask(task, data) {
      const client = data.clients?.find(c => c.id === task.client);
      const linkedJob = data.jobs?.find(j => j.id === task.job);
      // Two dates. due_date below is WHEN IT LANDS, because that is what the
      // calendar, the Gantt bars and every sort want. _realDue is HOW LATE IT IS,
      // which is a different question and the one the overdue badge answers.
      // See actionableDateOf.
      const realDue = realDueOf(task);
      const lands = actionableDateOf(task);
      const isOverdue = realDue && new Date(realDue) < new Date() && task.status !== 'completed';
      const kind = sectionKind(task);
      // Map Todoist priority (1=p4 lowest, 4=p1 highest) to a label
      const priLabels = { 4: 'p1', 3: 'p2', 2: 'p3', 1: 'p4' };
      return {
        ...task,
        _isTask: true,
        title: task.content || task.title || '(untitled)',
        description: task.description || '',
        client: task.client,
        // Column first, date second. Waiting and Stalled work is parked on purpose,
        // and calling it "overdue" because of the calendar would bury the tasks
        // that can be acted on today.
        status: task.status === 'completed' ? 'completed'
              : kind === 'stalled' ? 'stalled'
              : WAITING_KINDS.includes(kind) ? 'waiting'
              : kind === 'backlog' ? 'on_hold'
              : isOverdue ? 'overdue'
              : kind === 'upcoming' ? 'on_hold'
              // A task moving today. Its own key, separate from any job status, so the
              // task colours and the job colours can change independently.
              : 'live',
        _realStatus: task.status,
        _sectionName: task.section_name || '',
        _sectionKind: kind,
        _isParked: isParked(task),
        _isOverdueByRealDate: !!isOverdue,
        _priority: task.priority,
        _priorityLabel: priLabels[task.priority] || 'p4',
        _labels: (task.labels || '').split(',').map(l => l.trim()).filter(Boolean),
        _linkedProject: linkedJob,
        _clientName: client?.name || '',
        start_date: null, // tasks don't have start dates
        due_date: lands,
        _realDue: realDue,
        _daysLate: daysLateOf(task),
        _deadline: deadlineOf(task),
        _todoistDueDate: task.due_date || null,
        value: linkedJob?.value || 0,
        location: task.location || null,
      };
    }

    function TimelinePage({ data, showToast, onNavigate, onOpenProjectFile, initialViewMode, focusId, onFocusChange }) {
      const [selectedJob, setSelectedJob] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      useEscapeBack(!!selectedJob, () => setSelectedJob(null));
      useEscapeBack(!!selectedClient, () => setSelectedClient(null));
      const [viewMode, setViewMode] = useState(() => {
        // If a parent (e.g. the dedicated Workload sidebar entry) pins the
        // starting view, honor that first.
        if (initialViewMode && ['map', 'list', 'calendar', 'workload', 'gantt'].includes(initialViewMode)) {
          return initialViewMode;
        }
        // Permalink: read viewMode from URL hash so a refresh stays on the same tab.
        // Supports #workload, #map, #list, #calendar, #gantt.
        if (typeof window !== 'undefined' && window.location.hash) {
          const h = window.location.hash.replace('#', '').toLowerCase();
          if (['map', 'list', 'calendar', 'workload', 'gantt'].includes(h)) return h;
        }
        return 'map';
      });
      const [dataMode, setDataMode] = useState('projects'); // 'projects' or 'tasks'
      // One client. The Workload groups by client, so this narrows it to one.
      const [clientFilterTL, setClientFilterTL] = useState('');
      const [statusFilter, setStatusFilter] = useState('current');
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('due_date');
      const [newToday, setNewToday] = useState(false);
      const [changedToday, setChangedToday] = useState(false);
      // Archived + reengage hidden by default: toggles surface them.
      const [showArchived, setShowArchived] = useState(false);
      const [showReengage, setShowReengage] = useState(false);
      const [showCancelled, setShowCancelled] = useState(false);
      // ── "When" filter (date dimension) ──────────────────────────────────────
      // dateFilter is one of DATE_WINDOWS ('all' | 'overdue' | 'today' | 'week'
      // | 'recent') or 'custom' when a From/To date is set. It combines with the
      // status pills (AND) so e.g. "Confirmed" + "This week" narrows both ways.
      const [dateFilter, setDateFilter] = useState('all');
      const [customStart, setCustomStart] = useState('');
      const [customEnd, setCustomEnd] = useState('');
      // ── "Records" filter (data quality dimension) ─────────────────────────
      // A list of rule codes. Empty means show everything. Picking two narrows
      // to projects carrying both gaps, which is how you find the genuinely
      // bad records rather than a long list of mildly incomplete ones.
      // Passing null to the handler clears the whole thing.
      const [qualityFilters, setQualityFilters] = useState([]);
      const toggleQualityFilter = (code) => {
        if (code === null) { setQualityFilters([]); return; }
        setQualityFilters(prev => prev.indexOf(code) !== -1
          ? prev.filter(c => c !== code)
          : prev.concat([code]));
      };
      // The pills themselves come from the rule catalogue, not a hand written
      // list, so adding a rule in quality_engine.js puts a working filter on
      // this bar with no further wiring.
      const tlQuality = useQuality(data);
      const qualityPills = useMemo(() => {
        // Closed work counts here. A project completed with no invoice and no
        // bill filed is the thing these chips exist to find, and leaving it
        // out made the count disagree with what picking the chip then showed.
        // Cancelled and lost raise no flags at all, so they cost nothing.
        const live = (data.jobs || []).filter(j => !j.archived);
        const counts = {};
        for (const j of live) {
          for (const i of (tlQuality.byJob[j.id] || [])) counts[i.code] = (counts[i.code] || 0) + 1;
        }
        const rank = { blocker: 0, fix: 1, info: 2 };
        return Q.RULES
          .filter(r => r.entity === 'job' || r.entity === 'finline')
          .map(r => ({ code: r.code, label: r.label, why: r.why, severity: r.severity, count: counts[r.code] || 0 }))
          .sort((a, b) => (rank[a.severity] - rank[b.severity]) || (b.count - a.count));
      }, [data.jobs, tlQuality]);
      // ── The Workload run ──────────────────────────────────────────────
      // One pass over the data (runWorkload in filter_engine.js). The chip
      // counts, the header line and the rows all read it, so they cannot
      // disagree.
      //
      // Only Workload uses it. List, Calendar and Gantt have their own rows and
      // keep counting what they show.
      const workloadRun = useMemo(() => {
        if (viewMode !== 'workload' || isTaskMode) return null;
        return F.runWorkload(
          {
            jobs: data.jobs || [],
            assignments: data.assignments || [],
            clients: data.clients || [],
            financials: data.financials || [],
            quality: tlQuality,
          },
          {
            client: clientFilterTL,
            status: statusFilter, when: dateFilter,
            customStart: customStart, customEnd: customEnd,
            records: qualityFilters, search: searchTerm,
            createdToday: newToday, editedToday: changedToday,
            archived: showArchived, reengage: showReengage, cancelled: showCancelled,
          },
          { recordCodes: qualityPills.map(r => r.code) }
        );
      }, [viewMode, isTaskMode, data.jobs, data.assignments, data.clients, data.financials,
          tlQuality, qualityPills, clientFilterTL, statusFilter, dateFilter,
          customStart, customEnd, qualityFilters, searchTerm, newToday, changedToday,
          showArchived, showReengage, showCancelled]);
      const wlCounts = workloadRun ? workloadRun.counts : null;

      const mapStateRef = useRef(null); // Persists map center/zoom across navigation

      // The URL hash is kept in step by the root component (currentPage), not
      // here. The Workload sidebar entry is the permalink for the Workload view.

      const isTaskMode = dataMode === 'tasks';

      // All hooks MUST be above any early return
      useEffect(() => {
        if (isTaskMode && viewMode === 'gantt') setViewMode('list');
      }, [isTaskMode, viewMode]);

      useEffect(() => { setStatusFilter('current'); setNewToday(false); setChangedToday(false); setDateFilter('all'); setCustomStart(''); setCustomEnd(''); }, [dataMode]);

      // ─── Task-activity enrichment (MUST be before early return: React hooks rule) ───
      const taskActivityTL = useMemo(() => {
        const byJob = {}, byClient = {};
        (data.assignments || []).forEach(t => {
          if (t.status === 'completed') return;
          const tNew = isToday(t.created);
          const tChanged = isToday(t.updated) && t.updated !== t.created;
          if (t.job) {
            if (!byJob[t.job]) byJob[t.job] = { n: false, c: false };
            if (tNew) byJob[t.job].n = true;
            if (tChanged) byJob[t.job].c = true;
          }
          if (t.client) {
            if (!byClient[t.client]) byClient[t.client] = { n: false, c: false };
            if (tNew) byClient[t.client].n = true;
            if (tChanged) byClient[t.client].c = true;
          }
        });
        return { byJob, byClient };
      }, [data.assignments]);

      // Permalink: open the project named in the URL (#workload/<id>, #timeline/<id>).
      // data.jobs loads asynchronously, so this re-runs when the data arrives.
      const tlFocusHandled = useRef(false);
      useEffect(() => {
        if (!focusId) { tlFocusHandled.current = false; return; }
        if (selectedJob && !selectedJob._isTask && selectedJob.id === focusId) { tlFocusHandled.current = true; return; }
        const job = (data.jobs || []).find(j => j.id === focusId);
        if (job) { setSelectedJob(job); tlFocusHandled.current = true; return; }
        // A task id works here too: land on the task's linked project so it
        // shows in context, or open the task itself when nothing links it.
        const t = (data.assignments || []).find(a => a.id === focusId);
        if (t) {
          const host = t.job && (data.jobs || []).find(j => j.id === t.job);
          if (host) { setSelectedJob(host); tlFocusHandled.current = true; return; }
          const normalized = normalizeTask ? normalizeTask(t, data) : { ...t, _isTask: true, title: t.content || t.title || '(untitled)' };
          setSelectedJob(normalized); tlFocusHandled.current = true;
        }
      }, [focusId, data.jobs, data.assignments]);
      // Report the open project up so the URL + Copy-link button track it
      // (only projects are deep-linked, not individual tasks).
      useEffect(() => {
        if (!onFocusChange) return;
        if (selectedJob && !selectedJob._isTask) { onFocusChange(selectedJob.id); return; }
        if (!focusId || tlFocusHandled.current) onFocusChange(null);
      }, [selectedJob]);
      // Register a "back to the list" action so a quick double-Enter returns from
      // an opened project/task to the search we used to reach it (search persists).
      useEffect(() => {
        if (selectedJob) {
          __ssDetailBack = () => setSelectedJob(null);
          return () => { if (__ssDetailBack) __ssDetailBack = null; };
        }
        return undefined;
      }, [selectedJob]);

      if (selectedClient) {
        return <ClientDetailView client={selectedClient} data={data} showToast={showToast}
          onBack={() => setSelectedClient(null)}
          onSelectProject={(job) => { setSelectedClient(null); setSelectedJob(job); }}
          onNavigate={onNavigate} />;
      }
      if (selectedJob) {
        return <DetailedTimeline job={selectedJob} onBack={() => setSelectedJob(null)} data={data} showToast={showToast}
          onOpenProjectFile={onOpenProjectFile}
          onNavigate={(page) => { if (page === 'clients') { const cl = data.clients.find(c => c.id === selectedJob.client); if (cl) { setSelectedJob(null); setSelectedClient(cl); } } else { onNavigate(page); } }} />;
      }

      const today = new Date();

      // Live-workload predicate for the "Overdue" date window: projects must
      // still be a live workload item; tasks are already open/non-archived.
      const dateLiveCheck = (it) => it && it._isTask ? true : countsTowardWorkload(it);

      // isStale and STALE_DAYS come from filter_engine.js, shared with the
      // Workload view.

      // ─── Normalize tasks from assignments ───
      const normalizedTasks = (data.assignments || []).map(t => normalizeTask(t, data));

      // ─── Choose data source ───
      const rawItems = isTaskMode ? normalizedTasks : data.jobs;

      // ─── Count context ───
      // Filter-pill + Archived/Re-engage counts are computed against the items
      // matching the current search term so the numbers always agree with what
      // the user is looking at (mirrors the Projects page behavior).
      const searchContextItems = !searchTerm ? rawItems : rawItems.filter(item => {
        const cq = searchTerm.toLowerCase();
        const client = data.clients.find(c => c.id === item.client);
        return (item.title || item.content || '').toLowerCase().includes(cq) ||
               (client?.name || '').toLowerCase().includes(cq) ||
               (item.description || '').toLowerCase().includes(cq);
      });
      // Visibility base for the status pills: also honors the Archived/Re-engage
      // toggle state so the pill counts match the rows that are actually shown.
      const pillBaseItems = searchContextItems.filter(item => {
        if (!showArchived && item.archived) return false;
        if (!isTaskMode && !showReengage && item.status === 'reengage') return false;
        return true;
      });

      // ── Date-pill count base ────────────────────────────────────────────
      // The Workload view shows projects and their tasks, and tasks carry most
      // of the due dates. Counting the "When" pills against projects alone would
      // read 0 for Overdue while many tasks are overdue, so in Workload mode the
      // date counts span projects plus open tasks (respecting search and
      // archive). Other views count their own mode.
      const dateCountTasks = (viewMode === 'workload' && !isTaskMode)
        ? normalizedTasks.filter(t => {
            if (!showArchived && t.archived) return false;
            if (t._realStatus === 'completed' || t.status === 'completed') return false;
            if (searchTerm) {
              const cq = searchTerm.toLowerCase();
              const client = data.clients.find(c => c.id === t.client);
              if (!((t.title || t.content || '').toLowerCase().includes(cq) ||
                    (client?.name || '').toLowerCase().includes(cq) ||
                    (t.description || '').toLowerCase().includes(cq))) return false;
            }
            return true;
          })
        : [];
      const dateCountBase = [...pillBaseItems, ...dateCountTasks];

      // In project mode the Workload/Timeline is a unified view that also shows
      // tasks nested under their project. Archived tasks are therefore part of
      // "what's archived here" even though they aren't in `rawItems` (which is
      // jobs). Count archived assignments (respecting the active search) so the
      // Archived badge reflects archived projects + archived tasks.
      const archivedTaskCount = isTaskMode ? 0 : (data.assignments || []).filter(t => {
        if (!t || !t.archived) return false;
        if (!searchTerm) return true;
        const cq = searchTerm.toLowerCase();
        const client = data.clients.find(c => c.id === t.client);
        return (t.title || t.content || '').toLowerCase().includes(cq) ||
               (client?.name || '').toLowerCase().includes(cq) ||
               (t.description || '').toLowerCase().includes(cq);
      }).length;

      // ─── Filter ───
      const filteredItems = rawItems.filter(item => {
        // Hide archived + reengage items unless explicitly toggled on.
        // Tasks don't have a 'reengage' status, but they can be archived.
        if (!showArchived && item.archived) return false;
        if (!isTaskMode && !showReengage && item.status === 'reengage') return false;
        if (searchTerm) {
          const q = searchTerm.toLowerCase();
          const client = data.clients.find(c => c.id === item.client);
          const match = (item.title || item.content || '').toLowerCase().includes(q) ||
                        (client?.name || '').toLowerCase().includes(q) ||
                        (item.description || '').toLowerCase().includes(q);
          if (!match) return false;
        }
        // "When" filter: combines (AND) with the status pills below.
        if (!passesDateWindow(item, dateFilter, customStart, customEnd, dateLiveCheck)) return false;
        if (isTaskMode) {
          // Task filters, one per Todoist column. normalizeTask has already worked
          // out _sectionKind, so this reads that rather than matching the section
          // name again, and the filter and the pill count agree.
          if (statusFilter === 'current') return item._realStatus !== 'completed';
          // 'overdue' is live overdue. Stalled and waiting work is late but
          // parked, and it has its own pills below.
          if (statusFilter === 'overdue') return item.status === 'overdue';
          // Cuts across all seven columns, so it needs a filter of its own.
          if (statusFilter === 'deadline') return !!item._deadline;
          if (statusFilter === 'today') return item._sectionKind === 'today';
          if (statusFilter === 'upcoming') return item._sectionKind === 'upcoming';
          if (statusFilter === 'waiting') return WAITING_KINDS.includes(item._sectionKind) || item._labels.includes('waiting');
          if (statusFilter === 'waiting_client') return item._sectionKind === 'waiting_client';
          if (statusFilter === 'waiting_supplier') return item._sectionKind === 'waiting_supplier';
          if (statusFilter === 'stalled') return item._sectionKind === 'stalled';
          if (statusFilter === 'backlog') return item._sectionKind === 'backlog';
          if (statusFilter === 'completed') return item._realStatus === 'completed';
          return true; // 'all'
        } else {
          // Project filters
          if (statusFilter === 'critical') return isJobCritical(item, data.clients);
          if (statusFilter === 'current') return !isStale(item);
          if (statusFilter === 'open') return isOpenStatus(item.status);
          if (statusFilter === 'confirmed') return isConfirmedStatus(item.status);
          if (statusFilter === 'on_hold') return item.status === 'on_hold';
          if (statusFilter === 'paid') return !!item.paid;
          if (statusFilter === 'ship_due') return shippingStatus(item, data.financials) === 'due';
          if (statusFilter === 'supplier_due') return supplierStatus(item, data.financials) === 'due';
          if (statusFilter === 'stale') return isStale(item);
          // The 'quoting' value is kept so older bookmarks and saved state still
          // work. There is no 'active' filter: that status no longer exists.
          if (statusFilter === 'quoting') return item.status === 'quoting' || isOpenStatus(item.status);
          return true;
        }
      });

      // ─── Sort ───
      const sortedRaw = [...filteredItems].sort((a, b) => {
        if (sortBy === 'due_date') { const aD = a.due_date ? new Date(a.due_date).getTime() : Infinity; const bD = b.due_date ? new Date(b.due_date).getTime() : Infinity; return aD - bD; }
        // Anything without a deadline sorts to the bottom, so the tasks that have
        // one come first.
        if (sortBy === 'deadline') { const aD = a._deadline ? new Date(a._deadline).getTime() : Infinity; const bD = b._deadline ? new Date(b._deadline).getTime() : Infinity; return aD - bD; }
        // Worst first: answers "what has been let slide".
        if (sortBy === 'days_late') return (b._daysLate || 0) - (a._daysLate || 0);
        if (sortBy === 'start_date') { const aS = a.start_date ? new Date(a.start_date).getTime() : Infinity; const bS = b.start_date ? new Date(b.start_date).getTime() : Infinity; return aS - bS; }
        if (sortBy === 'priority') return (b._priority || 0) - (a._priority || 0);
        if (sortBy === 'value') return (b.value || 0) - (a.value || 0);
        if (sortBy === 'status') return (a.status || '').localeCompare(b.status || '');
        return (a.title || '').localeCompare(b.title || '');
      });

      const sortedItems = sortedRaw.map(j => {
        if (j._isTask) {
          // For tasks, use their own created/updated
          return { ...j, _isNewToday: isToday(j.created), _isChangedToday: isToday(j.updated) && j.updated !== j.created };
        }
        // For projects, check own + linked task activity
        const ja = taskActivityTL.byJob[j.id] || {};
        const ca = taskActivityTL.byClient[j.client] || {};
        return {
          ...j,
          _isNewToday: isToday(j.created) || ja.n || ca.n,
          _isChangedToday: (isToday(j.updated) && j.updated !== j.created) || ja.c || ca.c,
        };
      });

      // ─── Apply "today" filters ───
      const todayFiltered = newToday ? sortedItems.filter(i => i._isNewToday)
        : changedToday ? sortedItems.filter(i => i._isChangedToday && !i._isNewToday)
        : sortedItems;

      // ─── Filter pills (change based on data mode) ───
      // One pill per Todoist column, plus Open, Overdue and All.
      //
      // A column pill only appears when it holds something, so empty columns do
      // not fill the bar with zeros. Overdue counts live work only, which is why
      // the parked columns get their own pills next to it.
      const taskKindCount = (kind) => pillBaseItems.filter(t => t._sectionKind === kind).length;
      const taskColumnPill = (key, label) => {
        const count = taskKindCount(key);
        return count > 0 ? [{ key, label, count }] : [];
      };
      // On Workload the row is fixed and every count is measured: the
      // pipeline runs again with that one chip picked and the cards are
      // counted. A chip reading 0 stays on the bar rather than vanishing,
      // so the row does not move under the mouse.
      const WORKLOAD_STATUS_PILLS = [
        ['current', 'Current'], ['critical', 'Critical'], ['open', 'Open Pipeline'],
        ['confirmed', 'Confirmed'], ['on_hold', 'On Hold'], ['paid', 'Paid'],
        ['ship_due', 'Shipping due'], ['supplier_due', 'Bills unpaid'],
        ['stale', 'Stale/Old'], ['all', 'All'],
      ];
      const filterPills = wlCounts ? WORKLOAD_STATUS_PILLS.map(([key, label]) => ({
        key, label,
        count: wlCounts.status[key] || 0,
        ...(key === 'critical' ? { accent: 'critical' } : {}),
      })) : isTaskMode ? [
        { key: 'current', label: 'Open', count: pillBaseItems.filter(t => t._realStatus !== 'completed').length },
        { key: 'overdue', label: 'Overdue', count: pillBaseItems.filter(t => t.status === 'overdue').length },
        // Hides itself when nothing has a deadline, same as the column pills,
        // so the bar does not grow an empty button on a quiet week.
        ...(() => {
          const n = pillBaseItems.filter(t => t._deadline).length;
          return n > 0 ? [{ key: 'deadline', label: 'Deadline', count: n }] : [];
        })(),
        ...taskColumnPill('today', 'Today'),
        ...taskColumnPill('upcoming', 'Upcoming'),
        ...taskColumnPill('waiting_client', 'Waiting on client'),
        ...taskColumnPill('waiting_supplier', 'Waiting on supplier'),
        ...taskColumnPill('stalled', 'Stalled'),
        ...taskColumnPill('backlog', 'Backlog'),
        { key: 'all', label: 'All', count: pillBaseItems.length },
      ] : (() => {
        const criticalCount = pillBaseItems.filter(j => isJobCritical(j, data.clients)).length;
        const pills = [
          { key: 'current', label: 'Current', count: pillBaseItems.filter(j => !isStale(j)).length },
          ...(criticalCount > 0 ? [{ key: 'critical', label: `Critical`, count: criticalCount, accent: 'critical' }] : []),
          { key: 'open', label: 'Open Pipeline', count: pillBaseItems.filter(j => isOpenStatus(j.status)).length },
          { key: 'confirmed', label: 'Confirmed', count: pillBaseItems.filter(j => isConfirmedStatus(j.status)).length },
          { key: 'on_hold', label: 'On Hold', count: pillBaseItems.filter(j => j.status === 'on_hold').length },
          { key: 'paid', label: 'Paid', count: pillBaseItems.filter(j => j.paid).length },
          { key: 'ship_due', label: 'Shipping due', count: pillBaseItems.filter(j => shippingStatus(j, data.financials) === 'due').length },
          { key: 'supplier_due', label: 'Bills unpaid', count: pillBaseItems.filter(j => supplierStatus(j, data.financials) === 'due').length },
          { key: 'stale', label: 'Stale/Old', count: pillBaseItems.filter(j => isStale(j)).length },
          { key: 'all', label: 'All', count: pillBaseItems.length },
        ];
        return pills;
      })();

      // ─── "When" date pills (counts honor search + archived base, like status pills) ───
      const WHEN_LABELS = { all: 'Any date', overdue: 'Overdue', today: 'Today', week: 'This week', recent: 'Recent' };
      const datePills = wlCounts ? DATE_WINDOWS.map(key => ({
        key, label: WHEN_LABELS[key] || key,
        count: wlCounts.when[key] || 0,
        ...(key === 'overdue' ? { tone: 'danger' } : {}),
      })) : [
        { key: 'all', label: 'Any date', count: dateCountBase.length },
        { key: 'overdue', label: 'Overdue', tone: 'danger', count: dateCountBase.filter(i => passesDateWindow(i, 'overdue', null, null, dateLiveCheck)).length },
        { key: 'today', label: 'Today', count: dateCountBase.filter(i => passesDateWindow(i, 'today')).length },
        { key: 'week', label: 'This week', count: dateCountBase.filter(i => passesDateWindow(i, 'week')).length },
        { key: 'recent', label: 'Recent', count: dateCountBase.filter(i => passesDateWindow(i, 'recent')).length },
      ];
      const dateFilterActive = dateFilter !== 'all';
      const pickDateWindow = (key) => { setDateFilter(key); setCustomStart(''); setCustomEnd(''); };
      const clearDateFilter = () => { setDateFilter('all'); setCustomStart(''); setCustomEnd(''); };
      // Emptying both date fields returns the row to Any date, rather than
      // leaving a 'custom' window with no bounds that looks on but filters
      // nothing.
      const pickCustomDate = (which, value) => {
        const start = which === 'start' ? value : customStart;
        const end = which === 'end' ? value : customEnd;
        if (which === 'start') setCustomStart(value); else setCustomEnd(value);
        setDateFilter(start || end ? 'custom' : 'all');
      };

      // ── The scope row ────────────────────────────────────────────────
      // Workload hands over measured counts. The other views count the rows
      // they are showing, which is the right answer for a view whose rows
      // are its items.
      const scopeCounts = wlCounts ? wlCounts.scope : {
        createdToday: sortedItems.filter(i => i._isNewToday).length,
        editedToday: sortedItems.filter(i => i._isChangedToday && !i._isNewToday).length,
        archived: searchContextItems.filter(i => i && i.archived).length + archivedTaskCount,
        reengage: searchContextItems.filter(i => i && i.status === 'reengage').length,
        cancelled: searchContextItems.filter(i => i && isTerminalStatus(i.status) && !i.archived).length,
      };
      // Archived and Closed are exclusive scopes on Workload: with either on,
      // the status chips do nothing. They dim and say so rather than sitting
      // there looking clickable.
      const statusPaused = !!(wlCounts && (showArchived || showCancelled));
      const scopeOnCount = [newToday, changedToday, showArchived, showCancelled, showReengage]
        .filter(Boolean).length;

      // Six statuses earn a permanent place on the bar. The rest are behind
      // More, which wears the picked one as its own label so nothing you
      // switched on is out of sight.
      const PRIMARY_STATUS = ['current', 'critical', 'open', 'confirmed', 'stale', 'all'];
      const primaryPills = wlCounts
        ? filterPills.filter(f => PRIMARY_STATUS.indexOf(f.key) !== -1)
        : filterPills.slice(0, 6);
      const morePills = wlCounts
        ? filterPills.filter(f => PRIMARY_STATUS.indexOf(f.key) === -1)
        : filterPills.slice(6);
      const activeMorePill = morePills.find(f => f.key === statusFilter) || null;

      const whenLabel = dateFilter === 'all'
        ? 'Any date'
        : (F.WHEN_LABELS[dateFilter] || dateFilter);

      // Only clients that have something on the board, so the list is short.
      const clientChoices = (() => {
        const seen = new Set();
        for (const j of (data.jobs || [])) if (j.client && !j.archived) seen.add(j.client);
        for (const t of (data.assignments || [])) if (t.client && t.status !== 'completed') seen.add(t.client);
        return (data.clients || [])
          .filter(c => seen.has(c.id))
          .map(c => ({ id: c.id, name: c.name || c.company || '(unknown)' }))
          .sort((a, b) => a.name.localeCompare(b.name));
      })();

      // ── What is switched on ──────────────────────────────────────────
      const currentFilters = {
        client: clientFilterTL,
        status: statusFilter, when: dateFilter,
        customStart: customStart, customEnd: customEnd,
        records: qualityFilters, search: searchTerm,
        createdToday: newToday, editedToday: changedToday,
        archived: showArchived, reengage: showReengage, cancelled: showCancelled,
      };
      const recordLabels = {};
      for (const p of qualityPills) recordLabels[p.code] = p.label;
      // describeFilters looks the client's name up in the same map, so the strip
      // and the empty state show a name like "Clearwater Bottling NZ" rather
      // than an id.
      for (const c of (data.clients || [])) recordLabels[c.id] = c.name || c.company || 'One client';
      const activeFilters = F.describeFilters(currentFilters, recordLabels);
      const filtersAreDefault = F.isDefaultFilters(currentFilters);

      const removeFilter = (row, key) => {
        if (row === 'status') setStatusFilter('current');
        else if (row === 'when') clearDateFilter();
        else if (row === 'records') toggleQualityFilter(key);
        else if (row === 'search') setSearchTerm('');
        else if (row === 'client') setClientFilterTL('');
        else if (row === 'scope') {
          if (key === 'createdToday') setNewToday(false);
          if (key === 'editedToday') setChangedToday(false);
          if (key === 'archived') setShowArchived(false);
          if (key === 'reengage') setShowReengage(false);
          if (key === 'cancelled') setShowCancelled(false);
        }
      };
      const clearAllFilters = () => {
        setStatusFilter('current'); setDateFilter('all');
        setCustomStart(''); setCustomEnd('');
        setQualityFilters([]); setSearchTerm(''); setClientFilterTL('');
        setNewToday(false); setChangedToday(false);
        setShowArchived(false); setShowReengage(false); setShowCancelled(false);
      };

      const displayItems = viewMode === 'map' ? sortedItems : todayFiltered;
      const totalValue = displayItems.reduce((sum, j) => sum + (j.value || 0), 0);
      const taskCount = normalizedTasks.filter(t => t._realStatus !== 'completed').length;
      const projectCount = data.jobs.filter(j => !isStale(j)).length;

      // What the combination got you, in the strip under the rows. On
      // Workload it is the summary object the bar below reads, so the two
      // cannot say different things.
      const resultLine = workloadRun
        ? [
            `${workloadRun.summary.cards} ${workloadRun.summary.cards === 1 ? 'project' : 'projects'}`,
            `${workloadRun.summary.openTasks} ${workloadRun.summary.openTasks === 1 ? 'task' : 'tasks'}`,
            ...(workloadRun.summary.value > 0 ? [`$${Math.round(workloadRun.summary.value).toLocaleString()}`] : []),
          ].join(' · ')
        : `${displayItems.length} ${isTaskMode
            ? (displayItems.length === 1 ? 'task' : 'tasks')
            : (displayItems.length === 1 ? 'project' : 'projects')}`;

      // View tabs. Gantt is for projects only; Workload shows projects with
      // their tasks nested.
      const viewTabs = [
        { key: 'map', label: 'Map', icon: 'map' },
        { key: 'list', label: 'List', icon: 'menu' },
        { key: 'calendar', label: 'Calendar', icon: 'calendar' },
        { key: 'workload', label: 'Workload', icon: 'book' },
        ...(!isTaskMode ? [{ key: 'gantt', label: 'Gantt', icon: 'briefcase' }] : []),
      ];

      // (hooks are at top of component, before early return)

      return (
        <div className="space-y-4">
          {/* Header */}
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div>
              <h2 className="text-2xl font-bold text-slate-900">
                {viewMode === 'map' ? 'Splatt NZ' : viewMode === 'workload' ? 'Workload' : isTaskMode ? 'Open Tasks' : 'Project Timeline'}
              </h2>
              <p className="text-sm text-slate-500 mt-0.5">
                {/* On Workload this is the summary bar's own number, read off the same
                    object, so the line at the top and the bar below it always agree. */}
                {(workloadRun ? workloadRun.summary.openProjects : displayItems.length)} {isTaskMode ? 'task' : 'project'}{(workloadRun ? workloadRun.summary.openProjects : displayItems.length) !== 1 ? 's' : ''}
                {!isTaskMode && (workloadRun ? workloadRun.summary.value : totalValue) > 0 && <span className="ml-2 font-medium text-emerald-600">${(workloadRun ? workloadRun.summary.value : totalValue).toLocaleString()} total value</span>}
                {isTaskMode && <span style={{ marginLeft: '8px', color: T.textSecondary }}>({projectCount} projects linked)</span>}
              </p>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              {/* Projects / Tasks toggle. Hidden in the Workload view, which shows
                  projects and their nested tasks together. */}
              {viewMode !== 'workload' && (
                <div style={{ display: 'flex', background: T.surfaceGradient, borderRadius: '10px', padding: '3px', border: `1px solid ${T.border}` }}>
                  {[
                    { key: 'projects', label: `Projects (${projectCount})` },
                    { key: 'tasks', label: `Tasks (${taskCount})` },
                  ].map(dm => (
                    <button key={dm.key} onClick={() => setDataMode(dm.key)}
                      style={{
                        padding: '6px 16px', fontSize: '11px', fontWeight: 600, borderRadius: '8px',
                        cursor: 'pointer', transition: 'all 0.2s', border: 'none',
                        background: dataMode === dm.key ? T.pillActive.bg : 'transparent',
                        color: dataMode === dm.key ? T.accentText : T.textSecondary,
                        boxShadow: dataMode === dm.key ? `inset 0 0 0 1px ${T.accentBorder}` : 'none',
                      }}>
                      {dm.label}
                    </button>
                  ))}
                </div>
              )}
              {/* View switcher */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '2px', background: T.surfaceGradient, borderRadius: '10px', padding: '3px', border: `1px solid ${T.border}` }}>
                {viewTabs.map(v => (
                  <button
                    key={v.key}
                    onClick={() => setViewMode(v.key)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: '5px',
                      padding: '6px 14px', fontSize: '11px', fontWeight: 600,
                      borderRadius: '8px', cursor: 'pointer', transition: 'all 0.2s', border: 'none',
                      background: viewMode === v.key ? T.pillActive.bg : 'transparent',
                      color: viewMode === v.key ? T.accentText : T.textSecondary,
                      boxShadow: viewMode === v.key ? `inset 0 0 0 1px ${T.accentBorder}` : 'none',
                    }}
                  >
                    <Icon name={v.icon} size={13} />
                    {v.label}
                  </button>
                ))}
              </div>
              {/* Status colour legend: hover to see the lifecycle and colours */}
              <StatusLegend />
            </div>
          </div>

          {/* ── The filter bar ──────────────────────────────────────────
              One row. The filters used most are on the bar, the rest are one click
              away behind a button that names what is picked. */}
          {viewMode !== 'map' && (
            <div style={{ background: T.cardGradient, borderRadius: '14px', border: `1px solid ${T.border}`, padding: '10px 12px', boxShadow: '0 1px 3px rgba(0,0,0,0.3)' }}>
              <div className="flex items-center gap-2 flex-wrap">

                <div className="relative" style={{ width: '210px', flexShrink: 0 }}>
                  <Icon name="search" size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{ color: T.textMuted }} />
                  <input type="text" placeholder={isTaskMode ? "Search tasks" : "Search projects or clients"} value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                    style={{ width: '100%', paddingLeft: '28px', paddingRight: '10px', paddingTop: '6px', paddingBottom: '6px', fontSize: '11px', background: T.surfaceGradient, border: `1px solid ${T.border}`, borderRadius: '20px', color: T.text, outline: 'none' }} />
                </div>

                {/* The statuses worth a permanent place. The rest are in More. */}
                <div className="flex gap-1.5 flex-wrap">
                  {primaryPills.map(f => (
                    <Chip key={f.key} label={f.label} count={f.count}
                      active={statusFilter === f.key}
                      tone={f.accent === 'critical' ? 'danger' : 'accent'}
                      paused={statusPaused}
                      onClick={() => setStatusFilter(f.key)} />
                  ))}
                  {morePills.length > 0 && (
                    <FilterMenu name="More"
                      label={activeMorePill ? '' : 'More'}
                      value={activeMorePill ? activeMorePill.label : ''}
                      active={!!activeMorePill}
                      title="The rest of the status filters">
                      {(close) => (
                        <div className="flex gap-1.5 flex-wrap">
                          {morePills.map(f => (
                            <Chip key={f.key} label={f.label} count={f.count}
                              active={statusFilter === f.key}
                              paused={statusPaused}
                              onClick={() => { setStatusFilter(f.key); close(); }} />
                          ))}
                        </div>
                      )}
                    </FilterMenu>
                  )}
                </div>

                <div style={{ width: '1px', height: '20px', background: T.border, flexShrink: 0 }} />

                {/* When. One at a time, or a range, which is why the date
                    fields live in the same panel as the windows. */}
                <FilterMenu name="When" label="When" value={whenLabel} active={dateFilter !== 'all'} width={300}>
                  {(close) => (
                    <div>
                      <div className="flex gap-1.5 flex-wrap">
                        {datePills.map(f => (
                          <Chip key={f.key} label={f.label} count={f.count}
                            active={dateFilter === f.key}
                            tone={f.tone === 'danger' ? 'danger' : 'accent'}
                            onClick={() => { pickDateWindow(f.key); close(); }} />
                        ))}
                      </div>
                      <div style={{ marginTop: '9px', paddingTop: '9px', borderTop: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: '6px' }}>
                        <input type="date" className="chip-date" value={customStart} max={customEnd || undefined}
                          onChange={e => pickCustomDate('start', e.target.value)}
                          title="Due on or after"
                          style={{
                            flex: 1, fontSize: '11px', padding: '5px 8px', borderRadius: '20px',
                            border: `1px solid ${customStart ? 'rgba(189,208,232,0.85)' : T.pillInactive.border}`,
                            background: customStart ? CHIP_TONES.accent.bg : T.pillInactive.bg,
                            color: customStart ? CHIP_TONES.accent.text : T.textSecondary,
                            outline: 'none', cursor: 'pointer', colorScheme: 'dark',
                          }} />
                        <span style={{ fontSize: '11px', color: T.textMuted }}>→</span>
                        <input type="date" className="chip-date" value={customEnd} min={customStart || undefined}
                          onChange={e => pickCustomDate('end', e.target.value)}
                          title="Due on or before"
                          style={{
                            flex: 1, fontSize: '11px', padding: '5px 8px', borderRadius: '20px',
                            border: `1px solid ${customEnd ? 'rgba(189,208,232,0.85)' : T.pillInactive.border}`,
                            background: customEnd ? CHIP_TONES.accent.bg : T.pillInactive.bg,
                            color: customEnd ? CHIP_TONES.accent.text : T.textSecondary,
                            outline: 'none', cursor: 'pointer', colorScheme: 'dark',
                          }} />
                      </div>
                    </div>
                  )}
                </FilterMenu>

                {/* Gaps. Only on Workload, the view that can show the fix
                    chips on the row and let you fill one in from here. */}
                {viewMode === 'workload' && qualityPills.length > 0 && (
                  <FilterMenu name="Gaps" label="Gaps" badge={qualityFilters.length}
                    active={qualityFilters.length > 0} width={430} align="right"
                    title="Records missing something. Pick two to find the ones with both.">
                    {() => (
                      <div>
                        <div className="flex gap-1.5 flex-wrap">
                          {(wlCounts
                              ? qualityPills.map(p => ({ ...p, count: wlCounts.records[p.code] || 0 }))
                              : qualityPills).map(p => {
                            const tone = Q_TONE[p.severity] || Q_TONE.info;
                            return (
                              <Chip key={p.code} label={p.label} count={p.count} title={p.why}
                                active={qualityFilters.indexOf(p.code) !== -1}
                                tone={{
                                  text: '#0f1320', dot: '#0f1320', border: tone.text,
                                  bg: `linear-gradient(150deg, ${tone.text} 0%, ${tone.text}cc 100%)`,
                                }}
                                onClick={() => toggleQualityFilter(p.code)} />
                            );
                          })}
                        </div>
                        <div style={{ marginTop: '8px', fontSize: '10px', color: T.textDim || T.textMuted, fontStyle: 'italic' }}>
                          They combine. Two shows the records carrying both.
                        </div>
                      </div>
                    )}
                  </FilterMenu>
                )}

                {/* Scope. Work that is hidden by default. */}
                <FilterMenu name="Scope" label="Scope" badge={scopeOnCount} active={scopeOnCount > 0} width={330} align="right"
                  title="Bring in work that is hidden by default">
                  {() => (
                    <div>
                      <div className="flex gap-1.5 flex-wrap">
                        <Chip label="Created today" count={scopeCounts.createdToday} tone="good"
                          active={newToday}
                          onClick={() => { setNewToday(!newToday); setChangedToday(false); }} />
                        <Chip label="Edited today" count={scopeCounts.editedToday} tone="good"
                          active={changedToday}
                          onClick={() => { setChangedToday(!changedToday); setNewToday(false); }} />
                        <Chip label="Archived" count={scopeCounts.archived} tone="warm"
                          active={showArchived}
                          onClick={() => setShowArchived(!showArchived)} />
                        {viewMode === 'workload' && !isTaskMode && (
                          <Chip label="Closed" count={scopeCounts.cancelled} tone="warm"
                            active={showCancelled}
                            onClick={() => setShowCancelled(!showCancelled)} />
                        )}
                        {!isTaskMode && (
                          <Chip label="Re-engage" count={scopeCounts.reengage} tone="warm"
                            active={showReengage}
                            onClick={() => setShowReengage(!showReengage)} />
                        )}
                      </div>
                      {statusPaused && (
                        <div style={{ marginTop: '8px', fontSize: '10px', color: T.amber || '#fbbf24' }}>
                          Archived and Closed show only that work, so the status
                          filters are paused while either is on.
                        </div>
                      )}
                    </div>
                  )}
                </FilterMenu>

                {/* One client. The Workload groups by client, so this narrows the page
                    to one of them. */}
                {viewMode === 'workload' && !isTaskMode && (
                  <select className="chip-select" value={clientFilterTL} onChange={e => setClientFilterTL(e.target.value)}
                    title="Show one client"
                    style={{
                      fontSize: '11px', padding: '6px 10px', borderRadius: '20px', maxWidth: '170px',
                      background: clientFilterTL ? CHIP_TONES.accent.bg : T.pillInactive.bg,
                      color: clientFilterTL ? CHIP_TONES.accent.text : T.textSecondary,
                      border: `1px solid ${clientFilterTL ? CHIP_TONES.accent.border : T.pillInactive.border}`,
                      outline: 'none', cursor: 'pointer',
                    }}>
                    <option value="">All clients</option>
                    {clientChoices.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                )}

                {viewMode === 'list' && (
                  <select value={sortBy} onChange={e => setSortBy(e.target.value)}
                    style={{ fontSize: '11px', padding: '6px 10px', borderRadius: '20px', background: T.pillInactive.bg, color: T.pillInactive.text, border: `1px solid ${T.pillInactive.border}`, outline: 'none', cursor: 'pointer' }}>
                    <option value="due_date">Sort: Due Date</option>
                    {!isTaskMode && <option value="start_date">Sort: Start Date</option>}
                    {isTaskMode && <option value="deadline">Sort: Deadline</option>}
                    {isTaskMode && <option value="days_late">Sort: Days Late</option>}
                    {isTaskMode && <option value="priority">Sort: Priority</option>}
                    {!isTaskMode && <option value="value">Sort: Value</option>}
                    <option value="status">Sort: Status</option>
                    <option value="title">Sort: Name</option>
                  </select>
                )}

                {/* ── What is on, and what it got you ──────────────────
                    Its own line, always, so the controls above never shuffle

    // ============================================================================
    // FINANCIALS PANEL: money in and out on one project, and its true win
    // ============================================================================
    // "True win" is the project's margin: revenue minus cost, ex-GST, in NZD.
    // Anchored on job.id. Reads and writes project_financials and keeps the
    // project's project_financials_summary row in step. The small engine below
    // mirrors server/financials_engine.js; keep the two in step.
    //   - GST is a pass-through, so the margin is ex-GST on both sides.
    //   - Lines billed via a partner (billed_via 'partner') are excluded from
    //     the headline win and reported on their own as partner_nzd.
    //   - Foreign lines with no FX rate are flagged "needs FX" and left out,
    //     never guessed at par.
    // The panel also scans the project folder for PDFs, reads them with pdf.js
    // (tesseract.js OCR for scanned ones), and proposes unconfirmed lines for
    // the operator to approve.
    function FinancialsPanel({ job, client, showToast, projectFolder }) {
      const KEY = job.id;
      const [lines, setLines] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editId, setEditId] = useState(null);   // line id, or 'new', or null
      const [form, setForm] = useState(null);
      const [busy, setBusy] = useState(false);
      const [docs, setDocs] = useState(null);       // PDFs found in the project folder (null = not scanned)
      const [scanning, setScanning] = useState(false);
      const [previewRel, setPreviewRel] = useState(null); // PDF currently shown in the preview pane
      const [cand, setCand] = useState(null);       // Xero-style multi-line picker for the open new-line: { rel, dir, currency, fx_rate, items:[…] }
      const [candBusy, setCandBusy] = useState(false);
      const [addGroup, setAddGroup] = useState(null); // key of the document/group a new line is being added to (null = standalone)
      const FS = FILES_URL + '/api/file';
      const FC = FILES_URL + '/api/folder-contents';

      // Engine: a mirror of server/financials_engine.js.
      const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
      const net = (l) => { const g = Number(l.amount_gross) || 0; if (l.gst_treatment === 'incl_15') return r2(g / 1.15); if (l.gst_treatment === 'is_import_gst') return 0; return r2(g); };
      // GST-inclusive total actually payable / invoiced (the headline figure). For
      // add_15 the entered amount is ex-GST, so the real total is +15%; incl_15 is
      // already inclusive; no_gst / zero / import-GST carry no extra. Display only:
      // the win still runs off the ex-GST net above.
      const grossDue = (l) => { const g = Number(l.amount_gross) || 0; return l.gst_treatment === 'add_15' ? r2(g * 1.15) : r2(g); };
      const netNzd = (l) => { const cur = (l.currency || 'NZD').toUpperCase(); const fx = Number(l.fx_rate); if (cur !== 'NZD') { if (!(fx > 0)) return null; return r2(net(l) * fx); } const rate = (fx && fx > 0) ? fx : 1; return r2(net(l) * rate); };
      const ready = (l) => l.parse_status !== 'parsed' && netNzd(l) !== null;
      const summarise = (ls) => { let rev = 0, cost = 0, mi = 0, mo = 0, unc = 0; (ls || []).forEach(l => { if (!ready(l)) { unc++; return; } const v = netNzd(l); const m = l.billed_via === 'partner'; if (l.direction === 'in') { m ? mi += v : rev += v; } else if (l.direction === 'out') { m ? mo += v : cost += v; } }); rev = r2(rev); cost = r2(cost); const margin = r2(rev - cost); return { revenue_nzd: rev, cost_nzd: cost, margin_nzd: margin, margin_pct: rev ? r2(margin / rev * 100) : 0, partner_nzd: r2(mi - mo), line_count: (ls || []).length, unconfirmed_count: unc }; };

      const FILTER = encodeURIComponent(`job='${KEY}' || project_key='${KEY}'`);
      const load = async () => {
        try { const res = await fetchAPI(`/collections/project_financials/records?perPage=200&sort=direction,created&filter=${FILTER}`); setLines(res.items || []); }
        catch (e) { setLines([]); }
        setLoading(false);
      };
      useEffect(() => { load(); }, [job.id]);

      const money = (n) => n == null ? '—' : ('$' + (Number(n) || 0).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
      const s = summarise(lines);
      const ins = lines.filter(l => l.direction === 'in');
      const outs = lines.filter(l => l.direction === 'out');

      const KINDS = ['client_invoice', 'supplier_bill', 'freight', 'duty', 'import_gst', 'custom_cost', 'ex_stock'];
      const GSTS = ['incl_15', 'add_15', 'no_gst', 'zero', 'is_import_gst'];
      const STATUSES = ['not_raised', 'draft', 'awaiting_approval', 'awaiting_payment', 'paid'];
      const CURS = ['NZD', 'USD', 'EUR', 'GBP', 'AUD', 'ZAR'];

      const blank = (direction) => ({ direction: direction || 'out', kind: direction === 'in' ? 'client_invoice' : 'supplier_bill', billed_via: 'splatt', party: '', ref: '', currency: 'NZD', amount_gross: '', gst_treatment: 'incl_15', fx_rate: '', status: 'not_raised', in_hubdoc: false, in_xero: false, notes: '', source_file: '', doc_date: '' });

      const syncSummary = async (ls) => {
        try {
          const body = { project_key: KEY, client: (client && client.name) || '', ...summarise(ls), last_computed: new Date().toISOString().slice(0, 10) };
          const ex = await fetchAPI(`/collections/project_financials_summary/records?perPage=1&filter=${encodeURIComponent(`project_key='${KEY}'`)}`);
          if (ex.items && ex.items.length) await fetchAPI(`/collections/project_financials_summary/records/${ex.items[0].id}`, { method: 'PATCH', body: JSON.stringify(body) });
          else await fetchAPI('/collections/project_financials_summary/records', { method: 'POST', body: JSON.stringify(body) });
        } catch (e) { /* summary is derived; non-fatal */ }
      };

      const startEdit = (l) => { setCand(null); setAddGroup(null); setEditId(l.id); setForm({ ...l, fx_rate: l.fx_rate || '', amount_gross: l.amount_gross || '' }); };
      const startNew = (dir) => { setCand(null); setAddGroup(null); setEditId('new'); setForm(blank(dir)); };
      const cancel = () => { setEditId(null); setForm(null); setCand(null); setAddGroup(null); };
      // Add a new line that belongs to an existing document/group, pre-seeded from it.
      const addToGroup = (g) => { setCand(null); setAddGroup(g.key); setEditId('new'); setForm({ ...blank(g.dir), source_file: g.source_file || '', party: g.party || '', ref: g.ref || '', currency: g.currency || 'NZD', fx_rate: g.fx_rate || '' }); };
      // Same, but also auto-read the PDF to offer a tick-list of candidate lines.
      const autofillGroup = (g) => { setAddGroup(g.key); setEditId('new'); setForm({ ...blank(g.dir), source_file: g.source_file || '', party: g.party || '', ref: g.ref || '', currency: g.currency || 'NZD', fx_rate: g.fx_rate || '' }); if (g.source_file) parseCandidates(g.source_file, g.dir); };
      // Apply a document-level field (status / Xero / Hubdoc) to EVERY line on the
      // same invoice/bill at once: they belong together, so they stay in sync.
      const setGroupMeta = async (g, patch) => {
        setBusy(true);
        try {
          for (const l of g.lines) await fetchAPI(`/collections/project_financials/records/${l.id}`, { method: 'PATCH', body: JSON.stringify(patch) });
          const res = await fetchAPI(`/collections/project_financials/records?perPage=200&sort=direction,created&filter=${FILTER}`);
          const ls = res.items || []; setLines(ls); await syncSummary(ls);
          showToast('Updated ' + g.lines.length + ' line' + (g.lines.length > 1 ? 's' : '') + ' on this document');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
        setBusy(false);
      };
      // Delete an ENTIRE document/group: every line on it (and, if asked, the
      // source PDF too). This is what "remove this bill" should actually do.
      const deleteGroup = async (g) => {
        const n = g.lines.length;
        const hasFile = !!g.source_file;
        const fn = hasFile ? g.source_file.split('/').pop() : '';
        const msg = `Delete this whole document?\n\nThis removes ${n} line${n > 1 ? 's' : ''} from the financials`
          + (hasFile ? ` and also deletes the file "${fn}" from the project folder.` : '.')
          + `\n\nThis cannot be undone.`;
        if (!confirm(msg)) return;
        setBusy(true);
        try {
          const ids = new Set(g.lines.map(l => l.id));
          for (const l of g.lines) await fetchAPI(`/collections/project_financials/records/${l.id}`, { method: 'DELETE' });
          const ls = lines.filter(x => !ids.has(x.id)); setLines(ls); await syncSummary(ls);
          if (hasFile) {
            try { await fetch(`${FS}?path=${encodeURIComponent(g.source_file)}`, { method: 'DELETE' }); setDocs(d => (d || []).filter(x => norm(x.rel) !== norm(g.source_file))); if (norm(previewRel) === norm(g.source_file)) setPreviewRel(null); } catch (e) {}
          }
          if (addGroup === g.key) cancel();
          showToast(`Deleted ${n} line${n > 1 ? 's' : ''}` + (hasFile ? ' + file' : ''));
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
        setBusy(false);
      };

      const save = async (addAnother) => {
        const f = form;
        if (f.amount_gross === '' || f.amount_gross == null) { showToast('Amount required to confirm a line', 'error'); return; }
        setBusy(true);
        const rec = {
          direction: f.direction, kind: f.kind, billed_via: f.billed_via, party: f.party || '', ref: f.ref || '',
          currency: f.currency || 'NZD', gst_treatment: f.gst_treatment, status: f.status || 'not_raised',
          in_hubdoc: !!f.in_hubdoc, in_xero: !!f.in_xero, notes: f.notes || '', date_paid: f.date_paid || '',
          source_file: f.source_file || '', doc_date: f.doc_date || '',
          job: KEY, project_key: KEY, client: (client && client.id) || job.client || '',
          amount_gross: parseFloat(String(f.amount_gross).replace(/[^0-9.]/g, '')) || 0,
          parse_status: 'confirmed',
        };
        rec.fx_rate = f.fx_rate ? (parseFloat(String(f.fx_rate).replace(/[^0-9.]/g, '')) || 0) : (String(rec.currency).toUpperCase() === 'NZD' ? 1 : 0);
        rec.amount_net = net(rec);
        const nn = netNzd(rec); rec.amount_net_nzd = nn == null ? 0 : nn;
        try {
          if (editId && editId !== 'new') await fetchAPI(`/collections/project_financials/records/${editId}`, { method: 'PATCH', body: JSON.stringify(rec) });
          else await fetchAPI('/collections/project_financials/records', { method: 'POST', body: JSON.stringify(rec) });
          const res = await fetchAPI(`/collections/project_financials/records?perPage=200&sort=direction,created&filter=${FILTER}`);
          const ls = res.items || []; setLines(ls); await syncSummary(ls);
          if (addAnother) {
            // keep the same bill open and seed a fresh line from it (duty, clearance, GST…)
            setEditId('new');
            setForm({ ...blank(f.direction), source_file: f.source_file || '', party: f.party || '', currency: f.currency || 'NZD', fx_rate: f.fx_rate || '', doc_date: f.doc_date || '', parse_status: 'parsed', notes: '' });
            showToast('Saved — add the next line from this bill');
          } else { cancel(); showToast('Saved'); }
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
        setBusy(false);
      };

      const del = async (l) => {
        if (!confirm('Delete this line?')) return;
        try { await fetchAPI(`/collections/project_financials/records/${l.id}`, { method: 'DELETE' }); const ls = lines.filter(x => x.id !== l.id); setLines(ls); await syncSummary(ls); showToast('Deleted'); }
        catch (e) { showToast('Error: ' + e.message, 'error'); }
      };

      // ── Job level money flags ─────────────────────────────────────────────
      // Four controls that write to fields on the job record (Paid, Has shipping,
      // Shipping paid, Supplier paid). They drive the Paid, Shipping and Supplier
      // pills on the Workload page.
      const involvesShipping = !!(job.has_shipping || job.shipping_paid)
        || lines.some(l => l.direction === 'out' && ['freight', 'duty', 'import_gst'].indexOf(l.kind) !== -1);

      const toggleHasShipping = async () => {
        try {
          const next = !involvesShipping;
          await fetchAPI(`/collections/jobs/records/${job.id}`, { method: 'PATCH', body: JSON.stringify(next ? { has_shipping: true } : { has_shipping: false, shipping_paid: false }) });
          showToast(next ? 'Marked as involving shipping' : 'Shipping removed from project');
          setTimeout(() => softRefresh(), 500);
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
      };

      const toggleShippingPaid = async () => {
        try {
          await fetchAPI(`/collections/jobs/records/${job.id}`, { method: 'PATCH', body: JSON.stringify({ shipping_paid: !job.shipping_paid }) });
          showToast(job.shipping_paid ? 'Shipping marked unpaid' : 'Shipping marked paid');
          setTimeout(() => softRefresh(), 500);
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
      };

      // ── PDF source docs: scan the project folder, preview, and parse-then-confirm (client-side pdf.js) ──
      // Scan the project folder, auto-parse every NOT-yet-parsed PDF into unconfirmed
      // lines for approval. Already-parsed docs are skipped (no double-parse).
      const scanDocs = async () => {
        if (!projectFolder) { showToast('No project folder linked to this project yet', 'error'); return; }
        setScanning(true);
        try {
          const res = await fetch(`${FC}?path=${encodeURIComponent(projectFolder)}`);
          const d = await res.json();
          const pdfs = (d.entries || []).filter(e => e.type === 'file' && e.extension === '.pdf')
            .map(e => ({ name: e.name, rel: e.parentDir ? `${projectFolder}/${e.parentDir}/${e.name}` : `${projectFolder}/${e.name}` }));
          setDocs(pdfs);
          if (!pdfs.length) { showToast('No PDFs found in the project folder'); setScanning(false); return; }
          const already = parsedFiles();
          const todo = pdfs.filter(p => !already.has(norm(p.rel)));
          let added = 0, done = 0;
          for (const p of todo) { showToast(`Parsing ${++done}/${todo.length}: ${p.name}…`); added += await parseAndPersist(p.rel, inferDir(p.rel)); }
          await load();
          showToast(todo.length ? `Scanned ${pdfs.length} doc(s) — added ${added} line(s) to approve` : `All ${pdfs.length} doc(s) already parsed`);
        } catch (e) { showToast('Scan failed: ' + e.message, 'error'); setDocs([]); }
        setScanning(false);
      };

      // ── number / currency helpers ──
      // Match a money token ending in a 2-digit decimal group, in EITHER Anglo
      // (1,096.61) OR European (2.635,00) grouping: bare integers (HS codes,
      // account numbers) are deliberately excluded by requiring the decimals.
      const NUM_RE = /\d{1,3}(?:[.,]\d{3})*[.,]\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g;
      // Normalise a token to a real number, auto-detecting which separator is the
      // decimal: when both appear the LAST one is the decimal (so 2.635,00→2635.00
      // and 1,096.61→1096.61); a lone comma/dot with exactly 2 trailing digits is
      // the decimal, otherwise it's a thousands separator.
      const toNum = (raw) => {
        const s = String(raw).replace(/[^\d.,]/g, '');
        if (!s) return NaN;
        const ld = s.lastIndexOf('.'), lc = s.lastIndexOf(',');
        let dec = -1;
        if (ld >= 0 && lc >= 0) dec = Math.max(ld, lc);
        else if (lc >= 0) { if (s.length - lc - 1 === 2 && s.indexOf(',') === lc) dec = lc; }
        else if (ld >= 0) { if (s.length - ld - 1 === 2 && s.indexOf('.') === ld) dec = ld; }
        const intp = (dec >= 0 ? s.slice(0, dec) : s).replace(/[.,]/g, '');
        const frac = dec >= 0 ? s.slice(dec + 1).replace(/[.,]/g, '') : '';
        return parseFloat(intp + (frac ? '.' + frac : ''));
      };
      const lastNumOn = (line) => { const m = line.match(NUM_RE); return m && m.length ? toNum(m[m.length - 1]) : null; };
      // Decide the document currency from figures that sit next to a currency
      // code or symbol. That is more reliable than any mention in bank details
      // or an address: a remittance slip listing an AUD account does not make an
      // NZ invoice AUD.
      const detectCurrency = (t) => {
        const MONEY = '\\d[\\d.,]*\\d';
        const near = (sym) => (t.match(new RegExp('(?:' + sym + ')\\s*' + MONEY + '|' + MONEY + '\\s*(?:' + sym + ')', 'gi')) || []).length;
        const score = { NZD: 0, EUR: 0, USD: 0, GBP: 0, AUD: 0, ZAR: 0 };
        score.EUR += near('EUR|€') * 3; score.USD += near('USD|US\\$') * 3; score.GBP += near('GBP|£') * 3;
        score.AUD += near('AUD') * 3; score.ZAR += near('ZAR|R\\b') * 3; score.NZD += near('NZD|NZ\\$') * 3;
        // Strong NZD signals: an explicit "Total/Amount due … NZD", or NZ GST at 15%.
        if (/(?:total|amount\s*(?:due|paid))[^\n]*\bNZD\b/i.test(t)) score.NZD += 10;
        if (/\b15(?:\.0)?\s*%/.test(t) && /\bGST\b/i.test(t)) score.NZD += 2;
        const best = Object.keys(score).reduce((a, b) => score[b] > score[a] ? b : a, 'NZD');
        return score[best] > 0 ? best : 'NZD';
      };

      const extractFromText = (text) => {
        const t = (text || '').replace(/\u00a0/g, ' ');
        const currency = detectCurrency(t);
        let amount = null;
        // Prefer an explicit total line (English OR Italian: these suppliers bill
        // in Italian: "Totale / Totali / Importo / Fattura"). Skip obvious noise
        // figures (share capital, IBAN, P.IVA, minimum-order) so the fallback can't
        // grab them, and collapse doubled OCR letters ("TToottaallee" → "Totale").
        const noise = /cap(?:itale|\.)\s*soc|share\s*capital|\bIBAN\b|R\.?\s*E\.?\s*A\.?|P\.?\s*IVA|partita\s*iva|minimo\s*fatt|\bSWIFT\b|\bBIC\b|account\s*(?:no|number)/i;
        const key = /(grand\s*total|total(?:\s*(?:due|payable|incl|amount|invoice|nzd))?|amount\s*due|balance\s*due|invoice\s*total|please\s*pay|total(?:e|i)?\b|importo\b|fattura)/i;
        const deDup = (ln) => ln.replace(/([A-Za-z])\1/g, '$1');
        const cands = [], pool = [];
        for (const ln of t.split(/[\n\r]/)) {
          const dd = deDup(ln);
          if (noise.test(ln) || noise.test(dd)) continue;
          const v = lastNumOn(ln);
          if (v != null && v > 0) pool.push(v);
          if ((key.test(ln) || key.test(dd)) && !/gst\s*(?:number|no|reg)/i.test(ln) && v != null && v > 0) cands.push(v);
        }
        if (cands.length) amount = Math.max(...cands);
        if (amount == null && pool.length) amount = Math.max(...pool);
        let date = '';
        const dm = t.match(/(\d{4})[-\/.](\d{2})[-\/.](\d{2})/) || t.match(/(\d{2})[-\/.](\d{2})[-\/.](\d{4})/);
        if (dm) date = dm[1].length === 4 ? `${dm[1]}-${dm[2]}-${dm[3]}` : `${dm[3]}-${dm[2]}-${dm[1]}`;
        let ref = ''; const rm = t.match(/(?:invoice|inv|document|doc|bill|waybill|awb)\s*(?:no\.?|number|#|:)?\s*((?=[A-Z0-9\-\/]*\d)[A-Z0-9][A-Z0-9\-\/]{3,})/i); if (rm) ref = rm[1];
        return { currency, amount, date, ref };
      };

      // Courier and import bills (couriers, customs brokers) bundle import duty,
      // admin/clearance fees and import GST on one document. Split each labelled
      // component into its own line, so one bill becomes the right few entries.
      const COURIER_RE = /dhl|fedex|\btnt\b|\bups\b|customs|broker|clearance|import\s*duty|disbursement/i;
      const COMPONENTS = [
        { kind: 'import_gst', gst: 'is_import_gst', re: /(goods\s*(?:and|&)\s*services\s*tax|import\s*gst|\bg\.?s\.?t\.?\b|\bvat\b)/i },
        { kind: 'duty',       gst: 'no_gst',        re: /(import\s*duty|customs\s*duty|\bduty\b)/i },
        { kind: 'duty',       gst: 'incl_15',       re: /(admin|administration|clearance|brokerage|disbursement|processing|handling|entry\s*fee|service\s*fee|cartage)/i },
      ];
      const proposeCourierLines = (text) => {
        const t = (text || '').replace(/\u00a0/g, ' ');
        const out = []; const seen = new Set();
        for (const ln of t.split(/[\n\r]/)) {
          for (const comp of COMPONENTS) {
            if (comp.re.test(ln)) {
              const v = lastNumOn(ln);
              if (v != null && v > 0) {
                const k = comp.kind + ':' + comp.gst + ':' + v.toFixed(2);
                if (!seen.has(k)) { seen.add(k); out.push({ kind: comp.kind, gst_treatment: comp.gst, amount_gross: v, label: ln.replace(/\s+/g, ' ').trim().slice(0, 60) }); }
              }
              break;
            }
          }
        }
        return out;
      };

      // Turn one document's text into one OR MORE proposed line objects.
      const proposeLines = (text, filename, dir) => {
        const base = extractFromText(text);
        const isCourier = COURIER_RE.test(text || '') || COURIER_RE.test(filename || '');
        if (dir === 'out' && isCourier) {
          const comps = proposeCourierLines(text);
          if (comps.length >= 1) return comps.map(c => ({ kind: c.kind, gst_treatment: c.gst_treatment, currency: base.currency, amount_gross: c.amount_gross, doc_date: base.date, ref: base.ref, notes: c.label }));
        }
        return [{ kind: dir === 'in' ? 'client_invoice' : 'supplier_bill', gst_treatment: base.currency === 'NZD' ? 'incl_15' : 'no_gst', currency: base.currency, amount_gross: base.amount != null ? base.amount : '', doc_date: base.date, ref: base.ref, notes: '' }];
      };

      // ── dedupe + record helpers ──
      const norm = (s) => (s || '').trim();
      const inferDir = (rel) => /\/(invoices|in)\//i.test(rel || '') ? 'in' : 'out';
      const parsedFiles = () => new Set(lines.filter(l => l.source_file).map(l => norm(l.source_file)));

      const buildRecord = (partial, dir, rel, parseStatus) => {
        const f = { ...blank(dir), ...partial, source_file: rel || (partial && partial.source_file) || '' };
        const cur = String(f.currency || 'NZD').toUpperCase();
        const rec = {
          direction: f.direction, kind: f.kind, billed_via: f.billed_via || 'splatt', party: f.party || '', ref: f.ref || '',
          currency: cur, gst_treatment: f.gst_treatment, status: f.status || 'not_raised',
          in_hubdoc: !!f.in_hubdoc, in_xero: !!f.in_xero, notes: f.notes || '', date_paid: f.date_paid || '',
          source_file: f.source_file || '', doc_date: f.doc_date || '',
          job: KEY, project_key: KEY, client: (client && client.id) || job.client || '',
          amount_gross: parseFloat(String(f.amount_gross).replace(/[^0-9.]/g, '')) || 0,
          parse_status: parseStatus || 'parsed',
        };
        rec.fx_rate = f.fx_rate ? (parseFloat(String(f.fx_rate).replace(/[^0-9.]/g, '')) || 0) : (cur === 'NZD' ? 1 : 0);
        rec.amount_net = net(rec); const nn = netNzd(rec); rec.amount_net_nzd = nn == null ? 0 : nn;
        return rec;
      };

      // OCR fallback for scanned/image PDFs: render each page to a canvas (pdf.js)
      // then run Tesseract.js on it. Fully client-side. Capped to keep it responsive.
      const ocrPages = async (pdf) => {
        if (!window.Tesseract) throw new Error('OCR engine not loaded yet — try again in a moment');
        let text = '';
        const maxPages = Math.min(pdf.numPages, 6);
        for (let i = 1; i <= maxPages; i++) {
          const pg = await pdf.getPage(i);
          const viewport = pg.getViewport({ scale: 2 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
