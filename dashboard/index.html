    // ============================================================================
    // DASHBOARD PAGE: the home screen. KPI cards, the live task workload, money
    // in vs out (Xero snapshot or project_financials), the Xero checks, and the
    // list behind each stat card.
    // ============================================================================

    function DashboardPage({ data, onRefresh, lastUpdated, refreshing, onNavigate }) {
      const [dateRange, setDateRange] = useState('30d');
      const [clientFilter, setClientFilter] = useState('all');
      const todayIso = new Date().toISOString().slice(0, 10);
      const defaultStartIso = new Date(Date.now() - 30*86400000).toISOString().slice(0, 10);
      const [customStart, setCustomStart] = useState(defaultStartIso);
      const [customEnd, setCustomEnd] = useState(todayIso);
      const [taskListModal, setTaskListModal] = useState(null);
      // Two sort orders the list window uses: cleanup lists oldest-late
      // first, schedule lists soonest first.
      const byLate = (arr) => arr.slice().sort((a, b) => (daysLateOf(b) || 0) - (daysLateOf(a) || 0));
      const byDue = (arr) => arr.slice().sort((a, b) => new Date(actionableDateOf(a) || '2100-01-01') - new Date(actionableDateOf(b) || '2100-01-01'));
      // Archived + reengage hidden from KPIs / pipeline by default.
      const [showArchived, setShowArchived] = useState(false);
      const [showReengage, setShowReengage] = useState(false);

      const filtered = useMemo(() => {
        const now = new Date();
        let startDate = null;
        let endDate = null;
        if (dateRange === '7d') startDate = new Date(now - 7*86400000);
        else if (dateRange === '30d') startDate = new Date(now - 30*86400000);
        else if (dateRange === '90d') startDate = new Date(now - 90*86400000);
        else if (dateRange === 'ytd') startDate = new Date(now.getFullYear(), 0, 1);
        else if (dateRange === 'custom') {
          if (customStart) startDate = new Date(customStart);
          if (customEnd) { endDate = new Date(customEnd); endDate.setHours(23, 59, 59, 999); }
        }
        const inRange = (d) => {
          if (!startDate && !endDate) return true;
          if (!d) return false;
          const dt = new Date(d);
          if (startDate && dt < startDate) return false;
          if (endDate && dt > endDate) return false;
          return true;
        };
        const byClient = (clientId) => clientFilter === 'all' || clientId === clientFilter;

        const includeJob = (j) => {
          if (!showArchived && j.archived) return false;
          if (!showReengage && j.status === 'reengage') return false;
          return true;
        };
        const includeQuote = (q) => showArchived || !q.archived;
        // Jobs often have no start or due date: they are current pipeline, not
        // time-series events. Undated jobs always count, otherwise any range other
        // than "all" would empty the pipeline and the Jobs-by-Status chart.
        const jobs = data.jobs.filter(j => includeJob(j) && byClient(j.client) && (inRange(j.start_date) || inRange(j.due_date) || (!j.start_date && !j.due_date)));
        const quotes = data.quotes.filter(q => includeQuote(q) && byClient(q.client) && inRange(q.created));
        const interactions = data.interactions.filter(i => byClient(i.client) && inRange(i.date));
        // Only live-workload projects count as overdue: archived, on-hold,
        // cancelled, stale and terminal projects are excluded so the figure
        // reflects the true overdue load.
        const overdueJobs = jobs.filter(j => j.due_date && new Date(j.due_date) < now && countsTowardWorkload(j));
        const confirmedRevenue = jobs.filter(j => isConfirmedStatus(j.status)).reduce((s, j) => s + (j.value || 0), 0);
        const openPipeline = jobs.filter(j => isOpenStatus(j.status)).reduce((s, j) => s + (j.value || 0), 0);
        const confirmedUnpriced = jobs.filter(j => isConfirmedStatus(j.status) && !(j.value > 0)).length;
        const openUnpriced = jobs.filter(j => isOpenStatus(j.status) && !(j.value > 0)).length;

        return { jobs, quotes, interactions, overdueJobs, confirmedRevenue, openPipeline, confirmedUnpriced, openUnpriced };
      }, [data, dateRange, clientFilter, customStart, customEnd, showArchived, showReengage]);

      const stats = useMemo(() => {
        const activeClients = clientFilter === 'all' ? data.clients.filter(c => c.status === 'active').length : 1;
        const confirmedJobs = filtered.jobs.filter(j => isConfirmedStatus(j.status)).length;
        const openJobs = filtered.jobs.filter(j => isOpenStatus(j.status)).length;
        const pendingQuotes = filtered.quotes.filter(q => ['draft', 'sent'].includes(q.status)).length;
        const recentInteractions = filtered.interactions.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10);

        const jobsByStatus = filtered.jobs.reduce((acc, job) => {
          const status = job.status || 'unknown';
          const existing = acc.find(s => s.name === status);
          if (existing) existing.value += 1;
          else acc.push({ name: status, value: 1 });
          return acc;
        }, []).sort((a, b) => (statusMeta(a.name).order || 99) - (statusMeta(b.name).order || 99));

        const upcomingDeadlines = filtered.jobs.filter(j => j.due_date && new Date(j.due_date) >= new Date() && new Date(j.due_date) <= new Date(Date.now() + 7*86400000) && !isTerminalStatus(j.status)).sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

        const quotesAwaiting = filtered.quotes.filter(q => q.status === 'sent').sort((a, b) => new Date(a.created) - new Date(b.created));

        return { activeClients, confirmedJobs, openJobs, pendingQuotes, recentInteractions, jobsByStatus, upcomingDeadlines, quotesAwaiting };
      }, [data, filtered, clientFilter]);

      // ── Money in vs out ────────────────────────────────────────────────
      // Both sides come from project_financials, split on direction: 'in' is
      // money owed to Splatt, 'out' is money Splatt owes. Balances are point in
      // time and ignore the date pill. They respect the client filter only.
      const money = useMemo(() => {
        const byC = (cid) => clientFilter === 'all' || cid === clientFilter;
        const all = data.financials || [];
        const invs = all.filter(l => l.direction === 'in' && byC(l.client));
        const bls = all.filter(l => l.direction === 'out' && byC(l.client));
        // What actually changes hands, GST inclusive, converted to NZD. A
        // foreign line with no exchange rate cannot be converted, so it is
        // left out rather than counted at par, which would silently make
        // every total on this panel wrong.
        const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
        const gross = (l) => {
          const g = Number(l.amount_gross) || 0;
          return l.gst_treatment === 'add_15' ? g * 1.15 : g;
        };
        const nzdOf = (l) => {
          const cur = String(l.currency || 'NZD').toUpperCase();
          const fx = Number(l.fx_rate);
          if (cur !== 'NZD' && !(fx > 0)) return null;
          return r2(gross(l) * (fx > 0 ? fx : 1));
        };
        const sum = (ls, pick) => r2(ls.reduce((t, l) => {
          const v = nzdOf(l);
          return v == null ? t : t + (pick(l) ? v : 0);
        }, 0));
        const always = () => true;
        const isPaid = (l) => l.status === 'paid';
        const notPaid = (l) => l.status !== 'paid';

        const invoiced = sum(invs, always);
        const received = sum(invs, isPaid);
        const outstanding = sum(invs, notPaid);
        const billed = sum(bls, always);
        const paidOut = sum(bls, isPaid);
        const owed = sum(bls, notPaid);
        return {
          invoiced, received, outstanding, billed, paidOut, owed,
          net: r2(received - paidOut),
          unpaidInvoices: invs.filter(notPaid).length,
          unpaidBills: bls.filter(notPaid).length,
          // Lines that could not be converted, so the reader knows the totals
          // above are missing something rather than being complete.
          unpriced: invs.concat(bls).filter(l => nzdOf(l) == null).length,
          // Is there anything to add up at all. Without this the panel cannot
          // tell "everything is paid" apart from "no invoice has ever been
          // loaded", and both come out as a green zero. Checked before the
          // client filter, so filtering to a client with no invoices still
          // shows a real zero rather than claiming nothing is connected.
          hasAnyRecords: all.length > 0,
        };
      }, [data.financials, clientFilter]);

      // ── Which set of figures the money panel should trust ──────────────
      //
      // Three possible sources, in order of how much they can be believed:
      //
      //   xero     the snapshot. Real money, straight off the ledger.
      //   records  the project_financials table. Typed in and parsed off the
      //            supplier PDFs, project by project.
      //   none     neither. The panel says so instead of showing zeros.
      //
      // The Xero snapshot is company wide and carries no link back to the
      // dashboard's client records, so it cannot be filtered to one client.
      // Showing a company total under a client filter would read as that
      // client owing the lot, which is a worse mistake than showing nothing,
      // so a client filter drops the panel back to the records path.
      const moneySource = useMemo(() => {
        const x = data.xero;
        if (x && x.available && clientFilter === 'all') return 'xero';
        if (money.hasAnyRecords) return 'records';
        return 'none';
      }, [data.xero, clientFilter, money.hasAnyRecords]);

      // The Xero figures, unpacked once so the panel below stays readable.
      // Only the totals that can be trusted end up here. Money paid out is
      // deliberately absent, because the connector only reports bills that
      // are still owing, so any "paid out" figure would be missing every
      // bill already settled and would read as far too low.
      const xeroMoney = useMemo(() => {
        const x = data.xero;
        if (!x || !x.available || !x.money) return null;
        const m = x.money;
        return {
          cash: m.cash_balance || 0,
          owedToYou: m.owed_to_you || 0,
          overdueToYou: m.overdue_to_you || 0,
          owedByYou: m.owed_by_you || 0,
          overdueByYou: m.overdue_by_you || 0,
          invoiced: m.invoiced_total || 0,
          received: m.received_total || 0,
          // Cash left once every outstanding bill is paid. Both halves are
          // complete (the bank balance, and every bill still owing), so
          // unlike a net position built from paid bills this one is real.
          afterBills: (m.cash_balance || 0) - (m.owed_by_you || 0),
          cashMeasured: x.cash_available === true
            || (x.cash_available === undefined && (m.cash_balance || 0) !== 0),
          capturedAt: x.captured_at,
          ageHours: x.age_hours,
          stale: x.stale,
          staleAfterHours: x.stale_after_hours,
          counts: x.counts || {},
          note: (x.completeness || {}).bills_note || null,
        };
      }, [data.xero]);

      // ── Live workload: current task figures from data.assignments ──
      // Tasks sync from Todoist, so these are always current. Respects the client
      // filter but ignores the date-range pill (a task's workload is "now", not a
      // historical window). The 8-week activity series uses interaction dates to
      // show a trend over time.
      const workload = useMemo(() => {
        const now = new Date();
        const todayStart = new Date(now); todayStart.setHours(0, 0, 0, 0);
        const todayEnd = new Date(todayStart.getTime() + 86400000 - 1);
        const weekEnd = new Date(todayStart.getTime() + 7 * 86400000);
        const byClient = (cid) => clientFilter === 'all' || cid === clientFilter;

        const openTasks = (data.assignments || []).filter(t => t.status !== 'completed' && !t.archived && byClient(t.client));

        // Two dates per task, and the difference matters.
        //
        // WHEN IT LANDS drives the schedule. That is the Todoist date, because a
        // Waiting task carries a real chase date. Stalled tasks have no Todoist
        // date left, so they fall back to the real due date.
        //
        // HOW LATE IT IS drives the overdue figure and the escalation ladder. That
        // is always the real due date, because rescheduling a task does not make it
        // any less late.
        const landsOn = (t) => actionableDateOf(t);
        const withDue = openTasks.filter(t => landsOn(t));
        const noDate = openTasks.filter(t => !landsOn(t));
        const dueToday = withDue.filter(t => { const d = new Date(landsOn(t)); return d >= todayStart && d <= todayEnd; });
        const dueThisWeek = withDue.filter(t => { const d = new Date(landsOn(t)); return d >= todayStart && d <= weekEnd; });
        const dueLater = withDue.filter(t => new Date(landsOn(t)) > weekEnd);

        // Overdue, split by whether the task is on the operator's desk. Tasks in
        // Stalled, Backlog or a Waiting column are overdue by the calendar but are
        // not work that can be picked up this morning. The headline counts live
        // work; the parked figure is shown next to it rather than hidden.
        const overdue = openTasks.filter(t => {
          const due = realDueOf(t);
          return due && new Date(due) < todayStart;
        });
        const overdueParked = overdue.filter(isParked);
        const overdueLive = overdue.filter(t => !isParked(t));

        // ── Metrics read off facts the board really carries ────────────────
        // Priorities are only a colour on this board, so there is no P1 count.
        // These four come from deadlines, labels, push counts and real due dates.

        // A hard deadline from Todoist. A due date is when the operator plans to
        // touch a task; a deadline is when it stops being worth doing.
        const withDeadline = openTasks.filter(t => deadlineOf(t));
        const deadlineBlown = withDeadline.filter(t => new Date(deadlineOf(t)) < todayStart);
        const deadlineSoon = withDeadline.filter(t => {
          const d = new Date(deadlineOf(t));
          return d >= todayStart && d <= weekEnd;
        });

        // Something written to a client. Breaking one of these costs more
        // than the work itself, so they get counted separately.
        const clientPromises = openTasks.filter(t =>
          (t.labels || '').toLowerCase().includes('client-promise'));
        // Late means late on the operator's desk. A promise parked in Waiting is
        // blocked on the other side, and a stalled one already shows under Needs a
        // Decision, so neither is counted here.
        const promiseIsLate = (t) => {
          const due = realDueOf(t);
          return due && new Date(due) < todayStart;
        };
        const promisesLate = clientPromises.filter(t => !isParked(t) && promiseIsLate(t));
        const promisesParkedLate = clientPromises.filter(t => isParked(t) && promiseIsLate(t));

        // The daemon reschedules a task at most three times, then gives up.
        // A task sitting at three pushes has been quietly moved along twice
        // and is not going to move itself again.
        const PUSHES = /\|\s*(\d+)\s*pushes/;
        const pushesOf = (t) => {
          const m = PUSHES.exec(t.description || '');
          return m ? parseInt(m[1], 10) : 0;
        };
        const chasesSpent = openTasks.filter(t => pushesOf(t) >= 3);

        // The single oldest thing still open, in days. One number that says
        // how bad the worst case is.
        const lateDays = openTasks.map(daysLateOf).filter(n => n !== null && n > 0);
        const oldestLate = lateDays.length ? Math.max(...lateDays) : 0;

        // Real due dates that were estimated (marked "(guessed)" on the pin)
        // because the original date was not recorded. Shows which numbers are soft.
        const guessedDates = openTasks.filter(t =>
          (t.description || '').includes('Real due:') &&
          (t.description || '').includes('(guessed)'));

        // Non-overlapping buckets for the "by due date" bar chart.
        const dueBuckets = [
          { name: 'Overdue', value: overdueLive.length },
          { name: 'Today', value: dueToday.length },
          { name: 'This week', value: Math.max(0, dueThisWeek.length - dueToday.length) },
          { name: 'Later', value: dueLater.length },
          { name: 'Parked', value: overdueParked.length },
          { name: 'No date', value: noDate.length },
        ];

        // Actionable list = everything landing on or before the end of this
        // week, soonest first. Parked work is left out: "actionable" has to
        // mean actionable.
        const actionable = withDue
          .filter(t => new Date(landsOn(t)) <= weekEnd && !isParked(t))
          .sort((a, b) => new Date(landsOn(a)) - new Date(landsOn(b)));

        // 8 rolling 7-day windows ending today: interaction momentum over time.
        const activityWeeks = [];
        for (let i = 7; i >= 0; i--) {
          const start = new Date(todayStart.getTime() - i * 7 * 86400000);
          const end = new Date(start.getTime() + 7 * 86400000);
          const count = (data.interactions || []).filter(x => byClient(x.client) && x.date && new Date(x.date) >= start && new Date(x.date) < end).length;
          activityWeeks.push({ name: `${start.getDate()}/${start.getMonth() + 1}`, value: count });
        }

        // Jobs missing a dollar value: a nudge to keep the money figures complete.
        const unpricedJobs = (data.jobs || []).filter(j => !j.archived && j.status !== 'cancelled' && !(j.value > 0));

        return {
          openCount: openTasks.length,
          overdueCount: overdueLive.length,
          overdueParkedCount: overdueParked.length,
          overdueTotalCount: overdue.length,
          dueTodayCount: dueToday.length,
          dueWeekCount: dueThisWeek.length,
          noDateCount: noDate.length,
          deadlineBlownCount: deadlineBlown.length,
          deadlineSoonCount: deadlineSoon.length,
          deadlineCount: withDeadline.length,
          promisesLateCount: promisesLate.length,
          promisesParkedLateCount: promisesParkedLate.length,
          promiseCount: clientPromises.length,
          chasesSpentCount: chasesSpent.length,
          guessedDateCount: guessedDates.length,
          oldestLateDays: oldestLate,
          overdueLive,
          overdueParked,
          openTasks,
          dueTodayTasks: dueToday,
          dueWeekTasks: dueThisWeek,
          deadlineBlownTasks: deadlineBlown,
          deadlineSoonTasks: deadlineSoon,
          clientPromises,
          promisesLate,
          promisesParkedLate,
          chasesSpent,
          dueBuckets,
          actionable,
          activityWeeks,
          unpricedCount: unpricedJobs.length,
        };
      }, [data, clientFilter]);

      const datePills = [
        { key: '7d', label: '7 days' }, { key: '30d', label: '30 days' },
        { key: '90d', label: '90 days' }, { key: 'ytd', label: 'YTD' },
        { key: 'all', label: 'All time' }, { key: 'custom', label: 'Custom' },
      ];

      const clientOptions = data.clients.filter(c => c.status === 'active').sort((a, b) => a.name.localeCompare(b.name));

      const fmtUpdated = (d) => {
        if (!d) return '—';
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      };

      return (
        <div className="space-y-6">
          <FilterBar pills={datePills} activePill={dateRange} onPillChange={setDateRange}>
            <ArchiveReengageFilters items={data.jobs} showArchived={showArchived} setShowArchived={setShowArchived} showReengage={showReengage} setShowReengage={setShowReengage} />
            <select value={clientFilter} onChange={e => setClientFilter(e.target.value)}
              style={{ fontSize: '12px', padding: '6px 14px', borderRadius: '20px', background: clientFilter !== 'all' ? T.pillActive.bg : T.pillInactive.bg, color: clientFilter !== 'all' ? T.pillActive.text : T.pillInactive.text, border: 'none', boxShadow: clientFilter !== 'all' ? `inset 0 0 0 1px ${T.pillActive.border}` : 'none', outline: 'none', cursor: 'pointer', marginLeft: 'auto' }}>
              <option value="all">All Clients</option>
              {clientOptions.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <span style={{ fontSize: '11px', color: '#94a3b8', marginLeft: '8px', whiteSpace: 'nowrap' }}>
              {lastUpdated ? `Updated ${fmtUpdated(lastUpdated)}` : 'Loading…'}
            </span>
            <button
              type="button"
              onClick={() => onRefresh && onRefresh()}
              disabled={refreshing}
              title="Refresh data now"
              style={{ fontSize: '12px', padding: '6px 12px', borderRadius: '20px', background: T.pillInactive.bg, color: T.pillInactive.text, border: 'none', outline: 'none', cursor: refreshing ? 'wait' : 'pointer', display: 'inline-flex', alignItems: 'center', gap: '6px', opacity: refreshing ? 0.6 : 1, marginLeft: '4px' }}>
              <Icon name="refresh" size={12} />
              <span>{refreshing ? 'Refreshing…' : 'Refresh'}</span>
            </button>
          </FilterBar>

          {dateRange === 'custom' && (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-wrap items-center gap-3" style={{ fontSize: '12px' }}>
              <span className="text-slate-500 font-medium">Custom range:</span>
              <label className="text-slate-600 flex items-center gap-1">
                From
                <input type="date" value={customStart} max={customEnd || undefined}
                  onChange={e => setCustomStart(e.target.value)}
                  className="border border-slate-300 rounded px-2 py-1" />
              </label>
              <label className="text-slate-600 flex items-center gap-1">
                To
                <input type="date" value={customEnd} min={customStart || undefined} max={todayIso}
                  onChange={e => setCustomEnd(e.target.value)}
                  className="border border-slate-300 rounded px-2 py-1" />
              </label>
              <span className="text-slate-400 ml-auto">
                Showing {filtered.jobs.length} jobs · {filtered.quotes.length} quotes · {filtered.interactions.length} interactions
              </span>
            </div>
          )}

          {/* ── Live workload: always current, straight from the synced tasks ── */}
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
            <StatCard title="Open Tasks" value={workload.openCount} icon="briefcase" color="blue" sub={workload.noDateCount ? `${workload.noDateCount} with no date` : 'all dated'} onClick={() => setTaskListModal({ title: 'Open tasks', groups: [{ label: 'On your desk', tasks: byDue(workload.openTasks.filter(t => !isParked(t))) }, { label: 'Parked', note: 'Waiting, stalled or backlog. Not nagging.', tasks: byDue(workload.openTasks.filter(isParked)) }] })} />
            <StatCard title="Overdue" value={workload.overdueCount} icon="clock" color="slate" sub={workload.overdueParkedCount ? `plus ${workload.overdueParkedCount} parked · click to clean up` : 'part of the day to day · click to clean up'} onClick={() => setTaskListModal({ title: 'Overdue tasks', groups: [{ label: 'On your desk', tasks: byLate(workload.overdueLive) }, { label: 'Parked, past their original date', note: 'These sit in Waiting, Stalled or Backlog, so they are not nagging. Tick off what is finished, delete what is dead.', tasks: byLate(workload.overdueParked) }] })} />
            <StatCard title="Due Today" value={workload.dueTodayCount} icon="clock" color="yellow" sub="today" onClick={() => setTaskListModal({ title: 'Due today', groups: [{ label: 'Today', tasks: byDue(workload.dueTodayTasks) }] })} />
            <StatCard title="Due This Week" value={workload.dueWeekCount} icon="calendar" color="blue" sub="next 7 days" onClick={() => setTaskListModal({ title: 'Due this week', groups: [{ label: 'Overdue and the next 7 days', tasks: byDue(workload.dueWeekTasks) }] })} />
            {/* Blown deadlines. A passed deadline is a fact, unlike a priority somebody
                has to remember to set, so it gets a box on the front page. */}
            <StatCard title="Deadline Passed" value={workload.deadlineBlownCount} icon="alertTriangle" color={workload.deadlineBlownCount ? 'yellow' : 'green'} sub={workload.deadlineSoonCount ? `${workload.deadlineSoonCount} more due within 7 days` : `${workload.deadlineCount} deadline${workload.deadlineCount === 1 ? '' : 's'} set`} onClick={() => setTaskListModal({ title: 'Hard deadlines', groups: [{ label: 'Deadline passed', tasks: byLate(workload.deadlineBlownTasks) }, { label: 'Deadline within 7 days', tasks: byDue(workload.deadlineSoonTasks) }] })} />
            {/* Client promises: work promised to a client by a date given to them,
                now past that date. Someone outside the business is waiting on each one,
                so they get their own box instead of folding into the overdue count. */}
            <StatCard title="Client Promises" value={workload.promisesLateCount} icon="clock" color={workload.promisesLateCount ? 'yellow' : 'green'} sub={workload.promisesParkedLateCount ? `late on your desk · ${workload.promisesParkedLateCount} parked in waiting or stalled` : `late of ${workload.promiseCount} tracked`} onClick={() => setTaskListModal({ title: 'Client promises', groups: [{ label: 'Late on your desk', tasks: byLate(workload.promisesLate) }, { label: 'Parked past their date', note: 'The ball sits with the client or a supplier, or the thread has stalled.', tasks: byLate(workload.promisesParkedLate) }, { label: 'On track', tasks: byDue(workload.clientPromises.filter(t => !workload.promisesLate.includes(t) && !workload.promisesParkedLate.includes(t))) }] })} />
            {/* Tasks the daemon has already pushed three times, its limit. They no
                longer move on their own, so they need a decision from the operator. */}
            <StatCard title="Needs a Decision" value={workload.chasesSpentCount} icon="clock" color={workload.chasesSpentCount ? 'yellow' : 'green'} sub={workload.oldestLateDays ? `auto follow-up used up, oldest ${workload.oldestLateDays} days late` : 'auto follow-up used up'} onClick={() => setTaskListModal({ title: 'Needs a decision', groups: [{ label: 'Auto follow-up used up', note: 'The daemon pushed these three times and stopped. Only you can unstick them.', tasks: byLate(workload.chasesSpent) }] })} />
            <StatCard title="Active Clients" value={stats.activeClients} icon="building" color="green" sub={`${stats.pendingQuotes} quote${stats.pendingQuotes === 1 ? '' : 's'} pending`} onClick={() => onNavigate && onNavigate('clients')} />
          {/* One list window behind every stat card: the tasks that make
              the number, grouped, each row clicking through to the workload
              page and carrying Done / Delete for cleanup. */}
          <Modal isOpen={!!taskListModal} onClose={() => setTaskListModal(null)} title={taskListModal ? taskListModal.title : ''} size="xl">
            {taskListModal && (
              <div className="space-y-5">
                {taskListModal.groups.filter(g => g.tasks.length > 0).map(g => (
                  <div key={g.label}>
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">{g.label} ({g.tasks.length})</p>
                    {g.note && <p className="text-xs text-slate-400 mb-2">{g.note}</p>}
                    <div className="space-y-2">
                      {g.tasks.map(t => (
                        <OverdueCleanupRow key={t.id} t={t} clients={data.clients} readOnly={!!window.SPLATT_CONFIG.SNAPSHOT_URL}
                          onOpen={() => { setTaskListModal(null); onNavigate && onNavigate('workload', t.job || t.id); }} />
                      ))}
                    </div>
                  </div>
                ))}
                {taskListModal.groups.every(g => g.tasks.length === 0) && (
                  <p className="text-sm text-slate-400 text-center py-6">Nothing in this list right now.</p>
                )}
              </div>
            )}
          </Modal>

          </div>

          {/* ── Money in vs out ──────────────────────────────────────────
              Xero first, then the hand-entered records, then an explicit empty
              state. It never shows a zero it did not measure: a green $0 outstanding
              would read as "nobody owes anything" when nothing may have been loaded. */}
          <div>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-sm font-semibold text-slate-700">Money in vs out</h3>
              {moneySource === 'xero' && xeroMoney && (
                <span className="text-xs text-slate-400">
                  {/* The snapshot's age is shown with the figures, so an old balance is not
                      mistaken for today's. */}
                  from Xero · {ageLabel(xeroMoney.ageHours)}
                </span>
              )}
              {moneySource === 'records' && (
                <span className="text-xs text-slate-400">{money.unpaidInvoices} invoice{money.unpaidInvoices === 1 ? '' : 's'} unpaid · {money.unpaidBills} bill{money.unpaidBills === 1 ? '' : 's'} unpaid</span>
              )}
            </div>

            {moneySource === 'xero' && xeroMoney ? (
              <div>
                {xeroMoney.stale && (
                  <div className="mb-3 rounded-lg border border-amber-200 bg-amber-50 px-4 py-2">
                    <p className="text-xs text-amber-800">
                      These figures are {ageLabel(xeroMoney.ageHours)} and anything paid since is missing.
                      Ask Claude to capture Xero again.
                    </p>
                  </div>
                )}
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                  <StatCard title="Cash in bank" value={xeroMoney.cashMeasured ? money0(xeroMoney.cash) : '\u2014'} icon="dollar" color={xeroMoney.cashMeasured && xeroMoney.cash > 0 ? 'green' : 'slate'} sub={xeroMoney.cashMeasured ? 'across all accounts' : 'bank balance not captured from Xero yet'} />
                  <StatCard title="Owed to you" value={money0(xeroMoney.owedToYou)} icon="dollar" color={xeroMoney.owedToYou > 0 ? 'yellow' : 'green'} sub={xeroMoney.overdueToYou > 0 ? `${money0(xeroMoney.overdueToYou)} of it overdue` : 'none overdue'} />
                  <StatCard title="Bills to pay" value={money0(xeroMoney.owedByYou)} icon="dollar" color={xeroMoney.owedByYou > 0 ? 'yellow' : 'green'} sub={xeroMoney.overdueByYou > 0 ? `${money0(xeroMoney.overdueByYou)} of it overdue` : 'none overdue'} />
                  {/* Both halves of this one are complete, so unlike a net
                      position built from paid bills it is a real number. */}
                  {xeroMoney.cashMeasured && <StatCard title="Cash after bills" value={money0(xeroMoney.afterBills)} icon="dollar" color={xeroMoney.afterBills >= 0 ? 'green' : 'yellow'} sub="if all bills paid today" />}
                  <StatCard title="Received" value={money0(xeroMoney.received)} icon="dollar" color="blue" sub={`of ${money0(xeroMoney.invoiced)} invoiced`} />
                </div>
                {xeroMoney.note && (
                  <p className="text-xs text-slate-400 mt-2 max-w-prose">
                    There is no "paid out" figure here on purpose. {xeroMoney.note}
                  </p>
                )}
              </div>
            ) : moneySource === 'records' ? (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <StatCard title="Outstanding (in)" value={money0(money.outstanding)} icon="dollar" color={money.outstanding > 0 ? 'yellow' : 'green'} sub="owed to you" />
                <StatCard title="Received" value={money0(money.received)} icon="dollar" color="green" sub={`of ${money0(money.invoiced)} invoiced`} />
                <StatCard title="Owed (out)" value={money0(money.owed)} icon="alertTriangle" color={money.owed > 0 ? 'red' : 'green'} sub="bills to pay" />
                <StatCard title="Paid out" value={money0(money.paidOut)} icon="dollar" color="blue" sub={`of ${money0(money.billed)} billed`} />
                <StatCard title="Net position" value={money0(money.net)} icon="dollar" color={money.net >= 0 ? 'green' : 'red'} sub="received − paid out" />
                {money.unpriced > 0 && (
                  <div className="col-span-2 md:col-span-3 lg:col-span-5 px-4 py-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-xs">
                    {`${money.unpriced} line${money.unpriced === 1 ? ' is' : 's are'} in a foreign currency with no exchange rate, so they are not counted above.`}
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <p className="text-sm text-slate-500">
                  {clientFilter !== 'all'
                    ? 'No figures for this client.'
                    : 'No money figures to show yet.'}
                </p>
                <p className="text-xs text-slate-400 mt-1 max-w-prose">
                  {clientFilter !== 'all'
                    ? 'The Xero figures cover the whole company and cannot be split by client, so they are not shown here. Clear the client filter to see them.'
                    : (data.xero && data.xero.reason)
                      ? data.xero.reason + ' Until then this stays blank rather than showing $0, because $0 would look like everything is paid up.'
                      : 'Nothing has been read from Xero and no project financial lines have been recorded yet. This is deliberately blank rather than $0, because $0 would look like everything is paid up.'}
                </p>
              </div>
            )}
          </div>

          {/* ── Needs attention ──────────────────────────────────────────
              What the Xero checks say is missing or worth a second look. Each row
              shows how sure the check is, and the levels are styled differently:
              a lead is a reason to open Xero, not a confirmed fact. */}
          {data.xero && data.xero.findings_available && data.xero.findings.length > 0 && (
            <div>
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-semibold text-slate-700">Needs attention in Xero</h3>
                <span className="text-xs text-slate-400">
                  {data.xero.findings.length} thing{data.xero.findings.length === 1 ? '' : 's'}
                  {data.xero.total_amount_flagged > 0 && ` · ${money0(data.xero.total_amount_flagged)} attached`}
                </span>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 divide-y divide-slate-100">
                {data.xero.findings.map((f, i) => (
                  <div key={i} className="p-4 flex items-start gap-3">
                    <ConfidenceBadge level={f.confidence} />
                    <div className="min-w-0 flex-1">
                      <p className="text-sm font-medium text-slate-800">{f.title}</p>
                      <p className="text-xs text-slate-500 mt-0.5 max-w-prose">{f.detail}</p>
                    </div>
                    {f.amount > 0 && (
                      <span className="text-sm font-semibold text-slate-700 shrink-0 tabular-nums">{money0(f.amount)}</span>
                    )}
                  </div>
                ))}
              </div>
              <p className="text-xs text-slate-400 mt-2 max-w-prose">
                The total counts each invoice once, even when it trips more than one check,
                so it cannot grow larger than the money actually on the book.
              </p>
            </div>
          )}

          {/* The checks were run against a different snapshot, so they are withheld,
              and this note says so instead of leaving the panel looking clean. */}
          {data.xero && data.xero.available && !data.xero.findings_available && (
            <div className="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
              <p className="text-xs text-slate-500">
                No Xero checks are being shown. {data.xero.findings_reason}
              </p>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">Open Tasks by Due Date</h3>
              {workload.openCount === 0 ? (
                <p className="text-sm text-slate-400 text-center py-8">No open tasks</p>
              ) : (
                <SimpleBarChart data={workload.dueBuckets} />
              )}
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-1">Activity <span className="text-xs font-normal text-slate-400 ml-1">last 8 weeks</span></h3>
              <p className="text-xs text-slate-400 mb-4">Emails, calls &amp; notes logged per week</p>
              <WeeklyBars data={workload.activityWeeks} />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">Jobs by Status</h3>
              {stats.jobsByStatus.length === 0 ? (
                <p className="text-sm text-slate-400 text-center py-8">No jobs in range</p>
              ) : (
                <SimpleDonutChart data={stats.jobsByStatus} />
              )}
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">Interaction Types <span className="text-xs font-normal text-slate-400 ml-1">in range</span></h3>
              <SimpleBarChart data={[
                { name: 'Email', value: filtered.interactions.filter(i => (i.type || i.interaction_type) === 'email').length },
                { name: 'Call', value: filtered.interactions.filter(i => (i.type || i.interaction_type) === 'call').length },
                { name: 'Meeting', value: filtered.interactions.filter(i => (i.type || i.interaction_type) === 'meeting').length },
                { name: 'Note', value: filtered.interactions.filter(i => (i.type || i.interaction_type) === 'note').length },
              ]} />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Due This Week: real task due dates (overdue plus the next 7 days) */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-3">Due This Week <span className="text-xs font-normal text-slate-400 ml-1">overdue + next 7 days</span></h3>
              {workload.actionable.length === 0 ? (
                <p className="text-sm text-slate-400 text-center py-4">Nothing due this week</p>
              ) : (
                <div className="space-y-2">
                  {workload.actionable.slice(0, 7).map(t => {
                    const due = new Date(t.due_date);
                    const today = new Date();
                    const dd = Math.round((new Date(due.getFullYear(), due.getMonth(), due.getDate()) - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
                    const overdue = dd < 0;
                    return (
                      <div key={t.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100" onClick={() => onNavigate && onNavigate('workload', t.job || t.id)}>
                        <div className="min-w-0 flex-1">
                          <p className="text-sm font-medium text-slate-800 truncate">{t.content}</p>
                          {(() => {
                            const c = data.clients.find(x => x.id === t.client);
                            const internal = isInternalClient(c);
                            return (
                              <p className={`text-xs truncate ${internal ? '' : 'text-slate-400'}`}
                                style={internal ? { color: INTERNAL_TONE.text } : undefined}
                                >{internal ? 'Splatt NZ, my own work' : (c?.name || 'No client yet')}</p>
                            );
                          })()}
                        </div>
                        <span className={`text-xs font-semibold px-2 py-1 rounded-full flex-shrink-0 ml-2 ${overdue ? (lateTierOf(t) === 'attention' ? 'bg-red-100 text-red-700' : lateTierOf(t) === 'aging' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600') : dd <= 1 ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>
                          {overdue ? `${Math.abs(dd)}d late` : dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : `${dd}d`}
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Quotes Awaiting Response */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 className="text-sm font-semibold text-slate-700 mb-3">Quotes Awaiting Response</h3>
              {stats.quotesAwaiting.length === 0 ? (
                <p className="text-sm text-slate-400 text-center py-4">No quotes pending</p>
              ) : (
                <div className="space-y-2">
                  {stats.quotesAwaiting.slice(0, 6).map(q => {
                    const age = Math.ceil((new Date() - new Date(q.created)) / 86400000);
                    return (
                      <div key={q.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100" onClick={() => onNavigate && onNavigate('quotes', q.id)}>
                        <div className="min-w-0 flex-1">
                          <p className="text-sm font-medium text-slate-800 truncate">{q.title}</p>
                          <p className="text-xs text-slate-400">{data.clients.find(c => c.id === q.client)?.name || ''}</p>
                        </div>
                        <div className="text-right flex-shrink-0">
                          {q.amount > 0 && <p className="text-sm font-semibold text-emerald-600">${q.amount.toLocaleString()}</p>}
                          <p className={`text-[10px] ${age > 14 ? 'text-red-500' : age > 7 ? 'text-amber-500' : 'text-slate-400'}`}>{age}d ago</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h3 className="text-sm font-semibold text-slate-700 mb-4">Recent Activity</h3>
            <div className="space-y-2">
              {stats.recentInteractions.map((interaction, idx) => (
                <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                  <div className="flex items-center gap-3 min-w-0 flex-1">
                    <Icon name={getInteractionIcon(interaction.type || interaction.interaction_type)} className="text-slate-400 flex-shrink-0" size={16} />
                    <div className="min-w-0">
                      <p className="text-sm font-medium text-slate-800 truncate">{interaction.subject}</p>
                      <p className="text-xs text-slate-400">{new Date(interaction.date).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' })}</p>
                    </div>
                  </div>
                  <span className="text-[10px] px-2 py-1 bg-slate-100 rounded-full text-slate-500 flex-shrink-0">{interaction.type || interaction.interaction_type}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function SimpleDonutChart({ data }) {
      const total = data.reduce((sum, d) => sum + d.value, 0);
      const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#14b8a6', '#ec4899'];
      let currentAngle = 0;

      return (
        <svg width="100%" height="300" viewBox="0 0 300 300" style={{ maxWidth: '100%' }}>
          {data.map((item, idx) => {
            const sliceAngle = (item.value / total) * 360;
            const startAngle = currentAngle;
            const endAngle = currentAngle + sliceAngle;
            const color = colors[idx % colors.length];

            const startRad = (startAngle - 90) * Math.PI / 180;
            const endRad = (endAngle - 90) * Math.PI / 180;

            const x1 = 150 + 90 * Math.cos(startRad);
            const y1 = 150 + 90 * Math.sin(startRad);
            const x2 = 150 + 90 * Math.cos(endRad);
            const y2 = 150 + 90 * Math.sin(endRad);

            const largeArc = sliceAngle > 180 ? 1 : 0;

            const path = `M 150 150 L ${x1} ${y1} A 90 90 0 ${largeArc} 1 ${x2} ${y2} Z`;

            currentAngle += sliceAngle;

            return (
              <g key={idx}>
                <path d={path} fill={color} />
                <text x="150" y="150" textAnchor="middle" dy="5" fontSize="12" fontWeight="bold" fill="white">
                  {Math.round((item.value / total) * 100)}%
                </text>
              </g>
            );
          })}

          {/* Center circle for donut effect */}
          <circle cx="150" cy="150" r="60" fill="#161b28" />
        </svg>
      );
    }

    function SimpleBarChart({ data }) {
      const max = Math.max(...data.map(d => d.value), 1);
      return (
        <div className="space-y-4">
          {data.map((item, idx) => (
            <div key={idx}>
              <div className="flex justify-between mb-1">
                <span className="text-sm font-medium text-slate-700">{item.name}</span>
                <span className="text-sm text-slate-500">{item.value}</span>
              </div>
              <div className="w-full rounded-full h-2" style={{ background: 'linear-gradient(160deg, rgba(255,255,255,0.102) 0%, rgba(255,255,255,0.027) 100%)' }}>
                <div
                  className="bg-blue-500 h-2 rounded-full transition-all"
                  style={{ width: `${(item.value / max) * 100}%` }}
                ></div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function WeeklyBars({ data }) {
      const max = Math.max(...data.map(d => d.value), 1);
      return (
        <div className="flex items-end justify-between gap-1" style={{ height: 150 }}>
          {data.map((d, i) => (
            <div key={i} className="flex flex-col items-center justify-end flex-1" style={{ height: '100%' }}>
              <span className="text-[10px] text-slate-400 mb-1">{d.value}</span>
              <div className="w-full rounded-t transition-all" style={{ height: `${(d.value / max) * 100}%`, minHeight: d.value > 0 ? 4 : 0, background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #64748b' }}></div>

    // How old the Xero snapshot is, in words. Kept vague on purpose past a
    // day, because the exact hour count stops mattering once the answer is
    // "old enough to be wrong" and a precise number invites false comfort.
    function ageLabel(hours) {
      if (hours === null || hours === undefined) return 'of unknown age';
      if (hours < 1) return 'from minutes ago';
      if (hours < 2) return 'about an hour old';
      if (hours < 24) return `about ${Math.round(hours)} hours old`;
      const days = Math.round(hours / 24);
      return days === 1 ? 'about a day old' : `about ${days} days old`;
    }

    // How sure a Xero finding is. "Certain" is read straight off the data; a
    // "lead" cannot be settled without opening Xero. The levels are styled
    // apart so the two are never confused.
    function ConfidenceBadge({ level }) {
      const styles = {
        certain: { cls: 'bg-red-50 text-red-700 border-red-200', label: 'certain' },
        likely: { cls: 'bg-amber-50 text-amber-700 border-amber-200', label: 'likely' },
        lead: { cls: 'bg-slate-100 text-slate-500 border-slate-200', label: 'worth a look' },
      };
      const s = styles[level] || styles.lead;
      return (
        <span className={`shrink-0 text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded border ${s.cls}`}>
          {s.label}
        </span>
      );
    }

    function StatCard({ title, value, icon, color, sub, onClick }) {
      const colorClasses = {
        blue: 'bg-blue-50 text-blue-600',
        green: 'bg-green-50 text-green-600',
        yellow: 'bg-yellow-50 text-yellow-600',
        purple: 'bg-purple-50 text-purple-600',
        red: 'bg-red-50 text-red-600',
        slate: 'bg-slate-100 text-slate-500',
      };

      return (
        <div className={`bg-white rounded-lg shadow-sm p-6${onClick ? ' cursor-pointer hover:shadow-md transition-shadow' : ''}`} onClick={onClick}>
          <div className="flex items-center justify-between">
            <div className="min-w-0">
              <p className="text-sm text-slate-600 font-medium">{title}</p>
              <p className="text-3xl font-bold text-slate-900 mt-2 truncate">{value}</p>
              {sub && <p className="text-xs text-slate-400 mt-1 truncate">{sub}</p>}
            </div>
            <div className={`p-3 rounded-lg ${colorClasses[color]}`}>
              <Icon name={icon} size={24} />
            </div>
          </div>
        </div>
      );
    }

    function getInteractionIcon(type) {
      switch (type) {
        case 'email':
          return 'mail';
        case 'call':
          return 'phone';
        case 'meeting':
          return 'calendar';
        default:
          return 'message';
      }

    // ============================================================================
    // CLIENTS PAGE: every client, with search and status filter pills. A
    // client expands in place to show its details, with add, edit and delete.
    // #clients/<id> opens one directly.
    // ============================================================================

    function ClientsPage({ data, showToast, focusId, onFocusChange }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [sortBy, setSortBy] = useState('name');
      const [newToday, setNewToday] = useState(false);
      const [changedToday, setChangedToday] = useState(false);
      const [expandedClient, setExpandedClient] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);

      // Permalink: expand the client named in the URL (#clients/<id>).
      // data.clients loads asynchronously, so this re-runs when the data arrives.
      const clientFocusHandled = useRef(false);
      useEffect(() => {
        if (!focusId) { clientFocusHandled.current = false; return; }
        if (expandedClient === focusId) { clientFocusHandled.current = true; return; }
        if ((data.clients || []).some(c => c.id === focusId)) { setExpandedClient(focusId); clientFocusHandled.current = true; }
      }, [focusId, data.clients]);
      // Report the expanded client up so the URL + Copy-link button track it.
      // Don't clear the URL id while we're still waiting for a deep link to open.
      useEffect(() => {
        if (!onFocusChange) return;
        if (expandedClient) { onFocusChange(expandedClient); return; }
        if (!focusId || clientFocusHandled.current) onFocusChange(null);
      }, [expandedClient]);
      const [formData, setFormData] = useState({
        name: '',
        email_addresses: '',
        phone: '',
        address: '',
        status: 'active',
      });

      const filteredClients = useMemo(() => {
        let list = data.clients.filter(c => {
          const matchesSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (c.email_addresses && c.email_addresses.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchesStatus = statusFilter === 'paid'
            ? data.jobs.some(j => j.client === c.id && j.paid)
            : (statusFilter === 'all' || c.status === statusFilter);
          if (newToday && !isToday(c.created)) return false;
          if (changedToday && !(isToday(c.updated) && c.updated !== c.created)) return false;
          return matchesSearch && matchesStatus;
        });
        if (sortBy === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
        else if (sortBy === 'recent') list.sort((a, b) => new Date(b.updated) - new Date(a.updated));
        else if (sortBy === 'jobs') list.sort((a, b) => data.jobs.filter(j => j.client === b.id).length - data.jobs.filter(j => j.client === a.id).length);
        return list;
      }, [data.clients, data.jobs, searchTerm, statusFilter, sortBy, newToday, changedToday]);

      const handleOpenModal = (client = null) => {
        if (client) {
          setEditingClient(client);
          setFormData({
            name: client.name,
            email_addresses: client.email_addresses || '',
            phone: client.phone || '',
            address: client.address || '',
            status: client.status,
          });
        } else {
          setEditingClient(null);
          setFormData({ name: '', email_addresses: '', phone: '', address: '', status: 'active' });
        }
        setShowModal(true);
      };

      const handleSave = async () => {
        if (!formData.name.trim()) {
          showToast('Name is required', 'error');
          return;
        }

        try {
          if (editingClient) {
            await fetchAPI(`/collections/clients/records/${editingClient.id}`, {
              method: 'PATCH',
              body: JSON.stringify(formData),
            });
            showToast('Client updated successfully');
          } else {
            await fetchAPI('/collections/clients/records', {
              method: 'POST',
              body: JSON.stringify(formData),
            });
            showToast('Client created successfully');
          }
          setShowModal(false);
          softRefresh();
        } catch (error) {
          showToast('Error saving client', 'error');
        }
      };

      const handleDelete = async () => {
        try {
          await fetchAPI(`/collections/clients/records/${confirmDelete}`, { method: 'DELETE' });
          showToast('Client deleted successfully');
          setConfirmDelete(null);
          softRefresh();
        } catch (error) {
          showToast('Error deleting client', 'error');
        }
      };

      const getClientContacts = (clientId) => data.contacts.filter(c => c.client_id === clientId);
      const getClientJobs = (clientId) => data.jobs.filter(j => j.client_id === clientId);
      const getClientQuotes = (clientId) => data.quotes.filter(q => q.client_id === clientId);

      const clientPills = [
        { key: 'all', label: 'All', count: data.clients.length },
        { key: 'active', label: 'Active', count: data.clients.filter(c => c.status === 'active').length },
        { key: 'inactive', label: 'Inactive', count: data.clients.filter(c => c.status === 'inactive').length },
        { key: 'paid', label: 'Paid', count: data.clients.filter(c => data.jobs.some(j => j.client === c.id && j.paid)).length },
      ];

      return (
        <div className="space-y-6">
          <FilterBar searchTerm={searchTerm} onSearchChange={setSearchTerm} placeholder="Search clients..." pills={clientPills} activePill={statusFilter} onPillChange={setStatusFilter}>
            <TodayFilters items={data.clients} newToday={newToday} setNewToday={setNewToday} changedToday={changedToday} setChangedToday={setChangedToday} />
            <select value={sortBy} onChange={e => setSortBy(e.target.value)}
              style={{ fontSize: '12px', padding: '6px 14px', borderRadius: '20px', background: T.pillInactive.bg, color: T.pillInactive.text, border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="name">Sort: Name</option>
              <option value="recent">Sort: Recent</option>
              <option value="jobs">Sort: Most Jobs</option>
            </select>
            <button
              onClick={() => handleOpenModal()}
              className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2 ml-auto"
            >
              <Icon name="plus" size={18} />
              New Client
            </button>
          </FilterBar>

          <div className="space-y-3">
            {filteredClients.map(client => (
              <div key={client.id} className="bg-white rounded-lg shadow-sm overflow-hidden">
                <button
                  onClick={() => setExpandedClient(expandedClient === client.id ? null : client.id)}
                  className="w-full p-4 flex items-center justify-between hover:bg-slate-50"
                  data-result="true" tabIndex={0}
                >
                  <div className="flex items-center gap-3">
                    <Icon name="building" className="text-slate-600" />
                    <div className="text-left">
                      <p className="font-semibold text-slate-900">{client.name}</p>
                      <p className="text-sm text-slate-500">{client.email_addresses}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    {!client.address && <span className="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-amber-100 text-amber-700 border border-amber-200" title="No address — projects won't appear on map">No address</span>}
                    <span className={`px-3 py-1 text-xs font-semibold rounded-full ${
                      client.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'
                    }`}>
                      {client.status}
                    </span>
                    <Icon name={expandedClient === client.id ? 'chevronDown' : 'chevronRight'} className="text-slate-400" />
                  </div>
                </button>

                {expandedClient === client.id && (
                  <div className="bg-slate-50 p-4 border-t border-slate-200 space-y-4">
                    <div className="grid grid-cols-3 gap-4">
                      <div>
                        <p className="text-xs text-slate-600 font-semibold">Email</p>
                        <p className="text-slate-900">{client.email_addresses || '-'}</p>
                      </div>
                      <div>
                        <p className="text-xs text-slate-600 font-semibold">Phone</p>
                        <p className="text-slate-900">{client.phone || '-'}</p>
                      </div>
                      <div>
                        <p className="text-xs text-slate-600 font-semibold">Address</p>
                        <p className={`text-sm ${client.address ? 'text-slate-900' : 'text-amber-600 italic'}`}>{client.address || 'Not set'}</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-4">
                      <div className="bg-white p-3 rounded-lg">
                        <p className="text-xs text-slate-600 font-semibold">Contacts</p>
                        <p className="text-xl font-bold text-slate-900">{getClientContacts(client.id).length}</p>
                      </div>
                      <div className="bg-white p-3 rounded-lg">
                        <p className="text-xs text-slate-600 font-semibold">Jobs</p>
                        <p className="text-xl font-bold text-slate-900">{getClientJobs(client.id).length}</p>
                      </div>
                      <div className="bg-white p-3 rounded-lg">
                        <p className="text-xs text-slate-600 font-semibold">Quotes</p>
                        <p className="text-xl font-bold text-slate-900">{getClientQuotes(client.id).length}</p>
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => handleOpenModal(client)}
                        className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm"
                      >
                        <Icon name="edit" size={16} />
                        Edit
                      </button>
                      <button
                        onClick={() => setConfirmDelete(client.id)}
                        className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm"
                      >
                        <Icon name="trash" size={16} />
                        Delete
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title={editingClient ? 'Edit Client' : 'New Client'} size="md">
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Client Name</label>
                <input
                  type="text"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input
                  type="email"
                  value={formData.email_addresses}
                  onChange={(e) => setFormData({ ...formData, email_addresses: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                <input
                  type="tel"
                  value={formData.phone}
                  onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Address</label>
                <textarea
                  value={formData.address}
                  onChange={(e) => setFormData({ ...formData, address: e.target.value })}

                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"

              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Status</label>

          <ConfirmModal

            message="Are you sure you want to delete this client? This action cannot be undone."
          />
        </div>
      );
    }

                  type="text"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input
                  type="email"
                  value={formData.email}
                  onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                <input
                  type="tel"
                  value={formData.phone}
                  onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Role</label>
                <input
                  type="text"
                  value={formData.role}
                  onChange={(e) => setFormData({ ...formData, role: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Client</label>
                <select
                  value={formData.client_id}
                  onChange={(e) => setFormData({ ...formData, client_id: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option value="">Select a client</option>
                  {data.clients.map(client => (
                    <option key={client.id} value={client.id}>{client.name}</option>
                  ))}
                </select>
              </div>
              <div className="flex gap-3 justify-end pt-4">
                <button onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
              </div>
            </div>
          </Modal>

          <ConfirmModal
            isOpen={!!confirmDelete}
            onConfirm={handleDelete}
            onCancel={() => setConfirmDelete(null)}
            title="Delete Contact"
            message="Are you sure you want to delete this contact?"
          />
        </div>
      );
    }

    // ============================================================================
    // CLIENT DETAIL VIEW: one client's header, stats, projects, open tasks,
    // recent activity and contacts. Opened from the Projects, Planner and
    // Timeline pages when a client name is clicked.
    // ============================================================================

    function ClientDetailView({ client, data, showToast, onBack, onSelectProject, onNavigate }) {
      const clientJobs = data.jobs.filter(j => j.client === client.id);
      const clientQuotes = data.quotes.filter(q => q.client === client.id);
      const clientContacts = data.contacts.filter(c => c.client === client.id);
      const clientInteractions = data.interactions.filter(i => i.client === client.id).sort((a, b) => new Date(b.date) - new Date(a.date));
      const clientTasks = (data.assignments || []).filter(t => t.client === client.id && t.status !== 'completed');
      const totalValue = clientJobs.reduce((s, j) => s + (j.value || 0), 0);
      const activeJobs = clientJobs.filter(j => isPipelineStatus(j.status));
      const completedJobs = clientJobs.filter(j => STATUS_GROUPS.closed.includes(j.status));
      const overdueJobs = clientJobs.filter(j => j.due_date && new Date(j.due_date) < new Date() && countsTowardWorkload(j));

      const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

      const critical = isClientCritical(client);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>

            onMouseEnter={e => e.currentTarget.style.color = T.blue}
            onMouseLeave={e => e.currentTarget.style.color = T.textMuted}>

            <div role="alert" style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', padding: '14px 18px', borderRadius: '12px', background: 'linear-gradient(160deg, rgba(239,68,68,0.136) 0%, rgba(239,68,68,0.036) 100%)', border: '1px solid rgba(239,68,68,0.35)', boxShadow: '0 0 0 1px rgba(239,68,68,0.08) inset' }}>
              <div style={{ flexShrink: 0, width: '8px', height: '8px', borderRadius: '50%', background: 'linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 55%, rgba(0,0,0,0.06) 100%), #f87171', marginTop: '6px', boxShadow: '0 0 0 4px rgba(239,68,68,0.18)' }} />

                      onMouseEnter={e => e.currentTarget.style.background = 'linear-gradient(160deg, rgba(255,255,255,0.068) 0%, rgba(255,255,255,0.018) 100%)'}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
