                                <div style={{ padding: '6px 14px 3px', fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em', borderTop: `1px solid ${T.borderSubtle}`, marginTop: '2px' }}>
                                  {dir}/
                                </div>
                                {allFiles.filter(e => e.parentDir === dir).map(entry => (
                                  <div key={dir + '/' + entry.name} onClick={() => openFile(entry)}
                                    style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '7px 14px 7px 22px', cursor: 'pointer', transition: 'background 0.1s' }}
                                    onMouseEnter={e => e.currentTarget.style.background = T.cardHoverGradient}
                                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                                    <span style={{ color: fileIconColor(entry.extension), flexShrink: 0 }}>
                                      {React.cloneElement(fileIcon(entry.extension), { width: 16, height: 16 })}
                                    </span>
                                    <div style={{ flex: 1, minWidth: 0 }}>
                                      <div style={{ fontSize: '12px', color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{entry.name}</div>
                                      <div style={{ fontSize: '10px', color: T.textMuted }}>{fmtBytes(entry.size)}</div>
                                    </div>
                                    <span style={{ color: T.textMuted, flexShrink: 0 }}>{React.cloneElement(icons.link, { width: 12, height: 12 })}</span>
                                  </div>
                                ))}
                              </React.Fragment>
                            ))}
                          </React.Fragment>
                        );
                      })()}
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // PUBLISH PAGE (#publish, local copy only)
    // ============================================================================
    // One button that runs bin/publish-dashboard on the files server, which
    // rebuilds the hosted read-only snapshot, plus the history of every run
    // underneath it. The history is read from the publish_log collection, one
    // row per run, so it can be sorted and counted. While a run is going, its
    // live output is shown as well.
    function PublishPage({ showToast }) {
      const [runs, setRuns] = React.useState([]);
      const [status, setStatus] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [starting, setStarting] = React.useState(false);
      const [open, setOpen] = React.useState(null);

      const loadRuns = React.useCallback(() => {
        fetch(PB_URL + '/api/collections/publish_log/records?perPage=50&sort=-started')
          .then(r => r.json())
          .then(d => { setRuns(d.items || []); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const loadStatus = React.useCallback(() => {
        fetch(FILES_URL + '/api/publish/status')
          .then(r => r.json()).then(setStatus).catch(() => setStatus(null));
      }, []);

      React.useEffect(() => { loadRuns(); loadStatus(); }, [loadRuns, loadStatus]);

      // Two second polling, but only while something is running, so the page is
      // idle the rest of the time.
      const running = !!(status && status.running);
      React.useEffect(() => {
        if (!running) return;
        const t = setInterval(() => { loadStatus(); loadRuns(); }, 2000);
        return () => clearInterval(t);
      }, [running, loadStatus, loadRuns]);

      // The moment a run stops, pull the history once more so the row that
      // said running becomes its final result without a manual refresh.
      const wasRunning = React.useRef(false);
      React.useEffect(() => {
        if (wasRunning.current && !running) { loadRuns(); loadStatus(); }
        wasRunning.current = running;
      }, [running, loadRuns, loadStatus]);

      const publish = () => {
        setStarting(true);
        fetch(FILES_URL + '/api/publish', { method: 'POST' })
          .then(async r => {
            const body = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(body.detail || body.error || ('HTTP ' + r.status));
            showToast('Publishing. This takes about a minute.', 'success');
            setTimeout(() => { loadStatus(); loadRuns(); }, 600);
          })
          .catch(e => showToast(e.message, 'error'))
          .finally(() => setStarting(false));
      };

      const ago = (iso) => {
        if (!iso) return '';
        const s = Math.floor((Date.now() - new Date(String(iso).replace(' ', 'T')).getTime()) / 1000);
        if (s < 0) return 'just now';
        if (s < 60) return s + 's ago';
        if (s < 3600) return Math.floor(s / 60) + 'm ago';
        if (s < 86400) return Math.floor(s / 3600) + 'h ago';
        return Math.floor(s / 86400) + 'd ago';
      };
      const when = (iso) => {
        if (!iso) return '';
        const d = new Date(String(iso).replace(' ', 'T'));
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('en-NZ', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      };
      const dur = (n) => (n === null || n === undefined) ? '' : n < 60 ? n + 's' : Math.floor(n / 60) + 'm ' + (n % 60) + 's';
      const mb = (kb) => !kb ? '' : kb < 1024 ? kb + ' KB' : (kb / 1024).toFixed(1) + ' MB';
      const clean = (t) => String(t || '').replace(/\[[0-9;]*m/g, '');

      const statusColour = { success: T.green, failed: '#ef4444', running: '#f59e0b' };
      const lastGood = runs.find(r => r.status === 'success');
      const lastRun = runs[0];

      // Fresh enough to trust. Anything older than half a day means the hosted
      // copy predates the most recent day's work.
      const staleHours = lastGood
        ? (Date.now() - new Date(String(lastGood.finished || lastGood.started).replace(' ', 'T')).getTime()) / 3600000
        : null;
      const freshness = staleHours === null ? { colour: T.textMuted, headline: 'The hosted copy has never been published' }
        : staleHours < 2 ? { colour: T.green, headline: 'The hosted copy is current' }
        : staleHours < 12 ? { colour: '#f59e0b', headline: 'The hosted copy is a few hours behind' }
        : { colour: '#ef4444', headline: 'The hosted copy is out of date' };

      const card = { background: T.cardGradient, border: '1px solid ' + T.border, borderRadius: '12px' };
      const th = { textAlign: 'left', padding: '8px 12px', fontSize: '11px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.04em', borderBottom: '1px solid ' + T.border };
      const td = { padding: '9px 12px', fontSize: '12px', color: T.text, borderBottom: '1px solid ' + T.border };

      if (loading) return <div style={{ padding: '40px', textAlign: 'center', color: T.textSecondary }}>Loading publish history...</div>;

      const scheduled = runs.some(r => r.trigger === 'cron');
      const blocked = !!(status && status.can_publish === false);
      const busy = running || starting || blocked;

      return (
        <div>
          <h2 style={{ fontSize: '18px', fontWeight: 700, color: T.text, marginBottom: '8px' }}>Publish</h2>
          <div style={{ fontSize: '12px', color: T.textMuted, marginBottom: '16px', maxWidth: '780px', lineHeight: 1.55 }}>
            The hosted copy is a frozen file, not a live page. It shows whatever the last publish put there and nothing changes it in between. Publishing rebuilds that file from PocketBase and uploads it, which takes about a minute. A publish only reads, so it can never change PocketBase, Todoist or Xero, and it is always safe to press.
          </div>

          <div style={{ ...card, padding: '18px 20px', marginBottom: '18px', display: 'flex', alignItems: 'center', gap: '20px', flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: '280px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{ width: '9px', height: '9px', borderRadius: '50%', background: freshness.colour, boxShadow: '0 0 8px ' + freshness.colour + '66' }} />
                <span style={{ fontSize: '15px', fontWeight: 700, color: T.text }}>{freshness.headline}</span>
              </div>
              <div style={{ fontSize: '12px', color: T.textSecondary, marginTop: '8px', lineHeight: 1.6 }}>
                {lastGood ? (
                  <span>
                    Last published <strong style={{ color: T.text }}>{ago(lastGood.finished || lastGood.started)}</strong>, {when(lastGood.finished || lastGood.started)}.
                    {' '}It carries {lastGood.records ? lastGood.records.toLocaleString() : '?'} records across {lastGood.collections || '?'} collections{lastGood.size_kb ? ', ' + mb(lastGood.size_kb) + ' on the wire' : ''}.
                  </span>
                ) : 'No successful publish has been recorded yet.'}
              </div>
              {lastRun && lastRun.status === 'failed' && (
                <div style={{ fontSize: '12px', color: '#ef4444', marginTop: '6px' }}>
                  The most recent attempt failed {ago(lastRun.finished || lastRun.started)}: {lastRun.error || 'see the output below'}
                </div>
              )}
              {lastGood && lastGood.deploy_url && (
                <a href={lastGood.deploy_url} target="_blank" rel="noopener"
                  style={{ fontSize: '12px', color: T.accent, textDecoration: 'none', marginTop: '6px', display: 'inline-block' }}>
                  Open the hosted copy
                </a>
              )}
            </div>
            <div style={{ textAlign: 'right' }}>
              <button onClick={publish} disabled={busy}
                title={blocked ? 'Publishing can only be started on the machine that runs the dashboard' : 'Rebuild the snapshot and upload it'}
                style={{
                  padding: '12px 22px', fontSize: '13px', fontWeight: 700, borderRadius: '10px', border: 'none',
                  cursor: busy ? 'not-allowed' : 'pointer',
                  background: busy ? T.border : 'linear-gradient(150deg, ' + T.accent + ', ' + (T.accentStrong || T.accent) + ')',
                  color: busy ? T.textMuted : '#fff',
                }}>
                {running ? 'Publishing...' : starting ? 'Starting...' : 'Publish now'}
              </button>
              <div style={{ fontSize: '11px', color: T.textMuted, marginTop: '8px', maxWidth: '230px' }}>
                {blocked
                  ? 'Only from the machine that runs the dashboard.'
                  : running
                    ? 'Running now. The output is below.'
                    : scheduled
                      ? 'It also runs on its own, on a schedule.'
                      : ''}
              </div>
            </div>
          </div>

          {status && status.lines && status.lines.length > 0 && (
            <div style={{ ...card, marginBottom: '18px', overflow: 'hidden' }}>
              <div style={{ padding: '9px 14px', borderBottom: '1px solid ' + T.border, fontSize: '12px', fontWeight: 600, color: T.text }}>
                {running ? 'Running now' : 'Output of the last run'}
              </div>
              <pre style={{ margin: 0, padding: '12px 14px', maxHeight: '260px', overflow: 'auto', fontSize: '11px', lineHeight: 1.5, fontFamily: 'monospace', color: T.textSecondary, whiteSpace: 'pre-wrap' }}>
                {clean(status.lines.join('\n'))}
              </pre>
            </div>
          )}

          <div style={{ ...card, overflow: 'hidden' }}>
            <div style={{ padding: '10px 14px', borderBottom: '1px solid ' + T.border, display: 'flex', alignItems: 'center' }}>
              <div style={{ fontSize: '13px', fontWeight: 600, color: T.text, flex: 1 }}>Every publish, newest first</div>
              <button onClick={() => { loadRuns(); loadStatus(); }}
                style={{ background: 'transparent', border: '1px solid ' + T.border, color: T.textSecondary, borderRadius: '8px', padding: '5px 11px', fontSize: '12px', cursor: 'pointer' }}>
                Refresh
              </button>
            </div>
            {runs.length === 0 ? (
              <div style={{ padding: '28px', textAlign: 'center', fontSize: '12px', color: T.textMuted }}>
                Nothing here yet. The first publish you run from this page will be the first row.
              </div>
            ) : (
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr>
                    <th style={th}>When</th>
                    <th style={th}>Result</th>
                    <th style={th}>Started by</th>
                    <th style={th}>Data as of</th>
                    <th style={th}>Records</th>
                    <th style={th}>Size</th>
                    <th style={th}>Took</th>
                  </tr>
                </thead>
                <tbody>
                  {runs.map(r => {
                    const expandable = !!(r.error || (r.output && r.output.trim()));
                    return (
                      <React.Fragment key={r.id}>
                        <tr onClick={() => expandable && setOpen(open === r.id ? null : r.id)}
                          style={{ cursor: expandable ? 'pointer' : 'default' }}>
                          <td style={td}>
                            {when(r.started)}
                            <span style={{ color: T.textMuted, marginLeft: '6px' }}>{ago(r.started)}</span>
                          </td>
                          <td style={td}>
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', color: statusColour[r.status] || T.textMuted, fontWeight: 600 }}>
                              <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: statusColour[r.status] || T.textMuted }} />
                              {r.status}
                            </span>
                          </td>
                          <td style={{ ...td, color: T.textSecondary }}>{r.trigger || ''}</td>
                          <td style={{ ...td, color: T.textSecondary, fontSize: '11px' }}>{when(r.snapshot_at)}</td>
                          <td style={{ ...td, color: T.textSecondary }}>{r.records ? r.records.toLocaleString() : ''}</td>
                          <td style={{ ...td, color: T.textSecondary }}>{mb(r.size_kb)}</td>
                          <td style={{ ...td, color: T.textSecondary }}>{dur(r.duration_s)}</td>
                        </tr>
                        {open === r.id && (
                          <tr>
                            <td colSpan={7} style={{ ...td, background: T.bg, padding: '12px 14px' }}>
                              {r.error && <div style={{ color: '#ef4444', fontSize: '12px', marginBottom: '8px' }}>{r.error}</div>}
                              {r.deploy_url && <div style={{ marginBottom: '8px' }}><a href={r.deploy_url} target="_blank" rel="noopener" style={{ color: T.accent, fontSize: '12px', textDecoration: 'none' }}>{r.deploy_url}</a></div>}
                              <pre style={{ margin: 0, maxHeight: '240px', overflow: 'auto', fontSize: '11px', lineHeight: 1.5, fontFamily: 'monospace', color: T.textSecondary, whiteSpace: 'pre-wrap' }}>
                                {clean(r.output)}
                              </pre>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // LOGS PAGE: the log files the files server exposes (daemon loop, servers),
    // with a tail of the selected one and an optional auto-refresh.
    // ============================================================================
    function LogsPage({ showToast }) {
      const [logs, setLogs] = React.useState([]);
      const [sel, setSel] = React.useState(null);
      const [tail, setTail] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [lineCount, setLineCount] = React.useState(200);
      const [auto, setAuto] = React.useState(false);

      const loadList = React.useCallback(() => {
        fetch(FILES_URL + '/api/logs')
          .then(r => r.json())
          .then(d => { setLogs(d); setLoading(false); if (!sel && d.length) setSel(d[0].file); })
          .catch(() => setLoading(false));
      }, [sel]);

      const loadTail = React.useCallback((file, n) => {
        if (!file) return;
        fetch(`${FILES_URL}/api/logs/tail?name=${encodeURIComponent(file)}&lines=${n}`)
          .then(r => r.json()).then(setTail).catch(() => setTail(null));
      }, []);

      React.useEffect(() => { loadList(); }, []);
      React.useEffect(() => { loadTail(sel, lineCount); }, [sel, lineCount, loadTail]);

      // Auto-refresh is off by default: a log that reloads while you are reading
      // it scrolls the line you were looking at off the screen.
      React.useEffect(() => {
        if (!auto) return;
        const t = setInterval(() => { loadList(); loadTail(sel, lineCount); }, 10000);
        return () => clearInterval(t);
      }, [auto, sel, lineCount, loadList, loadTail]);

      const ago = (ms) => {
        if (!ms) return 'never';
        const s = Math.floor((Date.now() - ms) / 1000);
        if (s < 60) return s + 's ago';
        if (s < 3600) return Math.floor(s / 60) + 'm ago';
        if (s < 86400) return Math.floor(s / 3600) + 'h ago';
        return Math.floor(s / 86400) + 'd ago';
      };
      const size = (b) => b === null ? '' : b < 1024 ? b + ' B'
        : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

      // Fresh means something wrote to it in the last 5 minutes. Only
      // meaningful for the loop and the server, which write constantly.
      const isLive = (l) => l.mtime && (Date.now() - l.mtime) < 300000;

      if (loading) return <div style={{ padding: '40px', textAlign: 'center', color: T.textSecondary }}>Loading logs...</div>;

      const current = logs.find(l => l.file === sel);

      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
            <h2 style={{ fontSize: '18px', fontWeight: 700, color: T.text, flex: 1 }}>Logs</h2>
            <label style={{ fontSize: '12px', color: T.textSecondary, display: 'flex', alignItems: 'center', gap: '6px', cursor: 'pointer' }}>
              <input type="checkbox" checked={auto} onChange={e => setAuto(e.target.checked)} />
              auto refresh 10s
            </label>
            <button onClick={() => { loadList(); loadTail(sel, lineCount); }}
              style={{ background: T.cardGradient, border: `1px solid ${T.border}`, color: T.text, borderRadius: '8px', padding: '6px 12px', fontSize: '12px', cursor: 'pointer' }}>
              Refresh
            </button>
          </div>
          <div style={{ fontSize: '12px', color: T.textMuted, marginBottom: '16px' }}>
            Everything on this page is written by the local services, under <code>logs/</code> in the repo. A green dot means something wrote to that file in the last 5 minutes.
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'minmax(260px, 340px) 1fr', gap: '16px', alignItems: 'start' }}>
            <div>
              {logs.map(l => (
                <div key={l.file} onClick={() => setSel(l.file)}
                  style={{
                    background: sel === l.file ? T.accentSoft || T.cardGradient : T.cardGradient,
                    border: `1px solid ${sel === l.file ? T.accent : T.border}`,
                    borderRadius: '10px', padding: '10px 12px', marginBottom: '8px', cursor: 'pointer',
                  }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <span style={{ width: '8px', height: '8px', borderRadius: '50%', flexShrink: 0,
                      background: isLive(l) ? '#22c55e' : (l.exists ? T.textMuted : '#ef4444') }} />
                    <span style={{ fontSize: '13px', fontWeight: 600, color: T.text, flex: 1 }}>{l.label}</span>
                    <span style={{ fontSize: '11px', color: T.textMuted }}>{ago(l.mtime)}</span>
                  </div>
                  <div style={{ fontSize: '11px', color: T.textMuted, marginTop: '4px', fontFamily: 'monospace' }}>
                    {l.file} · {l.exists ? size(l.size) : 'not created yet'}
                  </div>
                  <div style={{ fontSize: '11px', color: T.textSecondary, marginTop: '6px', lineHeight: 1.45 }}>
                    <strong style={{ color: T.text }}>Written by:</strong> {l.writer}
                  </div>
                  <div style={{ fontSize: '11px', color: T.textSecondary, marginTop: '4px', lineHeight: 1.45 }}>
                    {l.what}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '12px', overflow: 'hidden' }}>
              <div style={{ padding: '10px 14px', borderBottom: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: '13px', fontWeight: 600, color: T.text }}>{current ? current.label : ''}</div>
                  <div style={{ fontSize: '11px', color: T.textMuted, fontFamily: 'monospace' }}>logs/{sel}</div>
                </div>
                <select value={lineCount} onChange={e => setLineCount(parseInt(e.target.value, 10))}
                  style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: '6px', padding: '4px 8px', fontSize: '12px' }}>
                  <option value={100}>last 100</option>
                  <option value={200}>last 200</option>
                  <option value={500}>last 500</option>
                  <option value={2000}>last 2000</option>
                </select>
              </div>
              {tail && tail.truncated && (
                <div style={{ padding: '6px 14px', fontSize: '11px', color: T.textMuted, borderBottom: `1px solid ${T.border}` }}>
                  Showing the end of the file only. Earlier lines are still on disk.
                </div>
              )}
              <pre style={{
                margin: 0, padding: '12px 14px', maxHeight: '65vh', overflow: 'auto',
                fontSize: '11.5px', lineHeight: 1.5, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
                color: T.textSecondary, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
              }}>
                {tail && tail.missing
                  ? 'This file does not exist yet. That is not an error if the process that writes it has not run.'
                  : (tail && tail.lines.length ? tail.lines.join('\n') : 'Empty.')}
              </pre>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // PLAYBOOKS PAGE: health and recent runs of the playbook state machine
    // (server/project-files-server.js), per playbook, plus its source files.
    // ============================================================================
    function PlaybooksPage({ showToast }) {
      const [health, setHealth] = useState(null);
      const [runs, setRuns] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);        // hard failure, nothing to show
      const [staleError, setStaleError] = useState(null); // a refresh failed, old data still on screen
      const [fetchedAt, setFetchedAt] = useState(null);
      const [expanded, setExpanded] = useState({});
      const [folderContents, setFolderContents] = useState(null);
      const [folderExpanded, setFolderExpanded] = useState(true);
      // Bumped once a minute so the relative times on screen age by
      // themselves instead of sitting on "just now" until the next fetch.
      const [, setAgeTick] = useState(0);

      const PLAYBOOKS_REL = '_howtotasks/playbooks';
      const STANDARDS_REL = '_howtotasks/standards';
      const RUNS_LIMIT = 40;

      // The last good health payload, so a failed background refresh can leave
      // the page showing real data instead of replacing it with an error card.
      const healthRef = useRef(null);

      // load({ silent: true }) refetches without blanking the page, so it can be
      // used for polling; a plain load() shows the loading state (first load).
      const load = useCallback((opts) => {
        const silent = !!(opts && opts.silent);
        if (!silent) setLoading(true);
        Promise.all([
          fetch(FILES_URL + '/api/playbook/health').then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`)),
          fetch(`${FILES_URL}/api/playbook/runs?limit=${RUNS_LIMIT}`)
            .then(r => r.ok ? r.json() : [])
            .catch(() => []),
        ])
          .then(([h, rs]) => {
            healthRef.current = h;
            setHealth(h);
            setRuns(Array.isArray(rs) ? rs : []);
            setError(null);
            setStaleError(null);
            setFetchedAt(new Date());
            setLoading(false);
          })
          .catch(e => {
            setLoading(false);
            if (healthRef.current) setStaleError(String(e)); else setError(String(e));
          });
      }, []);

      // First load, then keep it live, so a run that lands while the page is open
      // appears without a reload.
      useEffect(() => { load(); }, [load]);
      useEffect(() => {
        const id = setInterval(() => load({ silent: true }), 30000);
        // Coming back to the tab is the moment you most want current numbers.
        const onWake = () => { if (!document.hidden) load({ silent: true }); };
        document.addEventListener('visibilitychange', onWake);
        window.addEventListener('focus', onWake);
        return () => {
          clearInterval(id);
          document.removeEventListener('visibilitychange', onWake);
          window.removeEventListener('focus', onWake);
        };
      }, [load]);
      useEffect(() => {
        const id = setInterval(() => setAgeTick(t => t + 1), 60000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        fetch(`${FOLDER_CONTENTS_URL}?path=${encodeURIComponent(PLAYBOOKS_REL)}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => setFolderContents(d))
          .catch(() => setFolderContents(null));
      }, []);

      const openFile = (relPath) => {
        window.open(`${FILE_SERVE_URL}?path=${encodeURIComponent(relPath)}`, '_blank');
      };
      const copyPath = async (p) => {
        try { await navigator.clipboard.writeText(p); showToast && showToast('Path copied'); }
        catch { showToast && showToast('Copy failed', 'error'); }
      };
      // A run id is what you paste into `curl $PLAYBOOK_URL/api/playbook/run/<id>`
      // to see the whole run, so it gets its own copy with its own wording.
      const copyRunId = async (id) => {
        try { await navigator.clipboard.writeText(id); showToast && showToast('Run id copied'); }
        catch { showToast && showToast('Copy failed', 'error'); }
      };
      const pbFileIcon = (ext) => {
        if (['.json'].includes(ext)) return icons.code;
        if (['.md', '.txt'].includes(ext)) return icons.fileText;
        return icons.file;
      };
      const pbFileIconColor = (ext) => {
        if (['.json'].includes(ext)) return '#64748b';
        if (['.md'].includes(ext)) return T.accent;
        return T.textMuted;
      };
      // Relative time, so a run from an hour ago is easy to tell apart from one
      // three weeks ago.
      const fmtAgo = (iso) => {
        if (!iso) return 'never';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        const mins = Math.floor((Date.now() - d.getTime()) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        if (days < 30) return `${days}d ago`;
        return d.toLocaleDateString();
      };
      const fullTime = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d.getTime()) ? String(iso) : d.toLocaleString(); };
      const runTone = (st) => st === 'completed' ? '#10b981'
        : st === 'failed_validation' ? '#ef4444'
        : st === 'open' ? '#f59e0b'
        : st === 'abandoned' ? '#64748b'
        : T.textMuted;
      const runLabel = (st) => st === 'failed_validation' ? 'failed' : (st || 'unknown');

      if (loading && !health) return <div style={{ padding: '40px', textAlign: 'center', color: T.textSecondary }}>Loading playbook health...</div>;
      if (error) return (
        <div style={{ padding: '40px', textAlign: 'center', color: '#f87171' }}>
          <div style={{ fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>Connection Error</div>
          <div style={{ fontSize: '13px', color: T.textMuted, marginBottom: '12px' }}>{error}</div>
          <div style={{ fontSize: '12px', color: T.textMuted, fontFamily: 'monospace', background: T.cardGradient, padding: '10px', borderRadius: '8px', display: 'inline-block', border: `1px solid ${T.border}` }}>node project-files-server.js</div>
        </div>
      );

      const totals = health.reduce((acc, p) => ({
        runs: acc.runs + p.total_runs,
        completed: acc.completed + p.completed,
        failed: acc.failed + p.failed_validation,
        open: acc.open + p.open,
        needs_review: acc.needs_review + (p.needs_review ? 1 : 0),
      }), { runs: 0, completed: 0, failed: 0, open: 0, needs_review: 0 });

      // Whatever ran most recently goes to the top. The server returns these in
      // spec-filename order, which would leave a playbook that just ran wherever
      // the alphabet puts it.
      const healthSorted = (health || []).slice().sort((a, b) => {
        const A = a.last_run_at || '', B = b.last_run_at || '';
        if (A !== B) return B.localeCompare(A);
        return String(a.playbook_id).localeCompare(String(b.playbook_id));
      });

      const fmtRate = (rate) => rate >= 80 ? '#10b981' : rate >= 50 ? '#f59e0b' : '#ef4444';
      const statusColor = (p) => p.needs_review ? '#ef4444' : p.failed_validation > 0 ? '#f59e0b' : p.completed > 0 ? '#10b981' : T.textMuted;

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <div style={{ padding: '20px 24px', borderBottom: `1px solid ${T.border}`, flexShrink: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '14px' }}>
              <h2 style={{ fontSize: '18px', fontWeight: 700, color: T.text, flex: 1 }}>Playbook Health</h2>
              {staleError ? (
                <span title={`Last refresh failed: ${staleError}`} style={{ fontSize: '11px', fontWeight: 600, color: '#fbbf24', background: 'linear-gradient(160deg, rgba(251,191,36,0.2) 0%, rgba(251,191,36,0.05) 100%)', border: '1px solid rgba(251,191,36,0.4)', padding: '3px 10px', borderRadius: '10px' }}>
                  Refresh failed · showing {fmtAgo(fetchedAt)}
                </span>
              ) : (
                <span title={fetchedAt ? `Fetched ${fullTime(fetchedAt)} · auto-refreshes every 30s` : ''} style={{ fontSize: '11px', color: T.textMuted, display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#10b981', display: 'inline-block' }} />
                  Live · updated {fmtAgo(fetchedAt)}
                </span>
              )}
              <button onClick={() => load()} style={{ padding: '6px 12px', fontSize: '12px', fontWeight: 600, borderRadius: '8px', border: `1px solid ${T.border}`, background: 'transparent', color: T.textSecondary, cursor: 'pointer' }}>Refresh</button>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '10px' }}>
              {[
                { label: 'Total Runs', value: totals.runs, color: T.text },
                { label: 'Completed', value: totals.completed, color: '#10b981' },
                { label: 'Failed Validation', value: totals.failed, color: '#ef4444' },
                { label: 'Open', value: totals.open, color: '#f59e0b' },
                { label: 'Need Review', value: totals.needs_review, color: totals.needs_review > 0 ? '#ef4444' : T.textMuted },
              ].map((s, i) => (
                <div key={i} style={{ background: T.cardGradient, border: `1px solid ${T.border}`, borderRadius: '10px', padding: '10px 14px' }}>
                  <div style={{ fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{s.label}</div>
                  <div style={{ fontSize: '20px', fontWeight: 700, color: s.color, marginTop: '2px' }}>{s.value}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ flex: 1, overflow: 'auto', padding: '16px 24px', display: 'flex', gap: '16px', alignItems: 'flex-start' }}>
            <div style={{ flex: 1, minWidth: 0 }}>
            {health.length === 0 ? (
              <div style={{ padding: '40px', textAlign: 'center', color: T.textMuted }}>No playbooks yet. Add a .spec.json to _howtotasks/playbooks/.</div>
            ) : healthSorted.map(p => (
              <div key={p.playbook_id} style={{ background: T.cardGradient, border: `1px solid ${p.needs_review ? '#ef4444' : T.border}`, borderRadius: '12px', marginBottom: '12px', overflow: 'hidden' }}>
                <div onClick={() => setExpanded(e => ({ ...e, [p.playbook_id]: !e[p.playbook_id] }))}
                  style={{ padding: '14px 18px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '12px', transition: 'background 0.15s' }}
                  onMouseEnter={e => e.currentTarget.style.background = T.cardHoverGradient}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  <div style={{ color: T.accent, transform: expanded[p.playbook_id] ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform 0.15s' }}>{icons.chevronDown}</div>
                  <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: statusColor(p), flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span style={{ fontSize: '14px', fontWeight: 600, color: T.text }}>{p.playbook_id}</span>
                      <span style={{ fontSize: '11px', color: T.textMuted, background: 'linear-gradient(160deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.0225) 100%)', padding: '2px 8px', borderRadius: '10px' }}>v{p.version}</span>
                      {p.needs_review && <span style={{ fontSize: '11px', color: '#ef4444', background: 'linear-gradient(160deg, rgba(239,68,68,0.255) 0%, rgba(239,68,68,0.0675) 100%)', padding: '2px 8px', borderRadius: '10px', fontWeight: 600 }}>NEEDS REVIEW</span>}
                    </div>
                    <div style={{ fontSize: '11px', color: T.textMuted, marginTop: '2px' }}>

                    </div>

              </div>
            ))}
            </div>
            {/* Right rail: what just happened, then the source files. */}
            <div style={{ width: '300px', flexShrink: 0, position: 'sticky', top: 0, display: 'flex', flexDirection: 'column', gap: '16px' }}>

            {/* Recent runs. The aggregates above answer "is this playbook healthy";

            <div style={{ border: `1px solid ${T.border}`, borderRadius: '12px', overflow: 'hidden', background: T.cardGradient }}>

                      onMouseEnter={e => e.currentTarget.style.background = T.cardHoverGradient}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                      <div style={{ width: '7px', height: '7px', borderRadius: '50%', background: runTone(r.status), flexShrink: 0 }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: '12px', color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.playbook_id}</div>
                        <div style={{ fontSize: '10px', color: T.textMuted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>

                          {r.status === 'open' && r.current_step ? ` · at ${r.current_step}` : ` · ${r.steps_recorded} step${r.steps_recorded === 1 ? '' : 's'}`}

                      <div style={{ fontSize: '10px', color: T.textMuted, flexShrink: 0, textAlign: 'right' }}>{fmtAgo(r.started_at)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Folder Contents Tile */}
            {folderContents && (() => {
              const allFiles = (folderContents.entries || []).filter(e => e.type === 'file');
              const specFiles = allFiles.filter(e => e.name.endsWith('.spec.json'));
              const mdFiles = allFiles.filter(e => e.name.endsWith('.md'));
              return (
                <div style={{ border: `1px solid ${T.border}`, borderRadius: '12px', overflow: 'hidden', background: T.cardGradient }}>
                  <div onClick={() => setFolderExpanded(p => !p)}

                    <span style={{ color: T.accent, transform: folderExpanded ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform 0.15s' }}>{icons.chevronDown}</span>
                    <span style={{ color: T.accent }}>{icons.folder}</span>
                    <span style={{ fontSize: '13px', fontWeight: 600, color: T.text, flex: 1 }}>Playbook Files</span>
                    <span style={{ fontSize: '11px', color: T.textMuted, background: 'linear-gradient(160deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.0225) 100%)', padding: '2px 8px', borderRadius: '10px' }}>{allFiles.length}</span>
                  </div>
                  <div onClick={() => copyPath(folderContents.folderPath)}
                    style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '8px 14px', fontSize: '11px', color: T.textMuted, cursor: 'pointer', borderBottom: `1px solid ${T.borderSubtle}`, transition: 'all 0.1s' }}
                    onMouseEnter={e => { e.currentTarget.style.background = T.cardHoverGradient; e.currentTarget.style.color = T.text; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.textMuted; }}>
                    {React.cloneElement(icons.copy, { width: 12, height: 12 })}
                    <span>Copy folder path</span>
                  </div>
                  {folderExpanded && (
                    <div style={{ maxHeight: '380px', overflow: 'auto' }}>
                      {/* Specs section */}
                      {specFiles.length > 0 && (
                        <React.Fragment>
                          <div style={{ padding: '6px 14px 3px', fontSize: '10px', fontWeight: 600, color: T.textMuted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>SPEC.JSON</div>
                          {specFiles.map(entry => (
                            <div key={entry.name} onClick={() => openFile(`${PLAYBOOKS_REL}/${entry.name}`)}
                              style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '7px 14px', cursor: 'pointer', transition: 'background 0.1s' }}
                              onMouseEnter={e => e.currentTarget.style.background = T.cardHoverGradient}

                              <span style={{ color: pbFileIconColor(entry.extension), flexShrink: 0 }}>{React.cloneElement(pbFileIcon(entry.extension), { width: 14, height: 14 })}</span>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: '12px', color: T.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{entry.name}</div>
                                <div style={{ fontSize: '10px', color: T.textMuted }}>{fmtBytes(entry.size)}</div>

                          {mdFiles.map(entry => (
                            <div key={entry.name} onClick={() => openFile(`${PLAYBOOKS_REL}/${entry.name}`)}
                              style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '7px 14px', cursor: 'pointer', transition: 'background 0.1s' }}

    // The Project Files page: every project markdown file from the files server,
    // filterable by type, grouped by client, searchable. Opening one shows
    // ProjectFileDetail.
    function ProjectFilesPage({ data, showToast, initialTarget, onTargetConsumed }) {
      const [projectFiles, setProjectFiles] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedFile, setSelectedFile] = useState(initialTarget || null);
      const [searchTerm, setSearchTerm] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [expandedClients, setExpandedClients] = useState({});

      // If we got a target from another page, consume it so it doesn't re-trigger
      useEffect(() => {
        if (initialTarget) {
          setSelectedFile(initialTarget);
          if (onTargetConsumed) onTargetConsumed();
        }
      }, [initialTarget]);

      useEffect(() => {
        const loadFiles = async () => {
          try {
            const res = await fetch(PROJECT_FILES_URL);
            if (!res.ok) throw new Error('Server not reachable');
            const files = await res.json();
            setProjectFiles(files);
            const expanded = {};
            files.forEach(f => { expanded[f.client] = true; });
            setExpandedClients(prev => {
              const next = {};
              files.forEach(f => { next[f.client] = prev[f.client] !== undefined ? prev[f.client] : true; });
              return next;
            });
            setError(null);
          } catch (e) {
            // Name the address it actually tried (FILES_URL), which may not be the
            // default port.
            setError('Could not reach the project files server at ' + FILES_URL + '. Make sure it is running.');
          } finally {
            setLoading(false);
          }
        };
        loadFiles();
        const interval = setInterval(loadFiles, 30000);
        return () => clearInterval(interval);
      }, []);

      const toggleClient = (client) => {
        setExpandedClients(prev => ({ ...prev, [client]: !prev[client] }));
      };

      // Type filter counts
      const typeCounts = { all: projectFiles.length, project: 0, supplier: 0, equipment: 0, howto: 0 };
      projectFiles.forEach(f => { typeCounts[f.type || 'project'] = (typeCounts[f.type || 'project'] || 0) + 1; });

      // Filter by type first, then group by client
      const typeFiltered = typeFilter === 'all' ? projectFiles : projectFiles.filter(f => (f.type || 'project') === typeFilter);
      const grouped = {};
      typeFiltered.forEach(f => {
        if (!grouped[f.client]) grouped[f.client] = [];
        grouped[f.client].push(f);
      });

      // Filter by search
      const filteredClients = Object.keys(grouped).filter(client => {
        if (!searchTerm) return true;
        const q = searchTerm.toLowerCase();
        if (client.toLowerCase().includes(q)) return true;
        return grouped[client].some(f => f.project.toLowerCase().includes(q) || f.content.toLowerCase().includes(q));
      });

      const extractStatus = (content) => {
        const match = content.match(/\*\*Status:\*\*\s*(.+)/);
        return match ? match[1].trim() : null;
      };
      const extractValue = (content) => {
        const match = content.match(/\*\*Value:\*\*\s*(.+)/);
        return match ? match[1].trim() : null;
      };
      const extractContact = (content) => {
        const match = content.match(/\*\*Primary Contact:\*\*\s*(.+)/);
        return match ? match[1].trim() : null;
      };

      const renderMarkdown = (content, basePath) => {
        if (typeof marked !== 'undefined') {
          let html = marked.parse(content);
          if (basePath) {
            const folderPath = basePath.substring(0, basePath.lastIndexOf('/'));
            html = html.replace(/(src|href)="(?!https?:\/\/|mailto:|#|data:)([^"]+)"/g, (match, attr, url) => {
              const rel = folderPath + '/' + url.replace(/^\.\//, '');
              return `${attr}="${FILE_SERVE_URL}?path=${encodeURIComponent(rel)}"`;
            });
          }
          return { __html: html };
        }
        return { __html: content.replace(/\n/g, '<br/>') };
      };

      if (loading) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: T.textSecondary }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '24px', marginBottom: '8px' }}>Loading project files...</div>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: T.textSecondary }}>
            <div style={{ textAlign: 'center', maxWidth: '420px' }}>
              <div style={{ color: '#f87171', fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>{icons.alert}</div>
              <div style={{ color: '#f87171', fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>Connection Error</div>
              <div style={{ fontSize: '14px', lineHeight: 1.6 }}>{error}</div>
              <div style={{ marginTop: '16px', fontSize: '13px', color: T.textMuted, background: T.cardGradient, padding: '12px', borderRadius: '8px', border: `1px solid ${T.border}`, fontFamily: 'monospace' }}>
                node project-files-server.js
              </div>
            </div>
          </div>
        );
      }

      // Detail view
      if (selectedFile) {
        return <ProjectFileDetail file={selectedFile} onBack={() => setSelectedFile(null)} showToast={showToast} renderMarkdown={renderMarkdown}
          onUpdated={(updatedFile) => {
            setSelectedFile(updatedFile);
            setProjectFiles(prev => prev.map(f => f.path === updatedFile.path ? updatedFile : f));
          }} />;
      }

      // Tree view
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <div style={{ padding: '16px 20px', borderBottom: `1px solid ${T.border}`, flexShrink: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <div style={{ position: 'relative', flex: 1, maxWidth: '400px', minWidth: '200px' }}>
                <div style={{ position: 'absolute', left: '10px', top: '50%', transform: 'translateY(-50%)', color: T.textMuted }}>{icons.search}</div>
                <input type="text" placeholder="Search files..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                  style={{ width: '100%', padding: '8px 12px 8px 36px', fontSize: '14px' }} />
              </div>
              <div style={{ display: 'flex', gap: '6px' }}>
                {[
                  { key: 'all', label: 'All', count: typeCounts.all },
                  { key: 'project', label: 'Projects', count: typeCounts.project, color: '#94a3b8' },
                  { key: 'supplier', label: 'Suppliers', count: typeCounts.supplier, color: '#f59e0b' },
                  { key: 'equipment', label: 'Equipment', count: typeCounts.equipment, color: '#10b981' },
                  { key: 'howto', label: 'How-To', count: typeCounts.howto, color: '#ec4899' },
                ].map(tab => (
                  <button key={tab.key} onClick={() => setTypeFilter(tab.key)}
                    style={{ padding: '5px 12px', fontSize: '11px', fontWeight: 600, borderRadius: '8px', border: typeFilter === tab.key ? `1px solid ${tab.color || T.accent}` : `1px solid ${T.border}`, background: typeFilter === tab.key ? `linear-gradient(150deg, ${(tab.color || T.accent)}33 0%, ${(tab.color || T.accent)}0d 100%)` : 'transparent', color: typeFilter === tab.key ? (tab.color || T.accent) : T.textMuted, cursor: 'pointer', transition: 'all 0.15s' }}>
                    {tab.label} <span style={{ opacity: 0.6 }}>{tab.count}</span>
                  </button>
                ))}
              </div>
              <div style={{ fontSize: '13px', color: T.textMuted }}>
                {typeFiltered.length} file{typeFiltered.length !== 1 ? 's' : ''} across {Object.keys(grouped).length} {typeFilter === 'all' ? 'folder' : typeFilter}{Object.keys(grouped).length !== 1 ? 's' : ''}
              </div>
            </div>
          </div>
          <div style={{ flex: 1, overflow: 'auto', padding: '16px 20px' }}>
            {filteredClients.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '40px', color: T.textMuted }}>
                {searchTerm ? 'No matching files found.' : 'No markdown files found in SS Folders.'}
              </div>
            ) : (
              filteredClients.sort((a, b) => {
                // Put underscore-prefixed folders (_Suppliers, _Equipment Library) last
                const aSpecial = a.startsWith('_') ? 1 : 0;
                const bSpecial = b.startsWith('_') ? 1 : 0;
                if (aSpecial !== bSpecial) return aSpecial - bSpecial;
                return a.localeCompare(b);
              }).map(client => {
                const projects = grouped[client].filter(f => {
                  if (!searchTerm) return true;
                  const q = searchTerm.toLowerCase();
                  return client.toLowerCase().includes(q) || f.project.toLowerCase().includes(q) || f.content.toLowerCase().includes(q);
                });
                if (projects.length === 0) return null;
                const isExpanded = expandedClients[client];
                const folderType = client === '_Suppliers' ? 'supplier' : client === '_Equipment Library' ? 'equipment' : 'project';
                const folderColor = folderType === 'supplier' ? '#f59e0b' : folderType === 'equipment' ? '#10b981' : T.accent;
                const folderLabel = client.replace(/^_/, '');

                return (
                  <div key={client} style={{ marginBottom: '4px' }}>
                    <div onClick={() => toggleClient(client)}
                      style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '10px 12px', borderRadius: '10px', cursor: 'pointer', transition: 'all 0.15s', userSelect: 'none' }}
                      onMouseEnter={e => { e.currentTarget.style.background = T.borderSubtle; }}
                      onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}>
                      <span style={{ color: folderColor, transition: 'transform 0.15s', transform: isExpanded ? 'rotate(90deg)' : 'rotate(0deg)', display: 'inline-flex' }}>{icons.chevronRight}</span>
                      <span style={{ color: folderColor }}>{folderType === 'supplier' ? icons.briefcase : folderType === 'equipment' ? icons.settings : icons.building}</span>
                      <span style={{ fontSize: '15px', fontWeight: 600, color: T.text }}>{folderLabel}</span>
                      <span style={{ fontSize: '12px', color: T.textMuted, background: folderColor + '15', padding: '2px 8px', borderRadius: '10px' }}>
                        {projects.length} file{projects.length !== 1 ? 's' : ''}
                      </span>
                    </div>
                    {isExpanded && (
                      <div style={{ paddingLeft: '24px', marginTop: '2px' }}>
                        {projects.map(file => {
                          const status = extractStatus(file.content);
                          const value = extractValue(file.content);
                          const contact = extractContact(file.content);
                          return (
                            <div key={file.path} onClick={() => setSelectedFile(file)}
                              data-result="true" tabIndex={0}
                              style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 14px', borderRadius: '10px', cursor: 'pointer', border: `1px solid ${T.border}`, marginBottom: '6px', background: T.cardGradient, transition: 'all 0.15s' }}
                              onMouseEnter={e => { e.currentTarget.style.background = T.cardHoverGradient; e.currentTarget.style.borderColor = T.accentBorder; }}
                              onMouseLeave={e => { e.currentTarget.style.background = T.cardGradient; e.currentTarget.style.borderColor = T.border; }}>
                              <div style={{ color: (file.type === 'supplier' ? '#f59e0b' : file.type === 'equipment' ? '#10b981' : file.type === 'howto' ? '#ec4899' : T.accent), flexShrink: 0 }}>{file.type === 'supplier' ? icons.briefcase : file.type === 'equipment' ? icons.settings : file.type === 'howto' ? icons.book : icons.fileText}</div>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: '14px', fontWeight: 600, color: T.text, marginBottom: '3px' }}>{file.project}</div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
                                  {status && <span style={{ fontSize: '12px', color: T.textSecondary }}>{status}</span>}
                                  {value && <span style={{ fontSize: '12px', color: T.textMuted }}>{value}</span>}
                                </div>
                                {contact && <div style={{ fontSize: '12px', color: T.textMuted, marginTop: '2px' }}>{contact}</div>}
                              </div>
                              <div style={{ fontSize: '11px', color: T.textMuted, flexShrink: 0, textAlign: 'right' }}>
                                {new Date(file.modified).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' })}
                              </div>
                              <span style={{ color: T.textMuted, flexShrink: 0 }}>{icons.chevronRight}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // RENDER APP
    // ============================================================================

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ErrorBoundary, null,
        React.createElement(SplattDashboard)
      )
    );
  </script>
</body>
</html>
